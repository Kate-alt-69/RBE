name: Build Tools CI

on:
  push:
    paths:
      - 'build.sh'
      - 'build-cache.py'
      - 'test-build-cache.py'
      - 'build-cache.ps1'
      - 'build*.ps1'
      - 'build-select.sh'
      - 'build-release.sh'
      - 'build-core.sh'
      - 'build-help.txt'
      - 'doc/linux-builds.md'
      - '.github/workflows/build-tools-ci.yml'
  pull_request:
    paths:
      - 'build.sh'
      - 'build-cache.py'
      - 'test-build-cache.py'
      - 'build-cache.ps1'
      - 'build*.ps1'
      - 'build-select.sh'
      - 'build-release.sh'
      - 'build-core.sh'
      - 'build-help.txt'
      - 'doc/linux-builds.md'
      - '.github/workflows/build-tools-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-cache:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify PowerShell adapter and per-crate Cargo reuse
        run: python test-build-cache.py
      - name: Parse PowerShell builders without running builds
        shell: pwsh
        run: |
          Get-ChildItem build*.ps1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { throw ($errors | Out-String) }
          }
  linux-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate shell builder syntax
        run: bash -n build.sh build-select.sh build-release.sh build-core.sh
      - name: Verify Linux build prerequisites
        run: ./build.sh --check-tools --build-linux --arch-x64
      - name: Verify cache discovery and real per-crate Cargo reuse
        run: python3 test-build-cache.py
      - name: Verify shared Cargo cache selection
        shell: bash
        run: |
          set -euo pipefail

          explicit_cache="$RUNNER_TEMP/rbe-explicit-cache"
          env -u CARGO_TARGET_DIR \
            RBE_BUILD_CACHE_DIR="$explicit_cache" \
            ./build.sh --check-tools --build-linux --arch-x64
          test -d "$explicit_cache/cargo-target"

          render_cache="$RUNNER_TEMP/rbe-render-xdg"
          env -u CARGO_TARGET_DIR -u RBE_BUILD_CACHE_DIR \
            RENDER=true \
            XDG_CACHE_HOME="$render_cache" \
            ./build.sh --check-tools --build-linux --arch-x64
          test -d "$render_cache/rbe-build/cargo-target"
      - name: Simulate corrupt cached rustup toolchain recovery
        shell: bash
        run: |
          set -euo pipefail
          fake_bin="$RUNNER_TEMP/rbe-fake-rust/bin"
          state="$RUNNER_TEMP/rbe-fake-rust/repaired"
          mkdir -p "$fake_bin"

          cat > "$fake_bin/rustc" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          [ -f "${RBE_FAKE_RUST_STATE:?}" ] || { echo "error: missing manifest in toolchain 'stable-x86_64-unknown-linux-gnu'" >&2; exit 1; }
          echo 'rustc 1.98.1 (simulated repaired toolchain)'
          SH

          cat > "$fake_bin/cargo" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          [ -f "${RBE_FAKE_RUST_STATE:?}" ] || { echo "error: missing manifest in toolchain 'stable-x86_64-unknown-linux-gnu'" >&2; exit 1; }
          echo 'cargo 1.98.1 (simulated repaired toolchain)'
          SH

          cat > "$fake_bin/rustup" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          state="${RBE_FAKE_RUST_STATE:?}"
          case "${1:-}" in
            --version)
              echo 'rustup 1.28.0 (simulated)'
              ;;
            toolchain)
              case "${2:-}" in
                list)
                  echo 'stable-x86_64-unknown-linux-gnu (active, default)'
                  ;;
                uninstall)
                  rm -f "$state"
                  ;;
                install)
                  touch "$state"
                  ;;
                *) exit 2 ;;
              esac
              ;;
            target)
              if [ "${2:-}" = list ] && [ "${3:-}" = --installed ]; then
                [ -f "$state" ] || exit 1
                echo 'x86_64-unknown-linux-gnu'
              else
                exit 2
              fi
              ;;
            show)
              if [ "${2:-}" = home ]; then
                echo "${RUNNER_TEMP:-/tmp}/fake-rustup-home"
              else
                exit 2
              fi
              ;;
            *) exit 2 ;;
          esac
          SH

          chmod +x "$fake_bin/rustc" "$fake_bin/cargo" "$fake_bin/rustup"
          rm -f "$state"

          PATH="$fake_bin:$PATH" \
          RBE_FAKE_RUST_STATE="$state" \
          RBE_RUST_TOOLCHAIN=stable \
          CARGO_TARGET_DIR="$RUNNER_TEMP/rbe-fake-cargo-cache" \
          ./build.sh --check-tools --build-linux --arch-x64

          test -f "$state"
          PATH="$fake_bin:$PATH" RBE_FAKE_RUST_STATE="$state" rustc --version | grep -q 'simulated repaired toolchain'
