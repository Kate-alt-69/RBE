name: CAP-004 worker capability relay

"on":
  push:
    branches: [main]
    paths:
      - '.github/patches/cap004-capability-relay.py'
      - '.github/patches/cap004-capability-relay-stagefix.py'
      - '.github/patches/cap004-capability-relay-compilefix.py'
      - '.github/workflows/cap004-capability-relay.yml'

permissions:
  contents: write

concurrency:
  group: cap004-capability-relay
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: container-runtime

      - name: Apply CAP-004 capability relay
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          python3 .github/patches/cap004-capability-relay-stagefix.py
          python3 .github/patches/cap004-capability-relay.py
          python3 .github/patches/cap004-capability-relay-compilefix.py
          cargo fmt --manifest-path container-runtime/Cargo.toml --all
          # Adding the existing ipc-protocol workspace crate as an execution-engine
          # dependency changes only local lock dependency metadata. Refresh it once,
          # then every validation below is locked.
          cargo check --manifest-path container-runtime/Cargo.toml -p execution-engine

      - name: Check Container workspace locked
        run: cargo check --manifest-path container-runtime/Cargo.toml --workspace --all-targets --locked
      - name: Test Container workspace locked
        run: cargo test --manifest-path container-runtime/Cargo.toml --workspace --locked
      - name: Clippy Container workspace locked
        run: cargo clippy --manifest-path container-runtime/Cargo.toml --workspace --all-targets --locked -- -D warnings

      - name: Verify CAP-004 invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'pub struct WorkerCapabilityCall' container-runtime/crates/ipc-protocol/src/lib.rs
          grep -q 'pub fn read_worker_output' container-runtime/crates/ipc-protocol/src/lib.rs
          grep -q 'pub fn execute_with_input_and_capabilities' container-runtime/crates/execution-engine/src/lib.rs
          grep -q '"capability_call"' container-runtime/crates/execution-engine/src/lib.rs
          grep -q 'const CHILD_PROTOCOL_VERSION: u16 = 3' container-runtime/crates/container-bin/src/environment_process.rs
          grep -q 'fn dispatch_capability' container-runtime/crates/container-bin/src/environment_process.rs
          grep -q 'capability_broker.authorize' container-runtime/crates/container-bin/src/environment_process.rs
          grep -q 'CAPABILITY_DISPATCH_UNAVAILABLE' container-runtime/crates/container-bin/src/environment_process.rs
          grep -q 'session: endpoint.session.clone()' container-runtime/crates/container-bin/src/environment_process.rs
          grep -q 'write_worker_capability_call' container-runtime/crates/container-bin/src/main.rs

      - name: Land validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/cap004-capability-relay.yml
          git rm -f .github/patches/cap004-capability-relay.py
          git rm .github/patches/cap004-capability-relay-stagefix.py
          git rm .github/patches/cap004-capability-relay-compilefix.py
          git add container-runtime
          git commit -m "FIX | BUG-CAP-004 relay sandbox capability calls through Controller authority"

          git fetch origin main
          base="$(git rev-parse HEAD~1)"
          current="$(git rev-parse origin/main)"
          if [ "$current" != "$base" ]; then
            git rebase origin/main
          fi
          git push origin HEAD:main
