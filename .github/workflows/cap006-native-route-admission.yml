name: CAP-006 native route Container admission

"on":
  push:
    branches: [main]
    paths:
      - '.github/patches/cap006-native-route-admission.py'
      - '.github/patches/cap006-native-route-admission-stagefix.py'
      - '.github/workflows/cap006-native-route-admission.yml'

permissions:
  contents: write

concurrency:
  group: cap006-native-route-admission
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Apply CAP-006 native route admission
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          python3 .github/patches/cap006-native-route-admission-stagefix.py
          python3 .github/patches/cap006-native-route-admission.py
          cargo fmt --manifest-path engine/Cargo.toml --all

      - name: Check Core and Route Engine locked
        run: cargo check --manifest-path engine/Cargo.toml -p core-lib -p route-engine --all-targets --locked
      - name: Test Core and Route Engine locked
        run: cargo test --manifest-path engine/Cargo.toml -p core-lib -p route-engine --locked
      - name: Clippy Core and Route Engine locked
        run: cargo clippy --manifest-path engine/Cargo.toml -p core-lib -p route-engine --all-targets --locked -- -D warnings

      - name: Check Backend locked
        run: cargo check --manifest-path engine/Cargo.toml -p backend --all-targets --locked
      - name: Test Backend locked
        run: cargo test --manifest-path engine/Cargo.toml -p backend --locked
      - name: Clippy Backend locked
        run: cargo clippy --manifest-path engine/Cargo.toml -p backend --all-targets --locked -- -D warnings

      - name: Verify CAP-006 invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'pub struct ContainerAuthorizedExecution' engine/crates/core/src/container_client.rs
          grep -q 'pub async fn execute_authorized' engine/crates/core/src/container_client.rs
          grep -q 'register_artifact(request.artifact_hash' engine/crates/core/src/container_client.rs
          grep -q 'register_capability_manifest(request.identity' engine/crates/core/src/container_client.rs
          grep -q 'struct NativeRoutePlan' engine/crates/route-engine/src/discovery.rs
          grep -q 'const NATIVE_ROUTE_ENVIRONMENT: &str = "general-1"' engine/crates/route-engine/src/discovery.rs
          grep -q 'image.image_id != plan.runtime_image' engine/crates/route-engine/src/discovery.rs
          grep -q 'source_id: plan.source_id.as_str()' engine/crates/route-engine/src/discovery.rs
          grep -q 'grants: Vec::new()' engine/crates/route-engine/src/discovery.rs
          grep -q 'native Route-WASM declares capabilities not lowered' engine/crates/route-engine/src/discovery.rs
          grep -q 'native route execution failed' engine/crates/route-engine/src/discovery.rs
          grep -q 'execute_native_route(plan, image.as_ref()' engine/crates/route-engine/src/discovery.rs
          grep -q 'build_method_router(&route_file, module_program.clone(), None)' engine/crates/route-engine/src/discovery.rs
          grep -q 'does \*\*not\*\* silently fall back' doc/runtime-image.md

      - name: Land validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/cap006-native-route-admission.yml
          git rm -f .github/patches/cap006-native-route-admission.py
          git rm -f .github/patches/cap006-native-route-admission-stagefix.py
          git add engine doc/runtime-image.md
          git commit -m "FIX | BUG-CAP-006 execute native Runtime Image routes through Container"

          git fetch origin main
          base="$(git rev-parse HEAD~1)"
          current="$(git rev-parse origin/main)"
          if [ "$current" != "$base" ]; then
            git rebase origin/main
          fi
          git push origin HEAD:main
