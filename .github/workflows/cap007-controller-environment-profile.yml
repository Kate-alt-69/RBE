name: CAP-007 Controller environment profile binding

"on":
  push:
    branches: [main]
    paths:
      - '.github/patches/cap007-controller-environment-profile.py'
      - '.github/workflows/cap007-controller-environment-profile.yml'

permissions:
  contents: write

concurrency:
  group: cap007-controller-environment-profile
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            container-runtime
            engine

      - name: Apply CAP-007 Controller profile binding
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          python3 .github/patches/cap007-controller-environment-profile.py
          cargo fmt --manifest-path container-runtime/Cargo.toml --all
          cargo fmt --manifest-path engine/Cargo.toml --all

      - name: Check Container workspace locked
        run: cargo check --manifest-path container-runtime/Cargo.toml --workspace --all-targets --locked
      - name: Test Container workspace locked
        run: cargo test --manifest-path container-runtime/Cargo.toml --workspace --locked
      - name: Clippy Container workspace locked
        run: cargo clippy --manifest-path container-runtime/Cargo.toml --workspace --all-targets --locked -- -D warnings

      - name: Check Core Route Engine Backend locked
        run: cargo check --manifest-path engine/Cargo.toml -p core-lib -p route-engine -p backend --all-targets --locked
      - name: Test Core Route Engine Backend locked
        run: cargo test --manifest-path engine/Cargo.toml -p core-lib -p route-engine -p backend --locked
      - name: Clippy Core Route Engine Backend locked
        run: cargo clippy --manifest-path engine/Cargo.toml -p core-lib -p route-engine -p backend --all-targets --locked -- -D warnings

      - name: Verify CAP-007 invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'next_general_environment: AtomicU64' container-runtime/crates/container-runtime-core/src/runtime.rs
          grep -q 'pub fn select_general_environment(&self) -> EnvironmentId' container-runtime/crates/container-runtime-core/src/runtime.rs
          grep -q 'general_environment_for_sequence' container-runtime/crates/container-runtime-core/src/runtime.rs
          grep -q 'assert_ne!(general_environment_for_sequence(5, sequence), EnvironmentId::Payment)' container-runtime/crates/container-runtime-core/src/runtime.rs
          grep -q 'requested_environment == "general"' container-runtime/crates/container-bin/src/main.rs
          grep -q 'Some(runtime.select_general_environment())' container-runtime/crates/container-bin/src/main.rs
          grep -q 'bound_request.environment = exact_environment.clone()' container-runtime/crates/container-bin/src/main.rs
          grep -q 'pub struct ContainerCapabilityBinding' engine/crates/core/src/container_client.rs
          grep -q 'environment: &binding.environment' engine/crates/core/src/container_client.rs
          grep -q 'const NATIVE_ROUTE_ENVIRONMENT_PROFILE: &str = "general"' engine/crates/route-engine/src/discovery.rs
          ! grep -q 'const NATIVE_ROUTE_ENVIRONMENT: &str = "general-1"' engine/crates/route-engine/src/discovery.rs
          grep -q 'never accepted as wildcard execution authority' doc/runtime-image.md

      - name: Land validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/cap007-controller-environment-profile.yml
          git rm -f .github/patches/cap007-controller-environment-profile.py
          git add container-runtime engine doc/runtime-image.md
          git commit -m "FIX | BUG-CAP-007 bind general profile inside Container Controller"

          git fetch origin main
          base="$(git rev-parse HEAD~1)"
          current="$(git rev-parse origin/main)"
          if [ "$current" != "$base" ]; then
            git rebase origin/main
          fi
          git push origin HEAD:main
