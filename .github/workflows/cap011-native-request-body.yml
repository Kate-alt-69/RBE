name: CAP-011 native request body execution

"on":
  push:
    branches: [main]
    paths:
      - '.github/patches/cap011-native-request-body.py'
      - '.github/patches/cap011-test-expectations.py'
      - '.github/workflows/cap011-native-request-body.yml'

permissions:
  contents: write

concurrency:
  group: cap011-native-request-body
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Apply CAP-011 native request body execution
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          python3 .github/patches/cap011-native-request-body.py
          python3 .github/patches/cap011-test-expectations.py
          cargo fmt --manifest-path engine/Cargo.toml --all

      - name: Check Engine native path locked
        run: cargo check --manifest-path engine/Cargo.toml -p core-lib -p route-engine -p backend --all-targets --locked
      - name: Test Engine native path locked
        run: cargo test --manifest-path engine/Cargo.toml -p core-lib -p route-engine -p backend --locked
      - name: Clippy Engine native path locked
        run: cargo clippy --manifest-path engine/Cargo.toml -p core-lib -p route-engine -p backend --all-targets --locked -- -D warnings

      - name: Verify CAP-011 invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'MAX_EXECUTION_INPUT_BYTES as CONTAINER_MAX_EXECUTION_INPUT_BYTES' engine/crates/core/src/lib.rs
          grep -q 'pub const ROUTE_WASM_ABI_VERSION: u32 = 2' engine/crates/route-engine/src/wasm_compiler.rs
          grep -q 'pub const ROUTE_WASM_COMPILER_VERSION: u32 = 2' engine/crates/route-engine/src/wasm_compiler.rs
          grep -q 'pub enum RouteWasmInput' engine/crates/route-engine/src/wasm_compiler.rs
          grep -q 'JsonBody' engine/crates/route-engine/src/wasm_compiler.rs
          grep -q 'fn returns_request_body' engine/crates/route-engine/src/wasm_compiler.rs
          grep -q 'fn encode_input_echo_module' engine/crates/route-engine/src/wasm_compiler.rs
          grep -q 'request_body_passthrough_is_native_v2_input' engine/crates/route-engine/src/wasm_compiler.rs
          grep -q 'request_body_route_emits_native_wasm' engine/crates/route-engine/src/cache.rs
          grep -q 'unsupported_dynamic_route_records_explicit_interpreter_fallback_without_wasm' engine/crates/route-engine/src/cache.rs
          grep -q 'RouteWasmInput::JsonBody' engine/crates/route-engine/src/discovery.rs
          grep -q 'native route body exceeds the Container execution input limit' engine/crates/route-engine/src/discovery.rs
          grep -q 'input,' engine/crates/route-engine/src/discovery.rs
          grep -q 'Route-WASM ABI v2' doc/runtime-image.md

      - name: Land validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/cap011-native-request-body.yml
          git rm -f .github/patches/cap011-native-request-body.py
          git rm -f .github/patches/cap011-test-expectations.py
          git add engine doc/runtime-image.md
          git commit -m "FIX | BUG-CAP-011 execute req.body routes through native WASM"

          git fetch origin main
          base="$(git rev-parse HEAD~1)"
          current="$(git rev-parse origin/main)"
          if [ "$current" != "$base" ]; then
            git rebase origin/main
          fi
          git push origin HEAD:main
