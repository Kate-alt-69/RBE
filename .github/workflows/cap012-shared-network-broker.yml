name: CAP-012 shared public HTTP Network Broker

"on":
  push:
    branches: [main]
    paths:
      - '.github/patches/cap012-shared-network-broker.py'
      - '.github/patches/cap012-remove-obsolete-http-tests.py'
      - '.github/workflows/cap012-shared-network-broker.yml'

permissions:
  contents: write

concurrency:
  group: cap012-shared-network-broker
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Apply CAP-012 shared Network Broker
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          python3 .github/patches/cap012-shared-network-broker.py
          python3 .github/patches/cap012-remove-obsolete-http-tests.py
          cargo fmt --manifest-path engine/Cargo.toml --all

      - name: Refresh Engine lock for dependency ownership move
        run: cargo check --manifest-path engine/Cargo.toml -p core-lib -p route-engine -p backend --all-targets
      - name: Check Engine capability path locked
        run: cargo check --manifest-path engine/Cargo.toml -p core-lib -p route-engine -p backend --all-targets --locked
      - name: Test Engine capability path locked
        run: cargo test --manifest-path engine/Cargo.toml -p core-lib -p route-engine -p backend --locked
      - name: Clippy Engine capability path locked
        run: cargo clippy --manifest-path engine/Cargo.toml -p core-lib -p route-engine -p backend --all-targets --locked -- -D warnings

      - name: Verify CAP-012 invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'mod network_broker;' engine/crates/core/src/lib.rs
          grep -q 'pub const PUBLIC_HTTP_TARGET: &str = "public-http"' engine/crates/core/src/network_broker.rs
          grep -q 'redirect(reqwest::redirect::Policy::none())' engine/crates/core/src/network_broker.rs
          grep -q '.no_proxy()' engine/crates/core/src/network_broker.rs
          grep -q 'HTTP hostname resolves to a non-public address' engine/crates/core/src/network_broker.rs
          grep -q 'PUBLIC_HTTP_REQUEST_MAX_BYTES' engine/crates/core/src/network_broker.rs
          grep -q 'PUBLIC_HTTP_RESPONSE_MAX_BYTES' engine/crates/core/src/network_broker.rs
          grep -q 'call_public_http(function, &args)' engine/crates/route-engine/src/video_host.rs
          if grep -q 'fn forbidden_ipv4' engine/crates/route-engine/src/video_host.rs; then
            echo 'duplicate Route Engine HTTP network policy remains' >&2
            exit 1
          fi
          if grep -q '^reqwest = ' engine/crates/route-engine/Cargo.toml; then
            echo 'Route Engine still owns reqwest after broker centralization' >&2
            exit 1
          fi
          grep -q '^reqwest = ' engine/crates/core/Cargo.toml
          grep -q 'request.kind == CapabilityKind::Network' engine/crates/backend/src/host_capability.rs
          grep -q 'request.target != PUBLIC_HTTP_TARGET' engine/crates/backend/src/host_capability.rs
          grep -q 'CAPABILITY_NETWORK_ARGS_INVALID' engine/crates/backend/src/host_capability.rs
          grep -q 'Public HTTP execution is centralized in `core_lib`' doc/runtime-image.md

      - name: Land validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/cap012-shared-network-broker.yml
          git rm -f .github/patches/cap012-shared-network-broker.py
          git rm -f .github/patches/cap012-remove-obsolete-http-tests.py
          git add engine doc/runtime-image.md
          git commit -m "FIX | BUG-CAP-012 centralize public HTTP Network Broker"

          git fetch origin main
          base="$(git rev-parse HEAD~1)"
          current="$(git rev-parse origin/main)"
          if [ "$current" != "$base" ]; then
            git rebase origin/main
          fi
          git push origin HEAD:main
