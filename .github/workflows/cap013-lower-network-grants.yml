name: CAP-013 lower typed Network grants

"on":
  push:
    branches: [main]
    paths:
      - '.github/patches/cap013-lower-network-grants.py'
      - '.github/workflows/cap013-lower-network-grants.yml'

permissions:
  contents: write

concurrency:
  group: cap013-lower-network-grants
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Apply CAP-013 typed Network grant lowering
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          python3 .github/patches/cap013-lower-network-grants.py
          cargo fmt --manifest-path engine/Cargo.toml --all

      - name: Check Engine capability path locked
        run: cargo check --manifest-path engine/Cargo.toml -p core-lib -p route-engine -p backend --all-targets --locked
      - name: Test Engine capability path locked
        run: cargo test --manifest-path engine/Cargo.toml -p core-lib -p route-engine -p backend --locked
      - name: Clippy Engine capability path locked
        run: cargo clippy --manifest-path engine/Cargo.toml -p core-lib -p route-engine -p backend --all-targets --locked -- -D warnings

      - name: Verify CAP-013 invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'MAX_CAPABILITY_PAYLOAD_BYTES as CONTAINER_MAX_CAPABILITY_PAYLOAD_BYTES' engine/crates/core/src/lib.rs
          grep -q 'fn lower_container_grants' engine/crates/route-engine/src/runtime_image.rs
          grep -q 'ContainerCapabilityKind::Network' engine/crates/route-engine/src/runtime_image.rs
          grep -q 'target: PUBLIC_HTTP_TARGET.to_string()' engine/crates/route-engine/src/runtime_image.rs
          grep -q 'public_http_operations.into_iter().collect()' engine/crates/route-engine/src/runtime_image.rs
          grep -q 'Video capability operation' engine/crates/route-engine/src/runtime_image.rs
          grep -q 'Service capability' engine/crates/route-engine/src/runtime_image.rs
          grep -q 'unknown_public_http_operation_fails_closed' engine/crates/route-engine/src/runtime_image.rs
          grep -q 'let grants = match image.container_capability_grants' engine/crates/route-engine/src/discovery.rs
          grep -q 'grants,' engine/crates/route-engine/src/discovery.rs
          grep -q 'Network/public-http' doc/runtime-image.md

      - name: Land validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/cap013-lower-network-grants.yml
          git rm -f .github/patches/cap013-lower-network-grants.py
          git add engine doc/runtime-image.md
          git commit -m "FIX | BUG-CAP-013 lower typed public HTTP Controller grants"

          git fetch origin main
          base="$(git rev-parse HEAD~1)"
          current="$(git rev-parse origin/main)"
          if [ "$current" != "$base" ]; then
            git rebase origin/main
          fi
          git push origin HEAD:main
