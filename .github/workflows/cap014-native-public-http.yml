name: CAP-014 native public HTTP WASM

"on":
  push:
    branches: [main]
    paths:
      - '.github/patches/cap014-native-public-http.py'
      - '.github/patches/cap014-doc-native-manifest.py'
      - '.github/patches/cap014-normalize-network-anchor.py'
      - '.github/workflows/cap014-native-public-http.yml'

permissions:
  contents: write

concurrency:
  group: cap014-native-public-http
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Apply CAP-014 native public HTTP lowering
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          python3 .github/patches/cap014-normalize-network-anchor.py
          python3 .github/patches/cap014-native-public-http.py
          python3 .github/patches/cap014-doc-native-manifest.py
          cargo fmt --manifest-path engine/Cargo.toml --all

      - name: Check Engine native capability path locked
        run: cargo check --manifest-path engine/Cargo.toml -p core-lib -p route-engine -p backend --all-targets --locked
      - name: Test Engine native capability path locked
        run: cargo test --manifest-path engine/Cargo.toml -p core-lib -p route-engine -p backend --locked
      - name: Clippy Engine native capability path locked
        run: cargo clippy --manifest-path engine/Cargo.toml -p core-lib -p route-engine -p backend --all-targets --locked -- -D warnings
      - name: Recheck Container worker capability ABI locked
        run: cargo test --manifest-path container-runtime/Cargo.toml -p execution-engine --locked

      - name: Verify CAP-014 invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'pub const ROUTE_WASM_ABI_VERSION: u32 = 3' engine/crates/route-engine/src/wasm_compiler.rs
          grep -q 'pub const ROUTE_WASM_COMPILER_VERSION: u32 = 3' engine/crates/route-engine/src/wasm_compiler.rs
          grep -q 'fn encode_public_http_module' engine/crates/route-engine/src/wasm_compiler.rs
          grep -q 'NETWORK_CAPABILITY_KIND: i32 = 1' engine/crates/route-engine/src/wasm_compiler.rs
          grep -q '"capability_call"' engine/crates/route-engine/src/wasm_compiler.rs
          grep -q '"capability_response_len"' engine/crates/route-engine/src/wasm_compiler.rs
          grep -q '"capability_response_read"' engine/crates/route-engine/src/wasm_compiler.rs
          grep -q 'PUBLIC_HTTP_TARGET.as_bytes()' engine/crates/route-engine/src/wasm_compiler.rs
          grep -q 'http_namespace_import_stays_interpreter_fallback' engine/crates/route-engine/src/wasm_compiler.rs
          grep -q 'dynamic_http_argument_stays_interpreter_fallback' engine/crates/route-engine/src/wasm_compiler.rs
          grep -q 'direct_http_get_links_native_artifact_with_exact_network_requirement' engine/crates/route-engine/src/relc.rs
          grep -q 'grant.kind == ContainerCapabilityKind::Network' engine/crates/route-engine/src/discovery.rs
          grep -q 'HTTP capability request exceeds the capability envelope' engine/crates/core/src/network_broker.rs
          grep -q 'HTTP response exceeds the capability envelope' engine/crates/core/src/network_broker.rs
          grep -q 'Route-WASM ABI v3' doc/runtime-image.md
          grep -q 'compiler-lowered `Network/public-http` grant' doc/runtime-image.md

      - name: Land validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/cap014-native-public-http.yml
          git rm -f .github/patches/cap014-native-public-http.py
          git rm -f .github/patches/cap014-doc-native-manifest.py
          git rm -f .github/patches/cap014-normalize-network-anchor.py
          git add engine doc/runtime-image.md
          git commit -m "FIX | BUG-CAP-014 execute static public HTTP through native WASM"

          git fetch origin main
          base="$(git rev-parse HEAD~1)"
          current="$(git rev-parse origin/main)"
          if [ "$current" != "$base" ]; then
            git rebase origin/main
          fi
          git push origin HEAD:main
