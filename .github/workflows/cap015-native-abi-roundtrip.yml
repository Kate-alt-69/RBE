name: CAP-015 native capability ABI round-trip

"on":
  push:
    branches: [main]
    paths:
      - '.github/patches/cap015-native-abi-roundtrip.py'
      - '.github/workflows/cap015-native-abi-roundtrip.yml'

permissions:
  contents: write

concurrency:
  group: cap015-native-abi-roundtrip
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            engine
            container-runtime

      - name: Apply CAP-015 compiler-to-Wasmtime ABI tests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          python3 .github/patches/cap015-native-abi-roundtrip.py
          cargo fmt --manifest-path engine/Cargo.toml --all

      - name: Refresh Engine lock for dev-only execution engine dependency
        run: cargo check --manifest-path engine/Cargo.toml -p route-engine --all-targets
      - name: Check Engine native ABI path locked
        run: cargo check --manifest-path engine/Cargo.toml -p core-lib -p route-engine -p backend --all-targets --locked
      - name: Test Engine native ABI path locked
        run: cargo test --manifest-path engine/Cargo.toml -p core-lib -p route-engine -p backend --locked
      - name: Clippy Engine native ABI path locked
        run: cargo clippy --manifest-path engine/Cargo.toml -p core-lib -p route-engine -p backend --all-targets --locked -- -D warnings

      - name: Verify CAP-015 invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'execution-engine = { path = "../../../container-runtime/crates/execution-engine" }' engine/crates/route-engine/Cargo.toml
          grep -q 'generated_http_wasm_round_trips_through_real_capability_host_abi' engine/crates/route-engine/src/wasm_compiler.rs
          grep -q 'generated_http_wasm_fails_closed_when_host_denies_capability' engine/crates/route-engine/src/wasm_compiler.rs
          grep -q 'ContainerCapabilityKind::Network' engine/crates/route-engine/src/wasm_compiler.rs
          grep -q 'CAPABILITY_DENIED' engine/crates/route-engine/src/wasm_compiler.rs
          grep -q 'WASM ABI violation' engine/crates/route-engine/src/wasm_compiler.rs
          git diff --check

      - name: Land validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/cap015-native-abi-roundtrip.yml
          git rm -f .github/patches/cap015-native-abi-roundtrip.py
          git add engine/Cargo.lock engine/crates/route-engine/Cargo.toml engine/crates/route-engine/src/wasm_compiler.rs
          git commit -m "FIX | BUG-CAP-015 verify native capability ABI round trip"

          git fetch origin main
          base="$(git rev-parse HEAD~1)"
          current="$(git rev-parse origin/main)"
          if [ "$current" != "$base" ]; then
            git rebase origin/main
          fi
          git push origin HEAD:main
