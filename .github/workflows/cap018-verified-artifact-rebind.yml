name: CAP-018 verified artifact rebinding

"on":
  push:
    branches: [main]
    paths:
      - '.github/patches/cap018-verified-artifact-rebind.py'
      - '.github/workflows/cap018-verified-artifact-rebind.yml'

permissions:
  contents: write

concurrency:
  group: cap018-verified-artifact-rebind
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            container-runtime
            engine

      - name: Apply CAP-018 verified artifact rebinding
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          python3 .github/patches/cap018-verified-artifact-rebind.py
          cargo fmt --manifest-path container-runtime/Cargo.toml --all
          cargo fmt --manifest-path engine/Cargo.toml --all

      - name: Check Container workspace locked
        run: cargo check --manifest-path container-runtime/Cargo.toml --workspace --all-targets --locked
      - name: Test Container workspace locked
        run: cargo test --manifest-path container-runtime/Cargo.toml --workspace --locked
      - name: Clippy Container workspace locked
        run: cargo clippy --manifest-path container-runtime/Cargo.toml --workspace --all-targets --locked -- -D warnings

      - name: Check Engine artifact admission path locked
        run: cargo check --manifest-path engine/Cargo.toml -p core-lib -p route-engine -p backend --all-targets --locked
      - name: Test Engine artifact admission path locked
        run: cargo test --manifest-path engine/Cargo.toml -p core-lib -p route-engine -p backend --locked
      - name: Clippy Engine artifact admission path locked
        run: cargo clippy --manifest-path engine/Cargo.toml -p core-lib -p route-engine -p backend --all-targets --locked -- -D warnings

      - name: Verify CAP-018 invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'pub const PROTOCOL_VERSION: u16 = 8' container-runtime/crates/ipc-protocol/src/lib.rs
          grep -q 'pub struct BindArtifactRequest' container-runtime/crates/ipc-protocol/src/lib.rs
          grep -q 'BindArtifact(BindArtifactRequest)' container-runtime/crates/ipc-protocol/src/lib.rs
          grep -q 'ArtifactBound {' container-runtime/crates/ipc-protocol/src/lib.rs
          grep -q 'pub fn verified_artifact_available' container-runtime/crates/container-runtime-core/src/cache.rs
          grep -q 'Request::BindArtifact(request)' container-runtime/crates/container-bin/src/main.rs
          grep -q 'verified_artifact_available(&request.artifact_hash)' container-runtime/crates/container-bin/src/main.rs
          grep -q 'pub async fn bind_cached_artifact' engine/crates/core/src/container_client.rs
          grep -q 'if !self' engine/crates/core/src/container_client.rs
          grep -q 'bind_cached_artifact(request.identity, request.artifact_hash)' engine/crates/core/src/container_client.rs
          grep -q 'cached_artifact_binding_uses_identity_only_fast_path' engine/crates/core/src/container_client.rs
          grep -q 'cached_artifact_binding_reports_controller_miss_without_faking_authority' engine/crates/core/src/container_client.rs
          grep -q 'Controller protocol v8 supports a hash-only rebind' doc/runtime-image.md

      - name: Land validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/cap018-verified-artifact-rebind.yml
          git rm -f .github/patches/cap018-verified-artifact-rebind.py
          git add container-runtime engine doc/runtime-image.md
          git commit -m "FIX | BUG-CAP-018 avoid retransmitting verified native artifacts"

          git fetch origin main
          base="$(git rev-parse HEAD~1)"
          current="$(git rev-parse origin/main)"
          if [ "$current" != "$base" ]; then
            git rebase origin/main
          fi
          git push origin HEAD:main
