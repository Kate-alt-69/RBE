name: CAP-020 Video capability principal propagation

"on":
  push:
    branches: [main]
    paths:
      - '.github/patches/cap020-video-principal.py'
      - '.github/patches/cap020-fix-nested-import.py'
      - '.github/workflows/cap020-video-principal.yml'

permissions:
  contents: write

concurrency:
  group: cap020-video-principal
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Apply CAP-020 principal-aware Video requirements
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          python3 .github/patches/cap020-video-principal.py
          python3 .github/patches/cap020-fix-nested-import.py
          cargo fmt --manifest-path engine/Cargo.toml --all

      - name: Check Route Engine locked
        run: cargo check --manifest-path engine/Cargo.toml -p route-engine --all-targets --locked
      - name: Test Route Engine locked
        run: cargo test --manifest-path engine/Cargo.toml -p route-engine --locked
      - name: Clippy Route Engine locked
        run: cargo clippy --manifest-path engine/Cargo.toml -p route-engine --all-targets --locked -- -D warnings

      - name: Verify CAP-020 invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Video { owner: String, operation: String }' engine/crates/route-engine/src/runtime_image.rs
          grep -q 'pub(crate) fn module_owner_from_logical_name' engine/crates/route-engine/src/module_runtime.rs
          grep -q 'module_owner_from_logical_name(source_record.logical_name())' engine/crates/route-engine/src/relc.rs
          grep -q 'Video Manager authority is module-owned' engine/crates/route-engine/src/relc.rs
          grep -q 'video_principal_survives_nested_module_to_route_propagation' engine/crates/route-engine/src/relc.rs
          grep -q 'distinct_video_modules_keep_distinct_principals' engine/crates/route-engine/src/relc.rs
          grep -q 'canonical declaring Module principal' doc/runtime-image.md
          # CAP-020 is metadata only: Video is still not lowerable to a Controller grant.
          grep -q 'has no native Container grant lowering yet' engine/crates/route-engine/src/runtime_image.rs

      - name: Land validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/cap020-video-principal.yml
          git rm -f .github/patches/cap020-video-principal.py
          git rm -f .github/patches/cap020-fix-nested-import.py
          git add engine/crates/route-engine doc/runtime-image.md
          git commit -m "FIX | BUG-CAP-020 preserve Video capability principal during propagation"

          git fetch origin main
          base="$(git rev-parse HEAD~1)"
          current="$(git rev-parse origin/main)"
          if [ "$current" != "$base" ]; then
            git rebase origin/main
          fi
          git push origin HEAD:main
