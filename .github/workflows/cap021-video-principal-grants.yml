name: CAP-021 principal-bound Video grants

"on":
  push:
    branches: [main]
    paths:
      - '.github/patches/cap021-video-principal-grants.py'
      - '.github/workflows/cap021-video-principal-grants.yml'

permissions:
  contents: write

concurrency:
  group: cap021-video-principal-grants
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            engine
            container-runtime

      - name: Apply CAP-021 principal-bound Video grants
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          python3 .github/patches/cap021-video-principal-grants.py
          cargo fmt --manifest-path engine/Cargo.toml --all

      - name: Check Engine Video capability path locked
        run: cargo check --manifest-path engine/Cargo.toml -p core-lib -p route-engine -p backend --all-targets --locked
      - name: Test Engine Video capability path locked
        run: cargo test --manifest-path engine/Cargo.toml -p core-lib -p route-engine -p backend --locked
      - name: Clippy Engine Video capability path locked
        run: cargo clippy --manifest-path engine/Cargo.toml -p core-lib -p route-engine -p backend --all-targets --locked -- -D warnings
      - name: Recheck Controller capability broker locked
        run: cargo test --manifest-path container-runtime/Cargo.toml -p container-runtime-core control_plane --locked

      - name: Verify CAP-021 invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'pub const VIDEO_LANGUAGE_OPERATIONS' engine/crates/core/src/video_language.rs
          grep -q 'pub const VIDEO_CAPABILITY_TARGET_PREFIX: &str = "module:"' engine/crates/core/src/video_language.rs
          grep -q 'VIDEO_LANGUAGE_OPERATIONS' engine/crates/route-engine/src/relc.rs
          ! grep -q 'const VIDEO_HOST_OPERATIONS' engine/crates/route-engine/src/relc.rs
          grep -q 'BTreeMap::<String, BTreeSet<String>>::new()' engine/crates/route-engine/src/runtime_image.rs
          grep -q 'kind: ContainerCapabilityKind::Video' engine/crates/route-engine/src/runtime_image.rs
          grep -q 'target: format!("{VIDEO_CAPABILITY_TARGET_PREFIX}{owner}")' engine/crates/route-engine/src/runtime_image.rs
          grep -q 'service_requirements_remain_fail_closed' engine/crates/route-engine/src/runtime_image.rs
          grep -q 'video_target_requires_exact_module_principal' engine/crates/backend/src/host_capability.rs
          grep -q 'video_dispatch_uses_authorized_target_as_owner_and_not_payload_identity' engine/crates/backend/src/host_capability.rs
          grep -q 'install_video_manager(video_manager.clone())' engine/crates/backend/src/main.rs
          grep -q 'Route-WASM v3 still has no linked-module/Video call producer' doc/runtime-image.md

      - name: Land validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/cap021-video-principal-grants.yml
          git rm -f .github/patches/cap021-video-principal-grants.py
          git add engine doc/runtime-image.md
          git commit -m "FIX | BUG-CAP-021 bind Video grants to module principals"

          git fetch origin main
          base="$(git rev-parse HEAD~1)"
          current="$(git rev-parse origin/main)"
          if [ "$current" != "$base" ]; then
            git rebase origin/main
          fi
          git push origin HEAD:main
