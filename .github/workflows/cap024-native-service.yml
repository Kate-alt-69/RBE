name: CAP-024 native Service capability calls

"on":
  push:
    branches: [main]
    paths:
      - '.github/workflows/cap024-native-service.yml'

permissions:
  contents: write

concurrency:
  group: cap024-native-service
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            engine
            container-runtime

      - name: Apply native Service capability lowering
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          python3 - <<'PY'
          from pathlib import Path

          wasm = Path('engine/crates/route-engine/src/wasm_compiler.rs')
          text = wasm.read_text(encoding='utf-8')

          def rep(old: str, new: str, label: str, count: int = 1) -> None:
              global text
              found = text.count(old)
              if found != count:
                  raise SystemExit(f'{label}: expected {count} anchors, found {found}')
              text = text.replace(old, new, count)

          rep(
              '''use core_lib::{
              ContainerCapabilityKind, CONTAINER_MAX_CAPABILITY_PAYLOAD_BYTES,
              CONTAINER_MAX_EXECUTION_INPUT_BYTES, PUBLIC_HTTP_TARGET,
          };
          use sha2::{Digest, Sha256};''',
              '''use core_lib::{
              ContainerCapabilityKind, CONTAINER_MAX_CAPABILITY_PAYLOAD_BYTES,
              CONTAINER_MAX_EXECUTION_INPUT_BYTES, PUBLIC_HTTP_TARGET,
          };
          use service_runtime::SERVICE_CAPABILITY_TARGET_PREFIX;
          use sha2::{Digest, Sha256};''',
              'Service target contract import',
          )
          rep(
              'pub const ROUTE_WASM_COMPILER_VERSION: u32 = 3;',
              'pub const ROUTE_WASM_COMPILER_VERSION: u32 = 4;',
              'compiler generation bump',
          )
          rep(
              '''/// Native lowering remains intentionally strict: one HTTP method, one return,
          /// no helper functions. In addition to literals and req.body passthrough, ABI v3
          /// permits one directly imported `http.get/post/request` function with fully
          /// static JSON arguments. Namespace imports stay interpreter-only so native
          /// grants remain operation-exact rather than widening authority.''',
              '''/// Native lowering remains intentionally strict: one HTTP method, one return,
          /// no helper functions. In addition to literals and req.body passthrough, compiler
          /// generation v4 permits one directly imported host-capability function with fully
          /// static JSON arguments: `http.get/post/request` or one exact Service export.
          /// Namespace imports stay interpreter-only so native grants remain operation-exact
          /// rather than widening authority.''',
              'native compiler documentation',
          )
          rep(
              '''    let http_import =
                  match file.imports.as_slice() {
                      [] => None,
                      [import] => match direct_http_import(import) {
                          Some(import) => Some(import),
                          None => return fallback(
                              "native Route-WASM v3 only supports one direct http.get/post/request import",
                          ),
                      },
                      _ => {
                          return fallback(
                              "native Route-WASM v3 supports at most one direct host capability import",
                          )
                      }
                  };''',
              '''    let host_import = match file.imports.as_slice() {
                  [] => None,
                  [import] => match direct_capability_import(import) {
                      Some(import) => Some(import),
                      None => return fallback(
                          "native Route-WASM v4 only supports one direct http.get/post/request or service:<name>.<operation> import",
                      ),
                  },
                  _ => {
                      return fallback(
                          "native Route-WASM v4 supports at most one direct host capability import",
                      )
                  }
              };''',
              'direct host import selection',
          )
          rep(
              '''    let (bytes, input) = if let Some((binding, operation)) = http_import.as_ref() {
                  let Some(args) = static_direct_call(binding, expr) else {
                      return fallback(
                          "native public HTTP calls require the imported function as the return value with static JSON arguments",
                      );
                  };
                  let payload = match serde_json::to_vec(&args) {
                      Ok(payload) => payload,
                      Err(error) => return fallback(format!("encode native HTTP arguments: {error}")),
                  };
                  if payload.len() > CONTAINER_MAX_CAPABILITY_PAYLOAD_BYTES {
                      return fallback("native HTTP argument payload exceeds the capability envelope");
                  }
                  (
                      encode_capability_call_module(
                          ContainerCapabilityKind::Network,
                          PUBLIC_HTTP_TARGET,
                          operation,
                          &payload,
                      ),
                      RouteWasmInput::None,
                  )''',
              '''    let (bytes, input) = if let Some(import) = host_import.as_ref() {
                  let Some(args) = static_direct_call(&import.binding, expr) else {
                      return fallback(
                          "native host capability calls require the directly imported function as the return value with static JSON arguments",
                      );
                  };
                  let payload = match serde_json::to_vec(&args) {
                      Ok(payload) => payload,
                      Err(error) => {
                          return fallback(format!("encode native capability arguments: {error}"))
                      }
                  };
                  if payload.len() > CONTAINER_MAX_CAPABILITY_PAYLOAD_BYTES {
                      return fallback("native capability argument payload exceeds the capability envelope");
                  }
                  (
                      encode_capability_call_module(
                          import.kind,
                          &import.target,
                          &import.operation,
                          &payload,
                      ),
                      RouteWasmInput::None,
                  )''',
              'generic direct capability lowering',
          )
          rep(
              '''fn direct_http_import(import: &ImportTarget) -> Option<(String, String)> {
              let (binding, module, function) = match import {
                  ImportTarget::BuiltinFunction { module, function } => {
                      (function.clone(), module.as_str(), function.as_str())
                  }
                  ImportTarget::Aliased { target, alias } => match target.as_ref() {
                      ImportTarget::BuiltinFunction { module, function } => {
                          (alias.clone(), module.as_str(), function.as_str())
                      }
                      _ => return None,
                  },
                  _ => return None,
              };
              (module == "http" && matches!(function, "get" | "post" | "request"))
                  .then(|| (binding, function.to_string()))
          }''',
              '''#[derive(Debug, Clone)]
          struct DirectCapabilityImport {
              binding: String,
              kind: ContainerCapabilityKind,
              target: String,
              operation: String,
          }

          fn direct_capability_import(import: &ImportTarget) -> Option<DirectCapabilityImport> {
              let (binding, base) = match import {
                  ImportTarget::Aliased { target, alias } => (alias.clone(), target.as_ref()),
                  ImportTarget::BuiltinFunction { function, .. }
                  | ImportTarget::ServiceFunction { function, .. } => {
                      (function.clone(), import)
                  }
                  _ => return None,
              };

              match base {
                  ImportTarget::BuiltinFunction { module, function }
                      if module == "http"
                          && matches!(function.as_str(), "get" | "post" | "request") =>
                  {
                      Some(DirectCapabilityImport {
                          binding,
                          kind: ContainerCapabilityKind::Network,
                          target: PUBLIC_HTTP_TARGET.to_string(),
                          operation: function.clone(),
                      })
                  }
                  ImportTarget::ServiceFunction { service, function } => {
                      Some(DirectCapabilityImport {
                          binding,
                          kind: ContainerCapabilityKind::Service,
                          target: format!("{SERVICE_CAPABILITY_TARGET_PREFIX}{service}"),
                          operation: function.clone(),
                      })
                  }
                  _ => None,
              }
          }''',
              'direct Service/Network capability import resolver',
          )

          # Existing HTTP fallback assertions now describe the broader direct-host subset.
          rep(
              'assert!(reason.contains("one direct http.get/post/request import"));',
              'assert!(reason.contains("one direct http.get/post/request or service:<name>.<operation> import"));',
              'namespace fallback assertion',
          )
          rep(
              'assert!(reason.contains("static JSON arguments"));',
              'assert!(reason.contains("static JSON arguments"));',
              'static argument assertion',
          )

          marker = '''    #[test]
              fn aliased_static_http_get_is_native() {'''
          if text.count(marker) != 1:
              raise SystemExit('Service native tests insertion anchor missing')
          tests = r'''    #[test]
              fn direct_static_service_call_is_native_v4_capability_call() {
                  let route = parse(
                      r#":import[service:uac.get_user]
                         class Route { get(req) { return get_user("alice"); } }"#,
                  );
                  let RouteWasmCompilation::Native(artifact) = compile_route(&route) else {
                      panic!("direct static Service call should lower to native capability ABI");
                  };
                  assert_eq!(artifact.input, RouteWasmInput::None);
                  wasmparser::validate(&artifact.bytes).unwrap();
                  assert!(artifact
                      .bytes
                      .windows(b"service:uac".len())
                      .any(|window| window == b"service:uac"));
                  assert!(artifact
                      .bytes
                      .windows(b"get_user".len())
                      .any(|window| window == b"get_user"));
              }

              #[test]
              fn generated_service_wasm_round_trips_through_real_capability_host_abi() {
                  let route = parse(
                      r#":import[service:uac.get_user]
                         class Route { get(req) { return get_user("alice", 7); } }"#,
                  );
                  let RouteWasmCompilation::Native(artifact) = compile_route(&route) else {
                      panic!("direct Service route should compile natively");
                  };
                  let host: CapabilityHost = Box::new(|request| {
                      assert_eq!(request.kind, ContainerCapabilityKind::Service);
                      assert_eq!(request.target, "service:uac");
                      assert_eq!(request.operation, "get_user");
                      assert_eq!(
                          serde_json::from_slice::<serde_json::Value>(&request.payload).unwrap(),
                          serde_json::json!(["alice", 7.0])
                      );
                      Ok(br#"{"id":"alice","ok":true}"#.to_vec())
                  });
                  let result = WasmExecutor::new()
                      .unwrap()
                      .execute_with_input_and_capabilities(
                          &artifact.bytes,
                          &[],
                          ExecutionLimits::default(),
                          Some(host),
                      )
                      .unwrap();
                  assert_eq!(result.exit_code, 0);
                  assert_eq!(result.output, br#"{"id":"alice","ok":true}"#);
              }

              #[test]
              fn aliased_static_service_call_is_native() {
                  let route = parse(
                      r#":import[service:uac.get_user as lookup]
                         class Route { get(req) { return lookup("alice"); } }"#,
                  );
                  assert!(compile_route(&route).is_native());
              }

              #[test]
              fn service_namespace_import_stays_interpreter_fallback() {
                  let route = parse(
                      r#":import[service:uac]
                         class Route { get(req) { return uac.get_user("alice"); } }"#,
                  );
                  let RouteWasmCompilation::InterpreterFallback { reason } = compile_route(&route) else {
                      panic!("Service namespace import must not widen native authority");
                  };
                  assert!(reason.contains("service:<name>.<operation>"));
              }

              #[test]
              fn dynamic_service_argument_stays_interpreter_fallback() {
                  let route = parse(
                      r#":import[service:uac.get_user]
                         class Route { post(req) { return get_user(req.body); } }"#,
                  );
                  let RouteWasmCompilation::InterpreterFallback { reason } = compile_route(&route) else {
                      panic!("dynamic Service argument is outside the v4 native subset");
                  };
                  assert!(reason.contains("static JSON arguments"));
              }

          '''
          text = text.replace(marker, tests + marker, 1)
          wasm.write_text(text, encoding='utf-8')

          doc = Path('doc/runtime-image.md')
          d = doc.read_text(encoding='utf-8')
          old = 'Service requirements lower to exact `Service/service:<name>` Controller grants with compiler-derived exported operation sets, and the authenticated Backend adapter rejects raw/unprefixed targets before calling `ServiceManager`. Route-WASM v3 still has no linked-module Service/Video call producer, so these grant+adapter boundaries are ready before end-to-end native linked-module host calls are enabled.'
          new = 'Service requirements lower to exact `Service/service:<name>` Controller grants with compiler-derived exported operation sets, and the authenticated Backend adapter rejects raw/unprefixed targets before calling `ServiceManager`. Route-WASM compiler generation v4 now emits direct `service:<name>.<operation>` imports with static JSON arguments through the existing versioned capability ABI, so those calls execute end-to-end through Controller authorization and the trusted Service Gateway. Service namespace imports remain interpreter-only to avoid widening authority; linked-module Video production remains separate work.'
          if d.count(old) != 1:
              raise SystemExit('runtime-image Service producer docs anchor missing')
          d = d.replace(old, new, 1)
          old = 'For routes inside the current native compiler subset, the image stores exact deterministic WASM bytes and artifact identity. Route-WASM ABI v3 retains the JSON invocation input for native `return req.body;` routes and adds real Controller-authorized `Network/public-http` capability calls for one directly imported `http.get`, `http.post`, or `http.request` operation when all call arguments are static JSON. Capability kind integers are defined centrally by `ipc-protocol::CapabilityKind` as part of the versioned capability ABI, and the compiler uses one generic capability-call emitter rather than hardcoding Network-specific numeric discriminants. Namespace `http` imports and dynamic HTTP arguments remain explicit interpreter fallback, preventing native compilation from widening the operation grant.'
          new = 'For routes inside the current native compiler subset, the image stores exact deterministic WASM bytes and artifact identity. Route-WASM ABI v3 remains stable while compiler generation v4 emits real Controller-authorized capability calls for one directly imported host operation: `http.get`, `http.post`, `http.request`, or an exact `service:<name>.<operation>` export when all call arguments are static JSON. Capability kind integers are defined centrally by `ipc-protocol::CapabilityKind` as part of the versioned capability ABI, and the compiler uses one generic capability-call emitter rather than hardcoding Network- or Service-specific numeric discriminants. Namespace HTTP/Service imports and dynamic capability arguments remain explicit interpreter fallback, preventing native compilation from widening the operation grant.'
          if d.count(old) != 1:
              raise SystemExit('runtime-image native Route-WASM docs anchor missing')
          d = d.replace(old, new, 1)
          old = 'Capability-free native routes register an empty manifest; an ABI-v3 directly imported public HTTP operation registers only its compiler-lowered `Network/public-http` grant and exact operation set.'
          new = 'Capability-free native routes register an empty manifest; an ABI-v3 directly imported public HTTP operation registers only its compiler-lowered `Network/public-http` grant and exact operation set, while a direct Service-function route registers only the exact `Service/service:<name>` operation it imports.'
          if d.count(old) != 1:
              raise SystemExit('runtime-image manifest docs anchor missing')
          doc.write_text(d.replace(old, new, 1), encoding='utf-8')
          PY
          cargo fmt --manifest-path engine/Cargo.toml --all

      - name: Check Route Engine locked
        run: cargo check --manifest-path engine/Cargo.toml -p route-engine --all-targets --locked
      - name: Test native Route-WASM compiler locked
        run: cargo test --manifest-path engine/Cargo.toml -p route-engine wasm_compiler --locked
      - name: Clippy Route Engine locked
        run: cargo clippy --manifest-path engine/Cargo.toml -p route-engine --all-targets --locked -- -D warnings
      - name: Verify CAP-024 invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'ROUTE_WASM_COMPILER_VERSION: u32 = 4' engine/crates/route-engine/src/wasm_compiler.rs
          grep -q 'SERVICE_CAPABILITY_TARGET_PREFIX' engine/crates/route-engine/src/wasm_compiler.rs
          grep -q 'ImportTarget::ServiceFunction' engine/crates/route-engine/src/wasm_compiler.rs
          grep -q 'direct_static_service_call_is_native_v4_capability_call' engine/crates/route-engine/src/wasm_compiler.rs
          grep -q 'generated_service_wasm_round_trips_through_real_capability_host_abi' engine/crates/route-engine/src/wasm_compiler.rs
          grep -q 'service_namespace_import_stays_interpreter_fallback' engine/crates/route-engine/src/wasm_compiler.rs
          grep -q 'compiler generation v4 now emits direct' doc/runtime-image.md
          git diff --check

      - name: Land validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/cap024-native-service.yml
          git add engine/crates/route-engine/src/wasm_compiler.rs doc/runtime-image.md
          git commit -m "FIX | BUG-CAP-024 execute Service capability calls through native WASM"

          git fetch origin main
          base="$(git rev-parse HEAD~1)"
          current="$(git rev-parse origin/main)"
          if [ "$current" != "$base" ]; then
            git rebase origin/main
          fi
          git push origin HEAD:main
