name: CAP-024 shared capability limits

"on":
  push:
    branches: [main]
    paths:
      - '.github/patches/cap024-shared-capability-limits.py'
      - '.github/workflows/cap024-shared-capability-limits.yml'

permissions:
  contents: write

concurrency:
  group: cap024-shared-capability-limits
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            container-runtime
            engine

      - name: Apply CAP-024 shared capability limits
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          python3 .github/patches/cap024-shared-capability-limits.py
          cargo fmt --manifest-path container-runtime/Cargo.toml --all
          cargo fmt --manifest-path engine/Cargo.toml --all

      - name: Check Container capability contract locked
        run: cargo check --manifest-path container-runtime/Cargo.toml --workspace --all-targets --locked
      - name: Test Container capability contract locked
        run: cargo test --manifest-path container-runtime/Cargo.toml --workspace --locked
      - name: Clippy Container capability contract locked
        run: cargo clippy --manifest-path container-runtime/Cargo.toml --workspace --all-targets --locked -- -D warnings

      - name: Check Engine capability lowering locked
        run: cargo check --manifest-path engine/Cargo.toml -p core-lib -p route-engine -p backend --all-targets --locked
      - name: Test Engine capability lowering locked
        run: cargo test --manifest-path engine/Cargo.toml -p core-lib -p route-engine -p backend --locked
      - name: Clippy Engine capability lowering locked
        run: cargo clippy --manifest-path engine/Cargo.toml -p core-lib -p route-engine -p backend --all-targets --locked -- -D warnings

      - name: Verify CAP-024 invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'pub const MAX_CAPABILITY_GRANTS_PER_MANIFEST: usize = 128' container-runtime/crates/ipc-protocol/src/lib.rs
          grep -q 'pub const MAX_CAPABILITY_OPERATIONS_PER_GRANT: usize = 64' container-runtime/crates/ipc-protocol/src/lib.rs
          grep -q 'pub const MAX_CAPABILITY_TARGET_BYTES: usize = 256' container-runtime/crates/ipc-protocol/src/lib.rs
          grep -q 'pub const MAX_CAPABILITY_OPERATION_BYTES: usize = 128' container-runtime/crates/ipc-protocol/src/lib.rs
          ! grep -q 'const MAX_GRANTS_PER_SOURCE' container-runtime/crates/container-runtime-core/src/control_plane.rs
          ! grep -q 'const MAX_OPERATIONS_PER_GRANT' container-runtime/crates/container-runtime-core/src/control_plane.rs
          ! grep -q 'const MAX_TARGET_BYTES' container-runtime/crates/container-runtime-core/src/control_plane.rs
          ! grep -q 'const MAX_OPERATION_BYTES' container-runtime/crates/container-runtime-core/src/control_plane.rs
          grep -q 'validate_lowered_grant_shape(&grants)' engine/crates/route-engine/src/runtime_image.rs
          grep -q 'CONTAINER_MAX_CAPABILITY_OPERATIONS_PER_GRANT' engine/crates/route-engine/src/runtime_image.rs
          grep -q 'MAX_CAPABILITY_OPERATION_BYTES' engine/crates/backend/src/host_capability.rs
          grep -q 'Capability manifest shape ceilings' doc/runtime-image.md

      - name: Land validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/cap024-shared-capability-limits.yml
          git rm -f .github/patches/cap024-shared-capability-limits.py
          git add \
            container-runtime/crates/ipc-protocol/src/lib.rs \
            container-runtime/crates/container-runtime-core/src/control_plane.rs \
            engine/crates/core/src/lib.rs \
            engine/crates/route-engine/src/runtime_image.rs \
            engine/crates/backend/src/host_capability.rs \
            doc/runtime-image.md
          git commit -m "FIX | BUG-CAP-024 centralize capability manifest limits"

          git fetch origin main
          base="$(git rev-parse HEAD~1)"
          current="$(git rev-parse origin/main)"
          if [ "$current" != "$base" ]; then
            git rebase origin/main
          fi
          git push origin HEAD:main
