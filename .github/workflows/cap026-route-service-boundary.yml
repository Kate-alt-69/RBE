name: CAP-026 Route Service boundary

"on":
  push:
    branches: [main]
    paths:
      - '.github/patches/cap026-route-service-boundary.py'
      - '.github/workflows/cap026-route-service-boundary.yml'

permissions:
  contents: write

concurrency:
  group: cap026-route-service-boundary
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Apply CAP-026 Route Service boundary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          python3 .github/patches/cap026-route-service-boundary.py
          cargo fmt --manifest-path engine/Cargo.toml --all

      - name: Check Route Engine boundary locked
        run: cargo check --manifest-path engine/Cargo.toml -p route-engine --all-targets --locked
      - name: Test Route Engine boundary locked
        run: cargo test --manifest-path engine/Cargo.toml -p route-engine --locked
      - name: Clippy Route Engine boundary locked
        run: cargo clippy --manifest-path engine/Cargo.toml -p route-engine --all-targets --locked -- -D warnings
      - name: Check Backend integration locked
        run: cargo check --manifest-path engine/Cargo.toml -p backend --all-targets --locked

      - name: Verify CAP-026 invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'pub const ROUTE_WASM_COMPILER_VERSION: u32 = 6' engine/crates/route-engine/src/wasm_compiler.rs
          grep -q 'direct_service_route_import_stays_outside_native_subset' engine/crates/route-engine/src/wasm_compiler.rs
          grep -q 'linked_module_service_call_substitutes_static_route_arguments' engine/crates/route-engine/src/wasm_compiler.rs
          grep -q 'linked_module_video_call_uses_canonical_module_owner' engine/crates/route-engine/src/wasm_compiler.rs
          grep -q 'Route REL cannot directly import Service REL; use a module boundary' engine/crates/route-engine/src/relc.rs
          grep -q 'compiler generation v6' doc/runtime-image.md
          if grep -q 'direct_static_service_call_is_native_v4_capability_call' engine/crates/route-engine/src/wasm_compiler.rs; then
            echo 'obsolete direct Route-to-Service native path still has blessed tests' >&2
            exit 1
          fi

      - name: Land validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/cap026-route-service-boundary.yml
          git rm -f .github/patches/cap026-route-service-boundary.py
          if [ -f .github/patches/cap025-linked-module-native-v2.py ]; then
            git rm -f .github/patches/cap025-linked-module-native-v2.py
          fi
          git add engine/crates/route-engine/src/wasm_compiler.rs doc/runtime-image.md
          git commit -m "FIX | BUG-CAP-026 enforce Route Service module boundary"
          git fetch origin main
          base="$(git rev-parse HEAD~1)"
          current="$(git rev-parse origin/main)"
          if [ "$current" != "$base" ]; then
            git rebase origin/main
          fi
          git push origin HEAD:main
