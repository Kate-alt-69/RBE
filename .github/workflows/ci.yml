name: CI

on:
  push:
  pull_request:

jobs:
  main-workspace:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: fmt check
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: build (release)
        run: cargo build --workspace --release

  build-script-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: build.sh (host debug build)
        run: ./build.sh --debug

  build-script-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: build.ps1 (host debug build)
        shell: pwsh
        run: ./build.ps1 --debug

  shared-crates:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        crate: [atomic-io, vault, error-client]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.crate }}
      - name: fmt check
        working-directory: ${{ matrix.crate }}
        run: cargo fmt --all -- --check
      - name: clippy
        working-directory: ${{ matrix.crate }}
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        working-directory: ${{ matrix.crate }}
        run: cargo test

  container-runtime-workspace:
    needs: shared-crates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: container-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: container-runtime
      - name: fmt check
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: build (release)
        run: cargo build --workspace --release

  container-runtime-windows:
    needs: shared-crates
    runs-on: windows-latest
    defaults:
      run:
        working-directory: container-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: container-runtime
      - name: test (portable runtime contracts)
        run: cargo test --workspace
      - name: build (release)
        run: cargo build --workspace --release

  container-security-smoke:
    needs: container-runtime-workspace
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: container-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: container-runtime
      - name: sandbox primitives tests
        run: cargo test -p sandbox-primitives
      - name: resource limits tests
        run: cargo test -p resource-limits
      - name: execution engine tests
        run: cargo test -p execution-engine
