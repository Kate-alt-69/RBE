name: CI

# Lives at the true repo root (project-root/.github/workflows).
# CI validates both the Rust workspaces and the same build entrypoints
# developers use locally, so a green CI run means the distributable build
# scripts can actually compile RBE on their native CI platforms.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  main-workspace:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: fmt check
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: build (release)
        run: cargo build --workspace --release

  build-script-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: build.sh (host debug build)
        run: ./build.sh --debug

  build-script-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: build.ps1 (host debug build)
        shell: pwsh
        run: ./build.ps1 --debug

  shared-crates:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        crate: [atomic-io, vault, error-client]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.crate }}
      - name: fmt check
        working-directory: ${{ matrix.crate }}
        run: cargo fmt --all -- --check
      - name: clippy
        working-directory: ${{ matrix.crate }}
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        working-directory: ${{ matrix.crate }}
        run: cargo test

  container-runtime-workspace:
    needs: shared-crates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: container-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: container-runtime
      - name: fmt check
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: build (release)
        run: cargo build --workspace --release

  container-runtime-audit:
    needs: container-runtime-workspace
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: container-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: install cargo-audit
        run: cargo install cargo-audit --locked
      - name: generate lockfile
        run: cargo generate-lockfile
      - name: dependency security audit
        run: cargo audit

  container-runtime-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: container-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: container-runtime
      - name: build container runtime on Windows
        run: cargo build --workspace --release
      - name: test portable container contracts on Windows
        run: cargo test --workspace

  container-security-hostile:
    if: github.event_name == 'workflow_dispatch'
    needs: container-runtime-workspace
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: container-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: container-runtime
      - name: hostile Linux sandbox tests
        run: cargo test -p sandbox-primitives --test security -- --ignored --nocapture
