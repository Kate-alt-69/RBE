name: Cloud Node Provider Edge Patch

on:
  push:
    branches:
      - work/cloud-node-providers

permissions:
  contents: write

concurrency:
  group: cloud-node-provider-edge-patch
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/cloud-node-providers
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Patch provider edge cases
        shell: python
        run: |
          from pathlib import Path

          provider = Path('engine/crates/cloud-node/src/provider.rs')
          text = provider.read_text()
          text = text.replace(
              'let url = self.supabase_url(&key)?;\n                self.apply_supabase_auth(self.client.get(url))?',
              'let url = self.supabase_url(&key, true)?;\n                self.apply_supabase_auth(self.client.get(url))?',
              1,
          )
          text = text.replace(
              'let url = self.supabase_url(&key)?;\n                self.apply_supabase_auth(\n                    self.client',
              'let url = self.supabase_url(&key, false)?;\n                self.apply_supabase_auth(\n                    self.client',
              1,
          )
          old = '''    fn supabase_url(&self, key: &str) -> anyhow::Result<Url> {
              let endpoint = self
                  .settings
                  .endpoint
                  .as_deref()
                  .ok_or_else(|| anyhow::anyhow!("supabase provider endpoint is missing"))?;
              object_url(
                  endpoint,
                  &format!(
                      "storage/v1/object/{}/{}",
                      encode_path_segment(&self.settings.bucket),
                      encode_object_key(key)
                  ),
              )
          }
          '''
          new = '''    fn supabase_url(&self, key: &str, authenticated_read: bool) -> anyhow::Result<Url> {
              let endpoint = self
                  .settings
                  .endpoint
                  .as_deref()
                  .ok_or_else(|| anyhow::anyhow!("supabase provider endpoint is missing"))?;
              let route = if authenticated_read {
                  "storage/v1/object/authenticated"
              } else {
                  "storage/v1/object"
              };
              object_url(
                  endpoint,
                  &format!(
                      "{route}/{}/{}",
                      encode_path_segment(&self.settings.bucket),
                      encode_object_key(key)
                  ),
              )
          }
          '''
          if old not in text:
              raise SystemExit('supabase_url block not found')
          text = text.replace(old, new, 1)
          marker = '''    #[test]
              fn aws_epoch_timestamp_is_stable() {
          '''
          test = '''    #[test]
              fn supabase_uses_authenticated_read_route() {
                  let settings: ProviderSettings = serde_json::from_value(serde_json::json!({
                      "kind":"supabase",
                      "namespace":"production",
                      "bucket":"private-backups",
                      "endpoint":"https://example.supabase.co"
                  }))
                  .unwrap();
                  let client = ProviderClient::new(&settings).unwrap();
                  assert_eq!(
                      client.supabase_url("history/HEAD.json", true).unwrap().path(),
                      "/storage/v1/object/authenticated/private-backups/tenant-a"
                          .replace("tenant-a", "history/HEAD.json")
                  );
                  assert_eq!(
                      client.supabase_url("history/HEAD.json", false).unwrap().path(),
                      "/storage/v1/object/private-backups/history/HEAD.json"
                  );
              }

              #[test]
              fn aws_epoch_timestamp_is_stable() {
          '''
          if marker not in text:
              raise SystemExit('provider test insertion marker not found')
          text = text.replace(marker, test, 1)
          provider.write_text(text)

          sync = Path('engine/crates/cloud-node/src/provider_sync.rs')
          text = sync.read_text()
          old = '''    let local_root = plan.root_hex();
              let history = LocalHistory::open(store, &provider.namespace)?;
              let local_head = history.ensure_snapshot_commit(&settings.node.id, &local_root)?;
              let remote_head = remote_head(&client).await?;
              status_from_heads(&history, &client, local_head, remote_head, local_root).await
          '''
          new = '''    let local_root = plan.root_hex();
              let history = LocalHistory::open(store, &provider.namespace)?;
              let remote = remote_head(&client).await?;
              if history.head()?.is_none() {
                  if let Some(remote_head) = remote.as_ref() {
                      let relation = if remote_head.snapshot_root == local_root {
                          ProviderSyncRelation::InSync
                      } else if plan.object_count() == 0 {
                          ProviderSyncRelation::RemoteAhead
                      } else {
                          ProviderSyncRelation::Diverged
                      };
                      return Ok(ProviderSyncStatus {
                          relation,
                          local_head: "<untracked>".to_owned(),
                          remote_head: Some(remote_head.id.clone()),
                          local_root,
                          remote_root: Some(remote_head.snapshot_root.clone()),
                      });
                  }
              }
              let local_head = history.ensure_snapshot_commit(&settings.node.id, &local_root)?;
              status_from_heads(&history, &client, local_head, remote, local_root).await
          '''
          if old not in text:
              raise SystemExit('provider_status block not found')
          text = text.replace(old, new, 1)

          old = '''    let local_root = plan.root_hex();
              let history = LocalHistory::open(store, &provider.namespace)?;
              let local_head = history.ensure_snapshot_commit(&settings.node.id, &local_root)?;
              let remote = remote_head(&client).await?;
              let before = status_from_heads(
                  &history,
                  &client,
                  local_head.clone(),
                  remote.clone(),
                  local_root,
              )
              .await?;
          '''
          new = '''    let local_root = plan.root_hex();
              let history = LocalHistory::open(store, &provider.namespace)?;
              let remote = remote_head(&client).await?;

              if history.head()?.is_none() {
                  if let Some(remote_head) = remote.as_ref() {
                      if remote_head.snapshot_root == local_root {
                          import_remote_history(&history, &client, remote_head).await?;
                          let before = ProviderSyncStatus {
                              relation: ProviderSyncRelation::InSync,
                              local_head: remote_head.id.clone(),
                              remote_head: Some(remote_head.id.clone()),
                              local_root: local_root.clone(),
                              remote_root: Some(remote_head.snapshot_root.clone()),
                          };
                          return Ok(ProviderSyncResult {
                              action: ProviderSyncAction::None,
                              final_root: local_root,
                              final_head: remote_head.id.clone(),
                              before,
                          });
                      }
                      if plan.object_count() == 0 {
                          let before = ProviderSyncStatus {
                              relation: ProviderSyncRelation::RemoteAhead,
                              local_head: "<untracked>".to_owned(),
                              remote_head: Some(remote_head.id.clone()),
                              local_root,
                              remote_root: Some(remote_head.snapshot_root.clone()),
                          };
                          pull_provider_state(&client, &history, store, remote_head).await?;
                          return Ok(ProviderSyncResult {
                              action: ProviderSyncAction::Pull,
                              final_root: remote_head.snapshot_root.clone(),
                              final_head: remote_head.id.clone(),
                              before,
                          });
                      }
                  }
              }

              let local_head = history.ensure_snapshot_commit(&settings.node.id, &local_root)?;
              let before = status_from_heads(
                  &history,
                  &client,
                  local_head.clone(),
                  remote.clone(),
                  local_root,
              )
              .await?;
          '''
          if old not in text:
              raise SystemExit('synchronize_provider block not found')
          text = text.replace(old, new, 1)

          old = '''    let missing = remote_chain_until_local(history, client, remote_head).await?;
              restore_snapshot(client, store, &remote_head.snapshot_root).await?;
              for commit in missing.iter().rev() {
                  history.write_commit(commit)?;
              }
              history.set_head(remote_head)?;
              Ok(())
          }
          '''
          new = '''    restore_snapshot(client, store, &remote_head.snapshot_root).await?;
              import_remote_history(history, client, remote_head).await
          }

          async fn import_remote_history(
              history: &LocalHistory,
              client: &ProviderClient,
              remote_head: &HistoryCommit,
          ) -> anyhow::Result<()> {
              let missing = remote_chain_until_local(history, client, remote_head).await?;
              for commit in missing.iter().rev() {
                  history.write_commit(commit)?;
              }
              history.set_head(remote_head)
          }
          '''
          if old not in text:
              raise SystemExit('pull_provider_state block not found')
          text = text.replace(old, new, 1)
          sync.write_text(text)
      - name: Format Rust workspace
        working-directory: engine
        run: cargo fmt --all
      - name: Commit edge hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/crates/cloud-node/src/provider.rs engine/crates/cloud-node/src/provider_sync.rs
          git commit -m "FIX | BUG-CN-PROV-004 recover provider history bootstrap"
          git push origin HEAD:work/cloud-node-providers
