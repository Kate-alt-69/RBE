name: Cloud Node minimal lock refresh temp

on:
  push:
    paths:
      - '.github/workflows/cn-lock-minimal-temp.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve Backend against existing lock
        working-directory: engine
        run: cargo check -p backend --all-targets
      - name: Resolve install executor against existing lock
        working-directory: engine
        run: cargo check -p rbe-install-executor --all-targets
      - name: Commit minimal lock delta
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/Cargo.lock
          if git diff --cached --quiet; then
            echo "engine/Cargo.lock already current"
            exit 0
          fi
          git commit -m "TEMP | resolve minimal engine lock delta"
          git push origin HEAD:tmp-cn-lock-minimal
