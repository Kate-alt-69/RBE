name: Cloud Node lock refresh temp

on:
  push:
    paths:
      - '.github/workflows/cn-lock-refresh-temp.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Refresh engine lock
        working-directory: engine
        run: cargo generate-lockfile
      - name: Commit generated lock to disposable branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/Cargo.lock
          if git diff --cached --quiet; then
            echo "engine/Cargo.lock already current"
            exit 0
          fi
          git commit -m "TEMP | generate current engine lock"
          git push origin HEAD:tmp-cn-lock-refresh
