name: Container cancellation lifecycle

"on":
  push:
    branches: [main]
    paths:
      - '.github/patches/container-cancel-lifecycle.py'
      - '.github/patches/container-cancel-lifecycle-fix.py'
      - '.github/workflows/container-cancel-lifecycle.yml'

permissions:
  contents: write

concurrency:
  group: container-cancel-lifecycle
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: container-runtime
      - name: Apply cancellation lifecycle repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          python3 .github/patches/container-cancel-lifecycle-fix.py
          python3 .github/patches/container-cancel-lifecycle.py
          cargo fmt --manifest-path container-runtime/Cargo.toml --all
      - name: Check Container workspace locked
        run: cargo check --manifest-path container-runtime/Cargo.toml --workspace --locked
      - name: Test Container workspace
        run: cargo test --manifest-path container-runtime/Cargo.toml --workspace --locked
      - name: Clippy Container workspace
        run: cargo clippy --manifest-path container-runtime/Cargo.toml --workspace --all-targets --locked -- -D warnings
      - name: Verify cancellation invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'struct ExecutionLifecycle' container-runtime/crates/container-runtime-core/src/runtime.rs
          grep -q 'if !lifecycle.live.contains(execution_id)' container-runtime/crates/container-runtime-core/src/runtime.rs
          grep -q 'lifecycle.cancelled.insert(execution_id.to_string())' container-runtime/crates/container-runtime-core/src/runtime.rs
          grep -q 'lifecycle.live.remove(&execution_id)' container-runtime/crates/container-runtime-core/src/runtime.rs
          grep -q 'let result = (|| -> Result<Vec<u8>, String>' container-runtime/crates/container-bin/src/environment_process.rs
          if grep -q 'cancelled: Arc<Mutex<HashSet<String>>>' container-runtime/crates/container-runtime-core/src/runtime.rs; then
            echo 'legacy split cancellation set still present' >&2
            exit 1
          fi
      - name: Land validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/container-cancel-lifecycle.yml
          git rm -f .github/patches/container-cancel-lifecycle.py
          git rm .github/patches/container-cancel-lifecycle-fix.py
          git add container-runtime
          git commit -m "FIX | BUG-CTR-004 linearize Container execution cancellation"
          git fetch origin main
          base="$(git rev-parse HEAD~1)"
          current="$(git rev-parse origin/main)"
          if [ "$current" != "$base" ]; then
            git rebase origin/main
          fi
          git push origin HEAD:main
