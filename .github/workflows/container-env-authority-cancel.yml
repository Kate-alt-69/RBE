name: Container Environment authority and cancellation

"on":
  push:
    branches: [main]
    paths:
      - '.github/patches/container-env-authority-cancel.py'
      - '.github/patches/container-env-authority-cancel-clippy.py'
      - '.github/workflows/container-env-authority-cancel.yml'

permissions:
  contents: write

concurrency:
  group: container-env-authority-cancel
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: container-runtime
      - name: Apply Environment authority repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          python3 .github/patches/container-env-authority-cancel.py
          python3 .github/patches/container-env-authority-cancel-clippy.py
          cargo fmt --manifest-path container-runtime/Cargo.toml --all
      - name: Check Container workspace locked
        run: cargo check --manifest-path container-runtime/Cargo.toml --workspace --locked
      - name: Test Container workspace
        run: cargo test --manifest-path container-runtime/Cargo.toml --workspace --locked
      - name: Clippy Container workspace
        run: cargo clippy --manifest-path container-runtime/Cargo.toml --workspace --all-targets --locked -- -D warnings
      - name: Verify Environment authority invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'manage_storage_locally = artifact_runner.is_none' container-runtime/crates/container-runtime-core/src/runtime.rs
          grep -q 'storage_manager: Option<Arc<EnvironmentStorageManager>>' container-runtime/crates/container-runtime-core/src/environment.rs
          grep -q 'pub type Canceller' container-runtime/crates/container-runtime-core/src/worker.rs
          grep -q 'ChildRequest::Cancel' container-runtime/crates/container-bin/src/environment_process.rs
          grep -q 'struct WorkerExecution' container-runtime/crates/container-bin/src/environment_process.rs
          grep -q 'active_executions' container-runtime/crates/container-bin/src/environment_process.rs
          grep -q 'environment_processes.canceller()' container-runtime/crates/container-bin/src/main.rs
          grep -q 'generation: owner.generation' container-runtime/crates/container-bin/src/environment_process.rs
      - name: Land validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/container-env-authority-cancel.yml
          git rm .github/patches/container-env-authority-cancel.py
          git rm .github/patches/container-env-authority-cancel-clippy.py
          git add container-runtime
          git commit -m "FIX | BUG-CTR-003 make Environment storage authoritative and hard-cancellable"
          git fetch origin main
          base="$(git rev-parse HEAD~1)"
          current="$(git rev-parse origin/main)"
          if [ "$current" != "$base" ]; then
            git rebase origin/main
          fi
          git push origin HEAD:main
