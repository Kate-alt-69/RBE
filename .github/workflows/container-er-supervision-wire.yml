name: CONTROL ER Container Supervision

on:
  push:
    paths:
      - '.github/patches/container-er-supervision-wire.py'
      - '.github/patches/container-er-supervision-fix.py'
      - '.github/workflows/container-er-supervision-wire.yml'

permissions:
  contents: write

concurrency:
  group: er-container-supervision-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Apply CONTROL ER container supervision
        run: |
          python .github/patches/container-er-supervision-wire.py
          python .github/patches/container-er-supervision-fix.py
      - name: Format
        working-directory: engine
        run: cargo fmt --all
      - name: Check workspace locked
        working-directory: engine
        run: cargo check --workspace --locked
      - name: Test container supervision slices
        working-directory: engine
        run: cargo test -p backend -p core-lib --locked
      - name: Clippy container supervision slices
        working-directory: engine
        run: cargo clippy -p backend -p core-lib --all-targets --locked -- -D warnings
      - name: Regenerate if main moved
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          latest="$(git rev-parse origin/main)"
          if [[ "$latest" != "$GITHUB_SHA" ]]; then
            echo "main moved to $latest; regenerating against latest source"
            git reset --hard "$latest"
            python .github/patches/container-er-supervision-wire.py
            python .github/patches/container-er-supervision-fix.py
            cd engine
            cargo fmt --all
            cargo check --workspace --locked
            cargo test -p backend -p core-lib --locked
            cargo clippy -p backend -p core-lib --all-targets --locked -- -D warnings
          fi
      - name: Commit verified container supervision
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/patches/container-er-supervision-wire.py
          rm -f .github/patches/container-er-supervision-fix.py
          rm -f .github/workflows/container-er-supervision-wire.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'FIX | BUG-ER-003 supervise container crashes through CONTROL ER'
          git push origin HEAD:main
