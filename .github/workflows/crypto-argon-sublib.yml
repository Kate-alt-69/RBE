name: One-shot Argon2id crypto sub-library

on:
  push:
    branches:
      - main
    paths:
      - .ci-crypto-argon-sublib-trigger

permissions:
  contents: write

jobs:
  crypto-argon-sublib:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Apply Argon2id crypto sub-library
        run: python3 .github/patches/crypto-argon-sublib.py

      - name: Resolve lockfile
        working-directory: engine
        run: cargo check -p route-engine

      - name: Format engine
        working-directory: engine
        run: cargo fmt --all

      - name: Diff check
        run: git diff --check

      - name: Test route-engine
        working-directory: engine
        run: cargo test -p route-engine --locked

      - name: Clippy route-engine
        working-directory: engine
        run: cargo clippy -p route-engine --all-targets --locked -- -D warnings

      - name: Commit Argon2id sub-library
        run: |
          rm -f \
            .ci-crypto-argon-sublib-trigger \
            .github/patches/crypto-argon-sublib.py \
            .github/workflows/crypto-argon-sublib.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "FEAT | CRY-002 add Argon2id crypto sub-library"
          git pull --rebase origin main
          git push origin HEAD:main
