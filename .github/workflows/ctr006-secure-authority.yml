name: CTR-006 secure Environment authority

"on":
  push:
    branches: [main]
    paths:
      - '.github/patches/ctr006-secure-authority.py'
      - '.github/patches/ctr006-test-isolation.py'
      - '.github/workflows/ctr006-secure-authority.yml'

permissions:
  contents: write

concurrency:
  group: ctr006-secure-authority
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: container-runtime

      - name: Apply secure authority restrictions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          python3 .github/patches/ctr006-secure-authority.py
          python3 .github/patches/ctr006-test-isolation.py
          cargo fmt --manifest-path container-runtime/Cargo.toml --all

      - name: Check Container workspace locked
        run: cargo check --manifest-path container-runtime/Cargo.toml --workspace --locked
      - name: Test capability and Environment authority locked
        run: cargo test --manifest-path container-runtime/Cargo.toml -p container-runtime-core -p container-bin --locked
      - name: Clippy Container workspace locked
        run: cargo clippy --manifest-path container-runtime/Cargo.toml --workspace --all-targets --locked -- -D warnings
      - name: Verify CTR-006 invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'environment_debug_enabled' container-runtime/crates/container-bin/src/environment_process.rs
          grep -q 'EnvironmentProfile::Secure' container-runtime/crates/container-bin/src/environment_process.rs
          grep -q 'debug/host-file grants cannot be registered for secure Environments' container-runtime/crates/container-runtime-core/src/control_plane.rs
          grep -q 'debug/host-file capabilities are unavailable to secure Environments' container-runtime/crates/container-runtime-core/src/control_plane.rs
          grep -q 'secure_environment_never_inherits_controller_debug' container-runtime/crates/container-bin/src/environment_process.rs
          grep -q 'debug_controller_still_denies_debug_and_host_file_to_secure_profile' container-runtime/crates/container-runtime-core/src/control_plane.rs
          git diff --check

      - name: Land validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/ctr006-secure-authority.yml
          git rm .github/patches/ctr006-secure-authority.py
          git rm .github/patches/ctr006-test-isolation.py
          git add container-runtime/crates/container-bin/src/environment_process.rs \
                  container-runtime/crates/container-runtime-core/src/control_plane.rs
          git commit -m "FIX | BUG-CTR-006 reduce authority for secure Environment profile"

          git fetch origin main
          base="$(git rev-parse HEAD~1)"
          current="$(git rev-parse origin/main)"
          if [ "$current" != "$base" ]; then
            git rebase origin/main
          fi
          git push origin HEAD:main
