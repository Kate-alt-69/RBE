name: CONTROL ER Service Recovery

on:
  push:
    paths:
      - '.github/patches/er-control-recovery-wire.py'
      - '.github/patches/er-control-recovery-fix.py'
      - '.github/workflows/er-control-recovery-wire.yml'

permissions:
  contents: write

concurrency:
  group: er-control-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wire:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Apply CONTROL ER service recovery
        run: |
          python .github/patches/er-control-recovery-wire.py
          python .github/patches/er-control-recovery-fix.py

      - name: Validate embedded Linux HostBootstrap script
        shell: bash
        run: sh -n engine/crates/backend/scripts/bootstrap/linux/probe-secret-service.sh

      - name: Format
        working-directory: engine
        run: cargo fmt --all

      - name: Check workspace locked
        working-directory: engine
        run: cargo check --workspace --locked

      - name: Cross-check service-runtime platform code
        working-directory: engine
        shell: bash
        run: |
          set -euo pipefail
          rustup target add x86_64-pc-windows-gnu x86_64-apple-darwin
          cargo check -p service-runtime --target x86_64-pc-windows-gnu --locked
          cargo check -p service-runtime --target x86_64-apple-darwin --locked

      - name: Test changed runtime slices
        working-directory: engine
        run: cargo test -p service-runtime -p backend --locked

      - name: Clippy changed runtime slices
        working-directory: engine
        run: cargo clippy -p service-runtime -p backend --all-targets --locked -- -D warnings

      - name: Regenerate if main moved
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
            exit 0
          fi
          echo 'main moved while validating; regenerating CONTROL ER recovery from latest main.'
          git reset --hard origin/main
          if ! grep -q 'pub struct ServiceExitReport' engine/crates/service-runtime/src/manager.rs; then
            python .github/patches/er-control-recovery-wire.py
            python .github/patches/er-control-recovery-fix.py
          fi
          sh -n engine/crates/backend/scripts/bootstrap/linux/probe-secret-service.sh
          (cd engine && cargo fmt --all)
          (cd engine && cargo check --workspace --locked)
          (cd engine && cargo test -p service-runtime -p backend --locked)
          (cd engine && cargo clippy -p service-runtime -p backend --all-targets --locked -- -D warnings)

      - name: Commit verified CONTROL ER recovery
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/patches/er-control-recovery-wire.py \
            .github/patches/er-control-recovery-fix.py \
            .github/workflows/er-control-recovery-wire.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'FIX | BUG-ER-001 authorize bounded service recovery through CONTROL ER'
          git push origin HEAD:main
