name: CONTROL ER Critical Supervision

on:
  push:
    paths:
      - '.github/patches/er-critical-supervision-wire.py'
      - '.github/workflows/er-critical-supervision-wire.yml'

permissions:
  contents: write

concurrency:
  group: er-critical-supervision-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Apply CONTROL ER critical supervision
        run: python .github/patches/er-critical-supervision-wire.py
      - name: Format
        working-directory: engine
        run: cargo fmt --all
      - name: Check workspace locked
        working-directory: engine
        run: cargo check --workspace --locked
      - name: Test critical supervision slices
        working-directory: engine
        run: cargo test -p service-runtime -p backend --locked
      - name: Clippy critical supervision slices
        working-directory: engine
        run: cargo clippy -p service-runtime -p backend --all-targets --locked -- -D warnings
      - name: Regenerate if main moved
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          latest="$(git rev-parse origin/main)"
          if [[ "$latest" != "$GITHUB_SHA" ]]; then
            echo "main moved to $latest; regenerating against latest source"
            git reset --hard "$latest"
            python .github/patches/er-critical-supervision-wire.py
            cd engine
            cargo fmt --all
            cargo check --workspace --locked
            cargo test -p service-runtime -p backend --locked
            cargo clippy -p service-runtime -p backend --all-targets --locked -- -D warnings
          fi
      - name: Commit verified critical supervision
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/patches/er-critical-supervision-wire.py
          rm -f .github/workflows/er-critical-supervision-wire.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'FIX | BUG-ER-002 route Service Mother crashes through CONTROL ER'
          git push origin HEAD:main
