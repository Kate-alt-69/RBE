name: ER Self Supervision

on:
  push:
    paths:
      - '.github/patches/er-self-supervision-wire.py'
      - '.github/patches/er-self-cross-target-cleanup.py'
      - '.github/workflows/er-self-supervision-wire.yml'

permissions:
  contents: write

concurrency:
  group: er-self-supervision-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Apply ER self supervision and cross-target cleanup
        run: |
          python .github/patches/er-self-supervision-wire.py
          python .github/patches/er-self-cross-target-cleanup.py
      - name: Format
        working-directory: engine
        run: cargo fmt --all
      - name: Check workspace locked
        working-directory: engine
        run: cargo check --workspace --locked
      - name: Test critical supervision
        working-directory: engine
        run: cargo test -p backend -p service-runtime --locked
      - name: Clippy critical supervision
        working-directory: engine
        run: cargo clippy -p backend -p service-runtime --all-targets --locked -- -D warnings
      - name: Check portable Windows warning cleanup
        shell: bash
        run: |
          set -euo pipefail
          rustup target add x86_64-pc-windows-msvc
          RUSTFLAGS='-D warnings' cargo check --manifest-path engine/Cargo.toml -p service-runtime --target x86_64-pc-windows-msvc --locked
      - name: Regenerate if main moved
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          latest="$(git rev-parse origin/main)"
          if [[ "$latest" != "$GITHUB_SHA" ]]; then
            echo "main moved to $latest; regenerating against latest source"
            git reset --hard "$latest"
            python .github/patches/er-self-supervision-wire.py
            python .github/patches/er-self-cross-target-cleanup.py
            cargo fmt --manifest-path engine/Cargo.toml --all
            cargo check --manifest-path engine/Cargo.toml --workspace --locked
            cargo test --manifest-path engine/Cargo.toml -p backend -p service-runtime --locked
            cargo clippy --manifest-path engine/Cargo.toml -p backend -p service-runtime --all-targets --locked -- -D warnings
            rustup target add x86_64-pc-windows-msvc
            RUSTFLAGS='-D warnings' cargo check --manifest-path engine/Cargo.toml -p service-runtime --target x86_64-pc-windows-msvc --locked
          fi
      - name: Commit verified ER self supervision
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/patches/er-self-supervision-wire.py
          rm -f .github/patches/er-self-cross-target-cleanup.py
          rm -f .github/workflows/er-self-supervision-wire.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'FIX | BUG-ER-005 preserve ER self-crash postmortems and clean release warnings'
          git push origin HEAD:main
