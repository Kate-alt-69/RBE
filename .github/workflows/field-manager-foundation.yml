name: One-shot FieldManager compiler foundation

on:
  push:
    branches:
      - main
    paths:
      - .ci-field-manager-foundation-trigger

permissions:
  contents: write

jobs:
  field-manager-foundation:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Apply FieldManager foundation
        run: python3 .github/patches/field-manager-foundation.py

      - name: Refresh engine lock
        run: cargo check --manifest-path engine/Cargo.toml -p route-engine

      - name: Format route-engine
        run: cargo fmt --manifest-path engine/Cargo.toml -p route-engine

      - name: Diff check
        run: git diff --check

      - name: Test route-engine
        run: cargo test --manifest-path engine/Cargo.toml -p route-engine --locked

      - name: Clippy route-engine
        run: cargo clippy --manifest-path engine/Cargo.toml -p route-engine --all-targets --locked -- -D warnings

      - name: Verify FieldManager contract
        run: |
          test -s doc/field-manager.md
          grep -Fq ':import[field:awesomeness]' doc/field-manager.md
          grep -Fq 'RelSourceKind::Field' engine/crates/route-engine/src/source_registry.rs
          grep -Fq 'parse_field_file' engine/crates/route-engine/src/parser.rs
          grep -Fq 'Field REL is pure request preprocessing' engine/crates/route-engine/src/relc.rs
          grep -Fq 'regx' engine/crates/route-engine/src/modules.rs

      - name: Commit FLD-001
        run: |
          rm -f \
            .ci-field-manager-foundation-trigger \
            .github/patches/field-manager-foundation.py \
            .github/workflows/field-manager-foundation.yml
          rmdir .github/patches 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "FEAT | FLD-001 add first-class FieldManager compiler foundation"
          git pull --rebase origin main
          git push origin HEAD:main
