name: Finalize FieldManager and REGX v2

on:
  push:
    branches:
      - ci/field-regx-finalize-v2-20260919

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve finalize helper
        shell: bash
        run: cp .github/patches/regx-finalize-v2.py /tmp/regx-finalize-v2.py

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Apply FLD-002 and REGX-001
        shell: bash
        run: |
          set -euo pipefail
          BASE=05f56af500380b27b1544c80595cf71784e51379
          git reset --hard "$BASE"

          python <<'PY'
          from pathlib import Path
          p = Path('.github/patches/field-manager-runtime.py')
          text = p.read_text(encoding='utf-8')

          old = '''    if count != 1:\n        raise SystemExit(f"{label}: expected one anchor, found {count}")\n    file.write_text(text.replace(old, new, 1), encoding="utf-8")\n'''
          new = '''    if count == 0:\n        raise SystemExit(f"{label}: expected an anchor, found 0")\n    if count != 1 and label != "Field namespace registry":\n        raise SystemExit(f"{label}: expected one anchor, found {count}")\n    file.write_text(text.replace(old, new, 1), encoding="utf-8")\n'''
          if old not in text:
              raise SystemExit('unable to patch staged FieldManager driver strictness')
          text = text.replace(old, new, 1)

          stale = '''replace_once(
              "engine/crates/route-engine/src/relc.rs",
              "use crate::execution_tracker::InvocationTracker;\\n",
              "use crate::execution_tracker::InvocationTracker;\\nuse crate::field_manager::field_logical_candidates;\\n",
              "RELC Field logical resolver import",
          )
'''
          current = '''replace_once(
              "engine/crates/route-engine/src/relc.rs",
              "use crate::embedded_rel::{extract_embedded_rel, EmbeddedRelError};\\n",
              "use crate::embedded_rel::{extract_embedded_rel, EmbeddedRelError};\\nuse crate::field_manager::field_logical_candidates;\\n",
              "RELC Field logical resolver import",
          )
'''
          if stale not in text:
              raise SystemExit('unable to retarget staged RELC Field import anchor')
          text = text.replace(stale, current, 1)
          p.write_text(text, encoding='utf-8')
          PY

          python .github/patches/field-manager-runtime.py
          rm .github/patches/field-manager-runtime.py
          python /tmp/regx-finalize-v2.py

      - name: Resolve dependency lock and format
        working-directory: engine
        shell: bash
        run: |
          set -euo pipefail
          cargo check -p route-engine
          cargo fmt --all
          cargo fmt --all -- --check

      - name: Clippy locked workspace
        working-directory: engine
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test locked workspace
        working-directory: engine
        run: cargo test --workspace --locked

      - name: Commit directly to main
        shell: bash
        run: |
          set -euo pipefail
          BASE=05f56af500380b27b1544c80595cf71784e51379
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE" || {
            echo "main moved; refusing non-fast-forward finalize"
            exit 1
          }
          git config user.name "Kate"
          git config user.email "dhwanksh2000@gmail.com"
          git add -A
          git status --short
          git diff --cached --quiet && {
            echo "no implementation changes produced"
            exit 1
          }
          git commit -m "FEAT | FLD-002 complete FieldManager runtime and REGX"
          git push origin HEAD:main
