name: Finalize FieldManager and REGX v2

on:
  push:
    branches:
      - ci/field-regx-finalize-v2-20260919

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve finalize helpers
        shell: bash
        run: |
          cp .github/patches/regx-finalize-v2.py /tmp/regx-finalize-v2.py
          cp .github/patches/fix-field-patch-driver.py /tmp/fix-field-patch-driver.py
          cp .github/patches/fld-clippy-fix.py /tmp/fld-clippy-fix.py

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Apply FLD-002 and REGX-001
        shell: bash
        run: |
          set -euo pipefail
          BASE=05f56af500380b27b1544c80595cf71784e51379
          git reset --hard "$BASE"
          python /tmp/fix-field-patch-driver.py .github/patches/field-manager-runtime.py
          python .github/patches/field-manager-runtime.py
          rm .github/patches/field-manager-runtime.py
          python /tmp/regx-finalize-v2.py
          python /tmp/fld-clippy-fix.py

      - name: Resolve dependency lock and format
        working-directory: engine
        shell: bash
        run: |
          set -euo pipefail
          cargo check -p route-engine
          cargo fmt --all
          cargo fmt --all -- --check

      - name: Clippy locked workspace
        working-directory: engine
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test locked route-engine
        working-directory: engine
        run: cargo test -p route-engine --locked

      - name: Commit directly to main
        shell: bash
        run: |
          set -euo pipefail
          BASE=05f56af500380b27b1544c80595cf71784e51379
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE" || {
            echo "main moved; refusing non-fast-forward finalize"
            exit 1
          }
          git config user.name "Kate"
          git config user.email "dhwanksh2000@gmail.com"
          git add -A
          git status --short
          git diff --cached --quiet && {
            echo "no implementation changes produced"
            exit 1
          }
          git commit -m "FEAT | FLD-002 complete FieldManager runtime and REGX"
          git push origin HEAD:main
