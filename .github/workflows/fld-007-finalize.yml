name: Finalize FLD-007 Dynamic Field Types

on:
  push:
    branches:
      - ci/fld-007-dynamic-types-20260924
    paths:
      - ".github/patches/fld-007-dynamic-types.py"
      - ".github/workflows/fld-007-finalize.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/fld-007-dynamic-types-20260924
          fetch-depth: 2

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Apply FLD-007
        run: python .github/patches/fld-007-dynamic-types.py

      - name: Format and check route-engine
        working-directory: engine
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check -p route-engine --locked

      - name: Clippy route-engine
        working-directory: engine
        run: cargo clippy -p route-engine --all-targets --locked -- -D warnings

      - name: Test route-engine
        working-directory: engine
        run: cargo test -p route-engine --locked

      - name: Commit verified FLD-007 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Kate"
          git config user.email "dhwanksh2000@gmail.com"
          git add engine/crates/route-engine/src/field_manager.rs \
                  doc/field-manager.md
          git diff --cached --quiet && { echo "FLD-007 produced no source diff"; exit 1; }
          git commit -m "FIX | FLD-007 enforce dynamic field string types"
          git push origin HEAD:ci/fld-007-dynamic-types-20260924
