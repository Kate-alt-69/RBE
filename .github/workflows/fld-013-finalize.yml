name: Finalize FLD-013 Direct Field Keys

on:
  push:
    branches:
      - ci/fld-012-sibling-scope-20260925
    paths:
      - ".github/patches/fld-013-direct-key-validation.py"
      - ".github/workflows/fld-013-finalize.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/fld-012-sibling-scope-20260925
          fetch-depth: 2

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Apply FLD-013
        run: python .github/patches/fld-013-direct-key-validation.py

      - name: Format and check route-engine
        working-directory: engine
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check -p route-engine --locked

      - name: Clippy route-engine
        working-directory: engine
        run: cargo clippy -p route-engine --all-targets --locked -- -D warnings

      - name: Test route-engine
        working-directory: engine
        run: cargo test -p route-engine --locked

      - name: Commit verified FLD-013 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Kate"
          git config user.email "dhwanksh2000@gmail.com"
          git add engine/crates/route-engine/src/field_manager.rs \
                  doc/field-manager.md
          git diff --cached --quiet && { echo "FLD-013 produced no source diff"; exit 1; }
          git commit -m "FIX | FLD-013 reject empty direct field keys"
          git push origin HEAD:ci/fld-012-sibling-scope-20260925
