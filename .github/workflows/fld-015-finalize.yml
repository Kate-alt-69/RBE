name: Finalize FLD-015 JSON Media Types

on:
  push:
    branches:
      - ci/fld-008-safe-integers-20260925
    paths:
      - .github/workflows/fld-015-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Apply FLD-015
        run: python .github/patches/fld-015-json-media-type.py

      - name: Format and check route-engine
        working-directory: engine
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check -p route-engine

      - name: Clippy route-engine
        working-directory: engine
        run: cargo clippy -p route-engine --all-targets -- -D warnings

      - name: Test route-engine
        working-directory: engine
        run: cargo test -p route-engine

      - name: Commit verified FLD-015 source
        run: |
          git config user.name "Kate"
          git config user.email "dhwanksh2000@gmail.com"
          git add engine/crates/route-engine/src/discovery.rs doc/field-manager.md
          git diff --cached --quiet && exit 1
          git commit -m "FIX | FLD-015 normalize JSON body media types"
          git push origin HEAD:ci/fld-008-safe-integers-20260925
