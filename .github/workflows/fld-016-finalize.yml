name: Finalize FLD-016 Cookie Snapshot

on:
  push:
    branches:
      - ci/fld-016-cookie-snapshot-20260926

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Apply FLD-016
        run: python .github/patches/fld-016-cookie-snapshot.py

      - name: Format and check route-engine
        working-directory: engine
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check -p route-engine

      - name: Clippy route-engine
        working-directory: engine
        run: cargo clippy -p route-engine --all-targets -- -D warnings

      - name: Test route-engine
        working-directory: engine
        run: cargo test -p route-engine

      - name: Commit verified FLD-016 source
        run: |
          set -euo pipefail
          git config user.name "Kate"
          git config user.email "dhwanksh2000@gmail.com"
          git add engine/crates/route-engine/src/discovery.rs doc/field-manager.md
          git diff --cached --quiet && { echo "no FLD-016 source changes" >&2; exit 1; }
          git commit -m "FIX | FLD-016 preserve split Cookie headers"
          git push origin HEAD:ci/fld-016-cookie-snapshot-20260926
