name: Finalize FLD-018 Explicit Null Body

on:
  push:
    branches:
      - ci/fld-018-explicit-null-body-20260926

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve FLD-018 patch
        run: cp .github/patches/fld-018-explicit-null-body.py /tmp/fld-018-explicit-null-body.py

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Apply FLD-018
        run: |
          set -euo pipefail
          git reset --hard 8e9507de0f2733f497790bb677972db4f5bd4a11
          python /tmp/fld-018-explicit-null-body.py

      - name: Format and check route-engine
        working-directory: engine
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check -p route-engine

      - name: Clippy route-engine
        working-directory: engine
        run: cargo clippy -p route-engine --all-targets -- -D warnings

      - name: Test route-engine
        working-directory: engine
        run: cargo test -p route-engine

      - name: Commit verified FLD-018 source
        run: |
          set -euo pipefail
          git config user.name "Kate"
          git config user.email "dhwanksh2000@gmail.com"
          git add engine/crates/route-engine/src/field_manager.rs doc/field-manager.md
          git diff --cached --quiet && { echo "FLD-018 produced no source diff"; exit 1; }
          git commit -m "FIX | FLD-018 distinguish explicit null request bodies"
          git push origin HEAD:ci/fld-018-explicit-null-body-20260926
