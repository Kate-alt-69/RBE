name: Finalize FLD-019 Query Identity

on:
  push:
    branches:
      - ci/fld-019-query-identity-20260926

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Apply FLD-019
        run: |
          set -euo pipefail
          python .github/patches/fld-019-query-identity.py
          python .github/patches/fld-019-test-fix.py

      - name: Format and check route-engine
        working-directory: engine
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check -p route-engine

      - name: Clippy route-engine
        working-directory: engine
        run: cargo clippy -p route-engine --all-targets -- -D warnings

      - name: Test route-engine
        working-directory: engine
        run: cargo test -p route-engine

      - name: Commit verified FLD-019 source
        run: |
          set -euo pipefail
          git config user.name "Kate"
          git config user.email "dhwanksh2000@gmail.com"
          git add engine/crates/route-engine/Cargo.toml engine/crates/route-engine/src/discovery.rs doc/field-manager.md
          git diff --cached --quiet && { echo "FLD-019 produced no source diff"; exit 1; }
          git commit -m "FIX | FLD-019 reject ambiguous duplicate query fields"
          git push origin HEAD:ci/fld-019-query-identity-20260926
