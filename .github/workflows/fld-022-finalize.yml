name: Finalize FLD-022 Header Snapshot Hardening

on:
  push:
    branches:
      - ci/fld-022-header-snapshot-20260926
    paths:
      - .github/patches/fld-022-header-snapshot.py
      - .github/workflows/fld-022-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Apply FLD-022
        run: python .github/patches/fld-022-header-snapshot.py

      - name: Format and check route-engine
        working-directory: engine
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check -p route-engine --locked

      - name: Clippy route-engine
        working-directory: engine
        run: cargo clippy -p route-engine --all-targets --locked -- -D warnings

      - name: Test route-engine
        working-directory: engine
        run: cargo test -p route-engine --locked

      - name: Commit verified FLD-022 source
        run: |
          set -euo pipefail
          git config user.name "Kate"
          git config user.email "dhwanksh2000@gmail.com"
          git add doc/field-manager.md engine/crates/route-engine/src/discovery.rs
          git diff --cached --quiet && { echo "no FLD-022 source changes"; exit 1; }
          git commit -m "FIX | FLD-022 reject non-text header snapshots"
          git push origin HEAD:ci/fld-022-header-snapshot-20260926
