name: Finalize FLD-023 Strict Body UTF-8

on:
  push:
    branches:
      - ci/fld-023-strict-body-utf8-20260926
    paths:
      - .github/patches/fld-023-strict-body-utf8.py
      - .github/workflows/fld-023-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Apply FLD-023
        run: python .github/patches/fld-023-strict-body-utf8.py

      - name: Format and check route-engine
        working-directory: engine
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check -p route-engine

      - name: Clippy route-engine library
        working-directory: engine
        run: cargo clippy -p route-engine --lib -- -D warnings

      - name: Test route-engine
        working-directory: engine
        run: cargo test -p route-engine

      - name: Commit verified FLD-023 source
        run: |
          set -euo pipefail
          git config user.name "Kate"
          git config user.email "dhwanksh2000@gmail.com"
          git add doc/field-manager.md doc/x.route/README.md engine/crates/route-engine/src/discovery.rs
          git diff --cached --quiet && { echo "no FLD-023 source changes"; exit 1; }
          git commit -m "FIX | FLD-023 reject lossy request bodies"
          git push origin HEAD:ci/fld-023-strict-body-utf8-20260926
