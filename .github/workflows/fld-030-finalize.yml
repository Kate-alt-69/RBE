name: Finalize FLD-030 Content Length

on:
  push:
    branches:
      - ci/fld-030-content-length-20260928

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Apply FLD-030
        run: python .github/patches/fld-030-content-length.py

      - name: Format and check route-engine
        working-directory: engine
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check -p route-engine --locked

      - name: Clippy route-engine
        working-directory: engine
        run: cargo clippy -p route-engine --all-targets --locked -- -D warnings

      - name: Test route-engine
        working-directory: engine
        run: cargo test -p route-engine --locked

      - name: Commit verified FLD-030 source
        run: |
          set -euo pipefail
          git config user.name "Kate"
          git config user.email "dhwanksh2000@gmail.com"
          git add engine/crates/route-engine/src/discovery.rs doc/x.route/README.md
          git diff --cached --quiet && { echo "FLD-030 produced no source diff"; exit 1; }
          git commit -m "FIX | FLD-030 harden Content-Length snapshot"
          git push origin HEAD:ci/fld-030-content-length-20260928
