name: Finalize FLD-033 Credential Singletons

on:
  push:
    branches:
      - ci/fld-033-auth-singletons-20260928

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Apply FLD-033
        run: python .github/patches/fld-033-auth-singletons.py

      - name: Format and check route-engine
        working-directory: engine
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check -p route-engine

      - name: Clippy route-engine
        working-directory: engine
        run: cargo clippy -p route-engine --all-targets -- -D warnings

      - name: Test route-engine
        working-directory: engine
        run: cargo test -p route-engine

      - name: Commit verified FLD-033 source
        run: |
          set -euo pipefail
          git config user.name "Kate"
          git config user.email "dhwanksh2000@gmail.com"
          git add engine/crates/route-engine/src/discovery.rs doc/x.route/README.md
          git diff --cached --quiet && { echo "FLD-033 produced no source diff"; exit 1; }
          git commit -m "FIX | FLD-033 reject duplicate credential headers"
          git push origin HEAD:ci/fld-033-auth-singletons-20260928
