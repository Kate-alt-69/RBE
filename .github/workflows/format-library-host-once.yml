name: Format Library Host Once

on:
  push:
    paths:
      - '.github/workflows/format-library-host-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format only the failing Library Host files
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2021 \
            engine/crates/backend/src/package_links/approval.rs \
            engine/crates/backend/src/package_links/host.rs
          rm -f .github/workflows/format-library-host-once.yml

          mapfile -t changed < <(git status --short | sed 's/^...//' | sort)
          printf 'Changed paths:\n'
          printf '  %s\n' "${changed[@]}"
          for path in "${changed[@]}"; do
            case "$path" in
              engine/crates/backend/src/package_links/approval.rs|engine/crates/backend/src/package_links/host.rs|.github/workflows/format-library-host-once.yml) ;;
              *) echo "ERROR: unexpected formatter change: $path" >&2; exit 1 ;;
            esac
          done

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'FIX | BUG-LIBHOST-156 satisfy backend rustfmt gate'
          git pull --rebase origin main
          git push origin HEAD:main
