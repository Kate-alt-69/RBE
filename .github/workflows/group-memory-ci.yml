name: Group Memory CI

on:
  push:
    paths:
      - "group-memory/**"
      - ".github/workflows/group-memory-ci.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  group-memory:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: group-memory
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: group-memory
      - name: fix owned file locks and checkpoint
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/lib.rs")
          source = path.read_text()
          start = source.index("    fn lock_shared(&self)")
          end = source.index("\nfn ensure_payload_len", start)
          replacement = '''    fn lock_shared(&self) -> Result<Option<OwnedFileLock>> {
              self.file
                  .as_ref()
                  .map(OwnedFileLock::shared)
                  .transpose()
          }

          fn lock_exclusive(&self) -> Result<Option<OwnedFileLock>> {
              self.file
                  .as_ref()
                  .map(OwnedFileLock::exclusive)
                  .transpose()
          }
          }

          struct OwnedFileLock {
              file: File,
          }

          impl OwnedFileLock {
              fn shared(file: &File) -> Result<Self> {
                  let file = file.try_clone()?;
                  FileExt::lock_shared(&file)?;
                  Ok(Self { file })
              }

              fn exclusive(file: &File) -> Result<Self> {
                  let file = file.try_clone()?;
                  FileExt::lock_exclusive(&file)?;
                  Ok(Self { file })
              }
          }

          impl Drop for OwnedFileLock {
              fn drop(&mut self) {
                  let _ = FileExt::unlock(&self.file);
              }
          }
          '''.replace('          ', '')
          path.write_text(source[:start] + replacement + source[end:])
          PY

          cargo fmt --all
          git diff --check
          cargo clippy --all-targets -- -D warnings
          cargo test --all-targets

          python - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(["git", "diff", "--name-only"], text=True).split())
          allowed = {"group-memory/src/lib.rs", "group-memory/Cargo.lock"}
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit("unexpected group-memory paths: " + ", ".join(sorted(unexpected)))
          PY

          if ! git diff --quiet; then
            git config user.name "Kate"
            git config user.email "dhwanksh2000@gmail.com"
            git add -- src/lib.rs Cargo.lock
            git commit -m "fix: own group memory file lock handles"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
