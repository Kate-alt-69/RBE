name: Group Memory CI

on:
  push:
    paths:
      - "group-memory/**"
      - ".github/workflows/group-memory-ci.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  group-memory:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: group-memory
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: group-memory
      - name: format and checkpoint
        shell: bash
        run: |
          cargo fmt --all
          git diff --check
          python - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(["git", "diff", "--name-only"], text=True).split())
          allowed = {"group-memory/src/lib.rs"}
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit("unexpected formatter paths: " + ", ".join(sorted(unexpected)))
          PY
          if ! git diff --quiet; then
            git config user.name "Kate"
            git config user.email "dhwanksh2000@gmail.com"
            git add -- src/lib.rs
            git commit -m "style: format group memory crate"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test --all-targets
