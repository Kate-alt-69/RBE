name: Group Memory Header Lock Patch

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: group-memory
      - name: serialize Group Memory header initialization
        shell: bash
        run: |
          python .github/patches/group-memory-header-lock.py
          cargo fmt --manifest-path group-memory/Cargo.toml --all -- --check
          cargo clippy --manifest-path group-memory/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path group-memory/Cargo.toml --all-targets
          git diff --check
          python - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(["git", "diff", "--name-only"], text=True).split())
          expected = {"group-memory/src/lib.rs"}
          if changed != expected:
              raise SystemExit("unexpected Group Memory header lock paths: " + ", ".join(sorted(changed)))
          PY
          git config user.name "Kate"
          git config user.email "dhwanksh2000@gmail.com"
          git add -- group-memory/src/lib.rs
          git commit -m "FIX | BUG-GMEM-001 serialize Group Memory header initialization"
          git push origin "HEAD:${GITHUB_REF_NAME}"
