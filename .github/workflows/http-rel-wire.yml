name: REL HTTP Wiring

on:
  push:
    paths:
      - '.github/patches/http-rel-wire.py'
      - '.github/workflows/http-rel-wire.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply REL HTTP wiring
        run: python .github/patches/http-rel-wire.py
      - name: Format workspace
        working-directory: engine
        run: cargo fmt --all
      - name: Check workspace
        working-directory: engine
        run: cargo check --workspace
      - name: Test route engine and API
        working-directory: engine
        run: cargo test -p route-engine -p api -p backend
      - name: Clippy affected crates
        working-directory: engine
        run: cargo clippy -p route-engine -p api -p backend --all-targets -- -D warnings
      - name: Commit successful HTTP wiring and remove one-shot files
        shell: bash
        run: |
          rm -f .github/patches/http-rel-wire.py .github/workflows/http-rel-wire.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: expose full REL HTTP request and response context"
          git push origin HEAD:main
