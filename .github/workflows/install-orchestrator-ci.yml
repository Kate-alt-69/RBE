name: Install Orchestrator CI

on:
  push:
    paths:
      - 'install-orchestrator/**'
      - '.github/workflows/install-orchestrator-ci.yml'
  pull_request:
    paths:
      - 'install-orchestrator/**'
      - '.github/workflows/install-orchestrator-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-orchestrator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: install-orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: install-orchestrator
      - name: fmt check
        run: cargo fmt -- --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test
