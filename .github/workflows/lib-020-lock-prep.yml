name: LIB-020 Lock Prep

on:
  push:
    branches:
      - ci/lib-020-artifact-inspection-20260925
    paths:
      - .github/workflows/lib-020-lock-prep.yml
      - install-runtime/**

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/lib-020-artifact-inspection-20260925
      - uses: dtolnay/rust-toolchain@stable
      - name: Refresh engine lock from current manifests
        working-directory: engine
        run: cargo check --workspace --all-targets
      - name: Commit generated lock only
        run: |
          if git diff --quiet -- engine/Cargo.lock; then
            echo "engine/Cargo.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/Cargo.lock
          git commit -m "CI | generate LIB-020 engine lock"
          git push origin HEAD:ci/lib-020-artifact-inspection-20260925
