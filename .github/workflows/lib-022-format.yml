name: LIB-022 Format

on:
  push:
    branches:
      - ci/lib-022-source-preparation-20260925
    paths:
      - .github/workflows/lib-022-format.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/lib-022-source-preparation-20260925
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format install-runtime
        working-directory: install-runtime
        run: cargo fmt
      - name: Commit formatted source only
        run: |
          if git diff --quiet -- install-runtime/src/source.rs install-runtime/src/lib.rs; then
            echo "LIB-022 source already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add install-runtime/src/source.rs install-runtime/src/lib.rs
          git commit -m "CI | format LIB-022 source preparation"
          git push origin HEAD:ci/lib-022-source-preparation-20260925
