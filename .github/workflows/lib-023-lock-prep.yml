name: LIB-023 lock prep

on:
  push:
    paths:
      - '.github/workflows/lib-023-lock-prep.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/lib-023-durable-activation-20260927
      - uses: dtolnay/rust-toolchain@stable
      - name: Regenerate engine lock minimally
        working-directory: engine
        run: cargo check --workspace
      - name: Commit generated lock
        run: |
          if git diff --quiet -- engine/Cargo.lock; then
            echo 'engine/Cargo.lock already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add engine/Cargo.lock
          git commit -m 'TEMP | LIB-023 regenerate engine Cargo.lock'
          git push origin HEAD:ci/lib-023-durable-activation-20260927
