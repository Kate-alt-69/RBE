name: LIB-024 Format Prep

on:
  push:
    branches:
      - ci/lib-024-prebuilt-activation-20260927
    paths:
      - .github/workflows/lib-024-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/lib-024-prebuilt-activation-20260927
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format linked engine graph and remove prep workflow
        shell: bash
        run: |
          set -euo pipefail
          cd engine
          cargo fmt --all
          cd ..
          rm .github/workflows/lib-024-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "TEMP | LIB-024 apply rustfmt"
          git push origin HEAD:ci/lib-024-prebuilt-activation-20260927
