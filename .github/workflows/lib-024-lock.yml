name: LIB-024 Lock Prep

on:
  push:
    branches:
      - ci/lib-024-prebuilt-activation-20260927
    paths:
      - .github/workflows/lib-024-lock.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/lib-024-prebuilt-activation-20260927
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate exact engine lock and remove prep workflow
        shell: bash
        run: |
          set -euo pipefail
          cd engine
          cargo check --workspace
          cd ..
          rm .github/workflows/lib-024-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/Cargo.lock .github/workflows/lib-024-lock.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "TEMP | LIB-024 regenerate engine lock"
          git push origin HEAD:ci/lib-024-prebuilt-activation-20260927
