# One-shot lifecycle token repair; delete after lifecycle lands.
name: Lifecycle Token Seed

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: repair event token arm
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("engine/crates/service-runtime/src/lib.rs")
          source = path.read_text()
          impl_start = source.index("impl ServiceRequest {")
          next_item = source.index("\n#[derive(Debug, Serialize, Deserialize)]\n#[serde(tag = \"status\"", impl_start)
          token_impl = '''impl ServiceRequest {
              fn token(&self) -> &str {
                  match self {
                      Self::Health { token }
                      | Self::Call { token, .. }
                      | Self::Event { token, .. }
                      | Self::MemoryGet { token, .. }
                      | Self::MemorySet { token, .. }
                      | Self::MemoryDelete { token, .. }
                      | Self::MemoryClear { token }
                      | Self::Shutdown { token } => token,
                  }
              }
          }
          '''.replace('          ', '')
          replacement = token_impl.rstrip() + "\n"
          current = source[impl_start:next_item]
          if current != replacement:
              path.write_text(source[:impl_start] + replacement + source[next_item:])
          PY

          git diff --check
          if ! git diff --quiet; then
            git config user.name "Kate"
            git config user.email "dhwanksh2000@gmail.com"
            git add -- engine/crates/service-runtime/src/lib.rs
            git commit -m "ci: repair lifecycle event token arm"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
