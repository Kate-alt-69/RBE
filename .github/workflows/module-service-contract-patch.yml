name: Module Service Contract Patch

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: validate module service contracts at boot
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # module_runtime.rs: add a service interface type and validated loaders.
          path = Path("crates/route-engine/src/module_runtime.rs")
          source = path.read_text()
          source = source.replace(
              "use std::collections::{HashMap, HashSet};",
              "use std::collections::{HashMap, HashSet};\n\npub type ServiceInterfaces = HashMap<String, HashSet<String>>;",
              1,
          )

          load_start = source.index("    pub fn load_default() -> Result<Self, ModuleCompileErrors> {")
          load_body_start = source.index("    pub fn load(module_dir: &Path) -> Result<Self, ModuleCompileErrors> {", load_start)
          load_body_end = source.index("\n    pub fn len(&self) -> usize {", load_body_start)
          old_impl_body = source[load_body_start:load_body_end]
          internal = old_impl_body.replace(
              "    pub fn load(module_dir: &Path) -> Result<Self, ModuleCompileErrors> {",
              "    fn load_internal(\n        module_dir: &Path,\n        services: Option<&ServiceInterfaces>,\n    ) -> Result<Self, ModuleCompileErrors> {",
              1,
          ).replace(
              "                    validate_local(&path, &file, &mut errors);",
              "                    validate_local(&path, &file, services, &mut errors);",
              1,
          )
          loaders = '''    pub fn load_default() -> Result<Self, ModuleCompileErrors> {
              Self::load(&default_module_dir())
          }

          pub fn load_default_with_services(
              services: &ServiceInterfaces,
          ) -> Result<Self, ModuleCompileErrors> {
              Self::load_with_services(&default_module_dir(), services)
          }

          pub fn load(module_dir: &Path) -> Result<Self, ModuleCompileErrors> {
              Self::load_internal(module_dir, None)
          }

          pub fn load_with_services(
              module_dir: &Path,
              services: &ServiceInterfaces,
          ) -> Result<Self, ModuleCompileErrors> {
              Self::load_internal(module_dir, Some(services))
          }

          '''.replace('          ', '')
          source = source[:load_start] + loaders + internal + source[load_body_end:]

          validate_start = source.index("fn validate_local(")
          import_base_start = source.index("\nfn import_base(", validate_start)
          validate_block = '''fn validate_local(
              path: &Path,
              file: &ModuleFile,
              services: Option<&ServiceInterfaces>,
              errors: &mut Vec<ModuleCompileError>,
          ) {
              let mut functions = HashSet::new();
              for function in &file.functions {
                  if !functions.insert(function.name.clone()) {
                      errors.push(ModuleCompileError {
                          code: "MOD2002",
                          path: path.to_path_buf(),
                          line: 1,
                          column: 1,
                          message: format!("duplicate function {:?}", function.name),
                      });
                  }
              }

              let mut exports = HashSet::new();
              for export in &file.exports {
                  if !exports.insert(export.clone()) {
                      errors.push(ModuleCompileError {
                          code: "MOD2003",
                          path: path.to_path_buf(),
                          line: 1,
                          column: 1,
                          message: format!("duplicate export {export:?}"),
                      });
                  }
                  if !functions.contains(export) {
                      errors.push(ModuleCompileError {
                          code: "MOD2004",
                          path: path.to_path_buf(),
                          line: 1,
                          column: 1,
                          message: format!("export {export:?} has no function body"),
                      });
                  }
              }

              let mut bindings = HashSet::new();
              let mut sources = HashSet::new();
              for import in &file.imports {
                  let binding = binding_name(import);
                  if !bindings.insert(binding.clone()) {
                      errors.push(ModuleCompileError {
                          code: "MOD2005",
                          path: path.to_path_buf(),
                          line: 1,
                          column: 1,
                          message: format!("duplicate import binding {binding:?}"),
                      });
                  }
                  let source = import_source_key(import);
                  if !sources.insert(source.clone()) {
                      errors.push(ModuleCompileError {
                          code: "MOD2006",
                          path: path.to_path_buf(),
                          line: 1,
                          column: 1,
                          message: format!("duplicate import source {source:?}"),
                      });
                  }

                  let Some(services) = services else {
                      continue;
                  };
                  match import_base(import) {
                      ImportTarget::Service(service) => {
                          if !services.contains_key(service) {
                              errors.push(ModuleCompileError {
                                  code: "MOD2008",
                                  path: path.to_path_buf(),
                                  line: 1,
                                  column: 1,
                                  message: format!("module imports unknown service {service:?}"),
                              });
                          }
                      }
                      ImportTarget::ServiceFunction { service, function } => {
                          match services.get(service) {
                              None => errors.push(ModuleCompileError {
                                  code: "MOD2008",
                                  path: path.to_path_buf(),
                                  line: 1,
                                  column: 1,
                                  message: format!("module imports unknown service {service:?}"),
                              }),
                              Some(exports) if !exports.contains(function) => {
                                  errors.push(ModuleCompileError {
                                      code: "MOD2009",
                                      path: path.to_path_buf(),
                                      line: 1,
                                      column: 1,
                                      message: format!(
                                          "service {service:?} does not export {function:?}"
                                      ),
                                  });
                              }
                              Some(_) => {}
                          }
                      }
                      _ => {}
                  }
              }
          }
          '''.replace('          ', '')
          source = source[:validate_start] + validate_block + source[import_base_start:]

          tests_end = source.rfind("\n}")
          tests = r'''

              #[test]
              fn service_contract_validation_rejects_unknown_service_and_export() {
                  let root = root();
                  fs::write(
                      root.join("module/service.module"),
                      ":import[service:missing as missing, service:search.nope as nope]\nexport function run() { return true; }",
                  )
                  .unwrap();
                  let mut services = ServiceInterfaces::new();
                  services.insert("search".into(), HashSet::from(["find".into()]));
                  let errors = ModuleProgram::load_with_services(&root.join("module"), &services)
                      .expect_err("invalid service contracts should fail module boot validation");
                  assert!(errors.0.iter().any(|error| error.code == "MOD2008"));
                  assert!(errors.0.iter().any(|error| error.code == "MOD2009"));
                  let _ = fs::remove_dir_all(root);
              }

              #[test]
              fn service_contract_validation_accepts_registered_interfaces() {
                  let root = root();
                  fs::write(
                      root.join("module/service.module"),
                      ":import[service:uac-cache as cache, service:search.find as lookup]\nexport function run(value) { return value; }",
                  )
                  .unwrap();
                  let mut services = ServiceInterfaces::new();
                  services.insert("uac-cache".into(), HashSet::from(["get".into()]));
                  services.insert("search".into(), HashSet::from(["find".into()]));
                  ModuleProgram::load_with_services(&root.join("module"), &services)
                      .expect("registered service interfaces should validate");
                  let _ = fs::remove_dir_all(root);
              }
          '''.replace('          ', '')
          source = source[:tests_end] + tests + source[tests_end:]
          path.write_text(source)

          # lib.rs: export interface type.
          path = Path("crates/route-engine/src/lib.rs")
          source = path.read_text().replace(
              "pub use module_runtime::{ModuleCompileError, ModuleCompileErrors, ModuleProgram};",
              "pub use module_runtime::{\n    ModuleCompileError, ModuleCompileErrors, ModuleProgram, ServiceInterfaces,\n};",
              1,
          )
          path.write_text(source)

          # discovery.rs: validated module load and build_routes parameter.
          path = Path("crates/route-engine/src/discovery.rs")
          source = path.read_text()
          source = source.replace(
              "use crate::module_runtime::ModuleProgram;",
              "use crate::module_runtime::{ModuleProgram, ServiceInterfaces};",
              1,
          )
          source = source.replace(
              "pub fn build_routes(api_dir: &Path) -> anyhow::Result<Router<AppState>> {\n    let module_program = Arc::new(ModuleProgram::load_default()?);",
              "pub fn build_routes(\n    api_dir: &Path,\n    service_interfaces: &ServiceInterfaces,\n) -> anyhow::Result<Router<AppState>> {\n    let module_program = Arc::new(ModuleProgram::load_default_with_services(service_interfaces)?);",
              1,
          )
          path.write_text(source)

          # api/lib.rs: thread the service interfaces into route construction.
          path = Path("crates/api/src/lib.rs")
          source = path.read_text()
          source = source.replace(
              "pub fn build_router(state: AppState, api_dir: &Path) -> anyhow::Result<Router> {\n    let cors = build_cors_layer(&state);\n    let dot_route_routes = route_engine::build_routes(api_dir)?;",
              "pub fn build_router(\n    state: AppState,\n    api_dir: &Path,\n    service_interfaces: &route_engine::ServiceInterfaces,\n) -> anyhow::Result<Router> {\n    let cors = build_cors_layer(&state);\n    let dot_route_routes = route_engine::build_routes(api_dir, service_interfaces)?;",
              1,
          )
          path.write_text(source)

          # backend/main.rs: derive interfaces from the already-compiled catalog and pass them to API boot.
          path = Path("crates/backend/src/main.rs")
          source = path.read_text()
          source = source.replace(
              "use std::io::Write;",
              "use std::collections::{HashMap, HashSet};\nuse std::io::Write;",
              1,
          )
          catalog_anchor = "    let service_catalog = service_boot::compile(&config.services, &io)?;\n    lifecycle.set(BackendState::ServicesStarting);"
          catalog_replacement = '''    let service_catalog = service_boot::compile(&config.services, &io)?;
              let service_interfaces: route_engine::ServiceInterfaces = service_catalog
                  .as_ref()
                  .map(|catalog| {
                      catalog
                          .services()
                          .iter()
                          .map(|service| {
                              (
                                  service.name.clone(),
                                  service.exports.iter().cloned().collect::<HashSet<_>>(),
                              )
                          })
                          .collect::<HashMap<_, _>>()
                  })
                  .unwrap_or_default();
              lifecycle.set(BackendState::ServicesStarting);'''.replace('              ', '')
          if catalog_anchor not in source:
              raise SystemExit("backend service catalog anchor missing")
          source = source.replace(catalog_anchor, catalog_replacement, 1)
          source = source.replace(
              "    let router = api::build_router(app_state, &api_dir)?;",
              "    let router = api::build_router(app_state, &api_dir, &service_interfaces)?;",
              1,
          )
          path.write_text(source)
          PY

          rustfmt --edition 2021 \
            crates/route-engine/src/module_runtime.rs \
            crates/route-engine/src/lib.rs \
            crates/route-engine/src/discovery.rs \
            crates/api/src/lib.rs \
            crates/backend/src/main.rs
          git diff --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked

          git checkout -- \
            crates/backend/src/error_reporter_daemon.rs \
            crates/backend/src/maintenance_notice.rs \
            crates/route-engine/src/cache.rs \
            crates/route-engine/src/interpreter.rs \
            crates/route-engine/src/lexer.rs \
            crates/route-engine/src/transpiled_support.rs

          python - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(["git", "diff", "--name-only", "--relative"], text=True).split())
          allowed = {
              "crates/route-engine/src/module_runtime.rs",
              "crates/route-engine/src/lib.rs",
              "crates/route-engine/src/discovery.rs",
              "crates/api/src/lib.rs",
              "crates/backend/src/main.rs",
          }
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit("unexpected module-service contract paths: " + ", ".join(sorted(unexpected)))
          PY

          if ! git diff --quiet; then
            git config user.name "Kate"
            git config user.email "dhwanksh2000@gmail.com"
            git add -- \
              crates/route-engine/src/module_runtime.rs \
              crates/route-engine/src/lib.rs \
              crates/route-engine/src/discovery.rs \
              crates/api/src/lib.rs \
              crates/backend/src/main.rs
            git commit -m "feat: validate module service contracts at boot"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
