name: One-shot backend boot diagnostic validation

"on":
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-api-body-limits.yml'

permissions:
  contents: write

jobs:
  validate-and-land:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Apply, validate and land DIAG-003
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python3 .github/patches/diag-backend-boot.py

          # Restore the unrelated API repair workflow from the last clean
          # diagnostics commit before DIAG-003 staging.
          git show c3556bb1c4809bee7a1ee0c891ded9aa7e0c725b:.github/workflows/one-shot-api-body-limits.yml > .github/workflows/one-shot-api-body-limits.yml
          rm -f .github/patches/diag-backend-boot.py

          cd engine
          cargo fmt --all
          cargo check -p backend --all-targets --locked
          cargo test -p backend backend_boot_fatal_preserves_specific_rbe_codes --locked
          cargo test -p backend backend_boot_fatal_wraps_unclassified_failures --locked
          cargo clippy -p backend --all-targets --locked -- -D warnings
          cd ..

          python3 -m json.tool doc/error-codes/catalog.json >/dev/null
          grep -q 'RBE5001 Required packaged Container runtime is missing' engine/crates/backend/src/main.rs
          grep -q 'RBE5099 Backend failed to start with an unclassified boot error' engine/crates/backend/src/main.rs
          grep -q 'Logger::new("BACKEND").child("BOOT").fatal' engine/crates/backend/src/main.rs
          grep -q 'doc/error-codes/runtime.md#rbe5099' engine/crates/backend/src/main.rs

          git add -A
          git diff --cached --check
          git commit -m 'FIX | BUG-DIAG-003 improve backend boot diagnostics'

          git pull --rebase origin main
          git push origin HEAD:main

          # retrigger: 2026-09-18-error-book-rebase
