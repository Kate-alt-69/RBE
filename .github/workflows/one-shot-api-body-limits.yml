name: One-shot Container package diagnostic validation

"on":
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-api-body-limits.yml'

permissions:
  contents: write

jobs:
  validate-and-land:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Apply, validate and land DIAG-005
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python3 .github/patches/diag-container-package-errors.py
          rm -f .github/patches/diag-container-package-errors.py

          cd engine
          cargo fmt --all
          cargo check -p backend --all-targets --locked
          cargo test -p backend container_package_diagnostics_are_stable_and_actionable --locked
          cargo clippy -p backend --all-targets --locked -- -D warnings

          missing="$(cargo run -q -p backend --bin backend -- --explain RBE5001)"
          grep -q 'RBE5001' <<<"$missing"
          grep -q 'Required packaged dependency missing' <<<"$missing"

          binding="$(cargo run -q -p backend --bin backend -- --explain RBE5002)"
          grep -q 'RBE5002' <<<"$binding"
          grep -q 'Container binding metadata' <<<"$binding"
          grep -q 'doc/error-codes/runtime.md#rbe5002' <<<"$binding"

          integrity="$(cargo run -q -p backend --bin backend -- --explain RBE5003)"
          grep -q 'RBE5003' <<<"$integrity"
          grep -q 'integrity verification' <<<"$integrity"
          grep -q 'doc/error-codes/runtime.md#rbe5003' <<<"$integrity"

          rbe5="$(cargo run -q -p backend --bin backend -- --list-error-codes RBE5)"
          grep -q 'RBE5001' <<<"$rbe5"
          grep -q 'RBE5002' <<<"$rbe5"
          grep -q 'RBE5003' <<<"$rbe5"
          cd ..

          python3 -m json.tool doc/error-codes/catalog.json >/dev/null
          grep -q '### RBE5002' doc/error-codes/runtime.md
          grep -q '### RBE5003' doc/error-codes/runtime.md
          grep -q 'doc/error-codes/runtime.md#rbe5001' engine/crates/backend/src/container_process.rs
          grep -q 'doc/error-codes/runtime.md#rbe5002' engine/crates/backend/src/container_process.rs
          grep -q 'doc/error-codes/runtime.md#rbe5003' engine/crates/backend/src/container_process.rs

          git add -A
          git diff --cached --check
          git commit -m 'FIX | BUG-DIAG-005 classify Container package failures'

          git pull --rebase origin main
          git push origin HEAD:main
