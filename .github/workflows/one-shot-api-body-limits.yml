name: One-shot REL diagnostic code validation

"on":
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-api-body-limits.yml'

permissions:
  contents: write

jobs:
  validate-and-land:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Apply, validate and land DIAG-001
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python3 .github/patches/diag-rel-errors-fix.py
          python3 .github/patches/diag-rel-errors.py

          # Restore the unrelated API repair workflow from the known clean
          # pre-DIAG staging commit. HEAD^ is no longer safe after a retry.
          git show fa70e4c36fa3d965bc9dc621a25136326c36ee1a:.github/workflows/one-shot-api-body-limits.yml > .github/workflows/one-shot-api-body-limits.yml
          rm -f .github/patches/diag-rel-errors.py
          rm -f .github/patches/diag-rel-errors-fix.py

          cd engine
          cargo fmt --all
          cargo check -p route-engine --all-targets --locked
          cargo test -p route-engine --locked
          cargo clippy -p route-engine --all-targets --locked -- -D warnings
          cd ..

          python3 -m json.tool doc/error-codes/catalog.json >/dev/null
          grep -q 'pub fn code(&self)' engine/crates/route-engine/src/relc.rs
          grep -q 'code: "RELC3001"' engine/crates/route-engine/src/relc.rs
          grep -q 'help: doc/error-codes/relc.md#relc3001' engine/crates/route-engine/src/relc.rs
          grep -q '### REL1100' doc/error-codes/rel.md
          grep -q '### RELC2200' doc/error-codes/relc.md

          git add -A
          git diff --cached --check
          git commit -m 'FIX | BUG-DIAG-001 emit stable REL and RELC error codes'

          git pull --rebase origin main
          git push origin HEAD:main
