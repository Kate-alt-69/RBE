name: One-shot API request timeout repair

"on":
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-api-request-timeout.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply and validate API timeout repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main

          python3 .github/patches/api-request-timeout.py

          cd engine
          cargo fmt --all
          cargo test -p config rejects_zero_api_request_timeout
          cargo check -p api
          cd ..

          git rm .github/workflows/one-shot-api-request-timeout.yml
          git rm .github/patches/api-request-timeout.py
          git add engine/crates/api/src/lib.rs engine/crates/config/src/lib.rs
          git commit -m "FIX | BUG-API-002 enforce configured request timeout"

          git fetch origin main
          base="$(git rev-parse HEAD~1)"
          current="$(git rev-parse origin/main)"
          if [ "$current" != "$base" ]; then
            git rebase origin/main
          fi
          git push origin HEAD:main
