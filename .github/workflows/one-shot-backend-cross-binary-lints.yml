name: One-shot backend cross-binary lint fix

on:
  push:
    paths:
      - '.github/workflows/one-shot-backend-cross-binary-lints.yml'

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Preserve intentional cross-binary Service helpers
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main = Path('engine/crates/backend/src/service_main.rs')
          text = main.read_text(encoding='utf-8')
          old = '''mod package_links {
              pub(crate) use crate::package_approval as approval;
          }'''
          new = '''mod package_links {
              // backend.exe shared diagnostics use this facade; service.exe does not
              // perform package approval decisions itself.
              #[allow(unused_imports)]
              pub(crate) use crate::package_approval as approval;
          }'''
          if old not in text:
              raise SystemExit('service_main package approval facade anchor not found')
          main.write_text(text.replace(old, new, 1), encoding='utf-8')

          host = Path('engine/crates/backend/src/service_native_host.rs')
          text = host.read_text(encoding='utf-8')
          old = '''impl NativeServiceHostFrame {
              pub fn new('''
          new = '''impl NativeServiceHostFrame {
              // Constructed by backend-side native cutover code; service.exe only consumes
              // the authenticated frame after bootstrap.
              #[allow(dead_code)]
              pub fn new('''
          if old not in text:
              raise SystemExit('NativeServiceHostFrame::new anchor not found')
          text = text.replace(old, new, 1)

          old = '''pub fn attach_native_service_frames(
              runtime_env: &mut Value,'''
          new = '''// Called by backend-side native cutover assembly; service.exe only consumes the
          // reserved bootstrap bundle through take_native_service_frame().
          #[allow(dead_code)]
          pub fn attach_native_service_frames(
              runtime_env: &mut Value,'''
          if old not in text:
              raise SystemExit('attach_native_service_frames anchor not found')
          host.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Format backend Service surface
        run: |
          rustfmt --edition 2021 \
            engine/crates/backend/src/service_main.rs \
            engine/crates/backend/src/service_native_host.rs
      - name: Verify service binary clippy
        working-directory: engine
        run: cargo clippy -p backend --bin service --tests --locked -- -D warnings
      - name: Commit verified lint fix and remove verifier
        run: |
          git config user.name 'Kate'
          git config user.email 'dhwanksh2000@gmail.com'
          git add \
            engine/crates/backend/src/service_main.rs \
            engine/crates/backend/src/service_native_host.rs
          git rm .github/workflows/one-shot-backend-cross-binary-lints.yml
          git commit -m 'FIX | CI preserve cross-binary Service helpers'
          git reset --hard HEAD
          git pull --rebase origin main
          git push origin HEAD:main
