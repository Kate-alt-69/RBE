name: One-shot Cloud Node mutual auth client

"on":
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-cloud-node-auth.yml'

permissions:
  contents: write

jobs:
  validate-and-land:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Apply, validate and land Cloud Node mutual auth client
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python3 .github/patches/cloud-node-auth.py
          rm -f .github/patches/cloud-node-auth.py
          rm -f .github/workflows/one-shot-cloud-node-auth.yml

          cd engine
          cargo fmt --all
          cargo check -p cloud-node --all-targets
          cargo test -p cloud-node mutual_proofs_bind_identity_session_nonce_and_time
          cargo test -p cloud-node recovery_plan_orders_folder_video_then_file
          cargo clippy -p cloud-node --all-targets --locked -- -D warnings
          cd ..

          git add -A
          git diff --cached --check
          git commit -m 'feat: add Cloud Node mutual authentication client'
          git pull --rebase origin main
          git push origin HEAD:main
