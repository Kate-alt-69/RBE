name: One-shot Cloud Node backup history

"on":
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-cloud-node-backup-history.yml'

permissions:
  contents: write

jobs:
  validate-and-land:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Apply, validate and land actual Cloud Node backup revisions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python3 .github/patches/cloud-node-backup-history.py
          rm -f .github/patches/cloud-node-backup-history.py
          rm -f .github/workflows/one-shot-cloud-node-backup-history.yml

          cd engine
          cargo fmt --all
          cargo test -p cloud-node backup_keeps_original_plus_five_actual_revisions
          cargo test -p cloud-node recovery_plan_orders_folder_video_then_file
          cargo clippy -p cloud-node --all-targets --locked -- -D warnings
          cd ..

          git add -A
          git diff --cached --check
          git commit -m 'feat: retain actual Cloud Node backup revisions'
          git pull --rebase origin main
          git push origin HEAD:main
