name: One-shot Cloud Node peer config hardening

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-cloud-node-config-hardening.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-land:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Harden Cloud Node peer configuration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python3 - <<'PY'
          from pathlib import Path

          cargo = Path('engine/crates/cloud-node/Cargo.toml')
          text = cargo.read_text()
          anchor = 'reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"], optional = true }\n'
          if text.count(anchor) != 1:
              raise SystemExit('cloud-node Cargo dependency anchor changed')
          cargo.write_text(text.replace(anchor, anchor + 'url = "2"\n', 1))

          path = Path('engine/crates/cloud-node/src/config.rs')
          text = path.read_text()
          text = text.replace(
              'use std::path::{Path, PathBuf};\n',
              'use std::net::IpAddr;\nuse std::path::{Path, PathBuf};\n',
              1,
          )

          old_node = '''fn validate_node_id(value: &str) -> anyhow::Result<()> {
              if value.is_empty()
                  || value.len() > 128
                  || !value
                      .bytes()
                      .all(|byte| byte.is_ascii_alphanumeric() || matches!(byte, b'_' | b'-' | b'.'))
              {
                  anyhow::bail!("Cloud Node id must use 1..=128 ASCII [A-Za-z0-9_.-] characters");
              }
              Ok(())
          }
          '''
          new_node = '''fn validate_node_id(value: &str) -> anyhow::Result<()> {
              if value.is_empty()
                  || value.len() > 128
                  || matches!(value, "." | "..")
                  || !value
                      .bytes()
                      .all(|byte| byte.is_ascii_alphanumeric() || matches!(byte, b'_' | b'-' | b'.'))
              {
                  anyhow::bail!(
                      "Cloud Node id must use 1..=128 ASCII [A-Za-z0-9_.-] characters and cannot be . or .."
                  );
              }
              Ok(())
          }
          '''
          if text.count(old_node) != 1:
              raise SystemExit('node id validator anchor changed')
          text = text.replace(old_node, new_node, 1)

          old_url = '''fn validate_peer_url(value: &str) -> anyhow::Result<()> {
              let secure = value.starts_with("https://") || value.starts_with("wss://");
              let local_dev = value.starts_with("http://127.0.0.1")
                  || value.starts_with("http://localhost")
                  || value.starts_with("ws://127.0.0.1")
                  || value.starts_with("ws://localhost");
              if !secure && !local_dev {
                  anyhow::bail!("Cloud Node peer URL must use TLS outside localhost development");
              }
              Ok(())
          }
          '''
          new_url = '''fn validate_peer_url(value: &str) -> anyhow::Result<()> {
              let parsed = url::Url::parse(value)
                  .map_err(|error| anyhow::anyhow!("invalid Cloud Node peer URL: {error}"))?;
              let host = parsed
                  .host_str()
                  .ok_or_else(|| anyhow::anyhow!("Cloud Node peer URL must include a host"))?;

              if !parsed.username().is_empty() || parsed.password().is_some() {
                  anyhow::bail!("Cloud Node peer URL cannot embed credentials");
              }
              if parsed.query().is_some() || parsed.fragment().is_some() {
                  anyhow::bail!("Cloud Node peer URL cannot include a query or fragment");
              }

              match parsed.scheme() {
                  "https" => Ok(()),
                  "http" => {
                      let loopback = host.eq_ignore_ascii_case("localhost")
                          || host
                              .parse::<IpAddr>()
                              .is_ok_and(|address| address.is_loopback());
                      if !loopback {
                          anyhow::bail!(
                              "Cloud Node peer URL must use HTTPS outside exact loopback development hosts"
                          );
                      }
                      Ok(())
                  }
                  "ws" | "wss" => anyhow::bail!(
                      "Cloud Node RBE-CN/1 currently uses HTTP POST transport; ws/wss peer URLs are not supported"
                  ),
                  scheme => anyhow::bail!(
                      "Cloud Node peer URL uses unsupported scheme {scheme:?}; expected https or loopback http"
                  ),
              }
          }
          '''
          if text.count(old_url) != 1:
              raise SystemExit('peer URL validator anchor changed')
          text = text.replace(old_url, new_url, 1)

          marker = '''    #[test]
              fn defaults_backup_history_to_five() {
          '''
          if text.count(marker) != 1:
              raise SystemExit('config test marker changed')
          tests = '''    #[test]
              fn node_ids_reject_filesystem_aliases() {
                  assert!(validate_node_id(".").is_err());
                  assert!(validate_node_id("..").is_err());
                  validate_node_id("nas.main-1").unwrap();
              }

              #[test]
              fn peer_url_plaintext_requires_an_exact_loopback_host() {
                  validate_peer_url("http://localhost:8080/base").unwrap();
                  validate_peer_url("http://127.0.0.1:8080").unwrap();
                  validate_peer_url("http://127.12.34.56:8080").unwrap();
                  validate_peer_url("http://[::1]:8080").unwrap();
                  validate_peer_url("https://cloud.example.test").unwrap();

                  assert!(validate_peer_url("http://localhost.evil.example").is_err());
                  assert!(validate_peer_url("http://127.0.0.1.evil.example").is_err());
                  assert!(validate_peer_url("http://192.168.1.10:8080").is_err());
              }

              #[test]
              fn peer_url_matches_the_implemented_http_transport() {
                  assert!(validate_peer_url("ws://localhost:8080").is_err());
                  assert!(validate_peer_url("wss://cloud.example.test").is_err());
                  assert!(validate_peer_url("ftp://cloud.example.test").is_err());
                  assert!(validate_peer_url("https://user:pass@cloud.example.test").is_err());
                  assert!(validate_peer_url("https://cloud.example.test?token=nope").is_err());
                  assert!(validate_peer_url("https://cloud.example.test/#fragment").is_err());
              }

          '''
          text = text.replace(marker, tests + marker, 1)
          path.write_text(text)
          PY

          cd engine
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test -p cloud-node --locked
          cargo test -p backend --locked
          cd ..

          rm -f .github/workflows/one-shot-cloud-node-config-hardening.yml
          git add -A \
            .github/workflows/one-shot-cloud-node-config-hardening.yml \
            engine/crates/cloud-node/Cargo.toml \
            engine/Cargo.lock \
            engine/crates/cloud-node/src/config.rs
          git diff --cached --check
          git commit -m 'FIX | BUG-CN-007 harden Cloud Node peer configuration'
          git pull --rebase origin main
          git push origin HEAD:main
