name: One-shot Cloud Node foundation

"on":
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-cloud-node-foundation.yml'

permissions:
  contents: write

jobs:
  validate-and-land:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Apply, validate and land Cloud Node foundation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Finish the previously staged malformed-IPC diagnostic patch. Its
          # first validation exposed one test helper that also needed the peer.
          python3 .github/patches/ipc-lnx-diagnostics.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('engine/crates/service-runtime/src/mother.rs')
          text = p.read_text()
          old = '''        let server = tokio::spawn(async move {
              let (stream, _) = listener.accept().await.unwrap();
              handle_connection(stream, server_manager, server_token, shutdown_tx)
                  .await
                  .unwrap();
          });'''.replace('              ', '            ')
          new = '''        let server = tokio::spawn(async move {
              let (stream, peer) = listener.accept().await.unwrap();
              handle_connection(stream, peer, server_manager, server_token, shutdown_tx)
                  .await
                  .unwrap();
          });'''.replace('              ', '            ')
          if old not in text:
              raise SystemExit('Service Mother shutdown test helper anchor was not found')
          p.write_text(text.replace(old, new, 1))
          PY

          python3 .github/patches/cloud-node-foundation.py

          # Small source-level corrections caught while reviewing the generated
          # foundation before compilation.
          python3 - <<'PY'
          from pathlib import Path

          p = Path('engine/crates/cloud-node/src/format.rs')
          text = p.read_text()
          text = text.replace(
              'parent_content_sha256: has_parent.then_some(parent_raw),',
              'parent_content_sha256: (has_parent == 1).then_some(parent_raw),',
              1,
          )
          p.write_text(text)

          p = Path('engine/crates/cloud-node/src/lib.rs')
          text = p.read_text().replace(
              'pub use config::{CloudNodeSettings, NodeMode, ReplicationTarget, UpstreamSettings};',
              'pub use config::{CloudNodeSettings, NodeMode, NodeSettings, ReplicationSettings, ReplicationTarget, UpstreamSettings};',
              1,
          )
          p.write_text(text)

          p = Path('engine/crates/cloud-node/src/main.rs')
          text = p.read_text()
          old = '''    if command == "public-key" {
        let signing = load_signing_key_from_env()?;
        println!("{}", public_key_hex(&signing));
        return Ok(());
    }

    let settings = CloudNodeSettings::load(&config_path)?;'''
          new = '''    if matches!(command, "--help" | "-h") {
        print_help();
        return Ok(());
    }
    if command == "public-key" {
        let signing = load_signing_key_from_env()?;
        println!("{}", public_key_hex(&signing));
        return Ok(());
    }

    let settings = CloudNodeSettings::load(&config_path)?;'''
          if old not in text:
              raise SystemExit('Cloud Node help/config anchor was not found')
          p.write_text(text.replace(old, new, 1))
          PY

          rm -f .github/patches/ipc-lnx-diagnostics.py
          rm -f .github/workflows/one-shot-ipc-lnx-diagnostics.yml
          rm -f .github/patches/cloud-node-foundation.py
          rm -f .github/workflows/one-shot-cloud-node-foundation.yml

          cd engine
          cargo fmt --all
          cargo check -p backend -p service-runtime -p cloud-node --all-targets
          cargo test -p service-runtime malformed_ipc_classifier
          cargo test -p cloud-node
          cargo clippy -p backend -p service-runtime -p cloud-node --all-targets -- -D warnings
          cd ..

          bash -n build.sh
          bash -n build-core.sh
          pwsh -NoProfile -Command '$tokens=$null; $errors=$null; [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "build.ps1"), [ref]$tokens, [ref]$errors) > $null; if ($errors.Count) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }'

          grep -q 'rejected malformed Host Capability frame' engine/crates/backend/src/host_capability.rs
          grep -q 'rejected malformed Service Mother IPC' engine/crates/service-runtime/src/mother.rs
          grep -q 'malformed service IPC HTTP-like preview' engine/crates/service-runtime/src/lib.rs
          grep -q 'crates/cloud-node' engine/Cargo.toml
          grep -q -- '--cloud-node-only' build-core.sh
          grep -q -- '--cloud-node-only' build.ps1
          grep -q 'file.blob.cn' engine/crates/cloud-node/src/format.rs
          grep -q 'video.blob.cn' engine/crates/cloud-node/src/format.rs
          grep -q 'folder.blob.cn' engine/crates/cloud-node/src/format.rs

          git add engine/crates/backend/src/host_capability.rs engine/crates/service-runtime/src/mother.rs engine/crates/service-runtime/src/lib.rs
          git diff --cached --check
          git commit -m 'FIX | BUG-IPC-LNX-001 instrument malformed local IPC'

          git add -A
          git diff --cached --check
          git commit -m 'feat: add Cloud Node storage foundation'

          git pull --rebase origin main
          git push origin HEAD:main
