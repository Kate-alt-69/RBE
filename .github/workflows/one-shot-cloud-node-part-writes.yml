name: One-shot Cloud Node part-write hardening

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-cloud-node-part-writes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-land:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Patch, validate, and land part-file writes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python3 - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, label: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: {path}: expected one anchor, found {count}")
              p.write_text(text.replace(old, new, 1))
              print(f"patched: {label}")

          store = 'engine/crates/cloud-node/src/store.rs'

          replace(store,
          '''        let payload_path = version_dir.join("payload");
                  if !payload_path.exists() {
                      copy_exact(source, &payload_path)?;
                  }
                  let logical_size = fs::metadata(source)?.len();
          ''',
          '''        let payload_path = version_dir.join("payload");
                  let logical_size = fs::metadata(source)?.len();
                  if !file_matches(&payload_path, content_sha256, logical_size)? {
                      copy_exact(source, &payload_path)?;
                      if !file_matches(&payload_path, content_sha256, logical_size)? {
                          anyhow::bail!(
                              "Cloud Node content-addressed payload verification failed after repair: {}",
                              payload_path.display()
                          );
                      }
                  }
          ''', 'self-heal content-addressed payload')

          replace(store,
          '''                    if old.is_file() {
                                  exact_byte_changes(&old, source)?
                              } else {
          ''',
          '''                    if file_matches(&old, previous.content_sha256, previous.logical_size)? {
                                  exact_byte_changes(&old, source)?
                              } else {
          ''', 'do not diff against corrupt parent payload')

          replace(store,
          '''            let chunk_path = chunks_dir.join(format!("{}.chunk", hex::encode(hash)));
                      if !chunk_path.exists() {
                          atomic_write(&chunk_path, &buffer[..used])?;
                      }
          ''',
          '''            let chunk_path = chunks_dir.join(format!("{}.chunk", hex::encode(hash)));
                      if !file_matches(&chunk_path, hash, used as u64)? {
                          atomic_write(&chunk_path, &buffer[..used])?;
                          if !file_matches(&chunk_path, hash, used as u64)? {
                              anyhow::bail!(
                                  "Cloud Node content-addressed video chunk verification failed after repair: {}",
                                  chunk_path.display()
                              );
                          }
                      }
          ''', 'self-heal content-addressed video chunks')

          replace(store,
          '''fn copy_exact(source: &Path, target: &Path) -> anyhow::Result<()> {
              if let Some(parent) = target.parent() {
                  fs::create_dir_all(parent)?;
              }
              let temp = target.with_extension(format!("cn.tmp.{}", std::process::id()));
              fs::copy(source, &temp)?;
              if target.exists() {
                  fs::remove_file(target)?;
              }
              fs::rename(temp, target)?;
              Ok(())
          }

          fn atomic_write(path: &Path, bytes: &[u8]) -> anyhow::Result<()> {
              if let Some(parent) = path.parent() {
                  fs::create_dir_all(parent)?;
              }
              let temp = path.with_extension(format!("cn.tmp.{}", std::process::id()));
              {
                  let mut writer = BufWriter::new(File::create(&temp)?);
                  writer.write_all(bytes)?;
                  writer.flush()?;
                  writer.get_ref().sync_all()?;
              }
              if path.exists() {
                  fs::remove_file(path)?;
              }
              fs::rename(temp, path)?;
              Ok(())
          }
          ''',
          '''fn file_matches(path: &Path, expected_hash: [u8; 32], expected_size: u64) -> anyhow::Result<bool> {
              let metadata = match fs::metadata(path) {
                  Ok(metadata) => metadata,
                  Err(error) if error.kind() == std::io::ErrorKind::NotFound => return Ok(false),
                  Err(error) => return Err(error.into()),
              };
              if !metadata.is_file() || metadata.len() != expected_size {
                  return Ok(false);
              }
              Ok(sha256_file(path)? == expected_hash)
          }

          fn part_path(path: &Path) -> anyhow::Result<PathBuf> {
              let name = path
                  .file_name()
                  .ok_or_else(|| anyhow::anyhow!("Cloud Node target has no file name: {}", path.display()))?
                  .to_string_lossy();
              Ok(path.with_file_name(format!("{name}.part.{}", std::process::id())))
          }

          fn commit_part(part: &Path, target: &Path) -> anyhow::Result<()> {
              if target.exists() {
                  #[cfg(unix)]
                  {
                      fs::rename(part, target)?;
                      return Ok(());
                  }
                  #[cfg(not(unix))]
                  {
                      fs::remove_file(target)?;
                  }
              }
              fs::rename(part, target)?;
              Ok(())
          }

          fn copy_exact(source: &Path, target: &Path) -> anyhow::Result<()> {
              if let Some(parent) = target.parent() {
                  fs::create_dir_all(parent)?;
              }
              let part = part_path(target)?;
              if part.exists() {
                  fs::remove_file(&part)?;
              }
              fs::copy(source, &part)?;
              File::open(&part)?.sync_all()?;
              commit_part(&part, target)
          }

          fn atomic_write(path: &Path, bytes: &[u8]) -> anyhow::Result<()> {
              if let Some(parent) = path.parent() {
                  fs::create_dir_all(parent)?;
              }
              let part = part_path(path)?;
              if part.exists() {
                  fs::remove_file(&part)?;
              }
              {
                  let mut writer = BufWriter::new(File::create(&part)?);
                  writer.write_all(bytes)?;
                  writer.flush()?;
                  writer.get_ref().sync_all()?;
              }
              commit_part(&part, path)
          }
          ''', 'durable .part atomic write helpers')

          replace(store,
          '''    #[test]
              fn video_storage_uses_hashed_chunks() {
                  let root = test_root("video");
                  fs::create_dir_all(&root).unwrap();
                  let source = root.join("clip.mp4");
                  fs::write(&source, vec![9u8; 2 * 1024 * 1024 + 17]).unwrap();
                  let store = CloudNodeStore::open(&settings(&root)).unwrap();
                  let stored = store.store_video(&source, "video/clip.mp4").unwrap();
                  let manifest = BlobManifest::decode(&fs::read(&stored.manifest).unwrap()).unwrap();
                  let BlobBody::Video { chunks, .. } = manifest.body else {
                      panic!("expected video blob");
                  };
                  assert_eq!(chunks.len(), 3);
                  fs::remove_dir_all(root).unwrap();
              }
          ''',
          '''    #[test]
              fn video_storage_uses_hashed_chunks() {
                  let root = test_root("video");
                  fs::create_dir_all(&root).unwrap();
                  let source = root.join("clip.mp4");
                  fs::write(&source, vec![9u8; 2 * 1024 * 1024 + 17]).unwrap();
                  let store = CloudNodeStore::open(&settings(&root)).unwrap();
                  let stored = store.store_video(&source, "video/clip.mp4").unwrap();
                  let manifest = BlobManifest::decode(&fs::read(&stored.manifest).unwrap()).unwrap();
                  let BlobBody::Video { chunks, .. } = manifest.body else {
                      panic!("expected video blob");
                  };
                  assert_eq!(chunks.len(), 3);
                  fs::remove_dir_all(root).unwrap();
              }

              #[test]
              fn storing_same_file_repairs_corrupted_content_addressed_payload() {
                  let root = test_root("repair-payload");
                  fs::create_dir_all(&root).unwrap();
                  let source = root.join("users.db");
                  fs::write(&source, b"authoritative bytes").unwrap();
                  let store = CloudNodeStore::open(&settings(&root)).unwrap();
                  let stored = store.store_file(&source, "db/users.db").unwrap();
                  let payload = store
                      .summary()
                      .storage
                      .join(&stored.object_key)
                      .join("versions")
                      .join(&stored.content_sha256)
                      .join("payload");
                  fs::write(&payload, b"corrupt").unwrap();
                  assert!(store.verify().is_err());
                  store.store_file(&source, "db/users.db").unwrap();
                  assert_eq!(fs::read(&payload).unwrap(), b"authoritative bytes");
                  store.verify().unwrap();
                  fs::remove_dir_all(root).unwrap();
              }

              #[test]
              fn storing_same_video_repairs_corrupted_content_addressed_chunk() {
                  let root = test_root("repair-video-chunk");
                  fs::create_dir_all(&root).unwrap();
                  let source = root.join("clip.mp4");
                  fs::write(&source, vec![5u8; 1024 * 1024 + 17]).unwrap();
                  let store = CloudNodeStore::open(&settings(&root)).unwrap();
                  let stored = store.store_video(&source, "video/clip.mp4").unwrap();
                  let manifest = BlobManifest::decode(&fs::read(&stored.manifest).unwrap()).unwrap();
                  let BlobBody::Video { chunks, .. } = manifest.body else {
                      panic!("expected video blob");
                  };
                  let first = chunks.first().unwrap();
                  let chunk_path = store
                      .summary()
                      .storage
                      .join(&stored.object_key)
                      .join("chunks")
                      .join(format!("{}.chunk", hex::encode(first.sha256)));
                  fs::write(&chunk_path, b"corrupt").unwrap();
                  assert!(store.verify().is_err());
                  store.store_video(&source, "video/clip.mp4").unwrap();
                  store.verify().unwrap();
                  assert!(!chunk_path.with_file_name(format!(
                      "{}.part.{}",
                      chunk_path.file_name().unwrap().to_string_lossy(),
                      std::process::id()
                  )).exists());
                  fs::remove_dir_all(root).unwrap();
              }
          ''', 'content-addressed repair tests')

          recovery = 'engine/crates/cloud-node/src/recovery.rs'
          replace(recovery,
          '''        if target.exists() {
                      if !verify_resource(&target, chunk.resource_sha256, chunk.total_size)? {
                          anyhow::bail!("Cloud Node recovery target already exists with different bytes");
                      }
                      fs::remove_file(&active.path)?;
                      duplicate = true;
                  } else {
                      fs::rename(&active.path, &target)?;
                  }
          ''',
          '''        if target.exists() {
                      if verify_resource(&target, chunk.resource_sha256, chunk.total_size)? {
                          fs::remove_file(&active.path)?;
                          duplicate = true;
                      } else {
                          fs::remove_file(&target)?;
                          fs::rename(&active.path, &target)?;
                          duplicate = false;
                      }
                  } else {
                      fs::rename(&active.path, &target)?;
                  }
          ''', 'repair corrupt staged recovery target')

          replace(recovery,
          '''            if !version.exists() {
                          fs::copy(target, &version)?;
                      }
          ''',
          '''            if !version.exists() {
                          copy_file_via_part(target, &version)?;
                      }
          ''', 'folder recovery version via part file')

          replace(recovery,
          '''        let temp = payload.with_extension(format!("recovery.tmp.{}", std::process::id()));
                  if temp.exists() {
                      fs::remove_file(&temp)?;
                  }
          ''',
          '''        let temp = part_path(&payload)?;
                  if temp.exists() {
                      fs::remove_file(&temp)?;
                  }
          ''', 'video reconstruction .part path')

          insert_anchor = '''fn validate_staged_resource(
          '''
          helper = '''fn part_path(path: &Path) -> anyhow::Result<PathBuf> {
              let name = path
                  .file_name()
                  .ok_or_else(|| anyhow::anyhow!("Cloud Node recovery target has no file name: {}", path.display()))?
                  .to_string_lossy();
              Ok(path.with_file_name(format!("{name}.part.{}", std::process::id())))
          }

          fn copy_file_via_part(source: &Path, target: &Path) -> anyhow::Result<()> {
              if let Some(parent) = target.parent() {
                  fs::create_dir_all(parent)?;
              }
              let part = part_path(target)?;
              if part.exists() {
                  fs::remove_file(&part)?;
              }
              fs::copy(source, &part)?;
              File::open(&part)?.sync_all()?;
              if target.exists() {
                  fs::remove_file(target)?;
              }
              fs::rename(part, target)?;
              Ok(())
          }

          fn validate_staged_resource(
          '''
          replace(recovery, insert_anchor, helper, 'recovery part-copy helper')
          PY

          cd engine
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test -p cloud-node --locked
          cargo test -p backend --locked
          cd ..

          rm -f .github/workflows/one-shot-cloud-node-part-writes.yml
          git add -A .github/workflows/one-shot-cloud-node-part-writes.yml \
            engine/crates/cloud-node/src/store.rs \
            engine/crates/cloud-node/src/recovery.rs
          git diff --cached --check
          git commit -m 'FIX | BUG-CN-003 use verified part-file writes for Cloud Node storage'
          git pull --rebase origin main
          git push origin HEAD:main
