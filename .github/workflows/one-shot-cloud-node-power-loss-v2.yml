name: One-shot Cloud Node power-loss durability v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-cloud-node-power-loss-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-land:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Harden Cloud Node power-loss commits
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cat > engine/crates/cloud-node/src/durable.rs <<'RS'
          use std::fs::{self, File};
          use std::io;
          use std::path::{Path, PathBuf};

          pub(crate) fn create_dir_all(path: &Path) -> io::Result<()> {
              let missing = missing_directories(path)?;
              fs::create_dir_all(path)?;
              for directory in missing.iter().rev() {
                  sync_parent(directory)?;
              }
              Ok(())
          }

          pub(crate) fn rename(source: &Path, target: &Path) -> io::Result<()> {
              let source_parent = parent_path(source);
              let target_parent = parent_path(target);
              fs::rename(source, target)?;
              sync_directory(&target_parent)?;
              if source_parent != target_parent {
                  sync_directory(&source_parent)?;
              }
              Ok(())
          }

          pub(crate) fn remove_file(path: &Path) -> io::Result<()> {
              let parent = parent_path(path);
              fs::remove_file(path)?;
              sync_directory(&parent)
          }

          pub(crate) fn remove_dir_all(path: &Path) -> io::Result<()> {
              let parent = parent_path(path);
              fs::remove_dir_all(path)?;
              sync_directory(&parent)
          }

          pub(crate) fn sync_parent(path: &Path) -> io::Result<()> {
              sync_directory(&parent_path(path))
          }

          fn parent_path(path: &Path) -> PathBuf {
              path.parent()
                  .filter(|parent| !parent.as_os_str().is_empty())
                  .unwrap_or_else(|| Path::new("."))
                  .to_path_buf()
          }

          fn missing_directories(path: &Path) -> io::Result<Vec<PathBuf>> {
              let mut missing = Vec::new();
              let mut current = path.to_path_buf();
              loop {
                  match fs::metadata(&current) {
                      Ok(metadata) => {
                          if !metadata.is_dir() {
                              return Err(io::Error::new(
                                  io::ErrorKind::AlreadyExists,
                                  format!("{} exists and is not a directory", current.display()),
                              ));
                          }
                          break;
                      }
                      Err(error) if error.kind() == io::ErrorKind::NotFound => {
                          missing.push(current.clone());
                          let Some(parent) = current.parent() else {
                              break;
                          };
                          if parent.as_os_str().is_empty() {
                              break;
                          }
                          current = parent.to_path_buf();
                      }
                      Err(error) => return Err(error),
                  }
              }
              Ok(missing)
          }

          #[cfg(unix)]
          fn sync_directory(path: &Path) -> io::Result<()> {
              File::open(path)?.sync_all()
          }

          #[cfg(not(unix))]
          fn sync_directory(_path: &Path) -> io::Result<()> {
              Ok(())
          }

          #[cfg(feature = "client")]
          pub(crate) async fn create_dir_all_async(path: &Path) -> io::Result<()> {
              let missing = missing_directories_async(path).await?;
              tokio::fs::create_dir_all(path).await?;
              for directory in missing.iter().rev() {
                  sync_parent_async(directory).await?;
              }
              Ok(())
          }

          #[cfg(feature = "client")]
          pub(crate) async fn rename_async(source: &Path, target: &Path) -> io::Result<()> {
              let source_parent = parent_path(source);
              let target_parent = parent_path(target);
              tokio::fs::rename(source, target).await?;
              sync_directory_async(&target_parent).await?;
              if source_parent != target_parent {
                  sync_directory_async(&source_parent).await?;
              }
              Ok(())
          }

          #[cfg(feature = "client")]
          pub(crate) async fn remove_file_async(path: &Path) -> io::Result<()> {
              let parent = parent_path(path);
              tokio::fs::remove_file(path).await?;
              sync_directory_async(&parent).await
          }

          #[cfg(feature = "client")]
          pub(crate) async fn remove_dir_all_async(path: &Path) -> io::Result<()> {
              let parent = parent_path(path);
              tokio::fs::remove_dir_all(path).await?;
              sync_directory_async(&parent).await
          }

          #[cfg(feature = "client")]
          async fn missing_directories_async(path: &Path) -> io::Result<Vec<PathBuf>> {
              let mut missing = Vec::new();
              let mut current = path.to_path_buf();
              loop {
                  match tokio::fs::metadata(&current).await {
                      Ok(metadata) => {
                          if !metadata.is_dir() {
                              return Err(io::Error::new(
                                  io::ErrorKind::AlreadyExists,
                                  format!("{} exists and is not a directory", current.display()),
                              ));
                          }
                          break;
                      }
                      Err(error) if error.kind() == io::ErrorKind::NotFound => {
                          missing.push(current.clone());
                          let Some(parent) = current.parent() else {
                              break;
                          };
                          if parent.as_os_str().is_empty() {
                              break;
                          }
                          current = parent.to_path_buf();
                      }
                      Err(error) => return Err(error),
                  }
              }
              Ok(missing)
          }

          #[cfg(all(feature = "client", unix))]
          async fn sync_directory_async(path: &Path) -> io::Result<()> {
              tokio::fs::File::open(path).await?.sync_all().await
          }

          #[cfg(all(feature = "client", not(unix)))]
          async fn sync_directory_async(_path: &Path) -> io::Result<()> {
              Ok(())
          }

          #[cfg(feature = "client")]
          async fn sync_parent_async(path: &Path) -> io::Result<()> {
              sync_directory_async(&parent_path(path)).await
          }

          #[cfg(test)]
          mod tests {
              use super::*;
              use std::time::{SystemTime, UNIX_EPOCH};

              fn test_root(label: &str) -> PathBuf {
                  std::env::temp_dir().join(format!(
                      "rbe-cloud-node-durable-{label}-{}-{}",
                      std::process::id(),
                      SystemTime::now()
                          .duration_since(UNIX_EPOCH)
                          .unwrap()
                          .as_nanos()
                  ))
              }

              #[test]
              fn durable_directory_creation_and_rename_round_trip() {
                  let root = test_root("rename");
                  let nested = root.join("a/b/c");
                  create_dir_all(&nested).unwrap();
                  let part = nested.join("value.part");
                  let target = nested.join("value");
                  fs::write(&part, b"durable").unwrap();
                  File::open(&part).unwrap().sync_all().unwrap();
                  sync_parent(&part).unwrap();
                  rename(&part, &target).unwrap();
                  assert_eq!(fs::read(&target).unwrap(), b"durable");
                  remove_dir_all(&root).unwrap();
              }
          }
          RS

          python3 - <<'PY'
          from pathlib import Path

          def insert_after(text, marker, addition, label):
              if text.count(marker) != 1:
                  raise SystemExit(f'{label} marker count={text.count(marker)}')
              return text.replace(marker, marker + addition, 1)

          lib = Path('engine/crates/cloud-node/src/lib.rs')
          text = lib.read_text()
          text = insert_after(text, 'mod crypto;', '\nmod durable;', 'cloud-node lib')
          lib.write_text(text)

          store = Path('engine/crates/cloud-node/src/store.rs')
          text = store.read_text()
          text = insert_after(text, 'use crate::config::CloudNodeSettings;', '\nuse crate::durable;', 'store import')
          marker = '\n#[cfg(test)]'
          if marker not in text:
              raise SystemExit('store test boundary missing')
          production, tests = text.split(marker, 1)
          production = production.replace('fs::create_dir_all(', 'durable::create_dir_all(')
          production = production.replace('fs::rename(', 'durable::rename(')
          production = production.replace('fs::remove_file(', 'durable::remove_file(')
          production = production.replace('fs::remove_dir_all(', 'durable::remove_dir_all(')
          store.write_text(production + marker + tests)

          recovery = Path('engine/crates/cloud-node/src/recovery.rs')
          text = recovery.read_text()
          text = insert_after(text, 'use sha2::{Digest, Sha256};', '\n\nuse crate::durable;', 'recovery import')
          if marker not in text:
              raise SystemExit('recovery test boundary missing')
          production, tests = text.split(marker, 1)
          production = production.replace('fs::create_dir_all(', 'durable::create_dir_all(')
          production = production.replace('fs::rename(', 'durable::rename(')
          production = production.replace('fs::remove_file(', 'durable::remove_file(')
          production = production.replace('fs::remove_dir_all(', 'durable::remove_dir_all(')
          part_anchor = 'file.sync_all()?;\n                    0'
          if production.count(part_anchor) != 2:
              raise SystemExit(f'recovery part sync anchor count={production.count(part_anchor)}')
          production = production.replace(
              part_anchor,
              'file.sync_all()?;\n                    durable::sync_parent(&part)?;\n                    0',
          )
          recovery.write_text(production + marker + tests)

          client = Path('engine/crates/cloud-node/src/client.rs')
          text = client.read_text()
          text = insert_after(text, 'use crate::crypto::load_signing_key_from_env;', '\nuse crate::durable;', 'client import')
          if marker not in text:
              raise SystemExit('client test boundary missing')
          production, tests = text.split(marker, 1)
          production = production.replace('tokio::fs::create_dir_all(', 'durable::create_dir_all_async(')
          production = production.replace('tokio::fs::rename(', 'durable::rename_async(')
          production = production.replace('tokio::fs::remove_file(', 'durable::remove_file_async(')
          production = production.replace('tokio::fs::remove_dir_all(', 'durable::remove_dir_all_async(')
          client.write_text(production + marker + tests)

          doc = Path('doc/cloud-node.md')
          text = doc.read_text()
          old = 'Resource bytes are first written to stable `.transfer.part` files and fsynced.'
          new = old + ' On Unix-like hosts, Cloud Node also fsyncs containing directories after durable directory creation, rename, and removal operations so a successful commit covers the filesystem namespace update rather than only file contents.'
          if text.count(old) != 1:
              raise SystemExit(f'cloud-node doc anchor count={text.count(old)}')
          doc.write_text(text.replace(old, new, 1))
          PY

          cd engine
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test -p cloud-node --locked
          cargo test -p backend --locked
          cd ..

          rm -f \
            .github/workflows/one-shot-cloud-node-power-loss.yml \
            .github/workflows/one-shot-cloud-node-power-loss-v2.yml
          git add -A \
            .github/workflows/one-shot-cloud-node-power-loss.yml \
            .github/workflows/one-shot-cloud-node-power-loss-v2.yml \
            engine/crates/cloud-node/src/durable.rs \
            engine/crates/cloud-node/src/lib.rs \
            engine/crates/cloud-node/src/store.rs \
            engine/crates/cloud-node/src/recovery.rs \
            engine/crates/cloud-node/src/client.rs \
            doc/cloud-node.md
          git diff --cached --check
          git commit -m 'FIX | BUG-CN-008 persist Cloud Node filesystem commits across power loss'
          git pull --rebase origin main
          git push origin HEAD:main
