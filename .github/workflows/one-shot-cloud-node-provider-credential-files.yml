name: One-shot Cloud Node rotating provider credentials

on:
  push:
    branches:
      - work/cloud-node-providers-latest

permissions:
  contents: write

jobs:
  credential-files:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Add rotating credential-file resolution
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('engine/crates/cloud-node/src/provider.rs')
          text = path.read_text()

          if 'use std::io::Read;' not in text:
              text = text.replace('use std::path::Path;\n', 'use std::io::Read;\nuse std::path::Path;\n', 1)
          if 'const MAX_PROVIDER_SECRET_FILE_BYTES' not in text:
              text = text.replace(
                  'const MAX_PROVIDER_ERROR_BYTES: usize = 1024;\n',
                  'const MAX_PROVIDER_ERROR_BYTES: usize = 1024;\nconst MAX_PROVIDER_SECRET_FILE_BYTES: u64 = 64 * 1024;\n',
                  1,
              )

          old_required = '''fn required_env(configured: Option<&str>, default_name: &str) -> anyhow::Result<String> {\n    let name = configured.unwrap_or(default_name);\n    let value = std::env::var(name).map_err(|_| {\n        anyhow::anyhow!("Cloud Node provider credential environment {name} is not set")\n    })?;\n    if value.trim().is_empty() {\n        anyhow::bail!("Cloud Node provider credential environment {name} is empty");\n    }\n    Ok(value)\n}\n\nfn optional_env(configured: Option<&str>, default_name: &str) -> anyhow::Result<Option<String>> {\n    let name = configured.unwrap_or(default_name);\n    match std::env::var(name) {\n        Ok(value) if !value.trim().is_empty() => Ok(Some(value)),\n        Ok(_) | Err(std::env::VarError::NotPresent) => Ok(None),\n        Err(error) => Err(anyhow::anyhow!(\n            "failed to read Cloud Node provider credential environment {name}: {error}"\n        )),\n    }\n}\n'''
          new_required = '''fn required_env(configured: Option<&str>, default_name: &str) -> anyhow::Result<String> {\n    let name = configured.unwrap_or(default_name);\n    let value = std::env::var(name).map_err(|_| {\n        anyhow::anyhow!("Cloud Node provider credential environment {name} is not set")\n    })?;\n    resolve_secret_value(name, &value)?.ok_or_else(|| {\n        anyhow::anyhow!("Cloud Node provider credential environment {name} is empty")\n    })\n}\n\nfn optional_env(configured: Option<&str>, default_name: &str) -> anyhow::Result<Option<String>> {\n    let name = configured.unwrap_or(default_name);\n    match std::env::var(name) {\n        Ok(value) => resolve_secret_value(name, &value),\n        Err(std::env::VarError::NotPresent) => Ok(None),\n        Err(error) => Err(anyhow::anyhow!(\n            "failed to read Cloud Node provider credential environment {name}: {error}"\n        )),\n    }\n}\n\nfn resolve_secret_value(name: &str, value: &str) -> anyhow::Result<Option<String>> {\n    if value.trim().is_empty() {\n        return Ok(None);\n    }\n    let Some(file_name) = value.strip_prefix("file:") else {\n        return Ok(Some(value.to_owned()));\n    };\n    if file_name.is_empty() {\n        anyhow::bail!(\n            "Cloud Node provider credential environment {name} has an empty file: path"\n        );\n    }\n    let path = Path::new(file_name);\n    if !path.is_absolute() {\n        anyhow::bail!(\n            "Cloud Node provider credential file from {name} must use an absolute path"\n        );\n    }\n    let file = std::fs::File::open(path).map_err(|error| {\n        anyhow::anyhow!(\n            "failed to open Cloud Node provider credential file {} from {name}: {error}",\n            path.display()\n        )\n    })?;\n    let mut bytes = Vec::new();\n    file.take(MAX_PROVIDER_SECRET_FILE_BYTES + 1)\n        .read_to_end(&mut bytes)\n        .map_err(|error| {\n            anyhow::anyhow!(\n                "failed to read Cloud Node provider credential file {} from {name}: {error}",\n                path.display()\n            )\n        })?;\n    if bytes.len() as u64 > MAX_PROVIDER_SECRET_FILE_BYTES {\n        anyhow::bail!(\n            "Cloud Node provider credential file {} exceeds {} bytes",\n            path.display(),\n            MAX_PROVIDER_SECRET_FILE_BYTES\n        );\n    }\n    let value = String::from_utf8(bytes).map_err(|_| {\n        anyhow::anyhow!(\n            "Cloud Node provider credential file {} from {name} is not UTF-8",\n            path.display()\n        )\n    })?;\n    let value = value.trim_end_matches(&['\\r', '\\n'][..]);\n    if value.trim().is_empty() {\n        return Ok(None);\n    }\n    Ok(Some(value.to_owned()))\n}\n'''
          if old_required not in text:
              raise SystemExit('credential helper anchor not found')
          text = text.replace(old_required, new_required, 1)

          test_anchor = '''    #[test]\n    fn aws_epoch_timestamp_is_stable() {\n'''
          tests = '''    #[test]\n    fn credential_file_values_are_reloaded_and_keep_inner_whitespace() {\n        let path = std::env::temp_dir().join(format!(\n            "rbe-provider-secret-{}-{}",\n            std::process::id(),\n            SystemTime::now()\n                .duration_since(UNIX_EPOCH)\n                .unwrap()\n                .as_nanos()\n        ));\n        std::fs::write(&path, b"first secret\\r\\n").unwrap();\n        let reference = format!("file:{}", path.display());\n        assert_eq!(\n            resolve_secret_value("RBE_TEST_SECRET", &reference)\n                .unwrap()\n                .as_deref(),\n            Some("first secret")\n        );\n        std::fs::write(&path, b"second secret\\n").unwrap();\n        assert_eq!(\n            resolve_secret_value("RBE_TEST_SECRET", &reference)\n                .unwrap()\n                .as_deref(),\n            Some("second secret")\n        );\n        std::fs::remove_file(path).unwrap();\n    }\n\n    #[test]\n    fn credential_file_reference_requires_absolute_path() {\n        assert!(resolve_secret_value("RBE_TEST_SECRET", "file:relative/token").is_err());\n    }\n\n'''
          if test_anchor not in text:
              raise SystemExit('provider test anchor not found')
          text = text.replace(test_anchor, tests + test_anchor, 1)
          path.write_text(text)

          doc = Path('doc/cloud-node.md')
          docs = doc.read_text()
          marker = 'The environment variable names can be overridden without putting their values in JSON. For example, a custom provider that expects a proprietary header can use:\n'
          addition = '''For credentials that rotate while `cloud_node run` stays online, any provider credential environment value may point at an absolute UTF-8 secret file using the `file:` prefix instead of containing the secret directly. Cloud Node re-opens the file for every provider request, so a sidecar or platform credential agent can atomically replace the token without restarting Cloud Node. Secret files are capped at 64 KiB and trailing CR/LF is ignored. For example:\n\n```text\nRBE_CN_PROV_GOOGLE_OAUTH_TOKEN=file:/run/secrets/gcs-oauth-token\n```\n\nOn Windows the same mechanism accepts an absolute Windows path, for example `file:C:\\\\ProgramData\\\\RBE\\\\gcs-oauth-token.txt`.\n\n'''
          if addition not in docs:
              if marker not in docs:
                  raise SystemExit('Cloud Node docs credential anchor not found')
              docs = docs.replace(marker, addition + marker, 1)
              doc.write_text(docs)
          PY
      - name: Format
        working-directory: engine
        run: cargo fmt --all
      - name: Clippy
        working-directory: engine
        run: cargo clippy -p cloud-node --all-targets --all-features --locked -- -D warnings
      - name: Test Cloud Node
        working-directory: engine
        run: cargo test -p cloud-node --all-features --locked
      - name: Commit BUG-CN-PROV-014
        run: |
          rm -f .github/workflows/one-shot-cloud-node-provider-credential-files.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "FIX | BUG-CN-PROV-014 reload rotating provider credentials"
          git push origin HEAD:work/cloud-node-providers-latest
