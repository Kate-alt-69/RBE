name: One-shot Cloud Node existing provider snapshot identity

on:
  push:
    branches:
      - work/cloud-node-provider-hardening-2

permissions:
  contents: write

jobs:
  provider-existing-snapshot:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Verify existing provider snapshot matches local plan
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('engine/crates/cloud-node/src/provider_sync.rs')
          text = path.read_text()

          old_existing = '''    if let Some(existing) = client.get(&index_key).await? {\n        let snapshot: ProviderSnapshot = serde_json::from_slice(&existing)?;\n        validate_snapshot(&snapshot)?;\n        if snapshot.root_sha256 == root {\n            return Ok(());\n        }\n        anyhow::bail!("Cloud Node provider snapshot index collision for root {root}");\n    }\n'''
          new_existing = '''    if let Some(existing) = client.get(&index_key).await? {\n        let snapshot: ProviderSnapshot = serde_json::from_slice(&existing)?;\n        validate_snapshot(&snapshot)?;\n        if snapshot.root_sha256 != root {\n            anyhow::bail!("Cloud Node provider snapshot index collision for root {root}");\n        }\n        if !snapshot_matches_plan(&snapshot, plan)? {\n            anyhow::bail!(\n                "Cloud Node provider snapshot index for root {root} does not match the local sync plan"\n            );\n        }\n        return Ok(());\n    }\n'''
          if 'does not match the local sync plan' not in text:
              if old_existing not in text:
                  raise SystemExit('existing snapshot anchor not found')
              text = text.replace(old_existing, new_existing, 1)

          validate_anchor = '''fn validate_snapshot(snapshot: &ProviderSnapshot) -> anyhow::Result<()> {\n'''
          helpers = '''fn snapshot_matches_plan(snapshot: &ProviderSnapshot, plan: &SyncPlan) -> anyhow::Result<bool> {\n    let header = plan.header()?;\n    if snapshot.root_sha256 != plan.root_hex()\n        || snapshot.folder_count != header.folder_count\n        || snapshot.video_count != header.video_count\n        || snapshot.file_count != header.file_count\n    {\n        return Ok(false);\n    }\n    let expected = snapshot_resource_keys_for_plan(plan)?;\n    let actual = snapshot\n        .resources\n        .iter()\n        .map(|resource| resource.key.clone())\n        .collect::<HashSet<_>>();\n    Ok(actual == expected)\n}\n\nfn snapshot_resource_keys_for_plan(plan: &SyncPlan) -> anyhow::Result<HashSet<String>> {\n    let root = plan.root_hex();\n    let mut keys = HashSet::new();\n    for object in plan.ordered() {\n        let object_hex = hex::encode(object.object_key);\n        let content_hex = hex::encode(object.content_sha256);\n        let base = format!("snapshots/{root}/objects/{object_hex}/{content_hex}");\n        keys.insert(format!("{base}/{}", object.kind.manifest_name()));\n        match object.kind {\n            BlobKind::Folder => {}\n            BlobKind::File => {\n                keys.insert(format!("{base}/payload"));\n            }\n            BlobKind::Video => {\n                for chunk_path in &object.chunk_paths {\n                    let name = chunk_path\n                        .file_name()\n                        .and_then(|name| name.to_str())\n                        .ok_or_else(|| {\n                            anyhow::anyhow!(\n                                "Cloud Node video chunk path has no UTF-8 file name: {}",\n                                chunk_path.display()\n                            )\n                        })?;\n                    let chunk = name.strip_suffix(".chunk").ok_or_else(|| {\n                        anyhow::anyhow!(\n                            "Cloud Node video chunk path has invalid suffix: {}",\n                            chunk_path.display()\n                        )\n                    })?;\n                    validate_hash(chunk, "video chunk hash")?;\n                    keys.insert(format!("{base}/chunks/{chunk}.chunk"));\n                }\n            }\n        }\n    }\n    Ok(keys)\n}\n\n'''
          if 'fn snapshot_matches_plan(' not in text:
              if validate_anchor not in text:
                  raise SystemExit('validate snapshot anchor not found')
              text = text.replace(validate_anchor, helpers + validate_anchor, 1)

          payload_anchor = '''            TransferResource::FilePayload => {\n                if !manifests.contains(&identity) {\n'''
          payload_replacement = '''            TransferResource::FilePayload => {\n                if resource.resource_sha256 != resource.content_sha256 {\n                    anyhow::bail!(\n                        "Cloud Node provider file payload hash must match its content hash"\n                    );\n                }\n                if !manifests.contains(&identity) {\n'''
          if 'file payload hash must match its content hash' not in text:
              if payload_anchor not in text:
                  raise SystemExit('file payload validation anchor not found')
              text = text.replace(payload_anchor, payload_replacement, 1)

          test_anchor = '''    #[test]\n    fn provider_snapshot_requires_canonical_resource_paths() {\n'''
          tests = '''    fn matching_file_sync_plan() -> SyncPlan {\n        SyncPlan {\n            root_sha256: [0x11; 32],\n            folders: Vec::new(),\n            videos: Vec::new(),\n            files: vec![crate::sync::SyncObject {\n                kind: BlobKind::File,\n                object_key: [0x22; 32],\n                content_sha256: [0x33; 32],\n                logical_path: "db/users.db".into(),\n                logical_size: 0,\n                manifest_path: PathBuf::from("unused/file.blob.cn"),\n                payload_path: Some(PathBuf::from("unused/payload")),\n                chunk_paths: Vec::new(),\n            }],\n        }\n    }\n\n    #[test]\n    fn existing_provider_snapshot_must_match_sync_plan_resources() {\n        let plan = matching_file_sync_plan();\n        let snapshot = valid_file_provider_snapshot();\n        validate_snapshot(&snapshot).unwrap();\n        assert!(snapshot_matches_plan(&snapshot, &plan).unwrap());\n\n        let mut poisoned = snapshot.clone();\n        let object = "55".repeat(32);\n        let content = "33".repeat(32);\n        for resource in &mut poisoned.resources {\n            resource.object_key = object.clone();\n            resource.key = match TransferResource::try_from(resource.resource).unwrap() {\n                TransferResource::Manifest => format!(\n                    "snapshots/{}/objects/{object}/{content}/{}",\n                    poisoned.root_sha256,\n                    BlobKind::File.manifest_name()\n                ),\n                TransferResource::FilePayload => format!(\n                    "snapshots/{}/objects/{object}/{content}/payload",\n                    poisoned.root_sha256\n                ),\n                TransferResource::VideoChunk => unreachable!(),\n            };\n        }\n        validate_snapshot(&poisoned).unwrap();\n        assert!(!snapshot_matches_plan(&poisoned, &plan).unwrap());\n    }\n\n    #[test]\n    fn provider_snapshot_file_payload_hash_matches_content() {\n        let mut snapshot = valid_file_provider_snapshot();\n        snapshot.resources[1].resource_sha256 = "66".repeat(32);\n        assert!(validate_snapshot(&snapshot).is_err());\n    }\n\n'''
          if 'fn existing_provider_snapshot_must_match_sync_plan_resources()' not in text:
              if test_anchor not in text:
                  raise SystemExit('provider snapshot test anchor not found')
              text = text.replace(test_anchor, tests + test_anchor, 1)
          path.write_text(text)
          PY
      - name: Format
        working-directory: engine
        run: cargo fmt --all
      - name: Clippy
        working-directory: engine
        run: cargo clippy -p cloud-node --all-targets --all-features --locked -- -D warnings
      - name: Test Cloud Node
        working-directory: engine
        run: cargo test -p cloud-node --all-features --locked
      - name: Commit BUG-CN-PROV-028
        run: |
          rm -f .github/workflows/one-shot-cloud-node-provider-existing-snapshot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "FIX | BUG-CN-PROV-028 reject mismatched existing provider snapshots"
          git push origin HEAD:work/cloud-node-provider-hardening-2
