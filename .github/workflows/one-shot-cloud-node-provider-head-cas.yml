name: One-shot Cloud Node provider atomic HEAD publish

on:
  push:
    branches:
      - work/cloud-node-provider-hardening

permissions:
  contents: write

jobs:
  provider-head-cas:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Apply provider native HEAD CAS
        run: python3 .github/scripts/apply-cloud-node-provider-head-cas.py
      - name: Format
        working-directory: engine
        run: cargo fmt --all
      - name: Clippy
        working-directory: engine
        run: cargo clippy -p cloud-node --all-targets --all-features --locked -- -D warnings
      - name: Test Cloud Node
        working-directory: engine
        run: cargo test -p cloud-node --all-features --locked
      - name: Commit BUG-CN-PROV-018
        run: |
          rm -f .github/workflows/one-shot-cloud-node-provider-head-cas.yml
          rm -f .github/scripts/apply-cloud-node-provider-head-cas.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "FIX | BUG-CN-PROV-018 atomically publish provider HEAD"
          git push origin HEAD:work/cloud-node-provider-hardening
