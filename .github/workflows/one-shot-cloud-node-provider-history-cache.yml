name: One-shot Cloud Node provider history transaction cache

on:
  push:
    branches:
      - work/cloud-node-provider-hardening-2

permissions:
  contents: write

jobs:
  provider-history-cache:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Reuse remote history reads within one sync
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('engine/crates/cloud-node/src/provider_sync.rs')
          text = path.read_text()

          if 'use std::collections::{HashMap, HashSet};' not in text:
              anchor = 'use std::collections::HashSet;\n'
              if anchor not in text:
                  raise SystemExit('collections import anchor not found')
              text = text.replace(anchor, 'use std::collections::{HashMap, HashSet};\n', 1)

          const_anchor = 'const PROVIDER_RECOVERY_OWNER_PREFIX: &str = "provider.";\n\n'
          if 'type RemoteCommitCache =' not in text:
              if const_anchor not in text:
                  raise SystemExit('provider constants anchor not found')
              text = text.replace(
                  const_anchor,
                  const_anchor + 'type RemoteCommitCache = HashMap<String, HistoryCommit>;\n\n',
                  1,
              )

          cache_block = '''    let mut remote_cache = RemoteCommitCache::new();\n    if let Some(remote_head) = remote.as_ref() {\n        remote_cache.insert(remote_head.id.clone(), remote_head.clone());\n    }\n'''

          status_anchor = '''    let client = ProviderClient::new(provider)?;\n    let remote = remote_head(&client).await?;\n    let plan = store.sync_plan()?;\n'''
          status_replacement = '''    let client = ProviderClient::new(provider)?;\n    let remote = remote_head(&client).await?;\n''' + cache_block + '''    let plan = store.sync_plan()?;\n'''
          if text.count('let mut remote_cache = RemoteCommitCache::new();') == 0:
              if status_anchor not in text:
                  raise SystemExit('provider_status remote-head anchor not found')
              text = text.replace(status_anchor, status_replacement, 1)

          sync_anchor = '''    let client = ProviderClient::new(provider)?;\n    let remote = remote_head(&client).await?;\n    let recovery_owner = provider_recovery_owner(&provider.namespace);\n'''
          sync_replacement = '''    let client = ProviderClient::new(provider)?;\n    let remote = remote_head(&client).await?;\n''' + cache_block + '''    let recovery_owner = provider_recovery_owner(&provider.namespace);\n'''
          if text.count('let mut remote_cache = RemoteCommitCache::new();') == 1:
              if sync_anchor not in text:
                  raise SystemExit('synchronize_provider remote-head anchor not found')
              text = text.replace(sync_anchor, sync_replacement, 1)

          if text.count('let mut remote_cache = RemoteCommitCache::new();') != 2:
              raise SystemExit('expected one remote history cache per status/sync transaction')

          old_status_call = '''    status_from_heads(&history, &client, local_head, remote, local_root).await\n'''
          new_status_call = '''    status_from_heads(\n        &history,\n        &client,\n        local_head,\n        remote,\n        local_root,\n        &mut remote_cache,\n    )\n    .await\n'''
          if old_status_call in text:
              text = text.replace(old_status_call, new_status_call, 1)

          old_sync_status = '''    let before = status_from_heads(\n        &history,\n        &client,\n        local_head.clone(),\n        remote.clone(),\n        local_root,\n    )\n    .await?;\n'''
          new_sync_status = '''    let before = status_from_heads(\n        &history,\n        &client,\n        local_head.clone(),\n        remote.clone(),\n        local_root,\n        &mut remote_cache,\n    )\n    .await?;\n'''
          if old_sync_status in text:
              text = text.replace(old_sync_status, new_sync_status, 1)

          direct_import = 'import_remote_history(&history, &client, remote_head).await?;'
          if direct_import in text:
              text = text.replace(
                  direct_import,
                  'import_remote_history(&history, &client, remote_head, &mut remote_cache).await?;',
                  1,
              )

          untracked_pull = 'pull_provider_state(&client, &history, store, remote_head, &recovery_owner).await?;'
          if untracked_pull in text:
              text = text.replace(
                  untracked_pull,
                  '''pull_provider_state(\n                    &client,\n                    &history,\n                    store,\n                    remote_head,\n                    &recovery_owner,\n                    &mut remote_cache,\n                )\n                .await?;''',
                  1,
              )

          remote_pull = 'pull_provider_state(&client, &history, store, &remote, &recovery_owner).await?;'
          text = text.replace(
              remote_pull,
              '''pull_provider_state(\n                &client,\n                &history,\n                store,\n                &remote,\n                &recovery_owner,\n                &mut remote_cache,\n            )\n            .await?;''',
          )

          status_sig = '''async fn status_from_heads(\n    history: &LocalHistory,\n    client: &ProviderClient,\n    local: HistoryCommit,\n    remote: Option<HistoryCommit>,\n    local_root: String,\n) -> anyhow::Result<ProviderSyncStatus> {\n'''
          status_sig_new = '''async fn status_from_heads(\n    history: &LocalHistory,\n    client: &ProviderClient,\n    local: HistoryCommit,\n    remote: Option<HistoryCommit>,\n    local_root: String,\n    remote_cache: &mut RemoteCommitCache,\n) -> anyhow::Result<ProviderSyncStatus> {\n'''
          if status_sig in text:
              text = text.replace(status_sig, status_sig_new, 1)
          text = text.replace(
              'remote_is_ancestor(client, &local.id, &remote.id).await?',
              'remote_is_ancestor(client, &local.id, &remote.id, remote_cache).await?',
              1,
          )

          pull_sig = '''async fn pull_provider_state(\n    client: &ProviderClient,\n    history: &LocalHistory,\n    store: &CloudNodeStore,\n    remote_head: &HistoryCommit,\n    recovery_owner: &str,\n) -> anyhow::Result<()> {\n    restore_snapshot(client, store, &remote_head.snapshot_root, recovery_owner).await?;\n    import_remote_history(history, client, remote_head).await\n}\n'''
          pull_sig_new = '''async fn pull_provider_state(\n    client: &ProviderClient,\n    history: &LocalHistory,\n    store: &CloudNodeStore,\n    remote_head: &HistoryCommit,\n    recovery_owner: &str,\n    remote_cache: &mut RemoteCommitCache,\n) -> anyhow::Result<()> {\n    restore_snapshot(client, store, &remote_head.snapshot_root, recovery_owner).await?;\n    import_remote_history(history, client, remote_head, remote_cache).await\n}\n'''
          if pull_sig in text:
              text = text.replace(pull_sig, pull_sig_new, 1)

          import_sig = '''async fn import_remote_history(\n    history: &LocalHistory,\n    client: &ProviderClient,\n    remote_head: &HistoryCommit,\n) -> anyhow::Result<()> {\n    let missing = remote_chain_until_local(history, client, remote_head).await?;\n'''
          import_sig_new = '''async fn import_remote_history(\n    history: &LocalHistory,\n    client: &ProviderClient,\n    remote_head: &HistoryCommit,\n    remote_cache: &mut RemoteCommitCache,\n) -> anyhow::Result<()> {\n    let missing = remote_chain_until_local(history, client, remote_head, remote_cache).await?;\n'''
          if import_sig in text:
              text = text.replace(import_sig, import_sig_new, 1)

          chain_sig = '''async fn remote_chain_until_local(\n    history: &LocalHistory,\n    client: &ProviderClient,\n    start: &HistoryCommit,\n) -> anyhow::Result<Vec<HistoryCommit>> {\n'''
          chain_sig_new = '''async fn remote_chain_until_local(\n    history: &LocalHistory,\n    client: &ProviderClient,\n    start: &HistoryCommit,\n    remote_cache: &mut RemoteCommitCache,\n) -> anyhow::Result<Vec<HistoryCommit>> {\n'''
          if chain_sig in text:
              text = text.replace(chain_sig, chain_sig_new, 1)
          text = text.replace(
              'current = fetch_remote_commit(client, parent).await?.ok_or_else(|| {',
              '''current = fetch_remote_commit_cached(client, parent, remote_cache)\n            .await?\n            .ok_or_else(|| {''',
              1,
          )

          ancestor_sig = '''async fn remote_is_ancestor(\n    client: &ProviderClient,\n    ancestor: &str,\n    descendant: &str,\n) -> anyhow::Result<bool> {\n'''
          ancestor_sig_new = '''async fn remote_is_ancestor(\n    client: &ProviderClient,\n    ancestor: &str,\n    descendant: &str,\n    remote_cache: &mut RemoteCommitCache,\n) -> anyhow::Result<bool> {\n'''
          if ancestor_sig in text:
              text = text.replace(ancestor_sig, ancestor_sig_new, 1)
          text = text.replace(
              'let Some(commit) = fetch_remote_commit(client, &current).await? else {',
              'let Some(commit) = fetch_remote_commit_cached(client, &current, remote_cache).await? else {',
              1,
          )

          fetch_anchor = '''async fn fetch_remote_commit(\n    client: &ProviderClient,\n    id: &str,\n) -> anyhow::Result<Option<HistoryCommit>> {\n'''
          cached_helper = '''async fn fetch_remote_commit_cached(\n    client: &ProviderClient,\n    id: &str,\n    remote_cache: &mut RemoteCommitCache,\n) -> anyhow::Result<Option<HistoryCommit>> {\n    if let Some(commit) = remote_cache.get(id) {\n        return Ok(Some(commit.clone()));\n    }\n    let commit = fetch_remote_commit(client, id).await?;\n    if let Some(commit) = commit.as_ref() {\n        remote_cache.insert(commit.id.clone(), commit.clone());\n    }\n    Ok(commit)\n}\n\n'''
          if 'async fn fetch_remote_commit_cached(' not in text:
              if fetch_anchor not in text:
                  raise SystemExit('fetch_remote_commit anchor not found')
              text = text.replace(fetch_anchor, cached_helper + fetch_anchor, 1)

          test_anchor = '''    #[test]\n    fn provider_sync_lock_serializes_same_namespace() {\n'''
          test = '''    #[tokio::test]\n    async fn remote_commit_cache_serves_known_history_without_network() {\n        let settings: crate::config::ProviderSettings = serde_json::from_value(serde_json::json!({\n            "kind":"http",\n            "namespace":"prod",\n            "bucket":"rbe",\n            "endpoint":"http://127.0.0.1:9",\n            "auth":{"mode":"none"}\n        }))\n        .unwrap();\n        let client = ProviderClient::new(&settings).unwrap();\n        let commit = new_commit("remote-node", None, &"11".repeat(32)).unwrap();\n        let mut cache = RemoteCommitCache::new();\n        cache.insert(commit.id.clone(), commit.clone());\n\n        let fetched = fetch_remote_commit_cached(&client, &commit.id, &mut cache)\n            .await\n            .unwrap()\n            .unwrap();\n        assert_eq!(fetched, commit);\n    }\n\n'''
          if 'fn remote_commit_cache_serves_known_history_without_network()' not in text:
              if test_anchor not in text:
                  raise SystemExit('provider sync test anchor not found')
              text = text.replace(test_anchor, test + test_anchor, 1)

          required = [
              'type RemoteCommitCache =',
              'fetch_remote_commit_cached(',
              'remote_cache: &mut RemoteCommitCache',
              'remote_commit_cache_serves_known_history_without_network',
          ]
          for marker in required:
              if marker not in text:
                  raise SystemExit(f'missing expected provider history cache marker: {marker}')

          path.write_text(text)
          PY
      - name: Format
        working-directory: engine
        run: cargo fmt --all
      - name: Clippy
        working-directory: engine
        run: cargo clippy -p cloud-node --all-targets --all-features --locked -- -D warnings
      - name: Test Cloud Node
        working-directory: engine
        run: cargo test -p cloud-node --all-features --locked
      - name: Commit BUG-CN-PROV-029
        run: |
          rm -f .github/workflows/one-shot-cloud-node-provider-history-cache.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "FIX | BUG-CN-PROV-029 reuse provider history reads during sync"
          git push origin HEAD:work/cloud-node-provider-hardening-2
