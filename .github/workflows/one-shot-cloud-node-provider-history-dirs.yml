name: One-shot Cloud Node provider durable history directories

on:
  push:
    branches:
      - work/cloud-node-provider-hardening-2

permissions:
  contents: write

jobs:
  provider-history-dirs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Durably create provider history directories
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('engine/crates/cloud-node/src/provider_sync.rs')
          text = path.read_text()

          if 'use crate::durable;' not in text:
              anchor = 'use crate::config::{validate_node_id, CloudNodeSettings, ProviderConflictPolicy};\n'
              if anchor not in text:
                  raise SystemExit('provider config import anchor not found')
              text = text.replace(anchor, anchor + 'use crate::durable;\n', 1)

          lock_old = '''        fs::create_dir_all(&root)?;\n        let path = root.join(".sync.lock");\n'''
          lock_new = '''        durable::create_dir_all(&root)?;\n        let path = root.join(".sync.lock");\n'''
          if lock_old in text:
              text = text.replace(lock_old, lock_new, 1)

          commits_old = '''        fs::create_dir_all(&self.commits)?;\n        let path = self.commits.join(format!("{}.json", commit.id));\n'''
          commits_new = '''        durable::create_dir_all(&self.commits)?;\n        let path = self.commits.join(format!("{}.json", commit.id));\n'''
          if commits_old in text:
              text = text.replace(commits_old, commits_new, 1)

          required = [
              'use crate::durable;',
              'durable::create_dir_all(&root)?;',
              'durable::create_dir_all(&self.commits)?;',
          ]
          for marker in required:
              if marker not in text:
                  raise SystemExit(f'missing durable provider history marker: {marker}')
          path.write_text(text)

          doc = Path('doc/cloud-node.md')
          docs = doc.read_text()
          marker = '''Local provider-history JSON metadata is treated as untrusted disk input when read back. `HEAD.json` and individual commit files are bounded to 64 KiB before JSON decoding, preventing a corrupted or externally replaced history file from causing unbounded memory allocation during status or synchronization.\n'''
          addition = marker + '''Provider-history directories are created through Cloud Node's durable directory helper before commits or lock files are placed inside them, so newly created namespace/commit directory entries receive the same parent-directory sync treatment used by the recovery/store paths on platforms that support directory fsync.\n'''
          if "newly created namespace/commit directory entries" not in docs:
              if marker not in docs:
                  raise SystemExit('provider history bounds docs anchor not found')
              docs = docs.replace(marker, addition, 1)
              doc.write_text(docs)
          PY
      - name: Format
        working-directory: engine
        run: cargo fmt --all
      - name: Clippy
        working-directory: engine
        run: cargo clippy -p cloud-node --all-targets --all-features --locked -- -D warnings
      - name: Test Cloud Node
        working-directory: engine
        run: cargo test -p cloud-node --all-features --locked
      - name: Commit BUG-CN-PROV-032
        run: |
          rm -f .github/workflows/one-shot-cloud-node-provider-history-dirs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "FIX | BUG-CN-PROV-032 durably create provider history directories"
          git push origin HEAD:work/cloud-node-provider-hardening-2
