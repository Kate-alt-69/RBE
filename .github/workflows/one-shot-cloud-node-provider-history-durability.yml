name: One-shot Cloud Node provider history durability

on:
  push:
    branches:
      - work/cloud-node-providers-latest

permissions:
  contents: write

jobs:
  provider-history:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Reconcile latest main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-commit --no-ff origin/main
      - name: Apply durable provider history writes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          cargo = Path('engine/crates/cloud-node/Cargo.toml')
          text = cargo.read_text()
          needle = '[dependencies]\n'
          replacement = '[dependencies]\natomic-io = { path = "../../../atomic-io" }\n'
          if 'atomic-io = { path = "../../../atomic-io" }' not in text:
              if needle not in text:
                  raise SystemExit('cloud-node dependency anchor not found')
              text = text.replace(needle, replacement, 1)
              cargo.write_text(text)

          src = Path('engine/crates/cloud-node/src/provider_sync.rs')
          text = src.read_text()
          if 'use atomic_io::AtomicIo;' not in text:
              anchor = 'use serde::{Deserialize, Serialize};\n'
              if anchor not in text:
                  raise SystemExit('provider_sync import anchor not found')
              text = text.replace(anchor, 'use atomic_io::AtomicIo;\n' + anchor, 1)

          old = '''fn atomic_json(path: &Path, value: &impl Serialize) -> anyhow::Result<()> {
              let parent = path
                  .parent()
                  .ok_or_else(|| anyhow::anyhow!("Cloud Node history path has no parent"))?;
              fs::create_dir_all(parent)?;
              let temp = parent.join(format!(
                  ".{}.{}.tmp",
                  path.file_name()
                      .and_then(|name| name.to_str())
                      .unwrap_or("history"),
                  std::process::id()
              ));
              fs::write(&temp, serde_json::to_vec(value)?)?;
              if path.exists() {
                  fs::remove_file(path)?;
              }
              fs::rename(temp, path)?;
              Ok(())
          }
          '''
          new = '''fn atomic_json(path: &Path, value: &impl Serialize) -> anyhow::Result<()> {
              let bytes = serde_json::to_vec(value)?;
              AtomicIo::new().write_atomic(path, &bytes).map_err(|error| {
                  anyhow::anyhow!(
                      "failed to durably replace Cloud Node provider history {}: {error}",
                      path.display()
                  )
              })?;
              Ok(())
          }
          '''
          if old not in text:
              raise SystemExit('provider_sync atomic_json anchor not found')
          text = text.replace(old, new, 1)
          src.write_text(text)
          PY
      - name: Format merged tree
        working-directory: engine
        run: cargo fmt --all
      - name: Cloud Node Clippy
        working-directory: engine
        run: cargo clippy -p cloud-node --all-targets --all-features --locked -- -D warnings
      - name: Cloud Node tests
        working-directory: engine
        run: cargo test -p cloud-node --all-features --locked
      - name: Commit BUG-CN-PROV-010
        run: |
          rm -f .github/workflows/one-shot-cloud-node-provider-history-durability.yml
          git add -A
          git diff --cached --check
          git commit -m "FIX | BUG-CN-PROV-010 durably replace provider history"
          git push origin HEAD:work/cloud-node-providers-latest
      - name: Diagnose full workspace tests
        working-directory: engine
        run: timeout 12m cargo test --workspace --all-features --locked -- --nocapture
