name: One-shot Cloud Node provider history node-id validation

on:
  push:
    branches:
      - work/cloud-node-provider-hardening

permissions:
  contents: write

jobs:
  provider-history-node-id:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Validate remote provider history node identities
        run: |
          python3 - <<'PY'
          from pathlib import Path

          config = Path('engine/crates/cloud-node/src/config.rs')
          text = config.read_text()
          anchor = 'fn validate_node_id(value: &str) -> anyhow::Result<()> {'
          if 'pub(crate) fn validate_node_id' not in text:
              if text.count(anchor) != 1:
                  raise SystemExit('validate_node_id anchor not found exactly once')
              text = text.replace(anchor, 'pub(crate) fn validate_node_id(value: &str) -> anyhow::Result<()> {', 1)
          config.write_text(text)

          path = Path('engine/crates/cloud-node/src/provider_sync.rs')
          text = path.read_text()
          old_import = 'use crate::config::{CloudNodeSettings, ProviderConflictPolicy};'
          new_import = 'use crate::config::{validate_node_id, CloudNodeSettings, ProviderConflictPolicy};'
          if 'validate_node_id, CloudNodeSettings' not in text:
              if text.count(old_import) != 1:
                  raise SystemExit('provider_sync config import anchor not found exactly once')
              text = text.replace(old_import, new_import, 1)

          anchor = '''    validate_hash(&commit.id, "history commit id")?;\n    validate_hash(&commit.snapshot_root, "snapshot root")?;\n'''
          replacement = '''    validate_hash(&commit.id, "history commit id")?;\n    validate_hash(&commit.snapshot_root, "snapshot root")?;\n    validate_node_id(&commit.node_id)?;\n'''
          if 'validate_node_id(&commit.node_id)?;' not in text:
              if text.count(anchor) != 1:
                  raise SystemExit('validate_commit anchor not found exactly once')
              text = text.replace(anchor, replacement, 1)

          test_anchor = '''    #[test]\n    fn provider_cache_owner_is_stable_and_path_safe() {\n'''
          test = '''    #[test]\n    fn provider_history_rejects_invalid_remote_node_identity() {\n        let node_id = "../remote";\n        let snapshot_root = "11".repeat(32);\n        let created_unix_ms = 7;\n        let commit = HistoryCommit {\n            format_version: HISTORY_VERSION,\n            id: commit_id(node_id, None, &snapshot_root, created_unix_ms),\n            parent: None,\n            snapshot_root,\n            node_id: node_id.to_owned(),\n            created_unix_ms,\n        };\n        assert!(validate_commit(&commit).is_err());\n    }\n\n'''
          if 'fn provider_history_rejects_invalid_remote_node_identity()' not in text:
              if text.count(test_anchor) != 1:
                  raise SystemExit('provider_sync test anchor not found exactly once')
              text = text.replace(test_anchor, test + test_anchor, 1)
          path.write_text(text)
          PY
      - name: Format
        working-directory: engine
        run: cargo fmt --all
      - name: Clippy
        working-directory: engine
        run: cargo clippy -p cloud-node --all-targets --all-features --locked -- -D warnings
      - name: Test Cloud Node
        working-directory: engine
        run: cargo test -p cloud-node --all-features --locked
      - name: Commit BUG-CN-PROV-020
        run: |
          rm -f .github/workflows/one-shot-cloud-node-provider-history-node-id.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "FIX | BUG-CN-PROV-020 validate provider history node ids"
          git push origin HEAD:work/cloud-node-provider-hardening
