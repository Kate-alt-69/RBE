                      if plan.object_count() == 0 {
          '''
          replace_once(old_sync, new_sync, "provider synchronize repair")

          anchor = '''fn provider_recovery_owner(namespace: &str) -> String {
              format!("{PROVIDER_RECOVERY_OWNER_PREFIX}{namespace}")
          }

          '''
          helper = '''fn should_adopt_matching_remote_history(
              local_head: Option<&HistoryCommit>,
              local_root: &str,
              remote_head: &HistoryCommit,
          ) -> bool {
              remote_head.snapshot_root == local_root
                  && local_head
                      .map(|head| head.snapshot_root.as_str() != local_root)
                      .unwrap_or(true)
          }

          '''
          replace_once(anchor, anchor + helper, "history repair helper")

          test_anchor = '''    #[test]
              fn snapshot_validation_rejects_phase_regression() {
          '''
          tests = '''    #[test]
              fn matching_remote_root_repairs_only_stale_or_missing_history() {
                  let live_root = "11".repeat(32);
                  let remote = HistoryCommit {
                      format_version: HISTORY_VERSION,
                      id: "22".repeat(32),
                      parent: None,
                      snapshot_root: live_root.clone(),
                      node_id: "remote".into(),
                      created_unix_ms: 1,
                  };
                  let stale = HistoryCommit {
                      format_version: HISTORY_VERSION,
                      id: "33".repeat(32),
                      parent: None,
                      snapshot_root: "44".repeat(32),
                      node_id: "local".into(),
                      created_unix_ms: 2,
                  };
                  let same_content_other_history = HistoryCommit {
                      format_version: HISTORY_VERSION,
                      id: "55".repeat(32),
                      parent: None,
                      snapshot_root: live_root.clone(),
                      node_id: "local".into(),
                      created_unix_ms: 3,
                  };
                  let other_remote = HistoryCommit {
                      snapshot_root: "66".repeat(32),
                      ..remote.clone()
                  };

                  assert!(should_adopt_matching_remote_history(None, &live_root, &remote));
                  assert!(should_adopt_matching_remote_history(
                      Some(&stale),
                      &live_root,
                      &remote
                  ));
                  assert!(!should_adopt_matching_remote_history(
                      Some(&same_content_other_history),
                      &live_root,
                      &remote
                  ));
                  assert!(!should_adopt_matching_remote_history(
                      Some(&stale),
                      &live_root,
                      &other_remote
                  ));
              }

          '''
          replace_once(test_anchor, tests + test_anchor, "history repair tests")

          path.write_text(text)
          PY
      - name: Format
        working-directory: engine
        run: cargo fmt --all
      - name: Validate Cloud Node
        working-directory: engine
        run: |
          cargo fmt --all -- --check
          cargo clippy -p cloud-node --all-targets --locked -- -D warnings
          cargo test -p cloud-node --locked
      - name: Commit repair
        shell: bash
        run: |
          rm .github/workflows/one-shot-cloud-node-provider-history-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "FIX | BUG-CN-PROV-007 self-heal provider history after interrupted pulls"
          git push origin HEAD:work/cloud-node-providers-latest
