name: One-shot Cloud Node provider history repair

on:
  push:
    branches:
      - work/cloud-node-providers-latest

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Repair provider history reconciliation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("engine/crates/cloud-node/src/provider_sync.rs")
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              text = text.replace(old, new, 1)

