name: One-shot Cloud Node immutable provider objects

on:
  push:
    branches:
      - work/cloud-node-provider-hardening-2

permissions:
  contents: write

jobs:
  provider-immutable-objects:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Protect immutable provider objects
        run: |
          python3 .github/apply_prov038.py
          python3 .github/cleanup_prov038.py
      - name: Format
        working-directory: engine
        run: cargo fmt --all
      - name: Clippy
        working-directory: engine
        run: cargo clippy -p cloud-node --all-targets --all-features --locked -- -D warnings
      - name: Test Cloud Node
        working-directory: engine
        run: cargo test -p cloud-node --all-features --locked
      - name: Commit BUG-CN-PROV-038
        run: |
          rm -f .github/workflows/one-shot-cloud-node-provider-immutable-objects.yml
          rm -f .github/apply_prov038.py
          rm -f .github/cleanup_prov038.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "FIX | BUG-CN-PROV-038 protect immutable provider objects"
          git push origin HEAD:work/cloud-node-provider-hardening-2
