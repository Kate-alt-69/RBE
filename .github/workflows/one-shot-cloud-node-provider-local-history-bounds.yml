name: One-shot Cloud Node provider local history bounds

on:
  push:
    branches:
      - work/cloud-node-provider-hardening-2

permissions:
  contents: write

jobs:
  provider-local-history-bounds:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Bound local provider history metadata reads
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('engine/crates/cloud-node/src/provider_sync.rs')
          text = path.read_text()

          if 'use std::io::Read;' not in text:
              anchor = 'use std::fs;\n'
              if anchor not in text:
                  raise SystemExit('fs import anchor not found')
              text = text.replace(anchor, anchor + 'use std::io::Read;\n', 1)

          const_anchor = 'const MAX_HISTORY_DEPTH: usize = 100_000;\n'
          if 'MAX_LOCAL_HISTORY_METADATA_BYTES' not in text:
              if const_anchor not in text:
                  raise SystemExit('history depth anchor not found')
              text = text.replace(
                  const_anchor,
                  const_anchor + 'const MAX_LOCAL_HISTORY_METADATA_BYTES: u64 = 64 * 1024;\n',
                  1,
              )

          old_head = '''        let pointer: HeadPointer = serde_json::from_slice(&fs::read(&self.head)?)?;\n'''
          new_head = '''        let pointer: HeadPointer =\n            serde_json::from_slice(&read_local_history_metadata(&self.head)?)?;\n'''
          if old_head in text:
              text = text.replace(old_head, new_head, 1)

          old_commit = '''        let commit: HistoryCommit = serde_json::from_slice(&fs::read(&path).map_err(|error| {\n            anyhow::anyhow!(\n                "failed to read Cloud Node local history commit {}: {error}",\n                path.display()\n            )\n        })?)?;\n'''
          new_commit = '''        let commit: HistoryCommit =\n            serde_json::from_slice(&read_local_history_metadata(&path).map_err(|error| {\n                anyhow::anyhow!(\n                    "failed to read Cloud Node local history commit {}: {error}",\n                    path.display()\n                )\n            })?)?;\n'''
          if old_commit in text:
              text = text.replace(old_commit, new_commit, 1)

          helper_anchor = '''fn atomic_json(path: &Path, value: &impl Serialize) -> anyhow::Result<()> {\n'''
          helper = '''fn read_local_history_metadata(path: &Path) -> anyhow::Result<Vec<u8>> {\n    let file = fs::File::open(path).map_err(|error| {\n        anyhow::anyhow!(\n            "failed to open Cloud Node local history metadata {}: {error}",\n            path.display()\n        )\n    })?;\n    if file.metadata()?.len() > MAX_LOCAL_HISTORY_METADATA_BYTES {\n        anyhow::bail!(\n            "Cloud Node local history metadata {} exceeds {} bytes",\n            path.display(),\n            MAX_LOCAL_HISTORY_METADATA_BYTES\n        );\n    }\n    let mut bytes = Vec::with_capacity(MAX_LOCAL_HISTORY_METADATA_BYTES as usize);\n    file.take(MAX_LOCAL_HISTORY_METADATA_BYTES + 1)\n        .read_to_end(&mut bytes)?;\n    if bytes.len() as u64 > MAX_LOCAL_HISTORY_METADATA_BYTES {\n        anyhow::bail!(\n            "Cloud Node local history metadata {} exceeds {} bytes",\n            path.display(),\n            MAX_LOCAL_HISTORY_METADATA_BYTES\n        );\n    }\n    Ok(bytes)\n}\n\n'''
          if 'fn read_local_history_metadata(' not in text:
              if helper_anchor not in text:
                  raise SystemExit('atomic_json anchor not found')
              text = text.replace(helper_anchor, helper + helper_anchor, 1)

          test_anchor = '''    #[test]\n    fn provider_sync_lock_serializes_same_namespace() {\n'''
          test = '''    #[test]\n    fn local_provider_history_metadata_reads_are_bounded() {\n        let root = test_root();\n        fs::create_dir_all(&root).unwrap();\n        let small = root.join("small.json");\n        fs::write(&small, b"{}").unwrap();\n        assert_eq!(read_local_history_metadata(&small).unwrap(), b"{}");\n\n        let oversized = root.join("oversized.json");\n        fs::write(\n            &oversized,\n            vec![b'x'; (MAX_LOCAL_HISTORY_METADATA_BYTES + 1) as usize],\n        )\n        .unwrap();\n        assert!(read_local_history_metadata(&oversized).is_err());\n        fs::remove_dir_all(root).unwrap();\n    }\n\n'''
          if 'fn local_provider_history_metadata_reads_are_bounded()' not in text:
              if test_anchor not in text:
                  raise SystemExit('provider sync lock test anchor not found')
              text = text.replace(test_anchor, test + test_anchor, 1)

          required = [
              'MAX_LOCAL_HISTORY_METADATA_BYTES',
              'read_local_history_metadata(&self.head)',
              'read_local_history_metadata(&path)',
              'fn local_provider_history_metadata_reads_are_bounded()',
          ]
          for marker in required:
              if marker not in text:
                  raise SystemExit(f'missing local history bound marker: {marker}')
          path.write_text(text)

          doc = Path('doc/cloud-node.md')
          docs = doc.read_text()
          marker = '''Provider mode maintains a local commit chain under `provider-history/<namespace>/`. Each history commit identifies a complete Cloud Node snapshot root and its parent commit. The provider stores the immutable snapshot data and history commits plus a mutable `HEAD.json` pointer.\n'''
          addition = marker + '''\nLocal provider-history JSON metadata is treated as untrusted disk input when read back. `HEAD.json` and individual commit files are bounded to 64 KiB before JSON decoding, preventing a corrupted or externally replaced history file from causing unbounded memory allocation during status or synchronization.\n'''
          if 'bounded to 64 KiB before JSON decoding' not in docs:
              if marker not in docs:
                  raise SystemExit('provider history docs anchor not found')
              docs = docs.replace(marker, addition, 1)
              doc.write_text(docs)
          PY
      - name: Format
        working-directory: engine
        run: cargo fmt --all
      - name: Clippy
        working-directory: engine
        run: cargo clippy -p cloud-node --all-targets --all-features --locked -- -D warnings
      - name: Test Cloud Node
        working-directory: engine
        run: cargo test -p cloud-node --all-features --locked
      - name: Commit BUG-CN-PROV-031
        run: |
          rm -f .github/workflows/one-shot-cloud-node-provider-local-history-bounds.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "FIX | BUG-CN-PROV-031 bound local provider history reads"
          git push origin HEAD:work/cloud-node-provider-hardening-2
