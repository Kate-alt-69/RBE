name: One-shot Cloud Node provider main reconcile

on:
  push:
    branches:
      - work/cloud-node-providers-latest

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Merge latest main without committing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-commit --no-ff origin/main
      - name: Remove one-shot helper
        run: rm -f .github/workflows/one-shot-cloud-node-provider-main-reconcile.yml
      - name: Format merged tree
        working-directory: engine
        run: cargo fmt --all
      - name: Workspace Clippy
        working-directory: engine
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Workspace tests
        working-directory: engine
        run: cargo test --workspace --all-features --locked
      - name: Commit reconciled tree
        run: |
          git add -A
          git diff --cached --check
          git commit -m "merge: reconcile Cloud Node providers with main durability"
          git push origin HEAD:work/cloud-node-providers-latest
