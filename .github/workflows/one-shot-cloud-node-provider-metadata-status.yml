name: One-shot Cloud Node provider metadata status ordering

on:
  push:
    branches:
      - work/cloud-node-provider-hardening-2

permissions:
  contents: write

jobs:
  provider-metadata-status:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Handle provider HTTP status before version headers
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('engine/crates/cloud-node/src/provider.rs')
          text = path.read_text()
          old = '''        let version = provider_object_version(self.settings.kind, response.headers())?;\n        let Some(bytes) = response_bytes_limited(response, "download", true, max_bytes).await?\n        else {\n            return Ok(None);\n        };\n        Ok(Some(ProviderMetadataObject { bytes, version }))\n'''
          new = '''        let status = response.status();\n        if status == StatusCode::NOT_FOUND {\n            return Ok(None);\n        }\n        if !status.is_success() {\n            return Err(provider_http_error(response, "download").await);\n        }\n        let version = provider_object_version(self.settings.kind, response.headers())?;\n        let bytes = response_bytes_limited(response, "download", false, max_bytes)\n            .await?\n            .ok_or_else(|| {\n                anyhow::anyhow!("Cloud Node provider successful metadata response disappeared")\n            })?;\n        Ok(Some(ProviderMetadataObject { bytes, version }))\n'''
          if 'successful metadata response disappeared' not in text:
              if old not in text:
                  raise SystemExit('provider metadata response anchor not found')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Format
        working-directory: engine
        run: cargo fmt --all
      - name: Clippy
        working-directory: engine
        run: cargo clippy -p cloud-node --all-targets --all-features --locked -- -D warnings
      - name: Test Cloud Node
        working-directory: engine
        run: cargo test -p cloud-node --all-features --locked
      - name: Commit BUG-CN-PROV-034
        run: |
          rm -f .github/workflows/one-shot-cloud-node-provider-metadata-status.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "FIX | BUG-CN-PROV-034 preserve provider HTTP errors"
          git push origin HEAD:work/cloud-node-provider-hardening-2
