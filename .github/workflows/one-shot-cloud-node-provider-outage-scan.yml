name: One-shot Cloud Node provider outage scan optimization

on:
  push:
    branches:
      - work/cloud-node-provider-hardening-2

permissions:
  contents: write

jobs:
  provider-outage-scan:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Check provider before scanning local snapshot
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('engine/crates/cloud-node/src/provider_sync.rs')
          text = path.read_text()

          old_status = '''    let client = ProviderClient::new(provider)?;\n    let plan = store.sync_plan()?;\n    let local_root = plan.root_hex();\n    let history = LocalHistory::open(store, &provider.namespace)?;\n    let remote = remote_head(&client).await?;\n    let existing_head = history.head()?;\n'''
          new_status = '''    let client = ProviderClient::new(provider)?;\n    let remote = remote_head(&client).await?;\n    let plan = store.sync_plan()?;\n    let local_root = plan.root_hex();\n    let history = LocalHistory::open(store, &provider.namespace)?;\n    let existing_head = history.head()?;\n'''
          if old_status not in text:
              raise SystemExit('provider_status ordering anchor not found')
          text = text.replace(old_status, new_status, 1)

          old_sync = '''    let _sync_lock = ProviderSyncLock::acquire(store, &provider.namespace)?;\n    let client = ProviderClient::new(provider)?;\n    let recovery_owner = provider_recovery_owner(&provider.namespace);\n    let plan = store.sync_plan()?;\n    let local_root = plan.root_hex();\n    let history = LocalHistory::open(store, &provider.namespace)?;\n    let remote = remote_head(&client).await?;\n    let existing_head = history.head()?;\n'''
          new_sync = '''    let _sync_lock = ProviderSyncLock::acquire(store, &provider.namespace)?;\n    let client = ProviderClient::new(provider)?;\n    let remote = remote_head(&client).await?;\n    let recovery_owner = provider_recovery_owner(&provider.namespace);\n    let plan = store.sync_plan()?;\n    let local_root = plan.root_hex();\n    let history = LocalHistory::open(store, &provider.namespace)?;\n    let existing_head = history.head()?;\n'''
          if old_sync not in text:
              raise SystemExit('synchronize_provider ordering anchor not found')
          text = text.replace(old_sync, new_sync, 1)
          path.write_text(text)
          PY
      - name: Format
        working-directory: engine
        run: cargo fmt --all
      - name: Clippy
        working-directory: engine
        run: cargo clippy -p cloud-node --all-targets --all-features --locked -- -D warnings
      - name: Test Cloud Node
        working-directory: engine
        run: cargo test -p cloud-node --all-features --locked
      - name: Commit BUG-CN-PROV-025
        run: |
          rm -f .github/workflows/one-shot-cloud-node-provider-outage-scan.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "FIX | BUG-CN-PROV-025 avoid local snapshot scans during provider outages"
          git push origin HEAD:work/cloud-node-provider-hardening-2
