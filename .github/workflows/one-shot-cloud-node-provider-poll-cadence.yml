name: One-shot Cloud Node provider poll cadence

on:
  push:
    branches:
      - work/cloud-node-provider-hardening

permissions:
  contents: write

jobs:
  provider-poll-cadence:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Separate provider poll and reconnect cadence
        run: |
          python3 - <<'PY'
          from pathlib import Path

          config = Path('engine/crates/cloud-node/src/config.rs')
          text = config.read_text()
          field_anchor = '''    #[serde(default = "default_reconnect_delay_ms")]\n    pub reconnect_delay_ms: u64,\n    #[serde(default = "default_provider_connect_timeout_ms")]\n'''
          field_new = '''    #[serde(default = "default_reconnect_delay_ms")]\n    pub reconnect_delay_ms: u64,\n    #[serde(default = "default_provider_poll_interval_ms")]\n    pub poll_interval_ms: u64,\n    #[serde(default = "default_provider_connect_timeout_ms")]\n'''
          if 'pub poll_interval_ms: u64' not in text:
              if text.count(field_anchor) != 1:
                  raise SystemExit('ProviderSettings reconnect field anchor not found exactly once')
              text = text.replace(field_anchor, field_new, 1)

          validate_anchor = '''    validate_prefix(&provider.prefix)?;\n    validate_reconnect_delay(provider.reconnect_delay_ms)?;\n    validate_provider_timeout("connectTimeoutMs", provider.connect_timeout_ms)?;\n'''
          validate_new = '''    validate_prefix(&provider.prefix)?;\n    validate_reconnect_delay(provider.reconnect_delay_ms)?;\n    validate_provider_poll_interval(provider.poll_interval_ms)?;\n    validate_provider_timeout("connectTimeoutMs", provider.connect_timeout_ms)?;\n'''
          if 'validate_provider_poll_interval(provider.poll_interval_ms)?;' not in text:
              if text.count(validate_anchor) != 1:
                  raise SystemExit('provider validation anchor not found exactly once')
              text = text.replace(validate_anchor, validate_new, 1)

          fn_anchor = '''fn validate_provider_timeout(label: &str, value: u64) -> anyhow::Result<()> {\n'''
          fn_new = '''fn validate_provider_poll_interval(value: u64) -> anyhow::Result<()> {\n    if !(1_000..=3_600_000).contains(&value) {\n        anyhow::bail!("Cloud Node provider pollIntervalMs must be between 1000 and 3600000");\n    }\n    Ok(())\n}\n\n''' + fn_anchor
          if 'fn validate_provider_poll_interval' not in text:
              if text.count(fn_anchor) != 1:
                  raise SystemExit('provider timeout validation anchor not found exactly once')
              text = text.replace(fn_anchor, fn_new, 1)

          default_anchor = '''const fn default_provider_connect_timeout_ms() -> u64 {\n    10_000\n}\n'''
          default_new = '''const fn default_provider_poll_interval_ms() -> u64 {\n    30_000\n}\n''' + default_anchor
          if 'fn default_provider_poll_interval_ms' not in text:
              if text.count(default_anchor) != 1:
                  raise SystemExit('provider timeout default anchor not found exactly once')
              text = text.replace(default_anchor, default_new, 1)

          test_anchor = '''        assert_eq!(provider.connect_timeout_ms, 10_000);\n        assert_eq!(provider.read_timeout_ms, 60_000);\n        validate_provider(&provider).unwrap();\n'''
          test_new = '''        assert_eq!(provider.poll_interval_ms, 30_000);\n        assert_eq!(provider.connect_timeout_ms, 10_000);\n        assert_eq!(provider.read_timeout_ms, 60_000);\n        validate_provider(&provider).unwrap();\n'''
          if 'assert_eq!(provider.poll_interval_ms, 30_000);' not in text:
              if text.count(test_anchor) != 1:
                  raise SystemExit('provider network defaults test anchor not found exactly once')
              text = text.replace(test_anchor, test_new, 1)

          invalid_anchor = '''        invalid = provider.clone();\n        invalid.read_timeout_ms = 300_001;\n        assert!(validate_provider(&invalid).is_err());\n'''
          invalid_new = invalid_anchor + '''        invalid = provider.clone();\n        invalid.poll_interval_ms = 999;\n        assert!(validate_provider(&invalid).is_err());\n'''
          if 'invalid.poll_interval_ms = 999;' not in text:
              if text.count(invalid_anchor) != 1:
                  raise SystemExit('provider network invalid test anchor not found exactly once')
              text = text.replace(invalid_anchor, invalid_new, 1)
          config.write_text(text)

          main = Path('engine/crates/cloud-node/src/main.rs')
          source = main.read_text()
          old = '''        if let Err(error) = result {\n            eprintln!("Cloud Node provider synchronization failed: {error}");\n            if !provider.auto_reconnect {\n                return Err(error);\n            }\n        } else if !provider.auto_reconnect {\n            return Ok(());\n        }\n        tokio::time::sleep(Duration::from_millis(provider.reconnect_delay_ms)).await;\n'''
          new = '''        let delay_ms = match result {\n            Err(error) => {\n                eprintln!("Cloud Node provider synchronization failed: {error}");\n                if !provider.auto_reconnect {\n                    return Err(error);\n                }\n                provider.reconnect_delay_ms\n            }\n            Ok(()) => {\n                if !provider.auto_reconnect {\n                    return Ok(());\n                }\n                provider.poll_interval_ms\n            }\n        };\n        tokio::time::sleep(Duration::from_millis(delay_ms)).await;\n'''
          if 'provider.poll_interval_ms' not in source:
              if source.count(old) != 1:
                  raise SystemExit('provider daemon delay anchor not found exactly once')
              source = source.replace(old, new, 1)
          main.write_text(source)

          doc = Path('doc/cloud-node.md')
          docs = doc.read_text()
          marker = '''Provider HTTP connections are also stall-bounded. `connectTimeoutMs` defaults to `10000` and bounds only connection establishment. `readTimeoutMs` defaults to `60000` and resets after each successful response read, so long streaming transfers can continue indefinitely while a provider that stops producing response data is eventually disconnected. Both values accept 250 through 300000 milliseconds. Cloud Node intentionally does not apply a total request deadline to provider uploads/downloads because that would incorrectly kill valid large transfers.\n'''
          addition = marker + '''\nProvider daemon success polling is intentionally separate from failure recovery. `reconnectDelayMs` remains the delay before retrying a failed provider operation, while `pollIntervalMs` controls the cadence after a successful sync/probe and defaults to `30000` milliseconds. It accepts 1000 through 3600000 milliseconds. This avoids turning the 2-second reconnect default into continuous healthy cloud API traffic.\n'''
          if '`pollIntervalMs` controls the cadence' not in docs:
              if docs.count(marker) != 1:
                  raise SystemExit('provider timeout docs anchor not found exactly once')
              docs = docs.replace(marker, addition, 1)
          example = '''    "reconnectDelayMs": 2000\n'''
          if '"pollIntervalMs": 30000' not in docs and example in docs:
              docs = docs.replace(example, '    "reconnectDelayMs": 2000,\n    "pollIntervalMs": 30000\n', 1)
          doc.write_text(docs)
          PY
      - name: Format
        working-directory: engine
        run: cargo fmt --all
      - name: Clippy
        working-directory: engine
        run: cargo clippy -p cloud-node --all-targets --all-features --locked -- -D warnings
      - name: Test Cloud Node
        working-directory: engine
        run: cargo test -p cloud-node --all-features --locked
      - name: Commit BUG-CN-PROV-022
        run: |
          rm -f .github/workflows/one-shot-cloud-node-provider-poll-cadence.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "FIX | BUG-CN-PROV-022 separate provider poll and reconnect cadence"
          git push origin HEAD:work/cloud-node-provider-hardening
