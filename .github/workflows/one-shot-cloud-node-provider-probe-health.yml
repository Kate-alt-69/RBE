name: One-shot Cloud Node provider probe health checks

on:
  push:
    branches:
      - work/cloud-node-provider-hardening-2

permissions:
  contents: write

jobs:
  provider-probe-health:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Avoid repeated provider probe writes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          provider = Path('engine/crates/cloud-node/src/provider.rs')
          text = provider.read_text()
          old_probe = '''    pub async fn probe(&self) -> anyhow::Result<()> {\n        let probe_key = "provider/probe.json";\n        let payload = format!(\n            "{{\\\"formatVersion\\\":1,\\\"namespace\\\":{}}}",\n            serde_json::to_string(&self.settings.namespace)?\n        );\n        self.put(probe_key, payload.into_bytes(), "application/json")\n            .await?;\n        let downloaded = self.get(probe_key).await?.ok_or_else(|| {\n            anyhow::anyhow!("Cloud Node provider probe object disappeared after upload")\n        })?;\n        if downloaded.is_empty() {\n            anyhow::bail!("Cloud Node provider probe returned an empty object");\n        }\n        Ok(())\n    }\n'''
          new_probe = '''    pub async fn probe(&self) -> anyhow::Result<()> {\n        let probe_key = "provider/probe.json";\n        let payload = format!(\n            "{{\\\"formatVersion\\\":1,\\\"namespace\\\":{}}}",\n            serde_json::to_string(&self.settings.namespace)?\n        );\n        self.put(probe_key, payload.into_bytes(), "application/json")\n            .await?;\n        self.probe_read_only().await\n    }\n\n    pub(crate) async fn probe_read_only(&self) -> anyhow::Result<()> {\n        let downloaded = self\n            .get("provider/probe.json")\n            .await?\n            .ok_or_else(|| anyhow::anyhow!("Cloud Node provider probe object is missing"))?;\n        if downloaded.is_empty() {\n            anyhow::bail!("Cloud Node provider probe returned an empty object");\n        }\n        Ok(())\n    }\n'''
          if 'pub(crate) async fn probe_read_only' not in text:
              if old_probe not in text:
                  raise SystemExit('provider probe anchor not found')
              text = text.replace(old_probe, new_probe, 1)
          provider.write_text(text)

          main = Path('engine/crates/cloud-node/src/main.rs')
          text = main.read_text()
          state_anchor = '''    let client = ProviderClient::new(provider)?;\n    let mut retry_delay_ms = provider.reconnect_delay_ms;\n    loop {\n'''
          state_replacement = '''    let client = ProviderClient::new(provider)?;\n    let mut retry_delay_ms = provider.reconnect_delay_ms;\n    let mut write_probe_verified = false;\n    loop {\n'''
          if 'let mut write_probe_verified = false;' not in text:
              if state_anchor not in text:
                  raise SystemExit('provider daemon state anchor not found')
              text = text.replace(state_anchor, state_replacement, 1)

          old_else = '''        } else {\n            client.probe().await.map(|()| {\n                println!(\n                    "Cloud Node provider reachable target={}",\n                    client.target_description()\n                );\n            })\n        };\n'''
          new_else = '''        } else {\n            let probe = if write_probe_verified {\n                client.probe_read_only().await\n            } else {\n                client.probe().await\n            };\n            if probe.is_ok() {\n                write_probe_verified = true;\n            }\n            probe.map(|()| {\n                println!(\n                    "Cloud Node provider reachable target={}",\n                    client.target_description()\n                );\n            })\n        };\n'''
          if 'client.probe_read_only().await' not in text:
              if old_else not in text:
                  raise SystemExit('provider daemon probe anchor not found')
              text = text.replace(old_else, new_else, 1)
          main.write_text(text)

          doc = Path('doc/cloud-node.md')
          docs = doc.read_text()
          marker = '''Provider daemon success polling is intentionally separate from failure recovery. `reconnectDelayMs` is the initial delay before retrying a failed provider operation, `maxReconnectDelayMs` caps exponential failure backoff and defaults to `60000` milliseconds, and `pollIntervalMs` controls the cadence after a successful sync/probe and defaults to `30000` milliseconds. `maxReconnectDelayMs` accepts 250 through 3600000 milliseconds and cannot be smaller than `reconnectDelayMs`; `pollIntervalMs` accepts 1000 through 3600000 milliseconds. Successful provider activity resets the retry delay back to `reconnectDelayMs`. This avoids both continuous healthy cloud API traffic and fixed 2-second hammering during prolonged outages.\n'''
          addition = marker + '''\nWhen `syncOnConnect` is disabled, `cloud_node run` performs one full write+read provider capability probe after process startup. After that succeeds, recurring daemon health checks only read the existing probe object instead of rewriting it on every `pollIntervalMs` cycle. The explicit `probe-provider` command always keeps the full write+read behavior when write capability needs to be tested on demand.\n'''
          if 'recurring daemon health checks only read the existing probe object' not in docs:
              if marker not in docs:
                  raise SystemExit('provider daemon docs anchor not found')
              docs = docs.replace(marker, addition, 1)
              doc.write_text(docs)
          PY
      - name: Format
        working-directory: engine
        run: cargo fmt --all
      - name: Clippy
        working-directory: engine
        run: cargo clippy -p cloud-node --all-targets --all-features --locked -- -D warnings
      - name: Test Cloud Node
        working-directory: engine
        run: cargo test -p cloud-node --all-features --locked
      - name: Commit BUG-CN-PROV-027
        run: |
          rm -f .github/workflows/one-shot-cloud-node-provider-probe-health.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "FIX | BUG-CN-PROV-027 avoid repeated provider probe writes"
          git push origin HEAD:work/cloud-node-provider-hardening-2
