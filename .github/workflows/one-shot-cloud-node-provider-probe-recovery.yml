name: One-shot Cloud Node provider probe recovery

on:
  push:
    branches:
      - work/cloud-node-provider-hardening-2

permissions:
  contents: write

jobs:
  provider-probe-recovery:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Restore full probe after read-only health failure
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main = Path('engine/crates/cloud-node/src/main.rs')
          text = main.read_text()
          old = '''            if probe.is_ok() {\n                write_probe_verified = true;\n            }\n'''
          new = '''            // A failed read-only health check must fall back to a full write+read\n            // capability probe on the next retry so a deleted probe object can\n            // self-heal instead of leaving the daemon permanently read-only.\n            write_probe_verified = probe.is_ok();\n'''
          if 'deleted probe object can' not in text:
              if old not in text:
                  raise SystemExit('provider probe state anchor not found')
              text = text.replace(old, new, 1)
          main.write_text(text)

          doc = Path('doc/cloud-node.md')
          docs = doc.read_text()
          marker = '''When `syncOnConnect` is disabled, `cloud_node run` performs one full write+read provider capability probe after process startup. After that succeeds, recurring daemon health checks only read the existing probe object instead of rewriting it on every `pollIntervalMs` cycle. The explicit `probe-provider` command always keeps the full write+read behavior when write capability needs to be tested on demand.\n'''
          replacement = marker + '''If a later read-only health check fails, the daemon drops that cached write-capability state and the next retry performs a full write+read probe again. This lets a deleted or lost `provider/probe.json` object self-heal instead of leaving the daemon stuck in permanent read-only probe failures.\n'''
          if 'stuck in permanent read-only probe failures' not in docs:
              if marker not in docs:
                  raise SystemExit('provider probe docs anchor not found')
              docs = docs.replace(marker, replacement, 1)
              doc.write_text(docs)
          PY
      - name: Format
        working-directory: engine
        run: cargo fmt --all
      - name: Clippy
        working-directory: engine
        run: cargo clippy -p cloud-node --all-targets --all-features --locked -- -D warnings
      - name: Test Cloud Node
        working-directory: engine
        run: cargo test -p cloud-node --all-features --locked
      - name: Commit BUG-CN-PROV-030
        run: |
          rm -f .github/workflows/one-shot-cloud-node-provider-probe-recovery.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "FIX | BUG-CN-PROV-030 recover provider probe write capability"
          git push origin HEAD:work/cloud-node-provider-hardening-2
