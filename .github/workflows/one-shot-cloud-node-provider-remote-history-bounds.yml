name: One-shot Cloud Node provider remote history bounds

on:
  push:
    branches:
      - work/cloud-node-provider-hardening-2

permissions:
  contents: write

jobs:
  provider-remote-history-bounds:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Bound remote provider control metadata reads
        run: |
          python3 - <<'PY'
          from pathlib import Path

          provider = Path('engine/crates/cloud-node/src/provider.rs')
          text = provider.read_text()

          const_anchor = 'const MAX_PROVIDER_METADATA_BYTES: usize = 64 * 1024 * 1024;\n'
          if 'MAX_PROVIDER_CONTROL_METADATA_BYTES' not in text:
              if const_anchor not in text:
                  raise SystemExit('provider metadata limit anchor not found')
              text = text.replace(
                  const_anchor,
                  const_anchor + 'const MAX_PROVIDER_CONTROL_METADATA_BYTES: usize = 64 * 1024;\n',
                  1,
              )

          old_get = '''    pub async fn get(&self, relative: &str) -> anyhow::Result<Option<Vec<u8>>> {\n        Ok(self\n            .get_versioned(relative)\n            .await?\n            .map(|object| object.bytes))\n    }\n\n    pub(crate) async fn get_versioned(\n        &self,\n        relative: &str,\n    ) -> anyhow::Result<Option<ProviderMetadataObject>> {\n'''
          new_get = '''    pub async fn get(&self, relative: &str) -> anyhow::Result<Option<Vec<u8>>> {\n        self.get_limited(relative, MAX_PROVIDER_METADATA_BYTES).await\n    }\n\n    pub(crate) async fn get_limited(\n        &self,\n        relative: &str,\n        max_bytes: usize,\n    ) -> anyhow::Result<Option<Vec<u8>>> {\n        Ok(self\n            .get_versioned_limited(relative, max_bytes)\n            .await?\n            .map(|object| object.bytes))\n    }\n\n    pub(crate) async fn get_versioned(\n        &self,\n        relative: &str,\n    ) -> anyhow::Result<Option<ProviderMetadataObject>> {\n        self.get_versioned_limited(relative, MAX_PROVIDER_METADATA_BYTES)\n            .await\n    }\n\n    pub(crate) async fn get_versioned_limited(\n        &self,\n        relative: &str,\n        max_bytes: usize,\n    ) -> anyhow::Result<Option<ProviderMetadataObject>> {\n'''
          if 'pub(crate) async fn get_limited(' not in text:
              if old_get not in text:
                  raise SystemExit('provider get anchor not found')
              text = text.replace(old_get, new_get, 1)

          old_download = '''        let Some(bytes) = response_bytes(response, "download", true).await? else {\n            return Ok(None);\n        };\n'''
          new_download = '''        let Some(bytes) =\n            response_bytes_limited(response, "download", true, max_bytes).await?\n        else {\n            return Ok(None);\n        };\n'''
          if 'response_bytes_limited(response, "download", true, max_bytes)' not in text:
              if old_download not in text:
                  raise SystemExit('provider bounded download anchor not found')
              text = text.replace(old_download, new_download, 1)

          old_probe_read = '''        let downloaded = self\n            .get("provider/probe.json")\n            .await?\n            .ok_or_else(|| anyhow::anyhow!("Cloud Node provider probe object is missing"))?;\n'''
          new_probe_read = '''        let downloaded = self\n            .get_limited("provider/probe.json", MAX_PROVIDER_CONTROL_METADATA_BYTES)\n            .await?\n            .ok_or_else(|| anyhow::anyhow!("Cloud Node provider probe object is missing"))?;\n'''
          if 'get_limited("provider/probe.json", MAX_PROVIDER_CONTROL_METADATA_BYTES)' not in text:
              if old_probe_read not in text:
                  raise SystemExit('probe read anchor not found')
              text = text.replace(old_probe_read, new_probe_read, 1)

          response_anchor = '''async fn response_bytes(\n    mut response: reqwest::Response,\n    operation: &str,\n    allow_not_found: bool,\n) -> anyhow::Result<Option<Vec<u8>>> {\n'''
          response_new = '''async fn response_bytes(\n    response: reqwest::Response,\n    operation: &str,\n    allow_not_found: bool,\n) -> anyhow::Result<Option<Vec<u8>>> {\n    response_bytes_limited(\n        response,\n        operation,\n        allow_not_found,\n        MAX_PROVIDER_METADATA_BYTES,\n    )\n    .await\n}\n\nasync fn response_bytes_limited(\n    mut response: reqwest::Response,\n    operation: &str,\n    allow_not_found: bool,\n    max_metadata_bytes: usize,\n) -> anyhow::Result<Option<Vec<u8>>> {\n'''
          if 'async fn response_bytes_limited(' not in text:
              if response_anchor not in text:
                  raise SystemExit('response_bytes anchor not found')
              text = text.replace(response_anchor, response_new, 1)

          text = text.replace(
              'length > MAX_PROVIDER_METADATA_BYTES as u64',
              'length > max_metadata_bytes as u64',
              1,
          )
          text = text.replace(
              'MAX_PROVIDER_METADATA_BYTES\n        );',
              'max_metadata_bytes\n        );',
              1,
          )
          text = text.replace(
              '.min(MAX_PROVIDER_METADATA_BYTES);',
              '.min(max_metadata_bytes);',
              1,
          )
          old_append = '''            MAX_PROVIDER_METADATA_BYTES,\n            "provider metadata",\n'''
          new_append = '''            max_metadata_bytes,\n            "provider metadata",\n'''
          if old_append in text:
              text = text.replace(old_append, new_append, 1)

          required_provider = [
              'MAX_PROVIDER_CONTROL_METADATA_BYTES',
              'pub(crate) async fn get_limited(',
              'pub(crate) async fn get_versioned_limited(',
              'async fn response_bytes_limited(',
              'max_metadata_bytes',
          ]
          for marker in required_provider:
              if marker not in text:
                  raise SystemExit(f'missing provider metadata bound marker: {marker}')
          provider.write_text(text)

          sync = Path('engine/crates/cloud-node/src/provider_sync.rs')
          text = sync.read_text()
          history_anchor = 'const MAX_LOCAL_HISTORY_METADATA_BYTES: u64 = 64 * 1024;\n'
          if 'MAX_REMOTE_HISTORY_METADATA_BYTES' not in text:
              if history_anchor not in text:
                  raise SystemExit('local history metadata constant anchor not found')
              text = text.replace(
                  history_anchor,
                  history_anchor + 'const MAX_REMOTE_HISTORY_METADATA_BYTES: usize = 64 * 1024;\n',
                  1,
              )

          old_head = '''    let Some(object) = client.get_versioned("history/HEAD.json").await? else {\n        return Ok(None);\n    };\n'''
          new_head = '''    let Some(object) = client\n        .get_versioned_limited("history/HEAD.json", MAX_REMOTE_HISTORY_METADATA_BYTES)\n        .await?\n    else {\n        return Ok(None);\n    };\n'''
          if 'get_versioned_limited("history/HEAD.json"' not in text:
              if old_head not in text:
                  raise SystemExit('remote HEAD fetch anchor not found')
              text = text.replace(old_head, new_head, 1)

          old_commit = '''    let Some(bytes) = client.get(&format!("history/commits/{id}.json")).await? else {\n        return Ok(None);\n    };\n'''
          new_commit = '''    let Some(bytes) = client\n        .get_limited(\n            &format!("history/commits/{id}.json"),\n            MAX_REMOTE_HISTORY_METADATA_BYTES,\n        )\n        .await?\n    else {\n        return Ok(None);\n    };\n'''
          if 'MAX_REMOTE_HISTORY_METADATA_BYTES' in text and '.get_limited(' not in text.split('async fn fetch_remote_commit(', 1)[1]:
              if old_commit not in text:
                  raise SystemExit('remote commit fetch anchor not found')
              text = text.replace(old_commit, new_commit, 1)
          elif old_commit in text:
              text = text.replace(old_commit, new_commit, 1)

          required_sync = [
              'MAX_REMOTE_HISTORY_METADATA_BYTES',
              'get_versioned_limited("history/HEAD.json"',
              'history/commits/{id}.json',
          ]
          for marker in required_sync:
              if marker not in text:
                  raise SystemExit(f'missing remote history metadata marker: {marker}')
          sync.write_text(text)

          doc = Path('doc/cloud-node.md')
          docs = doc.read_text()
          marker = '''Local provider-history JSON metadata is treated as untrusted disk input when read back. `HEAD.json` and individual commit files are bounded to 64 KiB before JSON decoding, preventing a corrupted or externally replaced history file from causing unbounded memory allocation during status or synchronization.\n'''
          addition = marker + '''Remote provider control metadata is bounded independently from snapshot indexes: `history/HEAD.json`, individual history commits, and the provider probe are capped at 64 KiB, while snapshot indexes retain the broader 64 MiB metadata allowance needed for large object graphs.\n'''
          if 'Remote provider control metadata is bounded independently' not in docs:
              if marker not in docs:
                  raise SystemExit('local history docs anchor not found')
              docs = docs.replace(marker, addition, 1)
              doc.write_text(docs)
          PY
      - name: Format
        working-directory: engine
        run: cargo fmt --all
      - name: Clippy
        working-directory: engine
        run: cargo clippy -p cloud-node --all-targets --all-features --locked -- -D warnings
      - name: Test Cloud Node
        working-directory: engine
        run: cargo test -p cloud-node --all-features --locked
      - name: Commit BUG-CN-PROV-033
        run: |
          rm -f .github/workflows/one-shot-cloud-node-provider-remote-history-bounds.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "FIX | BUG-CN-PROV-033 bound remote provider control metadata"
          git push origin HEAD:work/cloud-node-provider-hardening-2
