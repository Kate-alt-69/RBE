name: One-shot Cloud Node provider reconnect backoff

on:
  push:
    branches:
      - work/cloud-node-provider-hardening-2

permissions:
  contents: write

jobs:
  provider-retry-backoff:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Add bounded exponential provider reconnect backoff
        run: |
          python3 - <<'PY'
          from pathlib import Path

          config = Path('engine/crates/cloud-node/src/config.rs')
          text = config.read_text()
          field_anchor = '''    #[serde(default = "default_reconnect_delay_ms")]\n    pub reconnect_delay_ms: u64,\n    #[serde(default = "default_provider_poll_interval_ms")]\n    pub poll_interval_ms: u64,\n'''
          field_replacement = '''    #[serde(default = "default_reconnect_delay_ms")]\n    pub reconnect_delay_ms: u64,\n    #[serde(default = "default_provider_max_reconnect_delay_ms")]\n    pub max_reconnect_delay_ms: u64,\n    #[serde(default = "default_provider_poll_interval_ms")]\n    pub poll_interval_ms: u64,\n'''
          if 'pub max_reconnect_delay_ms: u64' not in text:
              if field_anchor not in text:
                  raise SystemExit('provider reconnect field anchor not found')
              text = text.replace(field_anchor, field_replacement, 1)

          validate_anchor = '''    validate_reconnect_delay(provider.reconnect_delay_ms)?;\n    validate_provider_poll_interval(provider.poll_interval_ms)?;\n'''
          validate_replacement = '''    validate_reconnect_delay(provider.reconnect_delay_ms)?;\n    validate_provider_max_reconnect_delay(\n        provider.reconnect_delay_ms,\n        provider.max_reconnect_delay_ms,\n    )?;\n    validate_provider_poll_interval(provider.poll_interval_ms)?;\n'''
          if 'validate_provider_max_reconnect_delay(' not in text:
              if validate_anchor not in text:
                  raise SystemExit('provider reconnect validation anchor not found')
              text = text.replace(validate_anchor, validate_replacement, 1)

          fn_anchor = '''fn validate_provider_poll_interval(value: u64) -> anyhow::Result<()> {\n'''
          validation_fn = '''fn validate_provider_max_reconnect_delay(initial: u64, maximum: u64) -> anyhow::Result<()> {\n    if !(250..=3_600_000).contains(&maximum) {\n        anyhow::bail!(\n            "Cloud Node provider maxReconnectDelayMs must be between 250 and 3600000"\n        );\n    }\n    if maximum < initial {\n        anyhow::bail!(\n            "Cloud Node provider maxReconnectDelayMs cannot be smaller than reconnectDelayMs"\n        );\n    }\n    Ok(())\n}\n\n'''
          if 'fn validate_provider_max_reconnect_delay(' not in text:
              if fn_anchor not in text:
                  raise SystemExit('poll interval validation anchor not found')
              text = text.replace(fn_anchor, validation_fn + fn_anchor, 1)

          default_anchor = '''const fn default_provider_poll_interval_ms() -> u64 {\n    30_000\n}\n'''
          default_replacement = '''const fn default_provider_max_reconnect_delay_ms() -> u64 {\n    60_000\n}\nconst fn default_provider_poll_interval_ms() -> u64 {\n    30_000\n}\n'''
          if 'default_provider_max_reconnect_delay_ms' not in text.split('#[cfg(test)]')[0]:
              if default_anchor not in text:
                  raise SystemExit('provider poll default anchor not found')
              text = text.replace(default_anchor, default_replacement, 1)

          test_anchor = '''        assert_eq!(provider.poll_interval_ms, 30_000);\n        assert_eq!(provider.connect_timeout_ms, 10_000);\n'''
          test_replacement = '''        assert_eq!(provider.max_reconnect_delay_ms, 60_000);\n        assert_eq!(provider.poll_interval_ms, 30_000);\n        assert_eq!(provider.connect_timeout_ms, 10_000);\n'''
          if 'assert_eq!(provider.max_reconnect_delay_ms, 60_000);' not in text:
              if test_anchor not in text:
                  raise SystemExit('provider defaults test anchor not found')
              text = text.replace(test_anchor, test_replacement, 1)

          invalid_anchor = '''        invalid = provider.clone();\n        invalid.poll_interval_ms = 999;\n        assert!(validate_provider(&invalid).is_err());\n'''
          invalid_replacement = '''        invalid = provider.clone();\n        invalid.poll_interval_ms = 999;\n        assert!(validate_provider(&invalid).is_err());\n        invalid = provider.clone();\n        invalid.max_reconnect_delay_ms = provider.reconnect_delay_ms - 1;\n        assert!(validate_provider(&invalid).is_err());\n        invalid = provider.clone();\n        invalid.max_reconnect_delay_ms = 3_600_001;\n        assert!(validate_provider(&invalid).is_err());\n'''
          if 'invalid.max_reconnect_delay_ms = provider.reconnect_delay_ms - 1;' not in text:
              if invalid_anchor not in text:
                  raise SystemExit('provider invalid test anchor not found')
              text = text.replace(invalid_anchor, invalid_replacement, 1)
          config.write_text(text)

          main = Path('engine/crates/cloud-node/src/main.rs')
          text = main.read_text()
          loop_anchor = '''    let client = ProviderClient::new(provider)?;\n    loop {\n'''
          loop_replacement = '''    let client = ProviderClient::new(provider)?;\n    let mut retry_delay_ms = provider.reconnect_delay_ms;\n    loop {\n'''
          if 'let mut retry_delay_ms = provider.reconnect_delay_ms;' not in text:
              if loop_anchor not in text:
                  raise SystemExit('provider daemon loop anchor not found')
              text = text.replace(loop_anchor, loop_replacement, 1)

          delay_old = '''        let delay_ms = match result {\n            Err(error) => {\n                eprintln!("Cloud Node provider synchronization failed: {error}");\n                if !provider.auto_reconnect {\n                    return Err(error);\n                }\n                provider.reconnect_delay_ms\n            }\n            Ok(()) => {\n                if !provider.auto_reconnect {\n                    return Ok(());\n                }\n                provider.poll_interval_ms\n            }\n        };\n'''
          delay_new = '''        let delay_ms = match result {\n            Err(error) => {\n                eprintln!("Cloud Node provider synchronization failed: {error}");\n                if !provider.auto_reconnect {\n                    return Err(error);\n                }\n                let delay = retry_delay_ms;\n                retry_delay_ms = retry_delay_ms\n                    .saturating_mul(2)\n                    .min(provider.max_reconnect_delay_ms);\n                delay\n            }\n            Ok(()) => {\n                retry_delay_ms = provider.reconnect_delay_ms;\n                if !provider.auto_reconnect {\n                    return Ok(());\n                }\n                provider.poll_interval_ms\n            }\n        };\n'''
          if '.min(provider.max_reconnect_delay_ms)' not in text:
              if delay_old not in text:
                  raise SystemExit('provider daemon delay anchor not found')
              text = text.replace(delay_old, delay_new, 1)
          main.write_text(text)

          doc = Path('doc/cloud-node.md')
          docs = doc.read_text()
          old_doc = '''Provider daemon success polling is intentionally separate from failure recovery. `reconnectDelayMs` remains the delay before retrying a failed provider operation, while `pollIntervalMs` controls the cadence after a successful sync/probe and defaults to `30000` milliseconds. It accepts 1000 through 3600000 milliseconds. This avoids turning the 2-second reconnect default into continuous healthy cloud API traffic.\n'''
          new_doc = '''Provider daemon success polling is intentionally separate from failure recovery. `reconnectDelayMs` is the initial delay before retrying a failed provider operation, `maxReconnectDelayMs` caps exponential failure backoff and defaults to `60000` milliseconds, and `pollIntervalMs` controls the cadence after a successful sync/probe and defaults to `30000` milliseconds. `maxReconnectDelayMs` accepts 250 through 3600000 milliseconds and cannot be smaller than `reconnectDelayMs`; `pollIntervalMs` accepts 1000 through 3600000 milliseconds. Successful provider activity resets the retry delay back to `reconnectDelayMs`. This avoids both continuous healthy cloud API traffic and fixed 2-second hammering during prolonged outages.\n'''
          if 'maxReconnectDelayMs` caps exponential failure backoff' not in docs:
              if old_doc not in docs:
                  raise SystemExit('provider daemon cadence docs anchor not found')
              docs = docs.replace(old_doc, new_doc, 1)
          doc.write_text(docs)
          PY
      - name: Format
        working-directory: engine
        run: cargo fmt --all
      - name: Clippy
        working-directory: engine
        run: cargo clippy -p cloud-node --all-targets --all-features --locked -- -D warnings
      - name: Test Cloud Node
        working-directory: engine
        run: cargo test -p cloud-node --all-features --locked
      - name: Commit BUG-CN-PROV-026
        run: |
          rm -f .github/workflows/one-shot-cloud-node-provider-retry-backoff.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "FIX | BUG-CN-PROV-026 add bounded provider reconnect backoff"
          git push origin HEAD:work/cloud-node-provider-hardening-2
