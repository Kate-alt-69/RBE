name: One-shot Cloud Node provider snapshot validation memory

on:
  push:
    branches:
      - work/cloud-node-provider-hardening-2

permissions:
  contents: write

jobs:
  provider-snapshot-validation-memory:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Reduce provider snapshot validation allocations
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('engine/crates/cloud-node/src/provider_sync.rs')
          text = path.read_text()

          old_match = '''    let expected = snapshot_resource_keys_for_plan(plan)?;\n    let actual = snapshot\n        .resources\n        .iter()\n        .map(|resource| resource.key.clone())\n        .collect::<HashSet<_>>();\n    Ok(actual == expected)\n'''
          new_match = '''    let expected = snapshot_resource_keys_for_plan(plan)?;\n    if snapshot.resources.len() != expected.len() {\n        return Ok(false);\n    }\n    Ok(snapshot\n        .resources\n        .iter()\n        .all(|resource| expected.contains(resource.key.as_str())))\n'''
          if '.all(|resource| expected.contains(resource.key.as_str()))' not in text:
              if old_match not in text:
                  raise SystemExit('snapshot plan comparison anchor not found')
              text = text.replace(old_match, new_match, 1)

          old_identity = '''        let identity = (\n            resource.kind,\n            resource.object_key.clone(),\n            resource.content_sha256.clone(),\n        );\n'''
          new_identity = '''        let identity = (\n            resource.kind,\n            resource.object_key.as_str(),\n            resource.content_sha256.as_str(),\n        );\n'''
          if 'resource.object_key.as_str(),' not in text:
              if old_identity not in text:
                  raise SystemExit('snapshot identity anchor not found')
              text = text.replace(old_identity, new_identity, 1)

          replacements = [
              ('resource_paths.insert(resource.key.clone())', 'resource_paths.insert(resource.key.as_str())'),
              ('manifests.insert(identity.clone())', 'manifests.insert(identity)'),
              ('folders.insert(resource.object_key.clone())', 'folders.insert(resource.object_key.as_str())'),
              ('videos.insert(resource.object_key.clone())', 'videos.insert(resource.object_key.as_str())'),
              ('files.insert(resource.object_key.clone())', 'files.insert(resource.object_key.as_str())'),
              ('file_payloads.insert(resource.object_key.clone())', 'file_payloads.insert(resource.object_key.as_str())'),
          ]
          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new, 1)

          forbidden = [
              'resource_paths.insert(resource.key.clone())',
              'manifests.insert(identity.clone())',
              'folders.insert(resource.object_key.clone())',
              'videos.insert(resource.object_key.clone())',
              'files.insert(resource.object_key.clone())',
              'file_payloads.insert(resource.object_key.clone())',
          ]
          for marker in forbidden:
              if marker in text:
                  raise SystemExit(f'provider snapshot validation still clones identity data: {marker}')

          path.write_text(text)
          PY
      - name: Format
        working-directory: engine
        run: cargo fmt --all
      - name: Clippy
        working-directory: engine
        run: cargo clippy -p cloud-node --all-targets --all-features --locked -- -D warnings
      - name: Test Cloud Node
        working-directory: engine
        run: cargo test -p cloud-node --all-features --locked
      - name: Commit BUG-CN-PROV-035
        run: |
          rm -f .github/workflows/one-shot-cloud-node-provider-snapshot-validation-memory.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "FIX | BUG-CN-PROV-035 reduce snapshot validation allocations"
          git push origin HEAD:work/cloud-node-provider-hardening-2
