name: One-shot Cloud Node provider stream restore

on:
  push:
    branches:
      - work/cloud-node-providers-latest

permissions:
  contents: write

jobs:
  stream-restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Stream provider restores
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          provider_path = Path("engine/crates/cloud-node/src/provider.rs")
          p = provider_path.read_text()
          p = replace_once(
              p,
              'use reqwest::header::{HeaderName, HeaderValue, AUTHORIZATION, CONTENT_TYPE, HOST};',
              'use reqwest::header::{\n    HeaderName, HeaderValue, AUTHORIZATION, CONTENT_RANGE, CONTENT_TYPE, HOST, RANGE,\n};',
              "provider header imports",
          )
          p = replace_once(
              p,
              'const HTTP_HEADER_VALUE_ENV: &str = "RBE_CN_PROV_HTTP_HEADER_VALUE";\n',
              'const HTTP_HEADER_VALUE_ENV: &str = "RBE_CN_PROV_HTTP_HEADER_VALUE";\nconst MAX_PROVIDER_ERROR_BYTES: usize = 1024;\n',
              "provider error cap",
          )
          p = p.replace(
              'self.aws_request(Method::GET, &key, Vec::new(), None)\n                    .await?',
              'self.aws_request(Method::GET, &key, Vec::new(), None, None)\n                    .await?',
          )
          p = p.replace(
              'self.aws_request(Method::PUT, &key, bytes, Some(content_type))\n                    .await?',
              'self.aws_request(Method::PUT, &key, bytes, Some(content_type), None)\n                    .await?',
          )

          get_anchor = '''    pub async fn put(
          '''
          open_download = '''    pub(crate) async fn open_download(
              &self,
              relative: &str,
              start: u64,
          ) -> anyhow::Result<Option<reqwest::Response>> {
              let key = self.object_key(relative)?;
              let range = (start > 0).then(|| format!("bytes={start}-"));
              let response = match self.settings.kind {
                  ProviderKind::AmazonS3 => {
                      self.aws_request(
                          Method::GET,
                          &key,
                          Vec::new(),
                          None,
                          range.as_deref(),
                      )
                      .await?
                  }
                  ProviderKind::Supabase => {
                      let url = self.supabase_url(&key, true)?;
                      apply_range(
                          self.apply_supabase_auth(self.client.get(url))?,
                          range.as_deref(),
                      )
                      .send()
                      .await?
                  }
                  ProviderKind::AzureBlob => {
                      let url = self.azure_url(&key)?;
                      apply_range(self.client.get(url), range.as_deref())
                          .send()
                          .await?
                  }
                  ProviderKind::GoogleCloudStorage => {
                      let url = self.gcs_url(&key)?;
                      let token = required_env(
                          self.settings
                              .auth
                              .oauth_token_env
                              .as_deref()
                              .or(self.settings.auth.bearer_token_env.as_deref())
                              .or(self.settings.credential_env.as_deref()),
                          GOOGLE_OAUTH_TOKEN_ENV,
                      )?;
                      apply_range(self.client.get(url).bearer_auth(token), range.as_deref())
                          .send()
                          .await?
                  }
                  ProviderKind::Http => {
                      let url = self.http_url(&key)?;
                      apply_range(self.apply_http_auth(self.client.get(url))?, range.as_deref())
                          .send()
                          .await?
                  }
              };
              checked_download_response(response, start).await
          }

          '''
          p = replace_once(p, get_anchor, open_download + get_anchor, "open provider download")

          old_aws_sig = '''    async fn aws_request(
              &self,
              method: Method,
              key: &str,
              body: Vec<u8>,
              content_type: Option<&str>,
          ) -> anyhow::Result<reqwest::Response> {
          '''
          new_aws_sig = '''    async fn aws_request(
              &self,
              method: Method,
              key: &str,
              body: Vec<u8>,
              content_type: Option<&str>,
              range: Option<&str>,
          ) -> anyhow::Result<reqwest::Response> {
          '''
          p = replace_once(p, old_aws_sig, new_aws_sig, "AWS request range signature")
          old_send = '''        if let Some(content_type) = content_type {
                  request = request.header(CONTENT_TYPE, content_type);
              }
              if !body.is_empty() {
                  request = request.body(body);
              }
          '''
          new_send = '''        if let Some(content_type) = content_type {
                  request = request.header(CONTENT_TYPE, content_type);
              }
              if let Some(range) = range {
                  request = request.header(RANGE, range);
              }
              if !body.is_empty() {
                  request = request.body(body);
              }
          '''
          p = replace_once(p, old_send, new_send, "AWS range header")

          old_response = '''async fn response_bytes(
              response: reqwest::Response,
              operation: &str,
              allow_not_found: bool,
          ) -> anyhow::Result<Option<Vec<u8>>> {
              let status = response.status();
              if allow_not_found && status == StatusCode::NOT_FOUND {
                  return Ok(None);
              }
              if !status.is_success() {
                  let detail = response.text().await.unwrap_or_default();
                  let detail = detail.chars().take(1024).collect::<String>();
                  anyhow::bail!("Cloud Node provider {operation} failed with HTTP {status}: {detail}");
              }
              if operation == "download" {
                  Ok(Some(response.bytes().await?.to_vec()))
              } else {
                  Ok(None)
              }
          }
          '''
          new_response = '''async fn checked_download_response(
              response: reqwest::Response,
              start: u64,
          ) -> anyhow::Result<Option<reqwest::Response>> {
              let status = response.status();
              if status == StatusCode::NOT_FOUND {
                  return Ok(None);
              }
              if !status.is_success() {
                  return Err(provider_http_error(response, "download").await);
              }
              if start > 0 && status == StatusCode::PARTIAL_CONTENT {
                  let content_range = response
                      .headers()
                      .get(CONTENT_RANGE)
                      .ok_or_else(|| {
                          anyhow::anyhow!(
                              "Cloud Node provider partial download omitted Content-Range"
                          )
                      })?
                      .to_str()
                      .map_err(|error| {
                          anyhow::anyhow!(
                              "Cloud Node provider returned invalid Content-Range header: {error}"
                          )
                      })?;
                  let actual_start = content_range_start(content_range).ok_or_else(|| {
                      anyhow::anyhow!(
                          "Cloud Node provider returned malformed Content-Range {content_range:?}"
                      )
                  })?;
                  if actual_start != start {
                      anyhow::bail!(
                          "Cloud Node provider range started at {actual_start} instead of requested {start}"
                      );
                  }
              }
              Ok(Some(response))
          }

          async fn response_bytes(
              response: reqwest::Response,
              operation: &str,
              allow_not_found: bool,
          ) -> anyhow::Result<Option<Vec<u8>>> {
              let status = response.status();
              if allow_not_found && status == StatusCode::NOT_FOUND {
                  return Ok(None);
              }
              if !status.is_success() {
                  return Err(provider_http_error(response, operation).await);
              }
              if operation == "download" {
                  Ok(Some(response.bytes().await?.to_vec()))
              } else {
                  Ok(None)
              }
          }

          async fn provider_http_error(
              mut response: reqwest::Response,
              operation: &str,
          ) -> anyhow::Error {
              let status = response.status();
              let mut detail = Vec::new();
              while detail.len() < MAX_PROVIDER_ERROR_BYTES {
                  match response.chunk().await {
                      Ok(Some(chunk)) => {
                          let take = (MAX_PROVIDER_ERROR_BYTES - detail.len()).min(chunk.len());
                          detail.extend_from_slice(&chunk[..take]);
                          if take < chunk.len() {
                              break;
                          }
                      }
                      Ok(None) | Err(_) => break,
                  }
              }
              let detail = String::from_utf8_lossy(&detail);
              anyhow::anyhow!(
                  "Cloud Node provider {operation} failed with HTTP {status}: {detail}"
              )
          }

          fn apply_range(request: RequestBuilder, range: Option<&str>) -> RequestBuilder {
              match range {
                  Some(range) => request.header(RANGE, range),
                  None => request,
              }
          }

          fn content_range_start(value: &str) -> Option<u64> {
              let value = value.strip_prefix("bytes ")?;
              let (range, _) = value.split_once('/')?;
              let (start, _) = range.split_once('-')?;
              start.parse().ok()
          }
          '''
          p = replace_once(p, old_response, new_response, "bounded provider error and ranged response")

          test_anchor = '''    #[test]
              fn provider_object_keys_are_namespaced() {
          '''
          range_test = '''    #[test]
              fn content_range_parser_requires_a_byte_start() {
                  assert_eq!(content_range_start("bytes 4194304-8388607/10000000"), Some(4_194_304));
                  assert_eq!(content_range_start("bytes 0-0/1"), Some(0));
                  assert_eq!(content_range_start("items 0-1/2"), None);
                  assert_eq!(content_range_start("bytes */10"), None);
              }

          '''
          p = replace_once(p, test_anchor, range_test + test_anchor, "range parser tests")
          provider_path.write_text(p)

          sync_path = Path("engine/crates/cloud-node/src/provider_sync.rs")
          s = sync_path.read_text()
          old_restore = '''async fn restore_resource(
              client: &ProviderClient,
              receiver: &mut CloudNodeRecoveryReceiver,
              resource: &ProviderResource,
          ) -> anyhow::Result<()> {
              let bytes = client.get(&resource.key).await?.ok_or_else(|| {
                  anyhow::anyhow!(
                      "Cloud Node provider snapshot resource {} is missing",
                      resource.key
                  )
              })?;
              let expected_size = usize::try_from(resource.size)
                  .map_err(|_| anyhow::anyhow!("Cloud Node provider resource size exceeds platform range"))?;
              if bytes.len() != expected_size {
                  anyhow::bail!(
                      "Cloud Node provider resource size mismatch for {}",
                      resource.key
                  );
              }
              let resource_sha = decode_hash(&resource.resource_sha256, "provider resource hash")?;
              let actual: [u8; 32] = Sha256::digest(&bytes).into();
              if actual != resource_sha {
                  anyhow::bail!(
                      "Cloud Node provider resource hash mismatch for {}",
                      resource.key
                  );
              }
              let kind = BlobKind::try_from(resource.kind)?;
              let transfer_resource = TransferResource::try_from(resource.resource)?;
              let object_key = decode_hash(&resource.object_key, "provider object key")?;
              let content_sha = decode_hash(&resource.content_sha256, "provider content hash")?;
              let total_size = resource.size;

              if bytes.is_empty() {
                  let chunk = TransferChunk::new(
                      kind,
                      transfer_resource,
                      object_key,
                      content_sha,
                      resource_sha,
                      0,
                      0,
                      Vec::new(),
                  )?;
                  receiver.accept_chunk(&chunk)?;
                  return Ok(());
              }

              let mut offset = 0usize;
              while offset < bytes.len() {
                  let end = offset
                      .saturating_add(MAX_TRANSFER_DATA_BYTES)
                      .min(bytes.len());
                  let chunk = TransferChunk::new(
                      kind,
                      transfer_resource,
                      object_key,
                      content_sha,
                      resource_sha,
                      u64::try_from(offset)
                          .map_err(|_| anyhow::anyhow!("provider resource offset exceeds u64"))?,
                      total_size,
                      bytes[offset..end].to_vec(),
                  )?;
                  let receipt = receiver.accept_chunk(&chunk)?;
                  let next = usize::try_from(receipt.next_offset)
                      .map_err(|_| anyhow::anyhow!("provider recovery offset exceeds platform range"))?;
                  if next <= offset || next > bytes.len() {
                      anyhow::bail!(
                          "Cloud Node provider recovery returned invalid resume offset {} for resource size {}",
                          next,
                          bytes.len()
                      );
                  }
                  offset = next;
              }
              Ok(())
          }
          '''
          new_restore = '''async fn restore_resource(
              client: &ProviderClient,
              receiver: &mut CloudNodeRecoveryReceiver,
              resource: &ProviderResource,
          ) -> anyhow::Result<()> {
              let resource_sha = decode_hash(&resource.resource_sha256, "provider resource hash")?;
              let kind = BlobKind::try_from(resource.kind)?;
              let transfer_resource = TransferResource::try_from(resource.resource)?;
              let object_key = decode_hash(&resource.object_key, "provider object key")?;
              let content_sha = decode_hash(&resource.content_sha256, "provider content hash")?;
              let total_size = resource.size;

              if total_size == 0 {
                  let mut response = client.open_download(&resource.key, 0).await?.ok_or_else(|| {
                      anyhow::anyhow!(
                          "Cloud Node provider snapshot resource {} is missing",
                          resource.key
                      )
                  })?;
                  if response.chunk().await?.is_some() {
                      anyhow::bail!(
                          "Cloud Node provider resource size mismatch for {}",
                          resource.key
                      );
                  }
                  let chunk = TransferChunk::new(
                      kind,
                      transfer_resource,
                      object_key,
                      content_sha,
                      resource_sha,
                      0,
                      0,
                      Vec::new(),
                  )?;
                  receiver.accept_chunk(&chunk)?;
                  return Ok(());
              }

              let probe = TransferChunk::new(
                  kind,
                  transfer_resource,
                  object_key,
                  content_sha,
                  resource_sha,
                  0,
                  total_size,
                  Vec::new(),
              )?;
              let receipt = receiver.accept_chunk(&probe)?;
              let mut offset = receipt.next_offset;
              if offset > total_size {
                  anyhow::bail!(
                      "Cloud Node provider recovery returned invalid resume offset {offset} for resource size {total_size}"
                  );
              }
              if offset == total_size {
                  return Ok(());
              }

              let mut response = client
                  .open_download(&resource.key, offset)
                  .await?
                  .ok_or_else(|| {
                      anyhow::anyhow!(
                          "Cloud Node provider snapshot resource {} is missing",
                          resource.key
                      )
                  })?;
              let ranged = response.status() == reqwest::StatusCode::PARTIAL_CONTENT;
              let mut source_offset = if ranged { offset } else { 0 };

              while let Some(bytes) = response.chunk().await? {
                  let chunk_start = source_offset;
                  source_offset = source_offset
                      .checked_add(u64::try_from(bytes.len()).map_err(|_| {
                          anyhow::anyhow!("provider response chunk size exceeds u64")
                      })?)
                      .ok_or_else(|| anyhow::anyhow!("provider response offset overflow"))?;

                  if source_offset <= offset {
                      continue;
                  }
                  let begin = if chunk_start < offset {
                      usize::try_from(offset - chunk_start).map_err(|_| {
                          anyhow::anyhow!("provider resume prefix exceeds platform range")
                      })?
                  } else {
                      0
                  };
                  let mut remaining = &bytes[begin..];
                  while !remaining.is_empty() {
                      if offset >= total_size {
                          anyhow::bail!(
                              "Cloud Node provider resource exceeded declared size for {}",
                              resource.key
                          );
                      }
                      let resource_remaining = usize::try_from(total_size - offset)
                          .unwrap_or(usize::MAX);
                      let take = remaining
                          .len()
                          .min(MAX_TRANSFER_DATA_BYTES)
                          .min(resource_remaining);
                      if take == 0 {
                          anyhow::bail!(
                              "Cloud Node provider resource exceeded declared size for {}",
                              resource.key
                          );
                      }
                      let data = remaining[..take].to_vec();
                      let sent_end = offset
                          .checked_add(u64::try_from(take).map_err(|_| {
                              anyhow::anyhow!("provider transfer chunk exceeds u64")
                          })?)
                          .ok_or_else(|| anyhow::anyhow!("provider transfer offset overflow"))?;
                      let chunk = TransferChunk::new(
                          kind,
                          transfer_resource,
                          object_key,
                          content_sha,
                          resource_sha,
                          offset,
                          total_size,
                          data,
                      )?;
                      let receipt = receiver.accept_chunk(&chunk)?;
                      if receipt.next_offset != sent_end {
                          anyhow::bail!(
                              "Cloud Node provider recovery advanced to unexpected offset {} instead of {}",
                              receipt.next_offset,
                              sent_end
                          );
                      }
                      offset = receipt.next_offset;
                      remaining = &remaining[take..];
                  }
              }

              if offset != total_size {
                  anyhow::bail!(
                      "Cloud Node provider resource ended at offset {offset} instead of declared size {total_size} for {}",
                      resource.key
                  );
              }
              Ok(())
          }
          '''
          s = replace_once(s, old_restore, new_restore, "streamed provider restore")
          sync_path.write_text(s)
          PY
      - name: Format
        working-directory: engine
        run: cargo fmt --all
      - name: Validate Cloud Node
        working-directory: engine
        run: |
          cargo fmt --all -- --check
          cargo clippy -p cloud-node --all-targets --locked -- -D warnings
          cargo test -p cloud-node --locked
      - name: Commit bounded restore
        shell: bash
        run: |
          rm .github/workflows/one-shot-cloud-node-provider-stream-restore.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "FIX | BUG-CN-PROV-008 stream and range-resume provider restores"
          git push origin HEAD:work/cloud-node-providers-latest
