name: One-shot Cloud Node provider stream restore

on:
  push:
    branches:
      - work/cloud-node-providers-latest

permissions:
  contents: write

jobs:
  stream-restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Apply bounded provider restore patch
        run: python3 .github/scripts/cloud-node-provider-stream-restore.py
      - name: Format
        working-directory: engine
        run: cargo fmt --all
      - name: Validate Cloud Node
        working-directory: engine
        run: |
          cargo fmt --all -- --check
          cargo clippy -p cloud-node --all-targets --locked -- -D warnings
          cargo test -p cloud-node --locked
      - name: Commit bounded restore
        run: |
          rm .github/workflows/one-shot-cloud-node-provider-stream-restore.yml
          rm .github/scripts/cloud-node-provider-stream-restore.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "FIX | BUG-CN-PROV-008 stream and range-resume provider restores"
          git push origin HEAD:work/cloud-node-providers-latest
