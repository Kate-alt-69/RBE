name: One-shot Cloud Node provider timeouts

on:
  push:
    branches:
      - work/cloud-node-provider-hardening

permissions:
  contents: write

jobs:
  provider-timeouts:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Bound provider connection and read stalls
        run: |
          python3 - <<'PY'
          from pathlib import Path

          config = Path('engine/crates/cloud-node/src/config.rs')
          text = config.read_text()

          fields_anchor = '''    #[serde(default = "default_reconnect_delay_ms")]\n    pub reconnect_delay_ms: u64,\n}\n\n#[derive(Debug, Clone, Serialize, Deserialize)]\n#[serde(rename_all = "camelCase")]\npub struct ReplicationSettings {\n'''
          fields_replacement = '''    #[serde(default = "default_reconnect_delay_ms")]\n    pub reconnect_delay_ms: u64,\n    #[serde(default = "default_provider_connect_timeout_ms")]\n    pub connect_timeout_ms: u64,\n    #[serde(default = "default_provider_read_timeout_ms")]\n    pub read_timeout_ms: u64,\n}\n\n#[derive(Debug, Clone, Serialize, Deserialize)]\n#[serde(rename_all = "camelCase")]\npub struct ReplicationSettings {\n'''
          if 'pub connect_timeout_ms: u64' not in text:
              if fields_anchor not in text:
                  raise SystemExit('ProviderSettings timeout field anchor not found')
              text = text.replace(fields_anchor, fields_replacement, 1)

          validation_anchor = '''    validate_prefix(&provider.prefix)?;\n    validate_reconnect_delay(provider.reconnect_delay_ms)?;\n\n    if let Some(endpoint) = &provider.endpoint {\n'''
          validation_replacement = '''    validate_prefix(&provider.prefix)?;\n    validate_reconnect_delay(provider.reconnect_delay_ms)?;\n    validate_provider_timeout("connectTimeoutMs", provider.connect_timeout_ms)?;\n    validate_provider_timeout("readTimeoutMs", provider.read_timeout_ms)?;\n\n    if let Some(endpoint) = &provider.endpoint {\n'''
          if 'validate_provider_timeout("connectTimeoutMs"' not in text:
              if validation_anchor not in text:
                  raise SystemExit('provider validation anchor not found')
              text = text.replace(validation_anchor, validation_replacement, 1)

          reconnect_anchor = '''fn validate_reconnect_delay(value: u64) -> anyhow::Result<()> {\n    if !(250..=300_000).contains(&value) {\n        anyhow::bail!("Cloud Node reconnectDelayMs must be between 250 and 300000");\n    }\n    Ok(())\n}\n\n'''
          timeout_validation = reconnect_anchor + '''fn validate_provider_timeout(label: &str, value: u64) -> anyhow::Result<()> {\n    if !(250..=300_000).contains(&value) {\n        anyhow::bail!("Cloud Node provider {label} must be between 250 and 300000");\n    }\n    Ok(())\n}\n\n'''
          if 'fn validate_provider_timeout(' not in text:
              if reconnect_anchor not in text:
                  raise SystemExit('timeout validation function anchor not found')
              text = text.replace(reconnect_anchor, timeout_validation, 1)

          defaults_anchor = '''const fn default_reconnect_delay_ms() -> u64 {\n    2_000\n}\nconst fn default_boot_recovery_timeout_ms() -> u64 {\n'''
          defaults_replacement = '''const fn default_reconnect_delay_ms() -> u64 {\n    2_000\n}\nconst fn default_provider_connect_timeout_ms() -> u64 {\n    10_000\n}\nconst fn default_provider_read_timeout_ms() -> u64 {\n    60_000\n}\nconst fn default_boot_recovery_timeout_ms() -> u64 {\n'''
          if 'const fn default_provider_connect_timeout_ms()' not in text:
              if defaults_anchor not in text:
                  raise SystemExit('provider timeout defaults anchor not found')
              text = text.replace(defaults_anchor, defaults_replacement, 1)

          test_anchor = '''    #[test]\n    fn provider_endpoint_uses_parsed_exact_loopback_rules() {\n'''
          tests = '''    #[test]\n    fn provider_network_timeouts_have_safe_defaults_and_bounds() {\n        let provider: ProviderSettings = serde_json::from_value(serde_json::json!({\n            "kind":"http",\n            "namespace":"prod",\n            "bucket":"rbe",\n            "endpoint":"https://storage.example.test"\n        }))\n        .unwrap();\n        assert_eq!(provider.connect_timeout_ms, 10_000);\n        assert_eq!(provider.read_timeout_ms, 60_000);\n        validate_provider(&provider).unwrap();\n\n        let mut invalid = provider.clone();\n        invalid.connect_timeout_ms = 249;\n        assert!(validate_provider(&invalid).is_err());\n        invalid = provider.clone();\n        invalid.read_timeout_ms = 300_001;\n        assert!(validate_provider(&invalid).is_err());\n    }\n\n'''
          if 'fn provider_network_timeouts_have_safe_defaults_and_bounds()' not in text:
              if test_anchor not in text:
                  raise SystemExit('config test anchor not found')
              text = text.replace(test_anchor, tests + test_anchor, 1)
          config.write_text(text)

          provider = Path('engine/crates/cloud-node/src/provider.rs')
          text = provider.read_text()
          if 'use std::time::{Duration, SystemTime, UNIX_EPOCH};' not in text:
              text = text.replace(
                  'use std::time::{SystemTime, UNIX_EPOCH};\n',
                  'use std::time::{Duration, SystemTime, UNIX_EPOCH};\n',
                  1,
              )
          old_client = '''        let client = Client::builder()\n            .https_only(false)\n            .build()\n'''
          new_client = '''        let client = Client::builder()\n            .https_only(false)\n            .connect_timeout(Duration::from_millis(settings.connect_timeout_ms))\n            .read_timeout(Duration::from_millis(settings.read_timeout_ms))\n            .build()\n'''
          if '.connect_timeout(Duration::from_millis(settings.connect_timeout_ms))' not in text:
              if old_client not in text:
                  raise SystemExit('ProviderClient builder anchor not found')
              text = text.replace(old_client, new_client, 1)
          provider.write_text(text)

          doc = Path('doc/cloud-node.md')
          docs = doc.read_text()
          marker = '''Provider endpoints must use HTTPS outside exact loopback development hosts. Embedded URL credentials, query strings, and fragments are rejected. Provider namespaces are also validated as safe local history components and cannot be `.` or `..`.\n'''
          addition = marker + '''\nProvider HTTP connections are also stall-bounded. `connectTimeoutMs` defaults to `10000` and bounds only connection establishment. `readTimeoutMs` defaults to `60000` and resets after each successful response read, so long streaming transfers can continue indefinitely while a provider that stops producing response data is eventually disconnected. Both values accept 250 through 300000 milliseconds. Cloud Node intentionally does not apply a total request deadline to provider uploads/downloads because that would incorrectly kill valid large transfers.\n'''
          if '`connectTimeoutMs` defaults to `10000`' not in docs:
              if marker not in docs:
                  raise SystemExit('Cloud Node provider timeout docs anchor not found')
              docs = docs.replace(marker, addition, 1)
              doc.write_text(docs)
          PY
      - name: Format
        working-directory: engine
        run: cargo fmt --all
      - name: Clippy
        working-directory: engine
        run: cargo clippy -p cloud-node --all-targets --all-features --locked -- -D warnings
      - name: Test Cloud Node
        working-directory: engine
        run: cargo test -p cloud-node --all-features --locked
      - name: Commit BUG-CN-PROV-016
        run: |
          rm -f .github/workflows/one-shot-cloud-node-provider-timeouts.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "FIX | BUG-CN-PROV-016 bound provider network stalls"
          git push origin HEAD:work/cloud-node-provider-hardening
