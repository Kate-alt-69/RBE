name: One-shot resumable Cloud Node recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-cloud-node-resume.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-land:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Patch, validate, and land resumable recovery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one anchor in {path}, found {count}")
              p.write_text(text.replace(old, new, 1))
              print(f"patched: {label}")

          def replace_between(path, start_marker, end_marker, new, label):
              p = Path(path)
              text = p.read_text()
              start = text.find(start_marker)
              if start < 0:
                  raise SystemExit(f"{label}: start marker missing in {path}")
              end = text.find(end_marker, start)
              if end < 0:
                  raise SystemExit(f"{label}: end marker missing in {path}")
              p.write_text(text[:start] + new + text[end:])
              print(f"patched: {label}")

          transfer = 'engine/crates/cloud-node/src/transfer.rs'
          replace(transfer,
              'pub const MAX_TRANSFER_DATA_BYTES: usize = 8 * 1024 * 1024;\n',
              'pub const MAX_TRANSFER_DATA_BYTES: usize = 8 * 1024 * 1024;\n'
              'pub const RESUME_ACK_HEADER: &str = "x-rbe-cn-resume-ack";\n',
              'resume acknowledgement protocol header')

          lib = 'engine/crates/cloud-node/src/lib.rs'
          replace(lib,
              'pub use transfer::{TransferChunk, TransferResource, MAX_TRANSFER_DATA_BYTES};',
              'pub use transfer::{\n    TransferChunk, TransferResource, MAX_TRANSFER_DATA_BYTES, RESUME_ACK_HEADER,\n};',
              'export resume acknowledgement header')

          recovery = 'engine/crates/cloud-node/src/recovery.rs'
          replace(recovery,
          '''pub struct RecoveryReceipt {
              pub committed: bool,
              pub duplicate: bool,
              pub video_reconstructed: bool,
          }
          ''',
          '''pub struct RecoveryReceipt {
              pub committed: bool,
              pub duplicate: bool,
              pub video_reconstructed: bool,
              /// First byte the sender still needs to transmit for this resource.
              /// A completed resource reports `total_size` so a reconnect can skip it.
              pub next_offset: u64,
          }
          ''', 'recovery progress receipt')

          replace(recovery,
          '''        Ok(Self {
                      session_root,
                      staging_storage,
                      phase: 0,
                      active: None,
                      completed: false,
                  })
              }

              pub fn accept_chunk(&mut self, chunk: &TransferChunk) -> anyhow::Result<RecoveryReceipt> {
          ''',
          '''        Ok(Self {
                      session_root,
                      staging_storage,
                      phase: 0,
                      active: None,
                      completed: false,
                  })
              }

              /// Removes an obsolete private staging tree. This is used only after
              /// the same authenticated peer negotiates a different snapshot root.
              pub fn discard(self) -> anyhow::Result<()> {
                  if self.session_root.exists() {
                      fs::remove_dir_all(&self.session_root)?;
                  }
                  Ok(())
              }

              pub fn accept_chunk(&mut self, chunk: &TransferChunk) -> anyhow::Result<RecoveryReceipt> {
          ''', 'discard obsolete recovery staging')

          replace(recovery,
          '''        chunk.validate()?;
                  self.enforce_recovery_order(chunk)?;
                  self.enforce_resource_dependency(chunk)?;

                  let target = self.resource_target(chunk);
                  if target.is_file() && verify_resource(&target, chunk.resource_sha256, chunk.total_size)? {
                      let video_reconstructed = self.after_resource_committed(chunk, &target)?;
                      return Ok(RecoveryReceipt {
                          committed: true,
                          duplicate: true,
                          video_reconstructed,
                      });
                  }

                  let identity = ResourceIdentity::from(chunk);
          ''',
          '''        chunk.validate()?;

                  // A reauthenticated sender starts its ordered walk at the beginning.
                  // Recognize already-committed staged resources before enforcing the
                  // current phase so reconnects can cheaply replay/skip earlier objects.
                  let target = self.resource_target(chunk);
                  if target.is_file() && verify_resource(&target, chunk.resource_sha256, chunk.total_size)? {
                      let video_reconstructed = self.after_resource_committed(chunk, &target)?;
                      return Ok(RecoveryReceipt {
                          committed: true,
                          duplicate: true,
                          video_reconstructed,
                          next_offset: chunk.total_size,
                      });
                  }

                  self.enforce_recovery_order(chunk)?;
                  self.enforce_resource_dependency(chunk)?;
                  let identity = ResourceIdentity::from(chunk);
          ''', 'allow duplicate replay before phase enforcement')

          replace(recovery,
          '''        if !chunk.final_chunk {
                      return Ok(RecoveryReceipt {
                          committed: false,
                          duplicate,
                          video_reconstructed: false,
                      });
                  }
          ''',
          '''        if !chunk.final_chunk {
                      return Ok(RecoveryReceipt {
                          committed: false,
                          duplicate,
                          video_reconstructed: false,
                          next_offset: active.written,
                      });
                  }
          ''', 'report partial recovery offset')

          replace(recovery,
          '''        Ok(RecoveryReceipt {
                      committed: true,
                      duplicate,
                      video_reconstructed,
                  })
          ''',
          '''        Ok(RecoveryReceipt {
                      committed: true,
                      duplicate,
                      video_reconstructed,
                      next_offset: chunk.total_size,
                  })
          ''', 'report completed recovery offset')

          # Add a regression test: once phase advanced to File, replaying a completed
          # Folder manifest must be accepted as an authenticated duplicate instead of
          # being rejected as a phase regression.
          marker = '''    #[test]
              fn recovery_rejects_phase_regression() {
          '''
          test = '''    #[test]
              fn recovery_allows_completed_earlier_resource_replay() {
                  let root = test_root("resume-replay");
                  fs::create_dir_all(&root).unwrap();
                  let store = CloudNodeStore::open(&settings(&root, "resume-replay")).unwrap();
                  let mut receiver = CloudNodeRecoveryReceiver::open(&store, [6u8; 16]).unwrap();

                  let folder_manifest = BlobManifest {
                      kind: BlobKind::Folder,
                      object_key: object_key(BlobKind::Folder, "root"),
                      content_sha256: folder_digest(&[]),
                      parent_content_sha256: None,
                      logical_path: "root".into(),
                      logical_size: 0,
                      created_unix_ms: 1,
                      body: BlobBody::Folder { entries: Vec::new() },
                  };
                  let folder_bytes = folder_manifest.encode().unwrap();
                  let folder_hash: [u8; 32] = Sha256::digest(&folder_bytes).into();
                  let folder_chunk = TransferChunk::new(
                      BlobKind::Folder,
                      TransferResource::Manifest,
                      folder_manifest.object_key,
                      folder_manifest.content_sha256,
                      folder_hash,
                      0,
                      folder_bytes.len() as u64,
                      folder_bytes,
                  )
                  .unwrap();
                  receiver.accept_chunk(&folder_chunk).unwrap();

                  let file_manifest = BlobManifest {
                      kind: BlobKind::File,
                      object_key: object_key(BlobKind::File, "db/a.db"),
                      content_sha256: Sha256::digest(b"a").into(),
                      parent_content_sha256: None,
                      logical_path: "db/a.db".into(),
                      logical_size: 1,
                      created_unix_ms: 1,
                      body: BlobBody::File { changes: Vec::new() },
                  };
                  let file_bytes = file_manifest.encode().unwrap();
                  let file_hash: [u8; 32] = Sha256::digest(&file_bytes).into();
                  let file_chunk = TransferChunk::new(
                      BlobKind::File,
                      TransferResource::Manifest,
                      file_manifest.object_key,
                      file_manifest.content_sha256,
                      file_hash,
                      0,
                      file_bytes.len() as u64,
                      file_bytes,
                  )
                  .unwrap();
                  receiver.accept_chunk(&file_chunk).unwrap();

                  let replay = receiver.accept_chunk(&folder_chunk).unwrap();
                  assert!(replay.committed);
                  assert!(replay.duplicate);
                  assert_eq!(replay.next_offset, folder_chunk.total_size);
                  fs::remove_dir_all(root).unwrap();
              }

          '''
          replace(recovery, marker, test + marker, 'resume replay regression test')

          client = 'engine/crates/cloud-node/src/client.rs'
          replace(client,
              'use std::path::Path;\n',
              'use std::io::SeekFrom;\nuse std::path::Path;\n',
              'seek import')
          replace(client,
              'use tokio::io::AsyncReadExt;\n',
              'use tokio::io::{AsyncReadExt, AsyncSeekExt};\n',
              'async seek import')
          replace(client,
              'use crate::transfer::{TransferChunk, TransferResource, MAX_TRANSFER_DATA_BYTES};\n',
              'use crate::transfer::{\n    TransferChunk, TransferResource, MAX_TRANSFER_DATA_BYTES, RESUME_ACK_HEADER,\n};\n',
              'client resume header import')

          # All ordinary authenticated frame calls opt out; ObjectChunk opts in.
          text = Path(client).read_text()
          ordinary = '''        MAX_SYNC_RESPONSE_BYTES,
              )
              .await?;'''
          if text.count(ordinary) != 1:
              raise SystemExit('sync frame call anchor changed')
          text = text.replace(ordinary, '''        MAX_SYNC_RESPONSE_BYTES,
                  false,
              )
              .await?;''', 1)
          complete = '''        MAX_TRANSFER_RESPONSE_BYTES,
              )
              .await?;
              if response.kind != FrameKind::SyncComplete'''
          if text.count(complete) != 1:
              raise SystemExit('completion frame call anchor changed')
          text = text.replace(complete, '''        MAX_TRANSFER_RESPONSE_BYTES,
                  false,
              )
              .await?;
              if response.kind != FrameKind::SyncComplete''', 1)
          Path(client).write_text(text)

          replace(client,
          '''        send_chunk(client, settings, peer, &chunk).await?;
                  return Ok(());
          ''',
          '''        let next_offset = send_chunk(client, settings, peer, &chunk).await?;
                  if next_offset != 0 {
                      anyhow::bail!("Cloud Node empty resource acknowledgement has invalid offset");
                  }
                  return Ok(());
          ''', 'empty resource resume acknowledgement')

          replace(client,
          '''        let remaining = total_size - offset;
                  let wanted = usize::try_from(remaining.min(MAX_TRANSFER_DATA_BYTES as u64))
          ''',
          '''        file.seek(SeekFrom::Start(offset)).await?;
                  let remaining = total_size - offset;
                  let wanted = usize::try_from(remaining.min(MAX_TRANSFER_DATA_BYTES as u64))
          ''', 'seek to remote resume offset')

          replace(client,
          '''        send_chunk(client, settings, peer, &chunk).await?;
                  offset = offset
                      .checked_add(read as u64)
                      .ok_or_else(|| anyhow::anyhow!("Cloud Node transfer offset overflow"))?;
          ''',
          '''        offset = send_chunk(client, settings, peer, &chunk).await?;
          ''', 'jump to acknowledged resume offset')

          replace(client,
          '''async fn send_chunk(
              client: &reqwest::Client,
              settings: &CloudNodeSettings,
              peer: &AuthenticatedPeer,
              chunk: &TransferChunk,
          ) -> anyhow::Result<()> {
              let response = post_authenticated_frame(
                  client,
                  settings,
                  peer,
                  TRANSFER_PATH,
                  chunk.into_frame(peer.session)?,
                  MAX_TRANSFER_RESPONSE_BYTES,
              )
              .await?;
              if response.kind != FrameKind::ObjectChunk || !response.payload.is_empty() {
                  anyhow::bail!("Cloud Node upstream returned an invalid object-transfer acknowledgement");
              }
              Ok(())
          }
          ''',
          '''async fn send_chunk(
              client: &reqwest::Client,
              settings: &CloudNodeSettings,
              peer: &AuthenticatedPeer,
              chunk: &TransferChunk,
          ) -> anyhow::Result<u64> {
              let response = post_authenticated_frame(
                  client,
                  settings,
                  peer,
                  TRANSFER_PATH,
                  chunk.into_frame(peer.session)?,
                  MAX_TRANSFER_RESPONSE_BYTES,
                  true,
              )
              .await?;
              if response.kind != FrameKind::ObjectChunk {
                  anyhow::bail!("Cloud Node upstream returned an invalid object-transfer acknowledgement");
              }
              decode_resume_ack(&response.payload, chunk)
          }

          fn decode_resume_ack(payload: &[u8], chunk: &TransferChunk) -> anyhow::Result<u64> {
              let chunk_end = chunk
                  .offset
                  .checked_add(u64::try_from(chunk.data.len())?)
                  .ok_or_else(|| anyhow::anyhow!("Cloud Node transfer acknowledgement range overflow"))?;
              let next_offset = if payload.is_empty() {
                  // Compatibility with a pre-resume server: it acknowledged only
                  // the chunk that was just sent.
                  chunk_end
              } else if payload.len() == 8 {
                  u64::from_be_bytes(payload.try_into()?)
              } else {
                  anyhow::bail!("Cloud Node upstream returned malformed resume acknowledgement");
              };
              if next_offset < chunk_end || next_offset > chunk.total_size {
                  anyhow::bail!("Cloud Node upstream returned an invalid resume offset");
              }
              Ok(next_offset)
          }
          ''', 'resume-aware ObjectChunk acknowledgement')

          replace(client,
          '''    frame: Frame,
              maximum_response_bytes: usize,
          ) -> anyhow::Result<Frame> {
          ''',
          '''    frame: Frame,
              maximum_response_bytes: usize,
              request_resume_ack: bool,
          ) -> anyhow::Result<Frame> {
          ''', 'authenticated frame resume option')

          replace(client,
          '''    let endpoint = format!("{}{}", upstream.url.trim_end_matches('/'), path);
              let response = client
                  .post(endpoint)
                  .header(reqwest::header::CONTENT_TYPE, "application/octet-stream")
                  .header(SESSION_PROOF_HEADER, hex::encode(proof.encode()?))
                  .body(frame.encode()?)
                  .send()
                  .await?;
          ''',
          '''    let endpoint = format!("{}{}", upstream.url.trim_end_matches('/'), path);
              let mut request = client
                  .post(endpoint)
                  .header(reqwest::header::CONTENT_TYPE, "application/octet-stream")
                  .header(SESSION_PROOF_HEADER, hex::encode(proof.encode()?));
              if request_resume_ack {
                  request = request.header(RESUME_ACK_HEADER, "1");
              }
              let response = request.body(frame.encode()?).send().await?;
          ''', 'send resume acknowledgement opt-in header')

          # Unit-test ack parsing without networking.
          Path(client).write_text(Path(client).read_text() + '''

          #[cfg(test)]
          mod tests {
              use super::*;

              #[test]
              fn resume_ack_accepts_old_server_and_forward_progress() {
                  let chunk = TransferChunk::new(
                      BlobKind::File,
                      TransferResource::FilePayload,
                      [1u8; 32],
                      [2u8; 32],
                      [2u8; 32],
                      0,
                      32,
                      vec![7u8; 8],
                  )
                  .unwrap();
                  assert_eq!(decode_resume_ack(&[], &chunk).unwrap(), 8);
                  assert_eq!(decode_resume_ack(&24u64.to_be_bytes(), &chunk).unwrap(), 24);
                  assert!(decode_resume_ack(&4u64.to_be_bytes(), &chunk).is_err());
                  assert!(decode_resume_ack(&33u64.to_be_bytes(), &chunk).is_err());
              }
          }
          ''')

          backend = 'engine/crates/backend/src/maintenance_notice.rs'
          replace(backend,
              '    MAX_AUTH_PROOF_BYTES, MAX_FRAME_BYTES, SESSION_PROOF_HEADER, SETTINGS_FILE_NAME, SYNC_PATH,\n    TRANSFER_PATH,\n',
              '    MAX_AUTH_PROOF_BYTES, MAX_FRAME_BYTES, RESUME_ACK_HEADER, SESSION_PROOF_HEADER,\n    SETTINGS_FILE_NAME, SYNC_PATH, TRANSFER_PATH,\n',
              'backend resume header import')
          replace(backend,
          '''struct RecoveryState {
              expected: SyncPlanHeader,
              receiver: CloudNodeRecoveryReceiver,
          }
          ''',
          '''struct RecoveryState {
              owner_node_id: String,
              expected: SyncPlanHeader,
              receiver: CloudNodeRecoveryReceiver,
          }
          ''', 'authenticated recovery ownership')

          # Helper centralizes opening a staging receiver with authenticated ownership.
          replace(backend,
          '''struct CloudNodeRuntime {
          ''',
          '''fn open_recovery_state(
              runtime: &CloudNodeRuntime,
              owner_node_id: &str,
              session: [u8; 16],
              expected: SyncPlanHeader,
          ) -> anyhow::Result<RecoveryState> {
              Ok(RecoveryState {
                  owner_node_id: owner_node_id.to_owned(),
                  expected,
                  receiver: CloudNodeRecoveryReceiver::open(&runtime.store, session)?,
              })
          }

          struct CloudNodeRuntime {
          ''', 'recovery state constructor')

          new_block = '''    if !roots_match {
              let mut recoveries = match runtime.recoveries.lock() {
                  Ok(recoveries) => recoveries,
                  Err(_) => {
                      tracing::error!("Cloud Node recovery session table is poisoned");
                      return StatusCode::SERVICE_UNAVAILABLE.into_response();
                  }
              };

              if let Some(existing) = recoveries.get(&session.session) {
                  if existing.owner_node_id != session.node_id {
                      return StatusCode::CONFLICT.into_response();
                  }
                  if existing.expected != remote_header {
                      let stale = recoveries
                          .remove(&session.session)
                          .expect("recovery state existed above");
                      if let Err(error) = stale.receiver.discard() {
                          tracing::error!(error = %error, "Cloud Node could not discard obsolete recovery staging");
                          return StatusCode::SERVICE_UNAVAILABLE.into_response();
                      }
                      let replacement = match open_recovery_state(
                          runtime,
                          &session.node_id,
                          session.session,
                          remote_header,
                      ) {
                          Ok(state) => state,
                          Err(error) => {
                              tracing::error!(error = %error, "Cloud Node could not create replacement recovery staging tree");
                              return StatusCode::SERVICE_UNAVAILABLE.into_response();
                          }
                      };
                      recoveries.insert(session.session, replacement);
                  }
              } else if recoveries.is_empty() {
                  let recovery = match open_recovery_state(
                      runtime,
                      &session.node_id,
                      session.session,
                      remote_header,
                  ) {
                      Ok(state) => state,
                      Err(error) => {
                          tracing::error!(error = %error, "Cloud Node could not create recovery staging tree");
                          return StatusCode::SERVICE_UNAVAILABLE.into_response();
                      }
                  };
                  recoveries.insert(session.session, recovery);
              } else {
                  if recoveries.len() != 1 {
                      tracing::error!("Cloud Node recovery table contains multiple active owners");
                      return StatusCode::SERVICE_UNAVAILABLE.into_response();
                  }
                  let (&old_session, existing) = recoveries
                      .iter()
                      .next()
                      .expect("non-empty recovery table checked above");
                  let owner = existing.owner_node_id.clone();
                  let expected = existing.expected;
                  if owner != session.node_id {
                      tracing::warn!(peer = %session.node_id, "Cloud Node recovery is already owned by another authenticated peer");
                      return StatusCode::CONFLICT.into_response();
                  }

                  let stale = recoveries
                      .remove(&old_session)
                      .expect("recovery state existed above");
                  if expected == remote_header {
                      recoveries.insert(session.session, stale);
                      tracing::info!(
                          peer = %session.node_id,
                          "Cloud Node resumed staged recovery after peer reauthentication"
                      );
                  } else {
                      if let Err(error) = stale.receiver.discard() {
                          tracing::error!(error = %error, "Cloud Node could not discard obsolete reauthenticated recovery staging");
                          return StatusCode::SERVICE_UNAVAILABLE.into_response();
                      }
                      let replacement = match open_recovery_state(
                          runtime,
                          &session.node_id,
                          session.session,
                          remote_header,
                      ) {
                          Ok(state) => state,
                          Err(error) => {
                              tracing::error!(error = %error, "Cloud Node could not restart changed recovery snapshot");
                              return StatusCode::SERVICE_UNAVAILABLE.into_response();
                          }
                      };
                      recoveries.insert(session.session, replacement);
                      tracing::info!(
                          peer = %session.node_id,
                          "Cloud Node discarded obsolete staged recovery after snapshot root changed"
                      );
                  }
              }
          }
          '''
          replace_between(backend,
              '    if !roots_match {\n        let mut recoveries',
              '\n\n    tracing::info!(',
              new_block,
              'authenticated recovery reattachment')

          replace(backend,
          '''    let body = match axum::body::to_bytes(request.into_body(), MAX_TRANSFER_REQUEST_BYTES).await {
          ''',
          '''    let resume_ack_requested = request
                  .headers()
                  .get(RESUME_ACK_HEADER)
                  .and_then(|value| value.to_str().ok())
                  .is_some_and(|value| value == "1");
              let body = match axum::body::to_bytes(request.into_body(), MAX_TRANSFER_REQUEST_BYTES).await {
          ''', 'read resume acknowledgement request')

          replace(backend,
          '''                    payload: Vec::new(),
                  },
                  "object transfer acknowledgement",
          ''',
          '''                    payload: if resume_ack_requested {
                          receipt.next_offset.to_be_bytes().to_vec()
                      } else {
                          Vec::new()
                      },
                  },
                  "object transfer acknowledgement",
          ''', 'return receiver resume offset')
          PY

          cd engine
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test -p cloud-node --locked
          cargo test -p backend --locked
          cd ..

          rm -f .github/workflows/one-shot-cloud-node-resume.yml
          git add -A .github/workflows/one-shot-cloud-node-resume.yml \
            engine/crates/cloud-node/src/transfer.rs \
            engine/crates/cloud-node/src/lib.rs \
            engine/crates/cloud-node/src/recovery.rs \
            engine/crates/cloud-node/src/client.rs \
            engine/crates/backend/src/maintenance_notice.rs
          git diff --cached --check
          git commit -m 'FIX | BUG-CN-004 resume Cloud Node recovery after reconnect'
          git pull --rebase origin main
          git push origin HEAD:main
