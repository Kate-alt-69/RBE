name: One-shot Cloud Node S3 endpoint addressing

on:
  push:
    branches:
      - work/cloud-node-providers-latest

permissions:
  contents: write

jobs:
  s3-endpoint:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Fix S3 custom endpoint addressing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('engine/crates/cloud-node/src/provider.rs')
          text = path.read_text()

          anchor = '''    async fn aws_request(\n'''
          helper = '''    fn aws_url(&self, key: &str, region: &str) -> anyhow::Result<Url> {\n        if let Some(endpoint) = self.settings.endpoint.as_deref() {\n            return object_url(\n                endpoint,\n                &format!(\n                    "{}/{}",\n                    encode_path_segment(&self.settings.bucket),\n                    encode_object_key(key)\n                ),\n            );\n        }\n        let endpoint = format!(\n            "https://{}.s3.{}.amazonaws.com",\n            self.settings.bucket, region\n        );\n        object_url(&endpoint, &encode_object_key(key))\n    }\n\n'''
          if 'fn aws_url(&self, key: &str, region: &str)' not in text:
              if anchor not in text:
                  raise SystemExit('aws_request anchor not found')
              text = text.replace(anchor, helper + anchor, 1)

          old = '''        let endpoint = self.settings.endpoint.clone().unwrap_or_else(|| {\n            format!(\n                "https://{}.s3.{}.amazonaws.com",\n                self.settings.bucket, region\n            )\n        });\n        let url = object_url(&endpoint, &encode_object_key(key))?;\n'''
          new = '''        let url = self.aws_url(key, region)?;\n'''
          if old not in text:
              raise SystemExit('S3 endpoint block not found')
          text = text.replace(old, new, 1)

          test_anchor = '''    #[test]\n    fn provider_object_keys_are_namespaced() {\n'''
          tests = '''    #[test]\n    fn s3_default_endpoint_uses_virtual_hosted_bucket() {\n        let settings: ProviderSettings = serde_json::from_value(serde_json::json!({\n            "kind":"amazon-s3",\n            "namespace":"production",\n            "bucket":"rbe-bucket",\n            "region":"ap-south-1"\n        }))\n        .unwrap();\n        let client = ProviderClient::new(&settings).unwrap();\n        let url = client.aws_url("rbe-cn/production/history/HEAD.json", "ap-south-1").unwrap();\n        assert_eq!(\n            url.as_str(),\n            "https://rbe-bucket.s3.ap-south-1.amazonaws.com/rbe-cn/production/history/HEAD.json"\n        );\n    }\n\n    #[test]\n    fn s3_custom_endpoint_uses_path_style_bucket() {\n        let settings: ProviderSettings = serde_json::from_value(serde_json::json!({\n            "kind":"amazon-s3",\n            "namespace":"production",\n            "bucket":"rbe-bucket",\n            "region":"auto",\n            "endpoint":"https://objects.example.invalid"\n        }))\n        .unwrap();\n        let client = ProviderClient::new(&settings).unwrap();\n        let url = client.aws_url("rbe-cn/production/history/HEAD.json", "auto").unwrap();\n        assert_eq!(\n            url.as_str(),\n            "https://objects.example.invalid/rbe-bucket/rbe-cn/production/history/HEAD.json"\n        );\n    }\n\n'''
          if test_anchor not in text:
              raise SystemExit('provider test anchor not found')
          text = text.replace(test_anchor, tests + test_anchor, 1)
          path.write_text(text)
          PY
      - name: Format
        working-directory: engine
        run: cargo fmt --all
      - name: Clippy
        working-directory: engine
        run: cargo clippy -p cloud-node --all-targets --all-features --locked -- -D warnings
      - name: Test Cloud Node
        working-directory: engine
        run: cargo test -p cloud-node --all-features --locked
      - name: Commit BUG-CN-PROV-012
        run: |
          rm -f .github/workflows/one-shot-cloud-node-s3-endpoint.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "FIX | BUG-CN-PROV-012 preserve S3 bucket on custom endpoints"
          git push origin HEAD:work/cloud-node-providers-latest
