name: One-shot Cloud Node Supabase upload semantics

on:
  push:
    branches:
      - work/cloud-node-providers-latest

permissions:
  contents: write

jobs:
  supabase-upload:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Fix Supabase first-write uploads
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('engine/crates/cloud-node/src/provider.rs')
          text = path.read_text()

          anchor = '''    fn apply_supabase_auth(&self, request: RequestBuilder) -> anyhow::Result<RequestBuilder> {\n'''
          helper = '''    fn supabase_upload_method() -> Method {\n        Method::POST\n    }\n\n'''
          if 'fn supabase_upload_method() -> Method' not in text:
              if anchor not in text:
                  raise SystemExit('Supabase auth anchor not found')
              text = text.replace(anchor, helper + anchor, 1)

          old = '''                    self.client\n                        .put(url)\n                        .header("x-upsert", "true")\n'''
          new = '''                    self.client\n                        .request(Self::supabase_upload_method(), url)\n                        .header("x-upsert", "true")\n'''
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'expected exactly 2 Supabase PUT upload blocks, found {count}')
          text = text.replace(old, new)

          test_anchor = '''    #[test]\n    fn provider_object_keys_are_namespaced() {\n'''
          test = '''    #[test]\n    fn supabase_upserts_use_upload_method() {\n        assert_eq!(ProviderClient::supabase_upload_method(), Method::POST);\n    }\n\n'''
          if test_anchor not in text:
              raise SystemExit('provider test anchor not found')
          text = text.replace(test_anchor, test + test_anchor, 1)
          path.write_text(text)
          PY
      - name: Format
        working-directory: engine
        run: cargo fmt --all
      - name: Clippy
        working-directory: engine
        run: cargo clippy -p cloud-node --all-targets --all-features --locked -- -D warnings
      - name: Test Cloud Node
        working-directory: engine
        run: cargo test -p cloud-node --all-features --locked
      - name: Commit BUG-CN-PROV-013
        run: |
          rm -f .github/workflows/one-shot-cloud-node-supabase-upload.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "FIX | BUG-CN-PROV-013 use Supabase upload semantics"
          git push origin HEAD:work/cloud-node-providers-latest
