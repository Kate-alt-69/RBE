name: One-shot Cloud Node I/O hardening

on:
  push:
    paths:
      - ".github/workflows/one-shot-cn235-cn236.yml"

permissions:
  contents: write

jobs:
  patch:
    if: startsWith(github.event.head_commit.message, 'CHORE | CN-235 stage')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Patch Cloud Node credential and peer I/O paths
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          provider = Path('engine/crates/cloud-node/src/provider.rs')
          text = provider.read_text()
          start = text.index('fn resolve_secret_value(name: &str, value: &str)')
          end = text.index('\nfn object_url(', start)
          body = text[start:end]
          needle = '    })?;\n    let mut bytes = Vec::new();'
          replacement = '''    })?;
              let metadata = file.metadata().map_err(|error| {
                  anyhow::anyhow!(
                      "failed to inspect opened Cloud Node provider credential file {} from {name}: {error}",
                      path.display()
                  )
              })?;
              if !metadata.is_file() {
                  anyhow::bail!(
                      "Cloud Node provider credential source {} from {name} must resolve to a regular file",
                      path.display()
                  );
              }
              let mut bytes = Vec::new();'''
          if body.count(needle) != 1:
              raise SystemExit(f'provider credential loader anchor count={body.count(needle)}')
          body = body.replace(needle, replacement, 1)
          text = text[:start] + body + text[end:]

          old_test = '    #[test]\n    fn credential_file_reference_requires_absolute_path() {\n        assert!(resolve_secret_value("RBE_TEST_SECRET", "file:relative/token").is_err());\n    }\n'
          new_test = '    #[test]\n    fn credential_file_reference_requires_absolute_regular_file() {\n        assert!(resolve_secret_value("RBE_TEST_SECRET", "file:relative/token").is_err());\n        let directory = format!("file:{}", std::env::temp_dir().display());\n        assert!(resolve_secret_value("RBE_TEST_SECRET", &directory).is_err());\n    }\n'
          if text.count(old_test) != 1:
              raise SystemExit(f'provider credential test anchor count={text.count(old_test)}')
          provider.write_text(text.replace(old_test, new_test, 1))

          client = Path('engine/crates/cloud-node/src/client.rs')
          text = client.read_text()
          old_const = 'const REQUEST_TIMEOUT: Duration = Duration::from_secs(60);'
          new_const = 'const REQUEST_READ_TIMEOUT: Duration = Duration::from_secs(60);'
          if text.count(old_const) != 1:
              raise SystemExit(f'peer timeout constant anchor count={text.count(old_const)}')
          text = text.replace(old_const, new_const, 1)
          old_builder = '        .connect_timeout(Duration::from_secs(10))\n        .timeout(REQUEST_TIMEOUT)\n'
          new_builder = '        .connect_timeout(Duration::from_secs(10))\n        .read_timeout(REQUEST_READ_TIMEOUT)\n'
          if text.count(old_builder) != 1:
              raise SystemExit(f'peer timeout builder anchor count={text.count(old_builder)}')
          client.write_text(text.replace(old_builder, new_builder, 1))
          PY
          cd engine
          cargo fmt -p cloud-node
          cd ..
      - name: Remove one-shot workflow
        run: git rm .github/workflows/one-shot-cn235-cn236.yml
      - name: Commit and rebase onto live main
        shell: bash
        run: |
          git config user.name "Kate"
          git config user.email "dhwanksh2000@gmail.com"
          git add engine/crates/cloud-node/src/provider.rs engine/crates/cloud-node/src/client.rs
          git commit -m "FIX | BUG-CN-235 BUG-CN-236 harden Cloud Node credential and peer I/O"
          git pull --rebase origin main
      - name: Validate Cloud Node after rebase
        working-directory: engine
        run: |
          cargo fmt -p cloud-node -- --check
          cargo clippy -p cloud-node --all-targets --locked -- -D warnings
          cargo test -p cloud-node --locked
      - name: Push final commit
        run: git push origin HEAD:main
