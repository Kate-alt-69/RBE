name: One-shot CTI K anchor fix

on:
  push:
    paths:
      - '.github/workflows/one-shot-cti-k-anchor-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Harden Phase 4 K patch helper
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/one-shot-cti-phase4-k-implement.yml')
          text = path.read_text(encoding='utf-8')
          import_anchor = '          from pathlib import Path\n'
          if import_anchor not in text:
              raise SystemExit('Phase 4 K Python import anchor missing')
          text = text.replace(import_anchor, import_anchor + '          import re\n', 1)

          start_anchor = '          def replace_once(path, old, new, label):\n'
          end_anchor = '\n\n          ipc = '
          start = text.find(start_anchor)
          if start < 0:
              raise SystemExit('Phase 4 K replace_once helper start missing')
          end = text.find(end_anchor, start)
          if end < 0:
              raise SystemExit('Phase 4 K replace_once helper end missing')

          replacement = '\n'.join([
              '          def replace_once(path, old, new, label):',
              '              p = Path(path)',
              "              text = p.read_text(encoding='utf-8')",
              '              if old in text:',
              "                  p.write_text(text.replace(old, new, 1), encoding='utf-8')",
              '                  return',
              '',
              '              def loose_pattern(block):',
              '                  lines = block.splitlines()',
              "                  return r'\\n'.join(",
              "                      (r'[ \\t]*' + re.escape(line.strip())) if line.strip() else r'[ \\t]*'",
              '                      for line in lines',
              '                  )',
              '',
              '              match = re.search(loose_pattern(old), text)',
              '              if match is None:',
              "                  raise SystemExit(f'{label}: anchor not found in {path}')",
              '              first = match.group(0).splitlines()[0]',
              '              indent = first[:len(first) - len(first.lstrip())]',
              "              normalized = '\\n'.join(",
              "                  (indent + line.strip()) if line.strip() else ''",
              '                  for line in new.splitlines()',
              '              )',
              "              p.write_text(text[:match.start()] + normalized + text[match.end():], encoding='utf-8')",
          ])
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY
      - name: Commit hardened verifier and remove helper
        run: |
          git config user.name 'Kate'
          git config user.email 'dhwanksh2000@gmail.com'
          git add .github/workflows/one-shot-cti-phase4-k-implement.yml
          git rm .github/workflows/one-shot-cti-k-anchor-fix.yml
          git commit -m 'FIX | CTI-005 tolerate verifier indentation drift'
          git pull --rebase origin main
          git push origin HEAD:main
