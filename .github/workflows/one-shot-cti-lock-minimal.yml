name: One-shot CTI minimal lock verify

on:
  push:
    paths:
      - '.github/workflows/one-shot-cti-lock-minimal.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Restore pre-refresh engine lock
        run: git show 4cdb2f0143e64f56bb9de0ad9f2f917a839f31f9:engine/Cargo.lock > engine/Cargo.lock
      - name: Resolve only required CTI dependency additions
        working-directory: engine
        run: cargo check -p route-engine
      - name: Verify locked route-engine
        working-directory: engine
        run: cargo check -p route-engine --locked
      - name: Test Phase 3 CTI assembly
        working-directory: engine
        run: cargo test -p route-engine container_task_assembly --locked
      - name: Clippy route-engine
        working-directory: engine
        run: cargo clippy -p route-engine --all-targets --locked -- -D warnings
      - name: Commit minimal lock and remove verifier
        run: |
          git config user.name 'Kate'
          git config user.email 'dhwanksh2000@gmail.com'
          git add engine/Cargo.lock
          git rm .github/workflows/one-shot-cti-lock-minimal.yml
          git commit -m 'FIX | CTI-003 minimize engine lock integration'
          git pull --rebase origin main
          git push origin HEAD:main
