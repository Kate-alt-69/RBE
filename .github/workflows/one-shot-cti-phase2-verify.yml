name: One-shot CTI Phase 1-2 verify

on:
  push:
    paths:
      - '.github/workflows/one-shot-cti-phase2-verify.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Fix CTI compiler surface
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('engine/crates/route-engine/src/relc_linked_image/container_task_plan')
          for path in root.glob('*.rs'):
              text = path.read_text()
              text = text.replace(
                  'use crate::rel_symbol_discovery::{LinkedRelDiscovery, LinkedRelSymbolSpec};',
                  'use crate::oid_link::LinkedRelSymbolSpec;\nuse crate::rel_symbol_discovery::LinkedRelDiscovery;',
              )
              text = text.replace(
                  'use crate::rel_symbol_discovery::LinkedRelSymbolSpec;',
                  'use crate::oid_link::LinkedRelSymbolSpec;',
              )
              path.write_text(text)

          linked = Path('engine/crates/route-engine/src/relc_linked_image.rs')
          text = linked.read_text()
          old = '.checked_add(container_task_count)\n        .unwrap_or(usize::MAX)'
          new = '.saturating_add(container_task_count)'
          if old not in text:
              raise SystemExit('CTI linked-image capacity anchor missing')
          linked.write_text(text.replace(old, new, 1))
          PY
      - name: Format CTI Phase 1-2 surface only
        run: |
          rustfmt --edition 2021 \
            container-runtime/crates/ipc-protocol/src/container_task_event.rs \
            container-runtime/crates/ipc-protocol/src/container_task_image.rs \
            container-runtime/crates/ipc-protocol/src/root.rs \
            engine/crates/route-engine/src/relc_linked_image.rs \
            engine/crates/route-engine/src/relc_linked_image/container_task_plan/mod.rs \
            engine/crates/route-engine/src/relc_linked_image/container_task_plan/graph.rs \
            engine/crates/route-engine/src/relc_linked_image/container_task_plan/semantic.rs \
            engine/crates/route-engine/src/relc_linked_image/container_task_plan/source_map.rs
      - name: Check route-engine
        working-directory: engine
        run: cargo check -p route-engine --locked
      - name: Test CTI compiler work
        working-directory: engine
        run: cargo test -p route-engine container_task --locked
      - name: Clippy route-engine
        working-directory: engine
        run: cargo clippy -p route-engine --all-targets --locked -- -D warnings
      - name: Commit verified CTI fix
        run: |
          git config user.name 'Kate'
          git config user.email 'dhwanksh2000@gmail.com'
          git add \
            container-runtime/crates/ipc-protocol/src/container_task_event.rs \
            container-runtime/crates/ipc-protocol/src/container_task_image.rs \
            container-runtime/crates/ipc-protocol/src/root.rs \
            engine/crates/route-engine/src/relc_linked_image.rs \
            engine/crates/route-engine/src/relc_linked_image/container_task_plan/mod.rs \
            engine/crates/route-engine/src/relc_linked_image/container_task_plan/graph.rs \
            engine/crates/route-engine/src/relc_linked_image/container_task_plan/semantic.rs \
            engine/crates/route-engine/src/relc_linked_image/container_task_plan/source_map.rs
          if git diff --cached --quiet; then
            echo 'No CTI changes to commit.'
            exit 0
          fi
          git commit -m 'FIX | CTI-003 verify Phase 1-2 compiler surface'
          git pull --rebase origin main
          git push origin HEAD:main
