name: One-shot CTI Phase 3 verify

on:
  push:
    paths:
      - '.github/workflows/one-shot-cti-phase3-verify.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Remove stale Phase 3 import
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('engine/crates/route-engine/src/container_task_assembly.rs')
          source = path.read_text(encoding='utf-8')
          before = '    ContainerTaskAssembler, ContainerTaskAssemblyInput, ContainerTaskIndex,\n'
          after = '    ContainerTaskAssembler, ContainerTaskAssemblyInput,\n'
          if before not in source:
              raise SystemExit('expected stale ContainerTaskIndex import was not found')
          path.write_text(source.replace(before, after, 1), encoding='utf-8')
          PY
      - name: Format Phase 3 surface
        run: |
          rustfmt --edition 2021 \
            engine/crates/route-engine/src/container_task_assembly.rs
      - name: Refresh engine lock for CTI dependencies
        working-directory: engine
        run: cargo generate-lockfile
      - name: Check route-engine
        working-directory: engine
        run: cargo check -p route-engine --locked
      - name: Test Phase 3 CTI assembly
        working-directory: engine
        run: cargo test -p route-engine container_task_assembly --locked
      - name: Clippy route-engine
        working-directory: engine
        run: cargo clippy -p route-engine --all-targets --locked -- -D warnings
      - name: Commit verified Phase 3 surface and remove verifier
        run: |
          git config user.name 'Kate'
          git config user.email 'dhwanksh2000@gmail.com'
          git add \
            engine/Cargo.lock \
            engine/crates/route-engine/src/container_task_assembly.rs
          git rm .github/workflows/one-shot-cti-phase3-verify.yml
          git commit -m 'FIX | CTI-003 verify Task assembly bridge'
          git pull --rebase origin main
          git push origin HEAD:main
# retry after clippy identified the single stale import
