name: One-shot CTI Phase 4 E verify

on:
  push:
    paths:
      - '.github/workflows/one-shot-cti-phase4-e-verify.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Fix non-const Arc-backed getters
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('container-runtime/crates/container-runtime-core/src/container_task_loader.rs')
          source = path.read_text(encoding='utf-8')
          replacements = {
              'pub const fn task_oid(&self)': 'pub fn task_oid(&self)',
              'pub const fn runtime_image_sha256(&self)': 'pub fn runtime_image_sha256(&self)',
              'pub const fn task_semantic_sha256(&self)': 'pub fn task_semantic_sha256(&self)',
              'pub const fn target_id(&self)': 'pub fn target_id(&self)',
          }
          for old, new in replacements.items():
              if old not in source:
                  raise SystemExit(f'expected getter signature not found: {old}')
              source = source.replace(old, new, 1)
          path.write_text(source, encoding='utf-8')
          PY
      - name: Format Phase 4 loader
        run: rustfmt --edition 2021 container-runtime/crates/container-runtime-core/src/container_task_loader.rs
      - name: Check Container Task loader
        working-directory: container-runtime
        run: cargo check -p container-runtime-core --locked
      - name: Test Container Task loader
        working-directory: container-runtime
        run: cargo test -p container-runtime-core container_task_loader --locked
      - name: Clippy Container Task loader
        working-directory: container-runtime
        run: cargo clippy -p container-runtime-core --all-targets --locked -- -D warnings -A clippy::chunks-exact-to-as-chunks
      - name: Commit verified loader and remove verifier
        run: |
          git config user.name 'Kate'
          git config user.email 'dhwanksh2000@gmail.com'
          git add container-runtime/crates/container-runtime-core/src/container_task_loader.rs
          git rm .github/workflows/one-shot-cti-phase4-e-verify.yml
          git commit -m 'FIX | CTI-004 verify RuntimeImage Task loader'
          git pull --rebase origin main
          git push origin HEAD:main
# Phase 1 SHA helper has a Rust 1.99-only chunks_exact lint; keep E verification scoped.
