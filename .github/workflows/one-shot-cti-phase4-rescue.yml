name: One-shot CTI Phase 4 rescue

on:
  push:
    paths:
      - '.github/workflows/one-shot-cti-phase4-rescue.yml'

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Extract hardened Phase 4 implementation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/one-shot-cti-phase4-k-implement.yml').read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          start = workflow.find(marker)
          if start < 0:
              raise SystemExit('Phase 4 implementation Python block start missing')
          start += len(marker)
          end = workflow.find('\n          PY', start)
          if end < 0:
              raise SystemExit('Phase 4 implementation Python block end missing')
          script = textwrap.dedent(workflow[start:end])

          import_anchor = 'from pathlib import Path\n'
          if import_anchor not in script:
              raise SystemExit('Phase 4 Path import missing')
          script = script.replace(import_anchor, import_anchor + 'import re\n', 1)

          old = '''def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'{label}: anchor not found in {path}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')
          '''
          new = '''def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old in text:
                  p.write_text(text.replace(old, new, 1), encoding='utf-8')
                  return

              def loose_pattern(block):
                  lines = block.splitlines()
                  return r'\\n'.join(
                      (r'[ \\t]*' + re.escape(line.strip())) if line.strip() else r'[ \\t]*'
                      for line in lines
                  )

              match = re.search(loose_pattern(old), text)
              if match is None:
                  raise SystemExit(f'{label}: anchor not found in {path}')
              first = match.group(0).splitlines()[0]
              indent = first[:len(first) - len(first.lstrip())]
              normalized = '\\n'.join(
                  (indent + line.strip()) if line.strip() else ''
                  for line in new.splitlines()
              )
              p.write_text(text[:match.start()] + normalized + text[match.end():], encoding='utf-8')
          '''
          if old not in script:
              raise SystemExit('Phase 4 replace_once helper shape missing')
          script = script.replace(old, new, 1)
          Path('/tmp/rbe-cti-phase4-apply.py').write_text(script, encoding='utf-8')
          PY
      - name: Apply ExecuteTask IPC and Controller integration
        run: python3 /tmp/rbe-cti-phase4-apply.py
      - name: Format Phase 4 K surface
        run: |
          rustfmt --edition 2021 \
            container-runtime/crates/ipc-protocol/src/lib.rs \
            container-runtime/crates/container-bin/src/main.rs \
            engine/crates/core/src/container_client.rs
      - name: Check Container IPC and Controller
        working-directory: container-runtime
        run: cargo check -p ipc-protocol -p container-bin --locked
      - name: Test ExecuteTask wire contract
        working-directory: container-runtime
        run: cargo test -p ipc-protocol execute_task --locked
      - name: Test Controller Task resolution
        working-directory: container-runtime
        run: cargo test -p container-bin execute_task_resolves --locked
      - name: Clippy Container Phase 4 K
        working-directory: container-runtime
        run: cargo clippy -p ipc-protocol -p container-bin --all-targets --locked -- -D warnings -A clippy::chunks-exact-to-as-chunks
      - name: Check Backend Container client
        working-directory: engine
        run: cargo check -p core-lib --locked
      - name: Test Backend ExecuteTask client
        working-directory: engine
        run: cargo test -p core-lib execute_task --locked
      - name: Clippy Backend ExecuteTask client
        working-directory: engine
        run: cargo clippy -p core-lib --all-targets --locked -- -D warnings
      - name: Commit verified ExecuteTask integration
        run: |
          git config user.name 'Kate'
          git config user.email 'dhwanksh2000@gmail.com'
          git add \
            container-runtime/crates/ipc-protocol/src/lib.rs \
            container-runtime/crates/container-bin/src/main.rs \
            engine/crates/core/src/container_client.rs
          git commit -m 'FEAT | CTI-005 add ExecuteTask addressing IPC'
          git reset --hard HEAD
          git pull --rebase origin main
          git push origin HEAD:main
