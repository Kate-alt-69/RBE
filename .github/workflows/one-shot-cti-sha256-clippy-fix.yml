name: One-shot CTI SHA-256 clippy fix

on:
  push:
    paths:
      - '.github/workflows/one-shot-cti-sha256-clippy-fix.yml'

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Replace fixed-size chunk iterators
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('container-runtime/crates/ipc-protocol/src/container_task_image.rs')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'for chunk in input[..whole].chunks_exact(64) {':
                  'for chunk in input[..whole].as_chunks::<64>().0 {',
              'for chunk in tail[..padded].chunks_exact(64) {':
                  'for chunk in tail[..padded].as_chunks::<64>().0 {',
              'for (index, word) in chunk.chunks_exact(4).take(16).enumerate() {':
                  'for (index, word) in chunk.as_chunks::<4>().0.iter().take(16).enumerate() {',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'CTI SHA-256 clippy anchor missing: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          rustfmt --edition 2021 container-runtime/crates/ipc-protocol/src/container_task_image.rs
      - name: Check Container workspace
        working-directory: container-runtime
        run: cargo check --workspace --all-targets --locked
      - name: Clippy Container workspace
        working-directory: container-runtime
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test Container workspace
        working-directory: container-runtime
        run: cargo test --workspace --all-targets --locked
      - name: Commit verified clippy cleanup
        run: |
          git config user.name 'Kate'
          git config user.email 'dhwanksh2000@gmail.com'
          git add container-runtime/crates/ipc-protocol/src/container_task_image.rs
          git commit -m 'FIX | CTI-007 modernize SHA-256 chunk iteration'
          git pull --rebase origin main
          git push origin HEAD:main
