name: One-shot fix Route export stager

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-fix-route-export-stager.yml'

permissions:
  contents: write

jobs:
  patch-stager:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make RouteFile compatibility scan ignore destructuring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Kate"
          git config user.email "dhwanksh2000@gmail.com"
          git pull --rebase origin main
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/one-shot-phase4-route-exports-v2.yml')
          text = path.read_text()
          old = '''                      if rel < 0:\n                          raise SystemExit(f'RouteFile literal in {path} has no class_name field')\n                      line_start = block.rfind('\\n', 0, rel) + 1'''
          new = '''                      if rel < 0:\n                          # `RouteFile { ... }` is also used for destructuring patterns.\n                          # Only constructors contain a `class_name:` field.\n                          pos = end\n                          continue\n                      line_start = block.rfind('\\n', 0, rel) + 1'''
          if text.count(old) != 1:
              raise SystemExit('RouteFile scanner failure anchor changed; refusing blind edit')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/one-shot-fix-route-export-stager.yml
          git add .github/workflows/one-shot-phase4-route-exports-v2.yml .github/workflows/one-shot-fix-route-export-stager.yml
          git commit -m "CHORE | SVC-OID-345 ignore RouteFile destructuring in stager"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main
          done
          exit 1
