name: One-shot stable service atomic update fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-fix-service-atomic-stable.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace unstable atomic try_update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Kate"
          git config user.email "dhwanksh2000@gmail.com"
          git pull --rebase origin main
          python3 - <<'PY'
          from pathlib import Path

          path = Path('engine/crates/service-runtime/src/manager.rs')
          text = path.read_text()
          old = '.try_update(Ordering::AcqRel, Ordering::Acquire, |value| {'
          new = '.fetch_update(Ordering::AcqRel, Ordering::Acquire, |value| {'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one unstable try_update call, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY

          cd engine
          cargo fmt -p service-runtime
          cargo check -p service-runtime --locked
          cargo test -p service-runtime --locked
          cargo clippy -p service-runtime --all-targets --locked -- -D warnings
          cargo fmt -p service-runtime -- --check
          cd ..

          changed="$(git status --porcelain | awk '{print $2}')"
          if [ "$changed" != "engine/crates/service-runtime/src/manager.rs" ]; then
            echo "unexpected files changed:" >&2
            printf '%s\n' "$changed" >&2
            exit 1
          fi

          git add engine/crates/service-runtime/src/manager.rs
          git commit -m "FIX | BUG-SVC-515 use stable atomic fetch_update"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main
          done
          echo "failed to fast-forward push BUG-SVC-515" >&2
          exit 1
