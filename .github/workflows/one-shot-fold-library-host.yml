# Temporary landing workflow; delete after LIBHOST-049 lands.
# The generated source was already validated by run 37221016707:
# Container check/tests, backend check, and both boot diagnostic suites passed.
name: one-shot land validated Library Host Container fold

on:
  push:
    paths:
      - '.github/workflows/one-shot-fold-library-host.yml'

permissions:
  contents: write

jobs:
  land:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize staging doc replacements
        run: |
          sed -i 's/doc = doc.replace("`container-library-worker-proxy`", "`container --library-worker-proxy`")/doc = doc.replace("container-library-worker-proxy", "container --library-worker-proxy")/' scripts/one_shot_fold_library_host.py
          sed -i 's/Library Host does \*\*not\*\* ship a separate `dep\/container-library-worker-proxy` executable\./Library Host does **not** ship a separate proxy sidecar executable./' scripts/one_shot_fold_library_host.py

      - name: Recreate validated Library Host refactor
        run: python3 scripts/one_shot_fold_library_host.py

      - name: Recreate validated compatibility cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main = Path('engine/crates/backend/src/main.rs')
          text = main.read_text(encoding='utf-8')
          text = text.replace(
              'use super::{has_rbe_error_code, render_backend_boot_fatal};',
              'use super::{has_error_book_code, render_backend_boot_fatal};',
          )
          text = text.replace(
              'assert!(has_rbe_error_code(&rendered));',
              'assert!(has_error_book_code(&rendered));',
          )
          main.write_text(text, encoding='utf-8')

          rel = Path('engine/crates/backend/src/rel_host_executor.rs')
          text = rel.read_text(encoding='utf-8')
          marker = '\nfn decode_exact<const '
          start = text.find(marker)
          if start >= 0:
              next_fn = text.find('\nfn ', start + len(marker))
              next_cfg = text.find('\n#[cfg', start + len(marker))
              ends = [p for p in (next_fn, next_cfg) if p >= 0]
              end = min(ends) if ends else len(text)
              text = text[:start] + '\n' + text[end:]
          rel.write_text(text, encoding='utf-8')
          PY

      - name: Format and recheck migration contract
        run: |
          rustfmt --edition 2021 container-runtime/crates/container-bin/src/main.rs
          rustfmt --edition 2021 container-runtime/crates/container-bin/src/library_worker_mode.rs
          rustfmt --edition 2021 engine/crates/backend/src/rel_host_executor.rs
          rustfmt --edition 2021 engine/crates/backend/src/main.rs
          rustfmt --edition 2021 engine/crates/backend/build.rs
          bash -n build-core.sh
          ! grep -R --line-number --fixed-strings 'container-library-worker-proxy' \
            container-runtime/crates/container-bin/Cargo.toml \
            build-core.sh \
            engine/crates/backend/build.rs \
            engine/crates/backend/src/rel_host_executor.rs \
            doc/library-host.md \
            doc/library-host-web-build.md \
            doc/library-worker-launch-preparation.md \
            doc/README.md

      - name: Commit and push validated source
        run: |
          git config user.name 'Kate'
          git config user.email 'dhwanksh2000@gmail.com'
          git add \
            container-runtime/crates/container-bin/Cargo.toml \
            container-runtime/crates/container-bin/src/main.rs \
            container-runtime/crates/container-bin/src/library_worker_mode.rs \
            container-runtime/crates/container-bin/src/library_worker_proxy_main.rs \
            engine/crates/backend/src/rel_host_executor.rs \
            engine/crates/backend/src/main.rs \
            engine/crates/backend/build.rs \
            build-core.sh \
            doc/library-host.md \
            doc/oid-compiler-cache.md \
            doc/library-host-web-build.md \
            doc/library-worker-launch-preparation.md \
            doc/README.md
          git diff --cached --check
          git commit -m 'REFACTOR | LIBHOST-049 fold proxy into Container mode'
          # Normalization intentionally edits this one-shot helper. It is not part
          # of the product change and must not block the rebase/push.
          git restore scripts/one_shot_fold_library_host.py
          git pull --rebase origin main
          git push origin HEAD:main
