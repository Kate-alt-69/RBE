name: One-shot BUG-IPC-LNX-001 diagnostics

"on":
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-ipc-lnx-diagnostics.yml'

permissions:
  contents: write

jobs:
  validate-and-land:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Apply, validate and land BUG-IPC-LNX-001 diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python3 .github/patches/ipc-lnx-diagnostics.py
          rm -f .github/patches/ipc-lnx-diagnostics.py
          rm -f .github/workflows/one-shot-ipc-lnx-diagnostics.yml

          cd engine
          cargo fmt --all
          cargo check -p backend -p service-runtime --all-targets --locked
          cargo test -p service-runtime malformed_ipc_classifier --locked
          cargo clippy -p backend -p service-runtime --all-targets --locked -- -D warnings
          cd ..

          grep -q 'rejected malformed Host Capability frame' engine/crates/backend/src/host_capability.rs
          grep -q 'rejected malformed Service Mother IPC' engine/crates/service-runtime/src/mother.rs
          grep -q 'malformed service IPC HTTP-like preview' engine/crates/service-runtime/src/lib.rs
          grep -q 'first4_hex' engine/crates/backend/src/host_capability.rs
          grep -q 'classification' engine/crates/service-runtime/src/mother.rs

          git add -A
          git diff --cached --check
          git commit -m 'FIX | BUG-IPC-LNX-001 instrument malformed local IPC'

          git pull --rebase origin main
          git push origin HEAD:main
