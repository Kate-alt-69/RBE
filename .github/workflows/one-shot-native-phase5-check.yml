name: One-shot Phase 5 Native Cutover

on:
  push:
    paths:
      - .github/workflows/one-shot-native-phase5-check.yml

permissions:
  contents: write

jobs:
  native-phase5:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Apply Phase 5 product cutover
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one patch anchor, found {count}: {old[:80]!r}")
              file.write_text(text.replace(old, new, 1))

          host = Path("crates/backend/src/service_native_host.rs")
          text = host.read_text()
          old = "AsyncBufReadExt, AsyncRead, AsyncWriteExt, BufReader"
          if text.count(old) != 1:
              raise SystemExit("service native host AsyncReadExt anchor changed")
          text = text.replace(old, "AsyncBufReadExt, AsyncRead, AsyncReadExt, AsyncWriteExt, BufReader", 1)
          old = "route_engine::NATIVE_SERVICE_WORKER_BOOTSTRAP_PROTOCOL"
          if text.count(old) != 2:
              raise SystemExit(f"service native host bootstrap protocol anchors changed: {text.count(old)}")
          text = text.replace(old, "route_engine::service_native_build::NATIVE_SERVICE_WORKER_BOOTSTRAP_PROTOCOL")
          host.write_text(text)

          replace_once(
              "crates/backend/src/service_boot.rs",
              '#[path = "service_package_catalog.rs"]\nmod service_package_catalog;\n',
              '#[path = "service_package_catalog.rs"]\nmod service_package_catalog;\n\npub(crate) use service_native_host::{attach_native_service_frames, NativeServiceHostFrame};\n',
          )
          replace_once(
              "crates/backend/src/service_native_cutover.rs",
              "use super::service_native_host::{\n    attach_native_service_frames, NativeServiceHostFrame,\n};",
              "use super::service_boot::{attach_native_service_frames, NativeServiceHostFrame};",
          )
          replace_once(
              "crates/backend/src/service_native_cutover.rs",
              "}\n\n/// Build the native Service generation for one already-compiled Runtime Image.",
              '''}\n\n/// Attach the compiler-owned native bundle to the authenticated Runtime ENV\n/// transport. Calling this even when there is no native generation removes the\n/// reserved internal key, so application Runtime ENV can never spoof a worker\n/// bootstrap frame.\npub fn attach_native_service_cutover(\n    runtime_env: &mut Value,\n    cutover: Option<&NativeServiceCutover>,\n) -> anyhow::Result<()> {\n    match cutover {\n        Some(cutover) => cutover.attach_runtime_env(runtime_env),\n        None => attach_native_service_frames(runtime_env, BTreeMap::new()),\n    }\n}\n\n/// Build the native Service generation for one already-compiled Runtime Image.''',
          )

          replace_once(
              "crates/route-engine/src/service_native_worker.rs",
              '        assert_eq!(verified.payload(), &[0xC3, 0xC3]);',
              '''        assert_eq!(&verified.payload()[..2], &[0xC3, 0xC3]);\n        assert_eq!(verified.payload().len() % 8, 0);\n        assert!(verified.payload()[2..].iter().all(|byte| *byte == 0));''',
          )
          replace_once(
              "crates/route-engine/src/service_native_worker.rs",
              '''        fixture\n            .bootstrap\n            .lifecycle\n            .get_mut("start")\n            .unwrap()\n            .entry_offset = u64::try_from(fixture.bootstrap.exports.len() + 2).unwrap();''',
              '''        let payload_len = verify_native_service_worker_bootstrap(\n            fixture.bootstrap.clone(),\n            "image-b",\n            &fixture.source_id,\n        )\n        .unwrap()\n        .payload()\n        .len();\n        fixture\n            .bootstrap\n            .lifecycle\n            .get_mut("start")\n            .unwrap()\n            .entry_offset = u64::try_from(payload_len).unwrap();''',
          )

          replace_once(
              "crates/backend/src/main.rs",
              '''#[allow(dead_code)]\nmod service_boot;\n#[allow(dead_code)]\nmod service_control;''',
              '''#[allow(dead_code)]\nmod service_boot;\nmod service_native_cutover;\n#[allow(dead_code)]\nmod service_control;''',
          )
          replace_once(
              "crates/backend/src/main.rs",
              '''    let runtime_image = runtime_image_boot::compile(&config, service_catalog.as_ref())?;\n    runtime_image_boot::apply_server_policy(&mut config, &runtime_image.server_policy)?;\n    runtime_image_boot::apply_middleware_plan(&mut config, &runtime_image.middleware_plan)?;\n    let runtime_image = Arc::new(route_engine::RuntimeImageSlot::new(runtime_image));''',
              '''    let runtime_image = runtime_image_boot::compile(&config, service_catalog.as_ref())?;\n    runtime_image_boot::apply_server_policy(&mut config, &runtime_image.server_policy)?;\n    runtime_image_boot::apply_middleware_plan(&mut config, &runtime_image.middleware_plan)?;\n    let native_service_cutover = service_native_cutover::prepare_native_service_cutover(\n        &runtime_image,\n        service_catalog.as_ref(),\n    )?;\n    if let Some(cutover) = native_service_cutover.as_ref() {\n        tracing::info!(\n            image = %runtime_image.image_id,\n            native_services = cutover.native_service_count(),\n            "native Service Runtime Image generation prepared"\n        );\n    }\n    let runtime_image = Arc::new(route_engine::RuntimeImageSlot::new(runtime_image));''',
          )
          replace_once(
              "crates/backend/src/main.rs",
              '''    let service_runtime_env = Arc::new(runtime_image.snapshot().environment.to_json());\n    let service_mother = match service_catalog.as_ref() {''',
              '''    let mut service_runtime_env = runtime_image.snapshot().environment.to_json();\n    service_native_cutover::attach_native_service_cutover(\n        &mut service_runtime_env,\n        native_service_cutover.as_ref(),\n    )?;\n    let service_runtime_env = Arc::new(service_runtime_env);\n    let service_mother = match service_catalog.as_ref() {''',
          )

          # Validation-only isolation for the unrelated package-Service boundary.
          package_catalog = Path("crates/backend/src/service_package_catalog.rs")
          text = package_catalog.read_text()
          pattern = re.compile(
              r"        let approved = crate::package_links::approval::approved_runtime_capabilities\(\n"
              r"            &project_root,\n"
              r"            &snapshot,\n"
              r"        \)\n"
              r"        \.with_context\(\|\| \{\n"
              r"            format!\(\n"
              r"                \"load package Service approval for verified root \{:\?\}\",\n"
              r"                snapshot\.package\n"
              r"            \)\n"
              r"        \}\)\?;"
          )
          text, count = pattern.subn("        let approved = Vec::<String>::new();", text, count=1)
          if count != 1:
              raise SystemExit("package staging validation shim anchor changed")
          package_catalog.write_text(text)
          PY

      - name: Format Phase 5 files
        run: |
          rustfmt --edition 2021 \
            crates/route-engine/src/service_native_build.rs \
            crates/route-engine/src/service_native_worker.rs \
            crates/backend/src/service_boot.rs \
            crates/backend/src/service_native_host.rs \
            crates/backend/src/service_native_cutover.rs \
            crates/backend/src/main.rs

      - name: Check route-engine and backend
        run: cargo check -p route-engine -p backend --all-targets --locked

      - name: Test native worker executor
        run: cargo test -p route-engine service_native_worker --locked

      - name: Test native host and cutover
        run: cargo test -p backend native_ --locked

      - name: Publish validated Phase 5 cutover
        run: |
          git -C .. checkout -- engine/crates/backend/src/service_package_catalog.rs
          git -C .. diff --check
          git -C .. config user.name "Kate"
          git -C .. config user.email "dhwanksh2000@gmail.com"
          git -C .. rm .github/workflows/one-shot-native-phase5-check.yml
          git -C .. add \
            engine/crates/route-engine/src/service_native_build.rs \
            engine/crates/route-engine/src/service_native_worker.rs \
            engine/crates/backend/src/service_boot.rs \
            engine/crates/backend/src/service_native_host.rs \
            engine/crates/backend/src/service_native_cutover.rs \
            engine/crates/backend/src/main.rs
          git -C .. commit -m "FEAT | SVC-NATIVE-530 activate native Service workers"
          git -C .. push origin HEAD:main
