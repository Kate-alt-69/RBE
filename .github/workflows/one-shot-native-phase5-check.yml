name: One-shot Phase 5 Native Validation

on:
  push:
    paths:
      - .github/workflows/one-shot-native-phase5-check.yml

permissions:
  contents: read

jobs:
  native-phase5:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Apply validation-only fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          host = Path("crates/backend/src/service_native_host.rs")
          text = host.read_text()
          text = text.replace(
              "AsyncBufReadExt, AsyncRead, AsyncWriteExt, BufReader",
              "AsyncBufReadExt, AsyncRead, AsyncReadExt, AsyncWriteExt, BufReader",
          )
          text = text.replace(
              "route_engine::NATIVE_SERVICE_WORKER_BOOTSTRAP_PROTOCOL",
              "route_engine::service_native_build::NATIVE_SERVICE_WORKER_BOOTSTRAP_PROTOCOL",
          )
          host.write_text(text)

          # Parallel package-Service staging currently reaches a backend-only
          # approval helper from service.exe. That boundary is unrelated to this
          # Phase-5 worker slice; disable package Service admission only inside
          # this disposable checkout so native compilation can be validated.
          package_catalog = Path("crates/backend/src/service_package_catalog.rs")
          text = package_catalog.read_text()
          pattern = re.compile(
              r"        let approved = crate::package_links::approval::approved_runtime_capabilities\(\n"
              r"            &project_root,\n"
              r"            &snapshot,\n"
              r"        \)\n"
              r"        \.with_context\(\|\| \{\n"
              r"            format!\(\n"
              r"                \"load package Service approval for verified root \{:\?\}\",\n"
              r"                snapshot\.package\n"
              r"            \)\n"
              r"        \}\)\?;"
          )
          text, count = pattern.subn("        let approved = Vec::<String>::new();", text, count=1)
          if count != 1:
              raise SystemExit("package staging validation shim anchor changed")
          package_catalog.write_text(text)
          PY
      - name: Format native Phase 5 files
        run: |
          rustfmt --edition 2021 \
            crates/route-engine/src/service_native_build.rs \
            crates/route-engine/src/service_native_worker.rs \
            crates/backend/src/service_boot.rs \
            crates/backend/src/service_native_host.rs
      - name: Check route-engine and backend
        run: cargo check -p route-engine -p backend --all-targets --locked
      - name: Test native worker executor
        run: cargo test -p route-engine service_native_worker --locked
      - name: Test native host transport
        run: cargo test -p backend native_ --locked
