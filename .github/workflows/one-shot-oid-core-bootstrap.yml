name: One-shot backend OID core bootstrap

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-oid-core-bootstrap.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire project OID core cache into backend compile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Kate"
          git config user.email "dhwanksh2000@gmail.com"
          git pull --rebase origin main
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path('install-runtime/Cargo.toml')
          manifest_text = manifest.read_text()
          reqwest_line = 'reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }\n'
          if reqwest_line not in manifest_text:
              raise SystemExit('install-runtime dependency anchor changed; refusing blind edit')
          additions = []
          if '\nserde = ' not in manifest_text:
              additions.append('serde = { version = "1", features = ["derive"] }')
          if '\nserde_json = ' not in manifest_text:
              additions.append('serde_json = "1"')
          if additions:
              manifest_text = manifest_text.replace(
                  reqwest_line,
                  reqwest_line + '\n'.join(additions) + '\n',
                  1,
              )
              manifest.write_text(manifest_text)

          package_links = Path('engine/crates/backend/src/package_links.rs')
          package_text = package_links.read_text()
          old_version_diag = '''                "RPX package index version mismatch for explicit root {:?}: lock={}, index={}",\n                verified.package,\n                verified.version\n'''
          new_version_diag = '''                "RPX package index version mismatch for explicit root {:?}: lock={}, index={}",\n                verified.package,\n                verified.version,\n                index.package.version\n'''
          if package_text.count(old_version_diag) != 1:
              raise SystemExit('package version diagnostic shape changed; refusing blind edit')
          package_links.write_text(package_text.replace(old_version_diag, new_version_diag, 1))

          deployment = Path('engine/crates/backend/src/deployment_worker/mod.rs')
          deployment_text = deployment.read_text()
          old_publisher = 'let publisher = PublisherClient::new(&config.publisher_base, config.helper_token)?;'
          new_publisher = 'let publisher = PublisherClient::new(&config.publisher_base, config.helper_token.clone())?;'
          if deployment_text.count(old_publisher) != 1:
              raise SystemExit('deployment worker publisher construction changed; refusing blind edit')
          deployment.write_text(deployment_text.replace(old_publisher, new_publisher, 1))

          tcp_listen = Path('engine/crates/backend/src/package_links/tcp_listen.rs')
          tcp_text = tcp_listen.read_text()
          old_stale = '''                match listener.last_touch.lock() {\n                    Ok(last_touch) => last_touch.elapsed() >= LISTENER_IDLE_LEASE,\n                    Err(_) => true,\n                }\n'''
          new_stale = '''                let idle = match listener.last_touch.lock() {\n                    Ok(last_touch) => last_touch.elapsed() >= LISTENER_IDLE_LEASE,\n                    Err(_) => true,\n                };\n                idle\n'''
          if tcp_text.count(old_stale) != 1:
              raise SystemExit('TCP listener reaper lifetime shape changed; refusing blind edit')
          tcp_listen.write_text(tcp_text.replace(old_stale, new_stale, 1))

          path = Path('engine/crates/backend/src/runtime_image_boot.rs')
          text = path.read_text()
          compile_anchor = 'pub fn compile(config: &Config, catalog: Option<&ServiceCatalog>) -> anyhow::Result<RuntimeImage> {\n    let root = runtime_paths::binary_dir();\n'
          if text.count(compile_anchor) != 1:
              raise SystemExit(f'backend compile anchor changed; found {text.count(compile_anchor)} matches')
          helper = '''fn prepare_core_oid_cache(root: &Path) -> anyhow::Result<route_engine::CoreMaterializationReport> {\n    let report = route_engine::prepare_service_oid_cache(root).map_err(|error| {\n        anyhow::anyhow!(\n            "RBE5100 Backend could not prepare the project OID compiler cache.\\n\\nCache:\\n  {}\\n\\nError:\\n  {error}\\n\\nNote:\\n  Corrupt/stale disposable OID cache state is rebuilt automatically. This failure is a real target, permission, capacity, or compiler invariant error. Startup stopped before the API listener was bound.\\n\\nHelp:\\n  {RUNTIME_IMAGE_COMPILE_HELP}",\n            route_engine::oid_cache_root(root).display()\n        )\n    })?;\n    tracing::debug!(\n        target = %report.target.label(),\n        generation = report.index_generation,\n        total = report.total,\n        written = report.written,\n        reused = report.reused,\n        cache = %route_engine::oid_cache_root(root).display(),\n        "prepared project OID compiler cache"\n    );\n    Ok(report)\n}\n\n'''
          text = text.replace(
              compile_anchor,
              helper + compile_anchor.replace(
                  '    let root = runtime_paths::binary_dir();\n',
                  '    let root = runtime_paths::binary_dir();\n    prepare_core_oid_cache(&root)?;\n',
              ),
              1,
          )
          test_anchor = '    use super::*;\n\n'
          if text.count(test_anchor) < 1:
              raise SystemExit('runtime_image_boot test import anchor missing')
          test = '''    #[test]\n    fn backend_compile_root_prepares_and_reuses_core_oid_cache() {\n        let nonce = std::time::SystemTime::now()\n            .duration_since(std::time::UNIX_EPOCH)\n            .expect("system clock before UNIX epoch")\n            .as_nanos();\n        let root = std::env::temp_dir().join(format!(\n            "rbe-backend-oid-bootstrap-{}-{nonce}",\n            std::process::id()\n        ));\n\n        let first = prepare_core_oid_cache(&root).expect("prepare first OID core cache");\n        assert!(first.total > 0);\n        assert_eq!(first.total, first.written + first.reused);\n        assert!(route_engine::oid_cache_root(&root).join("index").is_file());\n\n        let second = prepare_core_oid_cache(&root).expect("reuse OID core cache");\n        assert_eq!(second.total, first.total);\n        assert_eq!(second.written, 0);\n        assert_eq!(second.reused, second.total);\n\n        let _ = std::fs::remove_dir_all(root);\n    }\n\n'''
          text = text.replace(test_anchor, test_anchor + test, 1)
          path.write_text(text)
          PY
          rm .github/workflows/one-shot-oid-core-bootstrap.yml
          cd engine
          cargo fmt --all
          cargo check -p rbe-install-runtime
          cargo check -p rbe-install-runtime --locked
          cargo check -p backend --locked
          cargo test -p backend backend_compile_root_prepares_and_reuses_core_oid_cache --locked
          cargo fmt --all -- --check
          cd ..
          git add install-runtime/Cargo.toml engine/Cargo.lock engine/crates/backend/src/package_links.rs engine/crates/backend/src/deployment_worker/mod.rs engine/crates/backend/src/package_links/tcp_listen.rs engine/crates/backend/src/runtime_image_boot.rs .github/workflows/one-shot-oid-core-bootstrap.yml
          git commit -m "FEAT | OID-007 prepare core OIDs during backend compile" -m "Also repair compiler blockers encountered by the guarded backend check: install-runtime serde declarations, package version diagnostics, deployment worker token ownership, and listener reaper guard lifetime."
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main
          done
          echo "failed to fast-forward push backend OID core bootstrap" >&2
          exit 1
