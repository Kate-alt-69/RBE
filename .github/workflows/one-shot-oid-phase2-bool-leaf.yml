name: One-shot OID Phase 2 Boolean leaf lowerer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-oid-phase2-bool-leaf.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add first real linked REL native lowerer
        shell: bash
        env:
          REL_NATIVE_LOWERING_B64: ''
        run: |
          set -euo pipefail
          git config user.name "Kate"
          git config user.email "dhwanksh2000@gmail.com"
          git pull --rebase origin main
          test ! -e engine/crates/route-engine/src/rel_native_lowering.rs
          printf '%s' "$REL_NATIVE_LOWERING_B64" | base64 --decode > engine/crates/route-engine/src/rel_native_lowering.rs
          python3 - <<'PY'
          from pathlib import Path

          oid = Path('engine/crates/route-engine/src/service_oid.rs')
          text = oid.read_text()
          flag_anchor = 'pub const OID_FLAG_BASELINE_CPU: u32 = 1 << 3;\n'
          if text.count(flag_anchor) != 1:
              raise SystemExit('OID flag anchor changed; refusing blind edit')
          text = text.replace(
              flag_anchor,
              flag_anchor + '/// Native callable returns a canonical REL Boolean as integer 0/1 in the platform result register.\npub const OID_FLAG_RETURNS_BOOL: u32 = 1 << 4;\n',
              1,
          )
          lower_anchor = 'fn lower_core_machine_code(\n    lowering: CoreLowering,\n    target: &OidTarget,\n) -> Result<Vec<u8>, OidError> {\n'
          if text.count(lower_anchor) != 1:
              raise SystemExit('core machine-code lowering anchor changed; refusing blind edit')
          helper = '''pub(crate) fn lower_native_bool_return(\n    value: bool,\n    target: &OidTarget,\n) -> Result<Vec<u8>, OidError> {\n    lower_core_machine_code(CoreLowering::ReturnBool(value), target)\n}\n\n'''
          text = text.replace(lower_anchor, helper + lower_anchor, 1)
          oid.write_text(text)

          lib = Path('engine/crates/route-engine/src/lib.rs')
          text = lib.read_text()
          module_anchor = 'pub mod rel_native_link;\n'
          if text.count(module_anchor) != 1:
              raise SystemExit('route-engine module anchor changed; refusing blind edit')
          text = text.replace(module_anchor, module_anchor + 'pub mod rel_native_lowering;\n', 1)
          use_anchor = 'pub use rel_image_discovery::{discover_linked_rel_from_runtime_image, RuntimeImageLinkedRelError};\n'
          if text.count(use_anchor) != 1:
              raise SystemExit('route-engine export anchor changed; refusing blind edit')
          text = text.replace(
              use_anchor,
              use_anchor + 'pub use rel_native_lowering::{lower_linked_rel_function, NativeRelLowering};\n',
              1,
          )
          lib.write_text(text)
          PY
          rm .github/workflows/one-shot-oid-phase2-bool-leaf.yml
          cd engine
          cargo fmt --all
          cargo check -p route-engine --locked
          cargo test -p route-engine rel_native_lowering --locked
          cargo clippy -p route-engine --all-targets --locked -- -D warnings
          cargo fmt --all -- --check
          cd ..
          git add engine/crates/route-engine/src/rel_native_lowering.rs engine/crates/route-engine/src/service_oid.rs engine/crates/route-engine/src/lib.rs .github/workflows/one-shot-oid-phase2-bool-leaf.yml
          git commit -m "FEAT | OID-008 lower constant Boolean REL leaves"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main
          done
          echo "failed to fast-forward push OID-008" >&2
          exit 1
