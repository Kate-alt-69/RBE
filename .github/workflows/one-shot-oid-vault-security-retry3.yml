name: One-shot OID Vault security retry3

"on":
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-oid-vault-security-retry3.yml'

permissions:
  contents: write

jobs:
  retry-secure-oid-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Run structurally corrected OID Vault security staging body
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/one-shot-oid-vault-security-v2.yml').read_text()
          marker = '        run: |\n'
          if source.count(marker) != 1:
              raise SystemExit('could not uniquely locate v2 staging run block')
          body = textwrap.dedent(source.split(marker, 1)[1])

          old = """replace_once(
              'vault-process/src/lib.rs',
              '''    token: String,
              seq: u64,
          ''',
              '''    token: String,
              ipc_key: [u8; 32],
              seq: u64,
          '''
          )"""
          new = """replace_once(
              'vault-process/src/lib.rs',
              '''struct Connection {
              child: Child,
              stdin: ChildStdin,
              reader: BufReader<std::process::ChildStdout>,
              token: String,
              seq: u64,
          ''',
              '''struct Connection {
              child: Child,
              stdin: ChildStdin,
              reader: BufReader<std::process::ChildStdout>,
              token: String,
              ipc_key: [u8; 32],
              seq: u64,
          '''
          )"""
          if body.count(old) != 1:
              raise SystemExit(f'expected one ambiguous Connection patch in v2 body, found {body.count(old)}')
          body = body.replace(old, new, 1)

          start_marker = """replace_once(
              'vault-process/src/lib.rs',
              '''            ClientCommand::Set {"""
          end_marker = """replace_once(
              'vault-process/src/lib.rs',
              '''    fn ensure_live_connection"""
          start = body.find(start_marker)
          end = body.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit(f'could not isolate stale ClientCommand::Set patch: start={start} end={end}')

          structural = r'''p = Path('vault-process/src/lib.rs')
          text = p.read_text()
          handle_start = text.find('    fn handle(&mut self, command: ClientCommand) {')
          request_start = text.find('\n    fn request(', handle_start)
          if handle_start < 0 or request_start < 0:
              raise SystemExit('could not locate Vault Worker::handle/request boundary')
          segment = text[handle_start:request_start]
          if 'ClientCommand::Internal {' in segment:
              raise SystemExit('Vault Internal command arm already exists unexpectedly')
          match_close = segment.rfind('\n        }\n    }')
          if match_close < 0:
              raise SystemExit('could not locate closing match in Vault Worker::handle')
          insert_at = handle_start + match_close
          internal_arm = '''\n            ClientCommand::Internal {
                  op,
                  namespace,
                  payload,
                  response,
              } => {
                  self.last_operation = Some("internal-oid");
                  if let Err(err) = self.ensure_live_connection("internal-oid") {
                      let _ = response.send(Err(err));
                      return;
                  }
                  let result = self.request_internal(&op, &namespace, payload);
                  let failed = result.is_err();
                  let _ = response.send(result);
                  if failed {
                      self.recover_if_process_failed("internal-oid");
                  }
              }'''
          text = text[:insert_at] + internal_arm + text[insert_at:]
          p.write_text(text)
          '''
          body = body[:start] + structural + body[end:]
          Path('/tmp/run-oid-vault-v2.sh').write_text(body)
          PY
          bash /tmp/run-oid-vault-v2.sh
