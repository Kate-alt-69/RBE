name: One-shot OID Vault security retry6

"on":
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-oid-vault-security-retry6.yml'
      - '.github/scripts/oid_vault_retry6.py'

permissions:
  contents: write

jobs:
  retry-secure-oid-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Run resilient OID Vault security staging body
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/oid_vault_retry6.py
          bash /tmp/run-oid-vault-v2.sh
