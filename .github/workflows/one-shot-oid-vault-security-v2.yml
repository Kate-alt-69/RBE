name: One-shot OID Vault security v2

"on":
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-oid-vault-security-v2.yml'

permissions:
  contents: write

jobs:
  secure-oid-cache:
    runs-on: ubuntu-latest
