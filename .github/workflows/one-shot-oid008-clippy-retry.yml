name: One-shot OID-008 code-only landing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-oid008-clippy-retry.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Land Boolean REL leaf lowering without workflow mutation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Kate"
          git config user.email "dhwanksh2000@gmail.com"
          git pull --rebase origin main
          python3 - <<'PY'
          import base64
          from pathlib import Path

          repeat_paths = [
              'engine/crates/route-engine/tests/service_cache_semantics.rs',
              'engine/crates/route-engine/src/oid_index_bridge.rs',
              'engine/crates/route-engine/src/oid_link.rs',
              'engine/crates/route-engine/src/oid_materialize.rs',
              'engine/crates/route-engine/src/rel_native_link.rs',
              'engine/crates/route-engine/src/rel_oid_bridge.rs',
              'engine/crates/route-engine/src/service_bin.rs',
              'engine/crates/route-engine/src/service_cache_invalidation.rs',
              'engine/crates/route-engine/src/service_native.rs',
          ]
          old_repeat = 'std::iter::repeat(ch).take(64).collect()'
          new_repeat = 'std::iter::repeat_n(ch, 64).collect()'
          for raw in repeat_paths:
              path = Path(raw)
              text = path.read_text()
              if old_repeat in text:
                  text = text.replace(old_repeat, new_repeat)
                  path.write_text(text)
              elif new_repeat not in text:
                  raise SystemExit(f'{raw}: expected repeat helper shape is absent; refusing blind edit')

          staged_workflow = Path('.github/workflows/one-shot-oid-phase2-bool-leaf.yml')
          payload = None
          for line in staged_workflow.read_text().splitlines():
              stripped = line.strip()
              if stripped.startswith('REL_NATIVE_LOWERING_B64:'):
                  payload = stripped.split(':', 1)[1].strip()
                  if len(payload) >= 2 and payload[0] == payload[-1] and payload[0] in "'\"":
                      payload = payload[1:-1]
                  break
          if not payload:
              raise SystemExit('staged OID-008 native lowering payload is missing')
          decoded = base64.b64decode(payload).decode('utf-8')

          lowering = Path('engine/crates/route-engine/src/rel_native_lowering.rs')
          if lowering.exists():
              if lowering.read_text() != decoded:
                  raise SystemExit('rel_native_lowering.rs already exists with different contents')
          else:
              lowering.write_text(decoded)

          oid = Path('engine/crates/route-engine/src/service_oid.rs')
          text = oid.read_text()
          flag = 'pub const OID_FLAG_RETURNS_BOOL: u32 = 1 << 4;'
          if flag not in text:
              anchor = 'pub const OID_FLAG_BASELINE_CPU: u32 = 1 << 3;\n'
              if text.count(anchor) != 1:
                  raise SystemExit('OID flag anchor changed; refusing blind edit')
              text = text.replace(
                  anchor,
                  anchor + '/// Native callable returns a canonical REL Boolean as integer 0/1 in the platform result register.\n' + flag + '\n',
                  1,
              )

          helper_name = 'pub(crate) fn lower_native_bool_return('
          if helper_name not in text:
              lower_anchor = 'fn lower_core_machine_code(\n    lowering: CoreLowering,\n    target: &OidTarget,\n) -> Result<Vec<u8>, OidError> {\n'
              if text.count(lower_anchor) != 1:
                  raise SystemExit('core machine-code lowering anchor changed; refusing blind edit')
              helper = '''pub(crate) fn lower_native_bool_return(\n    value: bool,\n    target: &OidTarget,\n) -> Result<Vec<u8>, OidError> {\n    lower_core_machine_code(CoreLowering::ReturnBool(value), target)\n}\n\n'''
              text = text.replace(lower_anchor, helper + lower_anchor, 1)
          oid.write_text(text)

          lib = Path('engine/crates/route-engine/src/lib.rs')
          text = lib.read_text()
          module_line = 'pub mod rel_native_lowering;\n'
          if module_line not in text:
              module_anchor = 'pub mod rel_native_link;\n'
              if text.count(module_anchor) != 1:
                  raise SystemExit('route-engine module anchor changed; refusing blind edit')
              text = text.replace(module_anchor, module_anchor + module_line, 1)
          export_line = 'pub use rel_native_lowering::{lower_linked_rel_function, NativeRelLowering};\n'
          if export_line not in text:
              use_anchor = 'pub use rel_image_discovery::{discover_linked_rel_from_runtime_image, RuntimeImageLinkedRelError};\n'
              if text.count(use_anchor) != 1:
                  raise SystemExit('route-engine export anchor changed; refusing blind edit')
              text = text.replace(use_anchor, use_anchor + export_line, 1)
          lib.write_text(text)
          PY

          cd engine
          cargo fmt --all
          cargo check -p route-engine --locked
          cargo test -p route-engine rel_native_lowering --locked
          cargo clippy -p route-engine --all-targets --locked -- -D warnings
          cargo fmt --all -- --check
          cd ..

          allowed='^(engine/crates/route-engine/(src/(rel_native_lowering.rs|service_oid.rs|lib.rs|oid_index_bridge.rs|oid_link.rs|oid_materialize.rs|rel_native_link.rs|rel_oid_bridge.rs|service_bin.rs|service_cache_invalidation.rs|service_native.rs)|tests/service_cache_semantics.rs))$'
          unexpected="$(git status --porcelain | awk '{print $2}' | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo "unexpected files changed by OID-008 landing:" >&2
            echo "$unexpected" >&2
            exit 1
          fi

          git add engine/crates/route-engine/src/rel_native_lowering.rs \
            engine/crates/route-engine/src/service_oid.rs \
            engine/crates/route-engine/src/lib.rs \
            engine/crates/route-engine/tests/service_cache_semantics.rs \
            engine/crates/route-engine/src/oid_index_bridge.rs \
            engine/crates/route-engine/src/oid_link.rs \
            engine/crates/route-engine/src/oid_materialize.rs \
            engine/crates/route-engine/src/rel_native_link.rs \
            engine/crates/route-engine/src/rel_oid_bridge.rs \
            engine/crates/route-engine/src/service_bin.rs \
            engine/crates/route-engine/src/service_cache_invalidation.rs \
            engine/crates/route-engine/src/service_native.rs
          git commit -m "FEAT | OID-008 lower constant Boolean REL leaves"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main
          done
          echo "failed to fast-forward push OID-008" >&2
          exit 1
