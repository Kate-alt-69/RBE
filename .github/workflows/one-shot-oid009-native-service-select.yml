name: One-shot OID-009 native Service selection

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-oid009-native-service-select.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire and verify whole-Service native selection
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Kate"
          git config user.email "dhwanksh2000@gmail.com"
          git pull --rebase origin main

          python3 - <<'PY'
          from pathlib import Path

          selector = Path('engine/crates/route-engine/src/rel_native_service_select.rs')
          text = selector.read_text()
          old_import = 'use crate::oid_link::{LinkedRelKind, LinkedRelSymbolSpec};\n'
          if old_import in text:
              text = text.replace(
                  old_import,
                  'use crate::oid_link::LinkedRelKind;\n#[cfg(test)]\nuse crate::oid_link::LinkedRelSymbolSpec;\n',
                  1,
              )

          output_anchor = '            service_exports,\n            reachable_symbols: selected_ids,\n'
          output_replacement = (
              '            service_exports,\n'
              '            service_lifecycle: BTreeMap::new(),\n'
              '            reachable_symbols: selected_ids,\n'
          )
          if output_anchor in text:
              text = text.replace(output_anchor, output_replacement, 1)
          elif output_replacement not in text:
              raise SystemExit('selector output LinkedRelDiscovery anchor changed')

          test_anchor = (
              '            service_exports: BTreeMap::from([("demo".into(), export_map)]),\n'
              '            reachable_symbols,\n'
          )
          test_replacement = (
              '            service_exports: BTreeMap::from([("demo".into(), export_map)]),\n'
              '            service_lifecycle: BTreeMap::new(),\n'
              '            reachable_symbols,\n'
          )
          if test_anchor in text:
              text = text.replace(test_anchor, test_replacement, 1)
          elif test_replacement not in text:
              raise SystemExit('selector test LinkedRelDiscovery anchor changed')
          selector.write_text(text)

          lib = Path('engine/crates/route-engine/src/lib.rs')
          text = lib.read_text()
          module = 'pub mod rel_native_service_select;\n'
          if module not in text:
              anchor = 'pub mod rel_native_lowering;\n'
              if text.count(anchor) != 1:
                  raise SystemExit('rel_native_lowering module anchor changed')
              text = text.replace(anchor, anchor + module, 1)

          export = (
              'pub use rel_native_service_select::{\n'
              '    select_native_services, NativeServiceSelection, NativeServiceSelectionError,\n'
              '};\n'
          )
          if export not in text:
              anchor = 'pub use rel_native_lowering::{lower_linked_rel_function, NativeRelLowering};\n'
              if text.count(anchor) != 1:
                  raise SystemExit('rel_native_lowering export anchor changed')
              text = text.replace(anchor, anchor + export, 1)
          lib.write_text(text)
          PY

          rustfmt --edition 2021 engine/crates/route-engine/src/rel_native_service_select.rs

          cd engine
          cargo check -p route-engine --locked
          cargo test -p route-engine rel_native_service_select --locked
          cargo clippy -p route-engine --all-targets --locked -- -D warnings
          cd ..

          allowed='^(engine/crates/route-engine/src/(lib.rs|rel_native_service_select.rs))$'
          unexpected="$(git status --porcelain | awk '{print $2}' | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo "unexpected files changed by OID-009:" >&2
            echo "$unexpected" >&2
            exit 1
          fi

          git add engine/crates/route-engine/src/lib.rs engine/crates/route-engine/src/rel_native_service_select.rs
          if git diff --cached --quiet; then
            echo "OID-009 already wired and formatted"
            exit 0
          fi
          git commit -m "FEAT | OID-009 select whole native Services"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main
          done
          echo "failed to fast-forward push OID-009" >&2
          exit 1
