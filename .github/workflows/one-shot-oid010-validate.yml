name: One-shot OID-010 Phase 2 validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-oid010-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Validate OID-010 compiler handoff
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2021 --check engine/crates/route-engine/src/relc_linked_image.rs
          cd engine
          cargo check -p route-engine --locked
          cargo test -p route-engine relc_linked_image --locked
          cargo test -p route-engine rel_native_service_select --locked
          cargo clippy -p route-engine --all-targets --locked -- -D warnings
