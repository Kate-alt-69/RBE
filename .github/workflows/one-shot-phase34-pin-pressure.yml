name: One-shot Phase 3 4 live pin pressure diagnostics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-phase34-pin-pressure.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add live OID pin pressure diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Kate"
          git config user.email "dhwanksh2000@gmail.com"
          git pull --rebase origin main

          python3 - <<'PY'
          from pathlib import Path

          path = Path('engine/crates/route-engine/src/oid_link.rs')
          text = path.read_text()

          package_anchor = '''    occupied.extend(pinned_oids.iter().copied());\n\n    // Pass 2: deterministic hole-first allocation in package/export sort order.\n'''
          package_replacement = '''    let package_pin_pressure = OidPinPressure {\n        requested: desired_map.values().map(|spec| spec.exports.len()).sum(),\n        capacity: oid_capacity(PACKAGE_OID_START, PACKAGE_OID_END),\n        retained: occupied.len(),\n        live_pins: pinned_oids.len(),\n        blocking_pins: pinned_oids.difference(&occupied).count(),\n    };\n    occupied.extend(pinned_oids.iter().copied());\n\n    // Pass 2: deterministic hole-first allocation in package/export sort order.\n'''
          if text.count(package_anchor) != 1:
              raise SystemExit('package pin-pressure anchor changed; refusing blind edit')
          text = text.replace(package_anchor, package_replacement, 1)

          package_alloc = '''            let oid = next_free_oid(PACKAGE_OID_START, PACKAGE_OID_END, &occupied)\n                .ok_or(OidLinkError::PackageRangeExhausted)?;\n'''
          package_alloc_new = '''            let oid = next_free_oid(PACKAGE_OID_START, PACKAGE_OID_END, &occupied)\n                .ok_or_else(|| package_range_exhaustion_error(&package_pin_pressure))?;\n'''
          if text.count(package_alloc) != 1:
              raise SystemExit('package allocation anchor changed; refusing blind edit')
          text = text.replace(package_alloc, package_alloc_new, 1)

          rel_anchor = '''    occupied.extend(pinned_oids.iter().copied());\n\n    for (canonical_id, spec) in specs {\n'''
          rel_replacement = '''    let rel_pin_pressure = OidPinPressure {\n        requested: specs.len(),\n        capacity: oid_capacity(REL_OID_START, REL_OID_END),\n        retained: occupied.len(),\n        live_pins: pinned_oids.len(),\n        blocking_pins: pinned_oids.difference(&occupied).count(),\n    };\n    occupied.extend(pinned_oids.iter().copied());\n\n    for (canonical_id, spec) in specs {\n'''
          if text.count(rel_anchor) != 1:
              raise SystemExit('REL pin-pressure anchor changed; refusing blind edit')
          text = text.replace(rel_anchor, rel_replacement, 1)

          rel_alloc = '''        let oid = next_free_oid(REL_OID_START, REL_OID_END, &occupied)\n            .ok_or(OidLinkError::RelRangeExhausted)?;\n'''
          rel_alloc_new = '''        let oid = next_free_oid(REL_OID_START, REL_OID_END, &occupied)\n            .ok_or_else(|| rel_range_exhaustion_error(&rel_pin_pressure))?;\n'''
          if text.count(rel_alloc) != 1:
              raise SystemExit('REL allocation anchor changed; refusing blind edit')
          text = text.replace(rel_alloc, rel_alloc_new, 1)

          helper_anchor = '''fn validate_pins(pins: &BTreeSet<u16>, start: u16, end: u16) -> Result<(), OidLinkError> {\n'''
          helpers = '''fn oid_capacity(start: u16, end: u16) -> usize {\n    usize::from(end) - usize::from(start) + 1\n}\n\n#[derive(Debug, Clone, PartialEq, Eq)]\npub struct OidPinPressure {\n    pub requested: usize,\n    pub capacity: usize,\n    pub retained: usize,\n    pub live_pins: usize,\n    pub blocking_pins: usize,\n}\n\nimpl OidPinPressure {\n    pub fn usable_capacity(&self) -> usize {\n        self.capacity.saturating_sub(self.blocking_pins)\n    }\n}\n\nfn package_range_exhaustion_error(pressure: &OidPinPressure) -> OidLinkError {\n    if pressure.requested <= pressure.capacity && pressure.blocking_pins > 0 {\n        OidLinkError::PackageRangePinnedPressure(pressure.clone())\n    } else {\n        OidLinkError::PackageRangeExhausted\n    }\n}\n\nfn rel_range_exhaustion_error(pressure: &OidPinPressure) -> OidLinkError {\n    if pressure.requested <= pressure.capacity && pressure.blocking_pins > 0 {\n        OidLinkError::RelRangePinnedPressure(pressure.clone())\n    } else {\n        OidLinkError::RelRangeExhausted\n    }\n}\n\nfn fmt_pin_pressure(\n    formatter: &mut fmt::Formatter<'_>,\n    label: &str,\n    start: u16,\n    end: u16,\n    pressure: &OidPinPressure,\n) -> fmt::Result {\n    write!(\n        formatter,\n        "{label} OID range {start}..={end} is temporarily exhausted by live Runtime Image/worker pins: requested targets: {}; capacity: {}; currently usable capacity: {}; retained compatible OIDs: {}; live pinned OIDs: {} ({} block reuse). Drain/retire old Runtime Images or workers before reusing those OIDs",\n        pressure.requested,\n        pressure.capacity,\n        pressure.usable_capacity(),\n        pressure.retained,\n        pressure.live_pins,\n        pressure.blocking_pins,\n    )\n}\n\n'''
          if text.count(helper_anchor) != 1:
              raise SystemExit('OID helper insertion anchor changed; refusing blind edit')
          text = text.replace(helper_anchor, helpers + helper_anchor, 1)

          enum_anchor = '''    OidCollision(u16),\n    PackageRangeExhausted,\n    RelRangeExhausted,\n    Serialization(String),\n'''
          enum_new = '''    OidCollision(u16),\n    PackageRangeExhausted,\n    RelRangeExhausted,\n    PackageRangePinnedPressure(OidPinPressure),\n    RelRangePinnedPressure(OidPinPressure),\n    Serialization(String),\n'''
          if text.count(enum_anchor) != 1:
              raise SystemExit('OID error enum anchor changed; refusing blind edit')
          text = text.replace(enum_anchor, enum_new, 1)

          display_anchor = '''            Self::PackageRangeExhausted => write!(formatter, "package OID range 20086..=30456 is exhausted"),\n            Self::RelRangeExhausted => write!(formatter, "linked REL OID range 30458..=65535 is exhausted"),\n            Self::Serialization(message) => write!(formatter, "failed to serialize OID-link identity: {message}"),\n'''
          display_new = '''            Self::PackageRangeExhausted => write!(formatter, "package OID range 20086..=30456 is exhausted"),\n            Self::RelRangeExhausted => write!(formatter, "linked REL OID range 30458..=65535 is exhausted"),\n            Self::PackageRangePinnedPressure(pressure) => fmt_pin_pressure(\n                formatter,\n                "package",\n                PACKAGE_OID_START,\n                PACKAGE_OID_END,\n                pressure,\n            ),\n            Self::RelRangePinnedPressure(pressure) => fmt_pin_pressure(\n                formatter,\n                "linked REL",\n                REL_OID_START,\n                REL_OID_END,\n                pressure,\n            ),\n            Self::Serialization(message) => write!(formatter, "failed to serialize OID-link identity: {message}"),\n'''
          if text.count(display_anchor) != 1:
              raise SystemExit('OID error display anchor changed; refusing blind edit')
          text = text.replace(display_anchor, display_new, 1)

          test_anchor = '''    #[test]\n    fn reachability_excludes_unused_linked_symbols() {\n'''
          tests = '''    #[test]\n    fn package_exhaustion_reports_live_pin_pressure() {\n        let pins = (PACKAGE_OID_START..PACKAGE_OID_END).collect::<BTreeSet<_>>();\n        let error = reconcile_package_oids(\n            &BTreeMap::new(),\n            &[package("1.0.0", 'a', &["send", "receive"])],\n            &pins,\n        )\n        .unwrap_err();\n\n        let rendered = error.to_string();\n        let pressure = match error {\n            OidLinkError::PackageRangePinnedPressure(pressure) => pressure,\n            other => panic!("expected package pin-pressure diagnostic, got {other:?}"),\n        };\n        assert_eq!(pressure.requested, 2);\n        assert_eq!(pressure.capacity, 10_371);\n        assert_eq!(pressure.retained, 0);\n        assert_eq!(pressure.live_pins, 10_370);\n        assert_eq!(pressure.blocking_pins, 10_370);\n        assert_eq!(pressure.usable_capacity(), 1);\n        assert!(rendered.contains("temporarily exhausted by live Runtime Image/worker pins"));\n        assert!(rendered.contains("currently usable capacity: 1"));\n    }\n\n    #[test]\n    fn rel_exhaustion_reports_live_pin_pressure() {\n        let pins = (REL_OID_START..REL_OID_END).collect::<BTreeSet<_>>();\n        let desired = vec![\n            rel("module_users_first", LinkedRelKind::ModuleExport, &[]),\n            rel("module_users_second", LinkedRelKind::ModuleExport, &[]),\n        ];\n        let error = reconcile_rel_oids(&BTreeMap::new(), &desired, &pins).unwrap_err();\n\n        let rendered = error.to_string();\n        let pressure = match error {\n            OidLinkError::RelRangePinnedPressure(pressure) => pressure,\n            other => panic!("expected REL pin-pressure diagnostic, got {other:?}"),\n        };\n        assert_eq!(pressure.requested, 2);\n        assert_eq!(pressure.capacity, 35_078);\n        assert_eq!(pressure.retained, 0);\n        assert_eq!(pressure.live_pins, 35_077);\n        assert_eq!(pressure.blocking_pins, 35_077);\n        assert_eq!(pressure.usable_capacity(), 1);\n        assert!(rendered.contains("linked REL OID range 30458..=65535"));\n        assert!(rendered.contains("currently usable capacity: 1"));\n    }\n\n'''
          if text.count(test_anchor) != 1:
              raise SystemExit('OID pin-pressure test anchor changed; refusing blind edit')
          text = text.replace(test_anchor, tests + test_anchor, 1)

          path.write_text(text)
          PY

          rustfmt --edition 2021 engine/crates/route-engine/src/oid_link.rs
          cd engine
          cargo test -p route-engine exhaustion_reports_live_pin_pressure --locked
          cargo clippy -p route-engine --all-targets --locked -- -D warnings
          cd ..

          rm .github/workflows/one-shot-phase34-pin-pressure.yml
          git add engine/crates/route-engine/src/oid_link.rs .github/workflows/one-shot-phase34-pin-pressure.yml
          git commit -m "FEAT | SVC-OID-344 diagnose live OID pin pressure"

          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main
          done
          echo "failed to fast-forward push SVC-OID-344" >&2
          exit 1
