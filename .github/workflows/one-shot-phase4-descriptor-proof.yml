name: One-shot Phase 4 descriptor record proof

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-phase4-descriptor-proof.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove class descriptor materialization and clear route-engine clippy blockers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Kate"
          git config user.email "dhwanksh2000@gmail.com"
          git pull --rebase origin main

          python3 - <<'PY'
          from pathlib import Path

          repeat_paths = [
              'engine/crates/route-engine/src/oid_index_bridge.rs',
              'engine/crates/route-engine/src/oid_link.rs',
              'engine/crates/route-engine/src/oid_materialize.rs',
              'engine/crates/route-engine/src/rel_native_link.rs',
              'engine/crates/route-engine/src/rel_oid_bridge.rs',
              'engine/crates/route-engine/src/service_bin.rs',
              'engine/crates/route-engine/src/service_cache_invalidation.rs',
              'engine/crates/route-engine/src/service_native.rs',
              'engine/crates/route-engine/tests/service_cache_semantics.rs',
          ]
          old_repeat = 'std::iter::repeat(ch).take(64).collect()'
          new_repeat = 'std::iter::repeat_n(ch, 64).collect()'
          for raw in repeat_paths:
              path = Path(raw)
              text = path.read_text()
              count = text.count(old_repeat)
              if count != 1:
                  raise SystemExit(f'{raw}: expected exactly one legacy SHA helper, found {count}')
              path.write_text(text.replace(old_repeat, new_repeat, 1))

          path = Path('engine/crates/route-engine/src/oid_materialize.rs')
          text = path.read_text()
          anchor = '''        assert_eq!(required.len(), 2);\n    }\n\n    #[test]\n    fn fragment_constructor_defaults_to_current_native_shape() {'''
          if text.count(anchor) != 1:
              raise SystemExit('class materialization test anchor changed; refusing blind edit')
          replacement = '''        assert_eq!(required.len(), 2);\n\n        let nonce = std::time::SystemTime::now()\n            .duration_since(std::time::UNIX_EPOCH)\n            .expect("system clock before UNIX epoch")\n            .as_nanos();\n        let root = std::env::temp_dir().join(format!(\n            "rbe-class-record-{}-{nonce}",\n            std::process::id()\n        ));\n        let mut cache = OidCache::open_or_rebuild(&root).expect("open OID cache");\n        cache.replace_index(index).expect("persist linked REL index");\n\n        let fragments = BTreeMap::from([\n            (\n                "class_UserCache".to_string(),\n                NativeOidFragment::descriptor(),\n            ),\n            (\n                "ctor_UserCache".to_string(),\n                NativeOidFragment::executable(vec![0xC3]),\n            ),\n            (\n                "method_UserCache_get".to_string(),\n                NativeOidFragment::executable(vec![0xC3]),\n            ),\n        ]);\n        materialize_rel_records(&cache, &report.bindings, &fragments)\n            .expect("materialize class descriptor and members");\n\n        let record = cache\n            .read_record(class.oid)\n            .expect("read materialized class descriptor");\n        assert_eq!(record.kind, OidRecordKind::Class);\n        assert!(record.machine_code.is_empty());\n        assert_eq!(\n            record.required_oids.into_iter().collect::<BTreeSet<_>>(),\n            required\n        );\n\n        let _ = std::fs::remove_dir_all(root);\n    }\n\n    #[test]\n    fn fragment_constructor_defaults_to_current_native_shape() {'''
          path.write_text(text.replace(anchor, replacement, 1))
          PY

          rustfmt --edition 2021 \
            engine/crates/route-engine/src/oid_index_bridge.rs \
            engine/crates/route-engine/src/oid_link.rs \
            engine/crates/route-engine/src/oid_materialize.rs \
            engine/crates/route-engine/src/rel_native_link.rs \
            engine/crates/route-engine/src/rel_oid_bridge.rs \
            engine/crates/route-engine/src/service_bin.rs \
            engine/crates/route-engine/src/service_cache_invalidation.rs \
            engine/crates/route-engine/src/service_native.rs \
            engine/crates/route-engine/tests/service_cache_semantics.rs

          cd engine
          cargo test -p route-engine class_record_stacks_constructor_and_method_oids --locked
          cargo test -p route-engine --test service_cache_semantics --locked
          cargo clippy -p route-engine --all-targets --locked -- -D warnings
          cd ..

          rm .github/workflows/one-shot-phase4-descriptor-proof.yml
          git add \
            engine/crates/route-engine/src/oid_index_bridge.rs \
            engine/crates/route-engine/src/oid_link.rs \
            engine/crates/route-engine/src/oid_materialize.rs \
            engine/crates/route-engine/src/rel_native_link.rs \
            engine/crates/route-engine/src/rel_oid_bridge.rs \
            engine/crates/route-engine/src/service_bin.rs \
            engine/crates/route-engine/src/service_cache_invalidation.rs \
            engine/crates/route-engine/src/service_native.rs \
            engine/crates/route-engine/tests/service_cache_semantics.rs \
            .github/workflows/one-shot-phase4-descriptor-proof.yml
          git commit -m "TEST | SVC-OID-343 prove class descriptor record dependencies"

          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main
          done
          echo "failed to fast-forward push SVC-OID-343" >&2
          exit 1
