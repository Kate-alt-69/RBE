name: One-shot Phase 6 Native Bench Validation

on:
  push:
    paths:
      - .github/workflows/one-shot-phase6-bench-check.yml

permissions:
  contents: write

jobs:
  native-bench:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Patch benchmark to use public Service parser
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/route-engine/src/bin/rel-native-bench.rs')
          text = path.read_text()
          text = text.replace(
              'discover_linked_rel_symbols, optimize_function, BinaryOp, Expr, FunctionDef, ImportTarget,\n    LinkedRelSourceUnit, ModuleFile, OidTarget, ServiceProgram, Statement,',
              'discover_linked_rel_symbols, optimize_function, BinaryOp, Expr, FunctionDef,\n    LinkedRelSourceUnit, ModuleFile, OidTarget, ServiceProgram, Statement,',
          )
          old = '''    let service = ServiceProgram {
        imports: vec![
            ImportTarget::CustomFunction {
                path: "module/bench.module".into(),
                function: "live".into(),
            },
            ImportTarget::CustomFunction {
                path: "module/bench.module".into(),
                function: "dead".into(),
            },
        ],
        functions: vec![FunctionDef {
            name: "run".into(),
            params: Vec::new(),
            body: vec![Statement::If {
                condition: Expr::Bool(false),
                then_body: vec![Statement::Return(Expr::Call(
                    Box::new(Expr::Ident("dead".into())),
                    Vec::new(),
                ))],
                else_body: vec![Statement::Return(Expr::Call(
                    Box::new(Expr::Ident("live".into())),
                    Vec::new(),
                ))],
            }],
        }],
        exports: vec!["run".into()],
        class_name: None,
        lifecycle: Vec::new(),
        classes: Vec::new(),
    };'''
          new = '''    let service = route_engine::parse_service_source(
        r#":import["module/bench.module".live, "module/bench.module".dead]
:service[name = bench]
export function run() {
    if (false) { return dead(); }
    else { return live(); }
}
"#,
    )
    .expect("benchmark Service fixture must parse through the public REL frontend");'''
          if old not in text:
              raise SystemExit('benchmark Service fixture anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Format benchmark harness
        run: rustfmt --edition 2021 crates/route-engine/src/bin/rel-native-bench.rs
      - name: Check benchmark formatting
        run: rustfmt --edition 2021 --check crates/route-engine/src/bin/rel-native-bench.rs
      - name: Check route-engine targets
        run: cargo check -p route-engine --all-targets --locked
      - name: Clippy benchmark target
        run: cargo clippy -p route-engine --bin rel-native-bench --locked -- -D warnings
      - name: Test benchmark target
        run: cargo test -p route-engine --bin rel-native-bench --locked
      - name: Run release benchmark smoke test
        run: |
          cargo run -p route-engine --release --bin rel-native-bench --locked -- \
            --profile ci-smoke \
            --iterations 3 \
            --warmup 1 \
            --output /tmp/rbe-native-bench.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/rbe-native-bench.json').read_text())
          assert report['schema'] == 'RBE-REL-NATIVE-BENCH/1'
          assert report['profile'] == 'ci-smoke'
          names = [item['name'] for item in report['metrics']]
          assert names == [
              'rel_optimizer',
              'linked_rel_reachability',
              'service_bin_assembly',
              'service_bin_cache_decode',
          ]
          assert report['artifacts']['reachableSymbolCount'] == 2
          assert report['artifacts']['encodedServiceBinBytes'] > report['artifacts']['serviceBinPayloadBytes']
          assert 'backend_process_startup_latency' in report['unmeasured']
          print(json.dumps(report, indent=2))
          PY
      - name: Publish validated benchmark harness
        working-directory: .
        run: |
          git config user.name "Kate"
          git config user.email "dhwanksh2000@gmail.com"
          git add engine/crates/route-engine/src/bin/rel-native-bench.rs
          git rm .github/workflows/one-shot-phase6-bench-check.yml
          git commit -m "FEAT | SVC-NATIVE-608 add native performance benchmark harness"
          git reset --hard HEAD
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
