name: One-shot Phase 6 Optimizer Validation

on:
  push:
    paths:
      - .github/workflows/one-shot-phase6-optimizer-check.yml

permissions:
  contents: read

jobs:
  optimizer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Check Phase 6 formatting
        run: |
          rustfmt --edition 2021 --check \
            crates/route-engine/src/lib.rs \
            crates/route-engine/src/rel_optimizer.rs \
            crates/route-engine/src/rel_native_lowering.rs
      - name: Check route-engine
        run: cargo check -p route-engine --all-targets --locked
      - name: Clippy route-engine
        run: cargo clippy -p route-engine --all-targets --locked -- -D warnings
      - name: Test optimizer
        run: cargo test -p route-engine rel_optimizer --locked
      - name: Test native lowering integration
        run: cargo test -p route-engine rel_native_lowering --locked
