name: One-shot Phase 6 Native Process Bench

on:
  push:
    paths:
      - .github/workflows/one-shot-phase6-process-bench.yml
      - .github/scripts/phase6_process_bench_patch.py

permissions:
  contents: write

jobs:
  native-process-bench:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Wire benchmark into backend
        working-directory: .
        run: python3 .github/scripts/phase6_process_bench_patch.py

      - name: Format Phase 6 process benchmark files
        run: |
          rustfmt --edition 2021 crates/backend/src/main.rs crates/backend/src/service_main.rs crates/backend/src/package_links.rs crates/backend/src/service_mother.rs crates/backend/src/service_native_bench.rs crates/backend/src/service_package_catalog.rs crates/logging/src/terminal.rs
          rustfmt --edition 2021 --check crates/backend/src/main.rs crates/backend/src/service_main.rs crates/backend/src/package_links.rs crates/backend/src/service_mother.rs crates/backend/src/service_native_bench.rs crates/backend/src/service_package_catalog.rs crates/logging/src/terminal.rs

      - name: Check backend targets
        run: cargo check -p backend --all-targets --locked

      - name: Clippy benchmark host
        run: cargo clippy -p backend --bin backend --locked -- -D warnings

      - name: Test benchmark helpers
        run: cargo test -p backend --bin backend service_native_bench --locked

      - name: Build standalone Service
        run: cargo build -p backend --release --bin service --locked

      - name: Build integrity-bound backend
        run: RBE_SERVICE_BIN_PATH="$PWD/target/release/service" cargo build -p backend --release --bin backend --locked

      - name: Run disposable native process benchmark smoke test
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/rbe-native-process-bench"
          REPORT="$RUNNER_TEMP/rbe-native-process-bench.json"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/dep"
          cp target/release/backend "$STAGE/backend"
          cp target/release/service "$STAGE/dep/service"
          touch "$STAGE/.rbe-native-bench-root"
          cd "$STAGE"
          ./backend --native-service-process-bench --profile ci-process-smoke --iterations 2 --warm-calls 3 --output "$REPORT"
          test "$(jq -r '.schema' "$REPORT")" = "RBE-NATIVE-SERVICE-PROCESS-BENCH/1"
          test "$(jq -r '.profile' "$REPORT")" = "ci-process-smoke"
          test "$(jq -r '.iterations' "$REPORT")" = "2"
          test "$(jq -r '.warmCallsPerRound' "$REPORT")" = "3"
          test "$(jq -r '.nativeServiceCount' "$REPORT")" = "1"
          test "$(jq -r '.metrics[] | select(.name == "service_mother_startup") | .samples' "$REPORT")" = "2"
          test "$(jq -r '.metrics[] | select(.name == "cold_native_service_call") | .samples' "$REPORT")" = "2"
          test "$(jq -r '.metrics[] | select(.name == "warm_native_service_call") | .samples' "$REPORT")" = "6"
          jq -e 'all(.metrics[]; .minNs > 0)' "$REPORT" >/dev/null
          jq -e '.unmeasured | index("true_peak_process_rss") != null' "$REPORT" >/dev/null
          jq . "$REPORT"
          cd - >/dev/null
          rm -rf "$STAGE"

      - name: Publish validated process benchmark
        working-directory: .
        run: |
          set -euo pipefail
          git config user.name "Kate"
          git config user.email "dhwanksh2000@gmail.com"
          git add engine/crates/backend/src/main.rs engine/crates/backend/src/service_main.rs engine/crates/backend/src/package_links.rs engine/crates/backend/src/service_mother.rs engine/crates/backend/src/service_native_bench.rs engine/crates/backend/src/service_package_catalog.rs engine/crates/logging/src/terminal.rs
          git rm .github/workflows/one-shot-phase6-process-bench.yml .github/scripts/phase6_process_bench_patch.py
          git commit -m "FEAT | SVC-NATIVE-611 benchmark native Service process path"
          git reset --hard HEAD
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
