name: One-shot RELC dynamic body capability lowering

"on":
  push:
    branches:
      - work/relc-wasm-runtime
    paths:
      - '.github/workflows/one-shot-relc-dynamic-body-capability.yml'

permissions:
  contents: write

jobs:
  validate-and-land:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Lower request body through native Module capabilities
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python3 .github/patches/bug-cap-028.py

          cd engine
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test -p route-engine linked_module_storage_call_passes_dynamic_request_body_natively --locked
          cargo test -p route-engine storage_backed_dynamic_body_route_stays_inside_native_container_execution --locked
          cargo test -p route-engine wasm_compiler --locked
          cargo clippy -p route-engine --all-targets --locked -- -D warnings
          cd ..

          rm -f .github/patches/bug-cap-028.py
          rm -f .github/workflows/one-shot-relc-dynamic-body-capability.yml
          git add -A
          git diff --cached --check
          git commit -m 'FIX | BUG-CAP-028 pass request body through native Module capability calls'
          git pull --rebase origin work/relc-wasm-runtime
          git push origin HEAD:work/relc-wasm-runtime
