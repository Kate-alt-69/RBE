name: One-shot RELC linked Module helpers

"on":
  push:
    branches:
      - work/relc-wasm-runtime
    paths:
      - '.github/workflows/one-shot-relc-linked-module-helpers.yml'

permissions:
  contents: write

jobs:
  validate-and-land:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Lower linked Module helpers and exact host imports
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python3 .github/patches/bug-wasm-011.py
          python3 .github/patches/bug-wasm-011-fix.py

          cd engine
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test -p route-engine linked_module_multiple_exact_host_imports_select_returned_binding --locked
          cargo test -p route-engine linked_module_pure_helpers_build_static_host_arguments --locked
          cargo test -p route-engine linked_module_dynamic_helper_transform_stays_interpreter_fallback --locked
          cargo test -p route-engine linked_storage_module_helpers_compile_native_with_exact_storage_grant --locked
          cargo test -p route-engine --locked
          cargo clippy -p route-engine --all-targets --locked -- -D warnings
          cargo check --workspace --all-targets --locked
          cd ..

          rm -f .github/patches/bug-wasm-011.py
          rm -f .github/patches/bug-wasm-011-fix.py
          rm -f .github/workflows/one-shot-relc-linked-module-helpers.yml
          git add -A
          git diff --cached --check
          git commit -m 'FIX | BUG-WASM-011 lower pure linked Module helpers into Route-WASM'
          git pull --rebase origin work/relc-wasm-runtime
          for attempt in 1 2 3; do
            if git push origin HEAD:work/relc-wasm-runtime; then
              exit 0
            fi
            echo "push attempt ${attempt} failed; retrying..."
            sleep $((attempt * 5))
          done
          exit 1
