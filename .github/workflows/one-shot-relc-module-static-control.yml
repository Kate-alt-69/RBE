name: One-shot RELC Module static control

"on":
  push:
    branches:
      - work/relc-wasm-runtime
    paths:
      - '.github/workflows/one-shot-relc-module-static-control.yml'

permissions:
  contents: write

jobs:
  validate-and-land:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Lower static Module control flow to one exact host call
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python3 .github/patches/bug-wasm-012.py

          cd engine
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test -p route-engine linked_module_static_const_prefix_lowers_before_host_call --locked
          cargo test -p route-engine linked_module_static_if_selects_exact_host_binding --locked
          cargo test -p route-engine linked_module_dynamic_control_flow_stays_interpreter_fallback --locked
          cargo test -p route-engine linked_storage_module_static_prefix_compiles_into_native_image --locked
          cargo test -p route-engine --locked
          cargo clippy -p route-engine --all-targets --locked -- -D warnings
          cargo check --workspace --all-targets --locked
          cd ..

          rm -f .github/patches/bug-wasm-012.py
          rm -f .github/workflows/one-shot-relc-module-static-control.yml
          git add -A
          git diff --cached --check
          git commit -m 'FIX | BUG-WASM-012 lower static Module control flow into Route-WASM'
          git pull --rebase origin work/relc-wasm-runtime
          for attempt in 1 2 3; do
            if git push origin HEAD:work/relc-wasm-runtime; then
              exit 0
            fi
            echo "push attempt ${attempt} failed; retrying..."
            sleep $((attempt * 5))
          done
          exit 1
