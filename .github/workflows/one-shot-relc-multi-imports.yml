name: One-shot RELC exact multi-import lowering

"on":
  push:
    branches:
      - work/relc-wasm-runtime
    paths:
      - '.github/workflows/one-shot-relc-multi-imports.yml'

permissions:
  contents: write

jobs:
  validate-and-land:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Resolve multiple exact imports by called binding
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python3 .github/patches/bug-wasm-009.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('engine/crates/route-engine/src/wasm_compiler.rs')
          text = path.read_text()
          old = '''        assert!(reason.contains(
            "one direct http.get/post/request import or one linked Module function import"
        ));'''
          new = '''        assert!(reason.contains("namespace imports remain interpreter-only"));'''
          if text.count(old) != 1:
              raise SystemExit(f'BUG-WASM-009 stale namespace assertion expected once, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

          cd engine
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test -p route-engine multiple_exact_direct_imports_select_the_called_binding --locked
          cargo test -p route-engine mixed_exact_direct_and_linked_imports_select_the_linked_binding --locked
          cargo test -p route-engine namespace_import_among_exact_imports_still_fails_closed --locked
          cargo test -p route-engine http_namespace_import_stays_interpreter_fallback --locked
          cargo test -p route-engine wasm_compiler --locked
          cargo clippy -p route-engine --all-targets --locked -- -D warnings
          cd ..

          rm -f .github/patches/bug-wasm-009.py
          rm -f .github/workflows/one-shot-relc-multi-imports.yml
          git add -A
          git diff --cached --check
          git commit -m 'FIX | BUG-WASM-009 resolve multiple exact imports for native routes'
          git pull --rebase origin work/relc-wasm-runtime
          for attempt in 1 2 3; do
            if git push origin HEAD:work/relc-wasm-runtime; then
              exit 0
            fi
            echo "push attempt ${attempt} failed; retrying..."
            sleep $((attempt * 5))
          done
          exit 1
