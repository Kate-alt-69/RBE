name: One-shot RELC static capability expressions

"on":
  push:
    branches:
      - work/relc-wasm-runtime
    paths:
      - '.github/workflows/one-shot-relc-static-capability-expressions.yml'

permissions:
  contents: write

jobs:
  validate-and-land:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Fold static REL expressions into exact capability arguments
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python3 .github/patches/bug-wasm-008.py

          cd engine
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test -p route-engine direct_capability_arguments_can_use_pure_route_helpers --locked
          cargo test -p route-engine linked_module_capability_arguments_fold_pure_rel_expressions --locked
          cargo test -p route-engine request_dependent_local_helper_stays_interpreter_fallback --locked
          cargo test -p route-engine transformed_dynamic_linked_argument_stays_interpreter_fallback --locked
          cargo test -p route-engine wasm_compiler --locked
          cargo clippy -p route-engine --all-targets --locked -- -D warnings
          cd ..

          rm -f .github/patches/bug-wasm-008.py
          rm -f .github/workflows/one-shot-relc-static-capability-expressions.yml
          git add -A
          git diff --cached --check
          git commit -m 'FIX | BUG-WASM-008 fold pure REL capability arguments into native WASM'
          git pull --rebase origin work/relc-wasm-runtime
          git push origin HEAD:work/relc-wasm-runtime
