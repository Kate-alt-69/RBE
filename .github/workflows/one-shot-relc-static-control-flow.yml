name: One-shot RELC static control-flow lowering

"on":
  push:
    branches:
      - work/relc-wasm-runtime
    paths:
      - '.github/workflows/one-shot-relc-static-control-flow.yml'

permissions:
  contents: write

jobs:
  validate-and-land:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Compile static REL statements into native WASM
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python3 .github/patches/bug-wasm-006.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('engine/crates/route-engine/src/wasm_compiler.rs')
          text = path.read_text()
          old = 'entries.sort_by(|(left, _), (right, _)| left.cmp(right));'
          new = 'entries.sort_by_key(|(name, _)| (*name).clone());'
          if text.count(old) != 1:
              raise SystemExit(f'BUG-WASM-006 clippy fix expected one anchor, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

          cd engine
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test -p route-engine request_independent_const_arithmetic_and_if_compile_to_native_wasm --locked
          cargo test -p route-engine request_dependent_if_stays_interpreter_fallback --locked
          cargo test -p route-engine wasm_compiler --locked
          cargo clippy -p route-engine --all-targets --locked -- -D warnings
          cd ..

          rm -f .github/patches/bug-wasm-006.py
          rm -f .github/workflows/one-shot-relc-static-control-flow.yml
          git add -A
          git diff --cached --check
          git commit -m 'FIX | BUG-WASM-006 compile static REL control flow to native WASM'
          git pull --rebase origin work/relc-wasm-runtime
          git push origin HEAD:work/relc-wasm-runtime
