name: One-shot Rust 1.99 clippy compatibility

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-rust199-clippy.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Rust 1.99 atomic API rename
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Kate"
          git config user.email "dhwanksh2000@gmail.com"
          git pull --rebase origin main
          python3 - <<'PY'
          from pathlib import Path
          path = Path('engine/crates/service-runtime/src/manager.rs')
          text = path.read_text()
          old = '.fetch_update(Ordering::AcqRel, Ordering::Acquire, |value| {'
          new = '.try_update(Ordering::AcqRel, Ordering::Acquire, |value| {'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one deprecated AtomicU32::fetch_update call, found {count}')
          path.write_text(text.replace(old, new))
          PY
          rm .github/workflows/one-shot-rust199-clippy.yml
          cd engine
          cargo fmt --all
          cd ..
          git add engine/crates/service-runtime/src/manager.rs .github/workflows/one-shot-rust199-clippy.yml
          git commit -m "FIX | OID-005 update atomic API for Rust 1.99"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main
          done
          echo "failed to fast-forward push Rust 1.99 fix after retries" >&2
          exit 1
