name: One-shot runtime rustfmt repair

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-rustfmt.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format Runtime CI slice and commit
        shell: bash
        run: |
          set -euo pipefail
          cd engine
          rustfmt --edition 2021 \
            crates/service-runtime/src/lib.rs \
            crates/service-runtime/src/manager.rs \
            crates/service-runtime/src/mother.rs \
            crates/backend/src/service_boot.rs \
            crates/backend/src/service_mother.rs \
            crates/config/src/lib.rs \
            crates/video-manager/src/lib.rs \
            crates/video-manager/src/download.rs \
            crates/video-manager/src/download_worker.rs \
            crates/video-manager/src/container_probe.rs \
            crates/video-manager/src/ffprobe.rs \
            crates/video-manager/src/ffmpeg.rs \
            crates/video-manager/src/ffmpeg_capabilities.rs \
            crates/video-manager/src/live.rs \
            crates/video-manager/src/live_runtime.rs \
            crates/video-manager/src/normalization.rs \
            crates/video-manager/src/pipeline.rs \
            crates/video-manager/src/worker.rs \
            crates/core/src/video_language.rs \
            crates/api/src/health.rs \
            crates/route-engine/src/ast.rs \
            crates/route-engine/src/parser.rs \
            crates/route-engine/src/modules.rs \
            crates/route-engine/src/analyzer.rs \
            crates/route-engine/src/transpiler.rs \
            crates/route-engine/src/module_runtime.rs \
            crates/route-engine/src/module_eval.rs \
            crates/route-engine/src/service_eval.rs \
            crates/route-engine/src/video_host.rs \
            crates/route-engine/src/discovery.rs
          cd ..

          rm .github/workflows/one-shot-rustfmt.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "FIX | BUG-QDB-002 format runtime slices"
          git push origin HEAD:main
