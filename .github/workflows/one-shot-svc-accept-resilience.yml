name: One-shot service accept resilience repairs

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-svc-accept-resilience.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Repair transient service listener failures
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main

          python3 <<'PY'
          from pathlib import Path

          path = Path("engine/crates/service-runtime/src/mother.rs")
          source = path.read_text()

          old = '''const MOTHER_FRAME_TIMEOUT: Duration = Duration::from_secs(5);\nconst MOTHER_RESPONSE_TIMEOUT: Duration = Duration::from_secs(15);\nconst MAX_MOTHER_CONNECTIONS: usize = 128;'''
          new = '''const MOTHER_FRAME_TIMEOUT: Duration = Duration::from_secs(5);\nconst MOTHER_RESPONSE_TIMEOUT: Duration = Duration::from_secs(15);\nconst MOTHER_ACCEPT_RETRY_DELAY: Duration = Duration::from_millis(50);\nconst MOTHER_ACCEPT_FAILURE_LIMIT: u32 = 8;\nconst MAX_MOTHER_CONNECTIONS: usize = 128;'''
          if old not in source:
              raise SystemExit("Service Mother constants anchor changed")
          source = source.replace(old, new, 1)

          old = '''    let token: Arc<str> = Arc::<str>::from(token);\n    let connections = Arc::new(tokio::sync::Semaphore::new(MAX_MOTHER_CONNECTIONS));\n    let (shutdown_tx, mut shutdown_rx) = tokio::sync::watch::channel(false);\n    loop {'''
          new = '''    let token: Arc<str> = Arc::<str>::from(token);\n    let connections = Arc::new(tokio::sync::Semaphore::new(MAX_MOTHER_CONNECTIONS));\n    let (shutdown_tx, mut shutdown_rx) = tokio::sync::watch::channel(false);\n    let mut accept_failures = 0u32;\n    loop {'''
          if old not in source:
              raise SystemExit("Service Mother loop anchor changed")
          source = source.replace(old, new, 1)

          old = '''            accepted = listener.accept() => {\n                let (stream, peer) = accepted?;\n                if !peer.ip().is_loopback() {'''
          new = '''            accepted = listener.accept() => {\n                let (stream, peer) = match accepted {\n                    Ok(accepted) => {\n                        accept_failures = 0;\n                        accepted\n                    }\n                    Err(error) => {\n                        accept_failures = accept_failures.saturating_add(1);\n                        if accept_failures >= MOTHER_ACCEPT_FAILURE_LIMIT {\n                            return Err(anyhow::anyhow!(\n                                "Service Mother listener failed {accept_failures} consecutive accepts: {error}"\n                            ));\n                        }\n                        tracing::warn!(\n                            error = %error,\n                            accept_failures,\n                            retry_ms = MOTHER_ACCEPT_RETRY_DELAY.as_millis() as u64,\n                            "Service Mother listener accept failed; retrying without tearing down services"\n                        );\n                        tokio::time::sleep(MOTHER_ACCEPT_RETRY_DELAY).await;\n                        continue;\n                    }\n                };\n                if !peer.ip().is_loopback() {'''
          if old not in source:
              raise SystemExit("Service Mother accept anchor changed")
          source = source.replace(old, new, 1)
          path.write_text(source)
          PY

          cd engine
          cargo fmt --all
          cargo test -p service-runtime
          cd ..
          git add engine/crates/service-runtime/src/mother.rs
          git commit -m "FIX | BUG-SVC-030 tolerate transient Service Mother accept failures"

          python3 <<'PY'
          from pathlib import Path

          path = Path("engine/crates/service-runtime/src/lib.rs")
          source = path.read_text()

          old = '''pub(crate) const SERVICE_IPC_TIMEOUT: Duration = Duration::from_secs(5);\npub(crate) const SERVICE_IPC_REQUEST_MAX_BYTES: usize = 4 * 1024 * 1024;\npub(crate) const SERVICE_IPC_RESPONSE_MAX_BYTES: usize = 8 * 1024 * 1024;'''
          new = '''pub(crate) const SERVICE_IPC_TIMEOUT: Duration = Duration::from_secs(5);\npub(crate) const SERVICE_IPC_REQUEST_MAX_BYTES: usize = 4 * 1024 * 1024;\npub(crate) const SERVICE_IPC_RESPONSE_MAX_BYTES: usize = 8 * 1024 * 1024;\nconst SERVICE_ACCEPT_RETRY_DELAY: Duration = Duration::from_millis(50);\nconst SERVICE_ACCEPT_FAILURE_LIMIT: u32 = 8;'''
          if old not in source:
              raise SystemExit("service IPC constants anchor changed")
          source = source.replace(old, new, 1)

          old = '''    std::io::stdout().flush()?;\n    let mut parent_liveness = parent_liveness_signal_if_configured()?;\n    loop {'''
          new = '''    std::io::stdout().flush()?;\n    let mut parent_liveness = parent_liveness_signal_if_configured()?;\n    let mut accept_failures = 0u32;\n    loop {'''
          if old not in source:
              raise SystemExit("service host loop anchor changed")
          source = source.replace(old, new, 1)

          old = '''        let (stream, peer) = accepted?;\n        if !peer.ip().is_loopback() {'''
          new = '''        let (stream, peer) = match accepted {\n            Ok(accepted) => {\n                accept_failures = 0;\n                accepted\n            }\n            Err(error) => {\n                accept_failures = accept_failures.saturating_add(1);\n                if accept_failures >= SERVICE_ACCEPT_FAILURE_LIMIT {\n                    return Err(anyhow::anyhow!(\n                        "service {:?} listener failed {accept_failures} consecutive accepts: {error}",\n                        file.name\n                    ));\n                }\n                tracing::warn!(\n                    service = %file.name,\n                    error = %error,\n                    accept_failures,\n                    retry_ms = SERVICE_ACCEPT_RETRY_DELAY.as_millis() as u64,\n                    "service IPC listener accept failed; retrying"\n                );\n                tokio::time::sleep(SERVICE_ACCEPT_RETRY_DELAY).await;\n                continue;\n            }\n        };\n        if !peer.ip().is_loopback() {'''
          if old not in source:
              raise SystemExit("service host accept anchor changed")
          source = source.replace(old, new, 1)
          path.write_text(source)
          PY

          cd engine
          cargo fmt --all
          cargo test -p service-runtime
          cd ..
          git rm .github/workflows/one-shot-svc-accept-resilience.yml
          git add engine/crates/service-runtime/src/lib.rs
          git commit -m "FIX | BUG-SVC-031 tolerate transient service IPC accept failures"

          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$(git rev-parse HEAD~2)" ]; then
            git rebase origin/main
          fi
          git push origin HEAD:main
