name: One-shot Service application-root repair

"on":
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-svc-application-root.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Apply and validate Service application root ownership
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          staging="$(git rev-parse HEAD)"
          base="babb2d260c266ce10f59cac3a1da21823fc7415f"

          # The Service Manager has repeated call shapes that all need the
          # same propagation change. Keep the strict single-replacement rule
          # for boot/Mother code, but intentionally replace every matching
          # Manager callsite.
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/patches/svc-application-root.py')
          text = path.read_text()
          helper = '''def replace_many(path: str, old: str, new: str) -> None:\n    p = Path(path)\n    text = p.read_text()\n    count = text.count(old)\n    if count < 1:\n        raise SystemExit(f"{path}: expected at least one replacement, found {count}")\n    p.write_text(text.replace(old, new))\n\n'''
          marker = '# backend service_boot.rs\n'
          if marker not in text:
              raise SystemExit('patch marker missing')
          text = text.replace(marker, helper + marker, 1)
          manager_marker = '# service-runtime manager.rs\n'
          head, sep, tail = text.partition(manager_marker)
          if not sep:
              raise SystemExit('manager patch marker missing')
          tail = tail.replace('replace_once(path,', 'replace_many(path,')
          path.write_text(head + sep + tail)
          PY

          python3 .github/patches/svc-application-root.py

          rm -f .github/workflows/one-shot-svc-application-root.yml
          rm -f .github/patches/svc-application-root.py

          cd engine
          cargo fmt --all
          cargo check --workspace --locked
          cargo test -p backend explicit_application_root_owns_relative_service_paths --locked
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cd ..

          grep -q 'arg("--application-root")' engine/crates/backend/src/service_mother.rs
          grep -q 'compile_from_root' engine/crates/backend/src/service_mother.rs
          grep -q 'ModuleProgram::load(&root.join("module"))' engine/crates/backend/src/service_boot.rs
          grep -q 'prepare_all_for_mother' engine/crates/service-runtime/src/manager.rs

          git add -A
          tree="$(git write-tree)"
          message='FIX | BUG-SVC-001 bind Service paths to application root'
          final="$(printf '%s\n' "$message" | git commit-tree "$tree" -p "$base")"

          git fetch origin main
          current="$(git rev-parse origin/main)"
          if [ "$current" != "$staging" ]; then
            echo "main moved while Service fix was validating; refusing to overwrite concurrent work"
            exit 1
          fi

          if git push --force-with-lease=refs/heads/main:"$staging" origin "$final":refs/heads/main; then
            echo "landed squashed Service fix $final"
          else
            echo "force update rejected; preserving staging history and landing as fast-forward"
            fallback="$(printf '%s\n' "$message" | git commit-tree "$tree" -p "$staging")"
            git push origin "$fallback":refs/heads/main
          fi
