name: One-shot Service application-root repair

"on":
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-svc-application-root.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Apply, validate and land Service repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/patches/svc-application-root.py')
          text = path.read_text()
          helper = '''def replace_many(path: str, old: str, new: str) -> None:\n    p = Path(path)\n    text = p.read_text()\n    count = text.count(old)\n    if count < 1:\n        raise SystemExit(f"{path}: expected at least one replacement, found {count}")\n    p.write_text(text.replace(old, new))\n\n'''
          marker = '# backend service_boot.rs\n'
          text = text.replace(marker, helper + marker, 1)
          manager_marker = '# service-runtime manager.rs\n'
          head, sep, tail = text.partition(manager_marker)
          if not sep:
              raise SystemExit('Service manager patch marker missing')
          tail = tail.replace('replace_once(path,', 'replace_many(path,')
          path.write_text(head + sep + tail)
          PY

          python3 .github/patches/svc-application-root.py
          python3 .github/patches/svc-diagnostics-contract.py
          python3 .github/patches/svc-diagnostics-mother.py

          rm -f .github/workflows/one-shot-svc-application-root.yml
          rm -f .github/patches/svc-application-root.py
          rm -f .github/patches/svc-diagnostics-contract.py
          rm -f .github/patches/svc-diagnostics-mother.py
          rm -f .ci-service-repair-guard

          cd engine
          cargo fmt --all
          cargo check --workspace --locked
          cargo test -p backend explicit_application_root_owns_relative_service_paths --locked
          cargo test -p backend compatibility_probe_distinguishes_protocol_and_runtime_mismatches --locked
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo build -p backend --bin service --locked
          probe="$(target/debug/service --service-compat-probe)"
          python3 - "$probe" <<'PY'
          import json, sys
          p = json.loads(sys.argv[1])
          assert p['protocol'] == 'RBE-SERVICE-COMPAT/1'
          assert p['serviceRuntimeAbi'] == 1
          assert p['catalogFingerprintAbi'] == 1
          assert p['buildId'] and p['target']
          PY
          cd ..

          grep -q 'arg("--application-root")' engine/crates/backend/src/service_mother.rs
          grep -q 'compile_from_root' engine/crates/backend/src/service_mother.rs
          grep -q 'ModuleProgram::load(&root.join("module"))' engine/crates/backend/src/service_boot.rs
          grep -q 'prepare_all_for_mother' engine/crates/service-runtime/src/manager.rs
          grep -q 'SVC5001' engine/crates/backend/src/service_mother.rs
          grep -q 'SVC5002' engine/crates/backend/src/service_mother.rs
          grep -q 'SVC5003' engine/crates/backend/src/service_mother.rs

          git add -A
          git commit -m 'FIX | BUG-SVC-001 bind Service runtime to application root and compatibility identity'
          git pull --rebase origin main
          git push origin HEAD:main
