name: One-shot Service application-root repair
"on":
  push:
    branches: [main]
    paths: ['.github/workflows/one-shot-svc-application-root.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: dtolnay/rust-toolchain@stable
        with: {components: 'rustfmt,clippy'}
      - uses: Swatinem/rust-cache@v2
        with: {workspaces: engine}
      - name: Apply and land
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/patches/svc-application-root.py'); s=p.read_text()
          helper='''def replace_many(path: str, old: str, new: str) -> None:\n    p=Path(path); text=p.read_text(); count=text.count(old)\n    if count < 1: raise SystemExit(f"{path}: expected replacement")\n    p.write_text(text.replace(old,new))\n\n'''
          s=s.replace('# backend service_boot.rs\n',helper+'# backend service_boot.rs\n',1)
          h,sep,t=s.partition('# service-runtime manager.rs\n')
          if not sep: raise SystemExit('manager marker missing')
          p.write_text(h+sep+t.replace('replace_once(path,','replace_many(path,'))
          PY
          python3 .github/patches/svc-application-root.py
          python3 .github/patches/svc-diagnostics-contract.py
          python3 .github/patches/svc-diagnostics-mother.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('engine/crates/backend/src/service_main.rs'); s=p.read_text()
          old='mod service_integrity {\n    include!(concat!(env!("OUT_DIR"), "/service_integrity.rs"));\n}'
          if s.count(old) != 1: raise SystemExit('service identity module anchor missing')
          p.write_text(s.replace(old, '#[allow(dead_code)]\n'+old, 1))
          PY
          rm -f .github/workflows/one-shot-svc-application-root.yml .github/patches/svc-application-root.py .github/patches/svc-diagnostics-contract.py .github/patches/svc-diagnostics-mother.py .ci-service-repair-guard
          cd engine
          cargo fmt --all
          cargo check -p backend -p service-runtime -p route-engine --all-targets --locked
          cargo test -p service-runtime --locked
          cargo test -p backend --locked
          cargo clippy -p backend -p service-runtime -p route-engine --all-targets --locked -- -D warnings
          cargo build -p backend --bin service --locked
          target/debug/service --service-compat-probe | python3 -c 'import json,sys; p=json.load(sys.stdin); assert p["protocol"]=="RBE-SERVICE-COMPAT/1" and p["serviceRuntimeAbi"]==1 and p["catalogFingerprintAbi"]==1'
          cd ..
          grep -q 'arg("--application-root")' engine/crates/backend/src/service_mother.rs
          grep -q 'compile_from_root' engine/crates/backend/src/service_mother.rs
          grep -q 'prepare_all_for_mother' engine/crates/service-runtime/src/manager.rs
          grep -q 'SVC5001' engine/crates/backend/src/service_mother.rs
          grep -q 'SVC5002' engine/crates/backend/src/service_mother.rs
          grep -q 'SVC5003' engine/crates/backend/src/service_mother.rs
          git add -A
          git commit -m 'FIX | BUG-SVC-001 bind Service runtime to application root and compatibility identity'
          git pull --rebase origin main
          git push origin HEAD:main
