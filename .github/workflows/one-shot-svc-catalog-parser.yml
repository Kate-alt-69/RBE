name: One-shot service catalog parser repairs

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-svc-catalog-parser.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Repair service catalog source discovery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          echo '' | base64 -d > /tmp/patch-svc-032.py
          python3 /tmp/patch-svc-032.py
          cd engine
          cargo fmt --all
          cargo test -p service-runtime
          cd ..
          git add engine/crates/service-runtime/src/lib.rs
          git commit -m "FIX | BUG-SVC-032 ignore commented service directives"
          echo '' | base64 -d > /tmp/patch-svc-033.py
          python3 /tmp/patch-svc-033.py
          cd engine
          cargo fmt --all
          cargo test -p service-runtime
          cd ..
          git rm .github/workflows/one-shot-svc-catalog-parser.yml
          git add engine/crates/service-runtime/src/lib.rs
          git commit -m "FIX | BUG-SVC-033 parse service exports across whitespace"
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$(git rev-parse HEAD~2)" ]; then
            git rebase origin/main
          fi
          git push origin HEAD:main
