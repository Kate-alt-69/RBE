name: One-shot Service Mother frame bounds repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-svc-mother-bounds.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Bound Service Mother readiness and stdout frames
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main

          python3 <<'PY'
          from pathlib import Path

          path = Path("engine/crates/backend/src/service_mother.rs")
          source = path.read_text()

          source = source.replace(
              "use tokio::io::{AsyncBufReadExt, BufReader};",
              "use tokio::io::{AsyncBufRead, AsyncBufReadExt, BufReader};",
              1,
          )

          old_constants = '''const MOTHER_RESTART_BASE_DELAY: Duration = Duration::from_millis(250);\nconst MOTHER_RESTART_MAX_DELAY: Duration = Duration::from_secs(30);\nconst MOTHER_STABLE_WINDOW: Duration = Duration::from_secs(60);'''
          new_constants = '''const MOTHER_RESTART_BASE_DELAY: Duration = Duration::from_millis(250);\nconst MOTHER_RESTART_MAX_DELAY: Duration = Duration::from_secs(30);\nconst MOTHER_STABLE_WINDOW: Duration = Duration::from_secs(60);\nconst MOTHER_READY_MAX_BYTES: usize = 4 * 1024;\nconst MOTHER_STDOUT_LINE_MAX_BYTES: usize = 64 * 1024;'''
          if old_constants not in source:
              raise SystemExit("Service Mother constants anchor changed")
          source = source.replace(old_constants, new_constants, 1)

          old_ready = '''    let mut reader = BufReader::new(stdout);\n    let mut line = String::new();\n    let bytes =\n        match tokio::time::timeout(Duration::from_secs(30), reader.read_line(&mut line)).await {\n            Ok(Ok(bytes)) => bytes,\n            Ok(Err(error)) => {\n                cleanup_failed_spawn(&alias, &mut child).await;\n                return Err(error.into());\n            }\n            Err(_) => {\n                cleanup_failed_spawn(&alias, &mut child).await;\n                anyhow::bail!("Service Mother readiness timed out");\n            }\n        };\n    if bytes == 0 {\n        cleanup_failed_spawn(&alias, &mut child).await;\n        anyhow::bail!("Service Mother exited before readiness");\n    }\n    let ready: ServiceMotherReady = match serde_json::from_str(line.trim()) {'''
          new_ready = '''    let mut reader = BufReader::new(stdout);\n    let line = match tokio::time::timeout(\n        Duration::from_secs(30),\n        read_bounded_buffered_line(\n            &mut reader,\n            MOTHER_READY_MAX_BYTES,\n            "Service Mother readiness",\n        ),\n    )\n    .await\n    {\n        Ok(Ok(Some(line))) => line,\n        Ok(Ok(None)) => {\n            cleanup_failed_spawn(&alias, &mut child).await;\n            anyhow::bail!("Service Mother exited before readiness");\n        }\n        Ok(Err(error)) => {\n            cleanup_failed_spawn(&alias, &mut child).await;\n            return Err(error);\n        }\n        Err(_) => {\n            cleanup_failed_spawn(&alias, &mut child).await;\n            anyhow::bail!("Service Mother readiness timed out");\n        }\n    };\n    let ready: ServiceMotherReady = match serde_json::from_str(line.trim()) {'''
          if old_ready not in source:
              raise SystemExit("Service Mother readiness anchor changed")
          source = source.replace(old_ready, new_ready, 1)

          old_drain = '''    tokio::spawn(async move {\n        let mut line = String::new();\n        loop {\n            line.clear();\n            match reader.read_line(&mut line).await {\n                Ok(0) => return,\n                Ok(_) => {\n                    let output = line.trim_end();\n                    if !output.is_empty() {\n                        tracing::info!(%output, "Service Mother stdout");\n                    }\n                }\n                Err(error) => {\n                    tracing::warn!(error = %error, "failed to drain Service Mother stdout");\n                    return;\n                }\n            }\n        }\n    });'''
          new_drain = '''    tokio::spawn(async move {\n        loop {\n            match read_service_mother_stdout_line(&mut reader, MOTHER_STDOUT_LINE_MAX_BYTES).await {\n                Ok(None) => return,\n                Ok(Some(ServiceMotherStdoutLine::Line(line))) => {\n                    let output = line.trim_end();\n                    if !output.is_empty() {\n                        tracing::info!(%output, "Service Mother stdout");\n                    }\n                }\n                Ok(Some(ServiceMotherStdoutLine::Oversized)) => tracing::warn!(\n                    max_bytes = MOTHER_STDOUT_LINE_MAX_BYTES,\n                    "discarded oversized Service Mother stdout line"\n                ),\n                Ok(Some(ServiceMotherStdoutLine::InvalidUtf8)) => tracing::warn!(\n                    "discarded non-UTF-8 Service Mother stdout line"\n                ),\n                Err(error) => {\n                    tracing::warn!(error = %error, "failed to drain Service Mother stdout");\n                    return;\n                }\n            }\n        }\n    });'''
          if old_drain not in source:
              raise SystemExit("Service Mother stdout drain anchor changed")
          source = source.replace(old_drain, new_drain, 1)

          helper_anchor = '''fn flag_value(args: &[String], flag: &str) -> Option<String> {'''
          helpers = '''async fn read_bounded_buffered_line<R>(\n    reader: &mut R,\n    max_bytes: usize,\n    label: &str,\n) -> anyhow::Result<Option<String>>\nwhere\n    R: AsyncBufRead + Unpin,\n{\n    let mut bytes = Vec::with_capacity(max_bytes.min(1024));\n    loop {\n        let buffer = reader.fill_buf().await?;\n        if buffer.is_empty() {\n            if bytes.is_empty() {\n                return Ok(None);\n            }\n            anyhow::bail!("{label} is not newline terminated");\n        }\n\n        let newline = buffer.iter().position(|byte| *byte == b'\\n');\n        let consumed = newline.map_or(buffer.len(), |index| index + 1);\n        if bytes.len().saturating_add(consumed) > max_bytes {\n            reader.consume(consumed);\n            anyhow::bail!("{label} exceeded {max_bytes} bytes");\n        }\n        bytes.extend_from_slice(&buffer[..consumed]);\n        reader.consume(consumed);\n        if newline.is_some() {\n            return String::from_utf8(bytes)\n                .map(Some)\n                .map_err(|error| anyhow::anyhow!("{label} is not valid UTF-8: {error}"));\n        }\n    }\n}\n\nenum ServiceMotherStdoutLine {\n    Line(String),\n    Oversized,\n    InvalidUtf8,\n}\n\nasync fn read_service_mother_stdout_line<R>(\n    reader: &mut R,\n    max_bytes: usize,\n) -> std::io::Result<Option<ServiceMotherStdoutLine>>\nwhere\n    R: AsyncBufRead + Unpin,\n{\n    let mut bytes = Vec::with_capacity(max_bytes.min(1024));\n    let mut oversized = false;\n    loop {\n        let buffer = reader.fill_buf().await?;\n        if buffer.is_empty() {\n            if bytes.is_empty() && !oversized {\n                return Ok(None);\n            }\n            if oversized {\n                return Ok(Some(ServiceMotherStdoutLine::Oversized));\n            }\n            return Ok(Some(match String::from_utf8(bytes) {\n                Ok(line) => ServiceMotherStdoutLine::Line(line),\n                Err(_) => ServiceMotherStdoutLine::InvalidUtf8,\n            }));\n        }\n\n        let newline = buffer.iter().position(|byte| *byte == b'\\n');\n        let consumed = newline.map_or(buffer.len(), |index| index + 1);\n        if !oversized {\n            if bytes.len().saturating_add(consumed) > max_bytes {\n                oversized = true;\n                bytes.clear();\n            } else {\n                bytes.extend_from_slice(&buffer[..consumed]);\n            }\n        }\n        reader.consume(consumed);\n\n        if newline.is_some() {\n            if oversized {\n                return Ok(Some(ServiceMotherStdoutLine::Oversized));\n            }\n            return Ok(Some(match String::from_utf8(bytes) {\n                Ok(line) => ServiceMotherStdoutLine::Line(line),\n                Err(_) => ServiceMotherStdoutLine::InvalidUtf8,\n            }));\n        }\n    }\n}\n\n'''
          if helper_anchor not in source:
              raise SystemExit("Service Mother helper insertion anchor changed")
          source = source.replace(helper_anchor, helpers + helper_anchor, 1)

          test_anchor = '''    #[test]\n    fn catalog_fingerprint_argument_is_fixed_size_hex() {'''
          tests = '''    #[tokio::test]\n    async fn mother_readiness_reader_is_bounded_and_preserves_following_output() {\n        let payload = b"{\\\"pid\\\":1}\\nfirst-log-line\\n";\n        let mut reader = BufReader::new(&payload[..]);\n        let readiness = read_bounded_buffered_line(&mut reader, 64, "readiness")\n            .await\n            .unwrap()\n            .unwrap();\n        assert_eq!(readiness, "{\\\"pid\\\":1}\\n");\n\n        let mut next = String::new();\n        reader.read_line(&mut next).await.unwrap();\n        assert_eq!(next, "first-log-line\\n");\n\n        let oversized = format!("{}\\n", "x".repeat(65));\n        let mut oversized_reader = BufReader::new(oversized.as_bytes());\n        let error = read_bounded_buffered_line(&mut oversized_reader, 64, "readiness")\n            .await\n            .unwrap_err();\n        assert!(error.to_string().contains("exceeded 64 bytes"));\n    }\n\n    #[tokio::test]\n    async fn mother_stdout_reader_discards_oversized_lines_and_keeps_draining() {\n        let payload = format!("{}\\nnext-line\\n", "x".repeat(65));\n        let mut reader = BufReader::new(payload.as_bytes());\n        assert!(matches!(\n            read_service_mother_stdout_line(&mut reader, 64).await.unwrap(),\n            Some(ServiceMotherStdoutLine::Oversized)\n        ));\n        match read_service_mother_stdout_line(&mut reader, 64).await.unwrap() {\n            Some(ServiceMotherStdoutLine::Line(line)) => assert_eq!(line, "next-line\\n"),\n            _ => panic!("stdout reader should continue with the next bounded line"),\n        }\n    }\n\n'''
          if test_anchor not in source:
              raise SystemExit("Service Mother tests anchor changed")
          source = source.replace(test_anchor, tests + test_anchor, 1)

          path.write_text(source)
          PY

          cd engine
          cargo fmt --all
          cd ..

          git rm .github/workflows/one-shot-svc-mother-bounds.yml
          git add engine/crates/backend/src/service_mother.rs
          git commit -m "FIX | BUG-SVC-029 bound Service Mother stdout frames"

          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$(git rev-parse HEAD^)" ]; then
            git rebase origin/main
          fi
          git push origin HEAD:main
