name: One-shot Service Mother shutdown ack repair

"on":
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-svc-mother-shutdown-ack.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply and validate Service Mother shutdown repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main

          python3 .github/patches/svc-mother-shutdown-ack.py

          cd engine
          cargo fmt --all
          cargo test -p service-runtime shutdown_request_is_acknowledged_and_signals_listener
          cargo test -p service-runtime
          cd ..

          git rm .github/workflows/one-shot-svc-mother-shutdown-ack.yml
          git rm .github/patches/svc-mother-shutdown-ack.py
          git add engine/crates/service-runtime/src/mother.rs
          git commit -m "FIX | BUG-SVC-035 acknowledge Service Mother shutdown before draining"

          git fetch origin main
          base="$(git rev-parse HEAD~1)"
          current="$(git rev-parse origin/main)"
          if [ "$current" != "$base" ]; then
            git rebase origin/main
          fi
          git push origin HEAD:main
