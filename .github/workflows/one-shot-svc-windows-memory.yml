name: One-shot Windows service memory limit repair

"on":
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-svc-windows-memory.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply and validate Windows service memory repair
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main

          python .github/patches/svc-windows-memory.py

          Push-Location engine
          cargo fmt --all
          cargo test -p service-runtime
          cargo check -p service-runtime
          Pop-Location

          git rm .github/workflows/one-shot-svc-windows-memory.yml
          git rm .github/patches/svc-windows-memory.py
          git add engine/crates/service-runtime/Cargo.toml engine/crates/service-runtime/src/lib.rs engine/Cargo.lock
          git commit -m 'FIX | BUG-SVC-034 enforce service memory limits on Windows'

          git fetch origin main
          $base = git rev-parse HEAD~1
          $current = git rev-parse origin/main
          if ($current -ne $base) {
            git rebase origin/main
          }
          git push origin HEAD:main
