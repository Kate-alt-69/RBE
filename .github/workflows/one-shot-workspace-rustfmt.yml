name: One-shot workspace rustfmt repair

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-workspace-rustfmt.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format Rust workspace and commit
        shell: bash
        run: |
          set -euo pipefail
          cd engine
          cargo fmt --all
          cd ..

          rm .github/workflows/one-shot-workspace-rustfmt.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "FIX | BUG-QDB-003 format Rust workspace"
          git push origin HEAD:main
