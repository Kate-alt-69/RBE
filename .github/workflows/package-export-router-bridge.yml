name: Land Runtime Image Package Export Bridge

on:
  push:
    paths:
      - ".github/workflows/package-export-router-bridge.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Wire trusted package caller into Runtime Image routes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          discovery_path = Path('engine/crates/route-engine/src/discovery.rs')
          lib_path = Path('engine/crates/route-engine/src/lib.rs')
          doc_path = Path('doc/library-host-web-build.md')

          discovery = discovery_path.read_text(encoding='utf-8')
          lib = lib_path.read_text(encoding='utf-8')
          doc = doc_path.read_text(encoding='utf-8')

          discovery = discovery.replace(
              'use crate::module_eval::ModuleExecutor;',
              'use crate::module_eval::{ModuleExecutor, PackageExportCaller};',
              1,
          )

          old_plan = '''#[derive(Clone)]
          struct RouteHandlerPlan {
              inline_file: Arc<ModuleFile>,
              module_program: Arc<ModuleProgram>,
              native_plan: Option<Arc<NativeRoutePlan>>,
              field_plan: Arc<FieldRoutePlan>,
              takes_request: bool,
          }
          '''
          new_plan = '''#[derive(Clone)]
          struct RouteHandlerPlan {
              inline_file: Arc<ModuleFile>,
              module_program: Arc<ModuleProgram>,
              native_plan: Option<Arc<NativeRoutePlan>>,
              field_plan: Arc<FieldRoutePlan>,
              package_exports: Option<Arc<dyn PackageExportCaller>>,
              takes_request: bool,
          }
          '''
          if old_plan not in discovery:
              raise SystemExit('RouteHandlerPlan anchor drifted')
          discovery = discovery.replace(old_plan, new_plan, 1)

          old_destructure = '''    let RouteHandlerPlan {
              inline_file,
              module_program,
              native_plan,
              field_plan,
              takes_request,
          } = plan;
          '''
          new_destructure = '''    let RouteHandlerPlan {
              inline_file,
              module_program,
              native_plan,
              field_plan,
              package_exports,
              takes_request,
          } = plan;
          '''
          if old_destructure not in discovery:
              raise SystemExit('execute destructure anchor drifted')
          discovery = discovery.replace(old_destructure, new_destructure, 1)

          old_executor = '''    let executor = ModuleExecutor::with_services_and_host_capabilities(
              module_program.as_ref(),
              state.services.clone(),
              Arc::new(host),
          );
          match executor
          '''
          new_executor = '''    let executor = ModuleExecutor::with_services_and_host_capabilities(
              module_program.as_ref(),
              state.services.clone(),
              Arc::new(host),
          );
          let executor = match package_exports {
              Some(package_exports) => executor.with_package_export_caller(package_exports),
              None => executor,
          };
          match executor
          '''
          if old_executor not in discovery:
              raise SystemExit('ModuleExecutor anchor drifted')
          discovery = discovery.replace(old_executor, new_executor, 1)

          old_method_sig = '''fn build_method_router(
              file: &RouteFile,
              module_program: Arc<ModuleProgram>,
              native_plan: Option<Arc<NativeRoutePlan>>,
              field_plan: Arc<FieldRoutePlan>,
          ) -> MethodRouter<AppState> {
          '''
          new_method_sig = '''fn build_method_router(
              file: &RouteFile,
              module_program: Arc<ModuleProgram>,
              native_plan: Option<Arc<NativeRoutePlan>>,
              field_plan: Arc<FieldRoutePlan>,
              package_exports: Option<Arc<dyn PackageExportCaller>>,
          ) -> MethodRouter<AppState> {
          '''
          if old_method_sig not in discovery:
              raise SystemExit('build_method_router signature anchor drifted')
          discovery = discovery.replace(old_method_sig, new_method_sig, 1)

          old_handler_plan = '''        let handler_plan = RouteHandlerPlan {
                  inline_file,
                  module_program: module_program.clone(),
                  native_plan: native_plan.clone(),
                  field_plan: field_plan.clone(),
                  takes_request: method_def.param_name.is_some(),
              };
          '''
          new_handler_plan = '''        let handler_plan = RouteHandlerPlan {
                  inline_file,
                  module_program: module_program.clone(),
                  native_plan: native_plan.clone(),
                  field_plan: field_plan.clone(),
                  package_exports: package_exports.clone(),
                  takes_request: method_def.param_name.is_some(),
              };
          '''
          if old_handler_plan not in discovery:
              raise SystemExit('handler plan construction anchor drifted')
          discovery = discovery.replace(old_handler_plan, new_handler_plan, 1)

          legacy_call = '''            build_method_router(
                          &route_file,
                          module_program.clone(),
                          None,
                          Arc::new(FieldRoutePlan::default()),
                      ),
          '''
          legacy_new = '''            build_method_router(
                          &route_file,
                          module_program.clone(),
                          None,
                          Arc::new(FieldRoutePlan::default()),
                          None,
                      ),
          '''
          if legacy_call not in discovery:
              raise SystemExit('legacy build_method_router call anchor drifted')
          discovery = discovery.replace(legacy_call, legacy_new, 1)

          old_image_fn = '''pub fn build_routes_from_image(
              image: &RuntimeImage,
              service_interfaces: &ServiceInterfaces,
          ) -> anyhow::Result<Router<AppState>> {
              crate::route_collision::validate_image(image)?;
          '''
          new_image_fn = '''pub fn build_routes_from_image(
              image: &RuntimeImage,
              service_interfaces: &ServiceInterfaces,
          ) -> anyhow::Result<Router<AppState>> {
              build_routes_from_image_with_package_exports(image, service_interfaces, None)
          }

          pub(crate) fn build_routes_from_image_with_package_exports(
              image: &RuntimeImage,
              service_interfaces: &ServiceInterfaces,
              package_exports: Option<Arc<dyn PackageExportCaller>>,
          ) -> anyhow::Result<Router<AppState>> {
              crate::route_collision::validate_image(image)?;
          '''
          if old_image_fn not in discovery:
              raise SystemExit('Runtime Image router function anchor drifted')
          discovery = discovery.replace(old_image_fn, new_image_fn, 1)

          image_call = '''            build_method_router(
                          route_file.as_ref(),
                          module_program.clone(),
                          native_plan,
                          field_plan,
                      ),
          '''
          image_new = '''            build_method_router(
                          route_file.as_ref(),
                          module_program.clone(),
                          native_plan,
                          field_plan,
                          package_exports.clone(),
                      ),
          '''
          if image_call not in discovery:
              raise SystemExit('Runtime Image build_method_router call anchor drifted')
          discovery = discovery.replace(image_call, image_new, 1)

          old_public = '''pub fn build_routes_from_image(
              image: &RuntimeImage,
              service_interfaces: &ServiceInterfaces,
          ) -> anyhow::Result<axum::Router<core_lib::AppState>> {
              discovery::build_routes_from_image(image, service_interfaces)
          }
          '''
          new_public = '''pub fn build_routes_from_image(
              image: &RuntimeImage,
              service_interfaces: &ServiceInterfaces,
          ) -> anyhow::Result<axum::Router<core_lib::AppState>> {
              discovery::build_routes_from_image(image, service_interfaces)
          }

          /// Build a Runtime Image router with a trusted package-export bridge.
          ///
          /// Only the immutable Runtime Image path accepts this caller because RELC has
          /// already validated every `X from Y` import against the verified root-only
          /// PackageLinkContext. The legacy filesystem loader intentionally remains
          /// package-runtime-free.
          pub fn build_routes_from_image_with_package_exports(
              image: &RuntimeImage,
              service_interfaces: &ServiceInterfaces,
              package_exports: std::sync::Arc<dyn PackageExportCaller>,
          ) -> anyhow::Result<axum::Router<core_lib::AppState>> {
              discovery::build_routes_from_image_with_package_exports(
                  image,
                  service_interfaces,
                  Some(package_exports),
              )
          }
          '''
          if old_public not in lib:
              raise SystemExit('public Runtime Image route builder anchor drifted')
          lib = lib.replace(old_public, new_public, 1)

          old_doc = '''### 4.2 Current integration boundary

          `LIBHOST-046` implements the secure live Container relay itself. Backend still needs the final owner-side integration that selects the trusted packaged proxy executable, sends the sealed bootstrap, consumes `library.proxy.ready`, attaches the resulting channel to the retained `LibrarySessionBinding`, and requires the existing `library.hello` handshake before exposing the package worker as live.

          Until that owner path is connected, documentation must not claim that every installed package worker is already launched end-to-end through live proxy mode.
          '''
          new_doc = '''### 4.2 Current integration boundary

          `LIBHOST-046` implements the secure live Container relay itself. Route Engine now also exposes a Runtime-Image-only package-export injection point: a trusted host can supply `PackageExportCaller`, and linked `X from Y` Module REL calls are forwarded through that logical package/export/operation bridge. The legacy filesystem router deliberately has no such package runtime because it has not passed the immutable `PackageLinkContext` gate.

          Backend still needs the final owner-side worker integration that selects the trusted packaged proxy executable, sends the sealed bootstrap, consumes `library.proxy.ready`, attaches the resulting channel to the retained `LibrarySessionBinding`, requires the existing `library.hello` handshake, and implements `PackageExportCaller` on top of that accepted live worker channel.

          Until that owner path is connected, documentation must not claim that every installed package worker is already launched end-to-end through live proxy mode. A Runtime Image accepting a package caller is an execution injection boundary, not proof that Backend has started or accepted the corresponding worker.
          '''
          if old_doc not in doc:
              raise SystemExit('Library Host integration-boundary doc anchor drifted')
          doc = doc.replace(old_doc, new_doc, 1)

          discovery_path.write_text(discovery, encoding='utf-8')
          lib_path.write_text(lib, encoding='utf-8')
          doc_path.write_text(doc, encoding='utf-8')
          PY
          rustfmt --edition 2021 engine/crates/route-engine/src/discovery.rs engine/crates/route-engine/src/lib.rs
      - name: Clippy Route Engine
        working-directory: engine
        run: cargo clippy --locked -p route-engine --all-targets -- -D warnings
      - name: Test Route Engine
        working-directory: engine
        run: cargo test --locked -p route-engine
      - name: Commit verified package bridge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add engine/crates/route-engine/src/discovery.rs engine/crates/route-engine/src/lib.rs doc/library-host-web-build.md
          git rm .github/workflows/package-export-router-bridge.yml
          python3 - <<'PY'
          import subprocess
          allowed = {
              'D  .github/workflows/package-export-router-bridge.yml',
              'M  doc/library-host-web-build.md',
              'M  engine/crates/route-engine/src/discovery.rs',
              'M  engine/crates/route-engine/src/lib.rs',
          }
          actual = set(subprocess.check_output(['git', 'status', '--porcelain'], text=True).splitlines())
          if actual != allowed:
              raise SystemExit(f'unexpected package bridge working tree: {sorted(actual)}')
          PY
          git commit -m 'FEAT | LIBHOST-047 inject verified package calls into Runtime Image routes'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
