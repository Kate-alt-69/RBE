name: Land Runtime Image Package Export Bridge

on:
  push:
    paths:
      - ".github/workflows/package-export-router-bridge.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Wire trusted package caller into Runtime Image routes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          discovery_path = Path('engine/crates/route-engine/src/discovery.rs')
          lib_path = Path('engine/crates/route-engine/src/lib.rs')
          doc_path = Path('doc/library-host-web-build.md')

          discovery = discovery_path.read_text(encoding='utf-8')
          lib = lib_path.read_text(encoding='utf-8')
          doc = doc_path.read_text(encoding='utf-8')

          def once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label} anchor count={count}, expected 1')
              return text.replace(old, new, 1)

          discovery = once(
              discovery,
              'use crate::module_eval::ModuleExecutor;',
              'use crate::module_eval::{ModuleExecutor, PackageExportCaller};',
              'module evaluator import',
          )

          discovery = once(
              discovery,
              '    field_plan: Arc<FieldRoutePlan>,\n    takes_request: bool,\n}\n\nasync fn execute(',
              '    field_plan: Arc<FieldRoutePlan>,\n    package_exports: Option<Arc<dyn PackageExportCaller>>,\n    takes_request: bool,\n}\n\nasync fn execute(',
              'RouteHandlerPlan field',
          )

          execute_start = discovery.index('async fn execute(')
          execute_end = discovery.index('\nfn build_method_router(', execute_start)
          execute = discovery[execute_start:execute_end]
          execute = once(
              execute,
              '        field_plan,\n        takes_request,\n    } = plan;',
              '        field_plan,\n        package_exports,\n        takes_request,\n    } = plan;',
              'execute RouteHandlerPlan destructure',
          )
          execute = once(
              execute,
              '    let executor = ModuleExecutor::with_services_and_host_capabilities(\n        module_program.as_ref(),\n        state.services.clone(),\n        Arc::new(host),\n    );\n',
              '    let executor = ModuleExecutor::with_services_and_host_capabilities(\n        module_program.as_ref(),\n        state.services.clone(),\n        Arc::new(host),\n    );\n    let executor = match package_exports {\n        Some(package_exports) => executor.with_package_export_caller(package_exports),\n        None => executor,\n    };\n',
              'ModuleExecutor package bridge',
          )
          discovery = discovery[:execute_start] + execute + discovery[execute_end:]

          discovery = once(
              discovery,
              'fn build_method_router(\n    file: &RouteFile,\n    module_program: Arc<ModuleProgram>,\n    native_plan: Option<Arc<NativeRoutePlan>>,\n    field_plan: Arc<FieldRoutePlan>,\n) -> MethodRouter<AppState> {',
              'fn build_method_router(\n    file: &RouteFile,\n    module_program: Arc<ModuleProgram>,\n    native_plan: Option<Arc<NativeRoutePlan>>,\n    field_plan: Arc<FieldRoutePlan>,\n    package_exports: Option<Arc<dyn PackageExportCaller>>,\n) -> MethodRouter<AppState> {',
              'build_method_router signature',
          )
          discovery = once(
              discovery,
              '            field_plan: field_plan.clone(),\n            takes_request: method_def.param_name.is_some(),',
              '            field_plan: field_plan.clone(),\n            package_exports: package_exports.clone(),\n            takes_request: method_def.param_name.is_some(),',
              'RouteHandlerPlan construction',
          )
          discovery = once(
              discovery,
              '                Arc::new(FieldRoutePlan::default()),\n            ),',
              '                Arc::new(FieldRoutePlan::default()),\n                None,\n            ),',
              'legacy route package caller',
          )

          image_start = discovery.index('pub fn build_routes_from_image(\n')
          image_header_end = discovery.index('    crate::route_collision::validate_image(image)?;', image_start)
          old_header = discovery[image_start:image_header_end + len('    crate::route_collision::validate_image(image)?;')]
          expected_prefix = (
              'pub fn build_routes_from_image(\n'
              '    image: &RuntimeImage,\n'
              '    service_interfaces: &ServiceInterfaces,\n'
              ') -> anyhow::Result<Router<AppState>> {\n'
              '    crate::route_collision::validate_image(image)?;'
          )
          if old_header != expected_prefix:
              raise SystemExit('Runtime Image router header drifted')
          new_header = (
              'pub fn build_routes_from_image(\n'
              '    image: &RuntimeImage,\n'
              '    service_interfaces: &ServiceInterfaces,\n'
              ') -> anyhow::Result<Router<AppState>> {\n'
              '    build_routes_from_image_with_package_exports(image, service_interfaces, None)\n'
              '}\n\n'
              'pub(crate) fn build_routes_from_image_with_package_exports(\n'
              '    image: &RuntimeImage,\n'
              '    service_interfaces: &ServiceInterfaces,\n'
              '    package_exports: Option<Arc<dyn PackageExportCaller>>,\n'
              ') -> anyhow::Result<Router<AppState>> {\n'
              '    crate::route_collision::validate_image(image)?;'
          )
          discovery = discovery[:image_start] + new_header + discovery[image_header_end + len('    crate::route_collision::validate_image(image)?;'):]

          image_fn_start = discovery.index('pub(crate) fn build_routes_from_image_with_package_exports(')
          image_fn_end = discovery.index('\n#[cfg(test)]', image_fn_start)
          image_fn = discovery[image_fn_start:image_fn_end]
          image_fn = once(
              image_fn,
              '                native_plan,\n                field_plan,\n            ),',
              '                native_plan,\n                field_plan,\n                package_exports.clone(),\n            ),',
              'Runtime Image route package caller',
          )
          discovery = discovery[:image_fn_start] + image_fn + discovery[image_fn_end:]

          lib = once(
              lib,
              'pub fn build_routes_from_image(\n    image: &RuntimeImage,\n    service_interfaces: &ServiceInterfaces,\n) -> anyhow::Result<axum::Router<core_lib::AppState>> {\n    discovery::build_routes_from_image(image, service_interfaces)\n}\n',
              'pub fn build_routes_from_image(\n    image: &RuntimeImage,\n    service_interfaces: &ServiceInterfaces,\n) -> anyhow::Result<axum::Router<core_lib::AppState>> {\n    discovery::build_routes_from_image(image, service_interfaces)\n}\n\n/// Build a Runtime Image router with a trusted package-export bridge.\n///\n/// Only the immutable Runtime Image path accepts this caller because RELC has\n/// already validated every `X from Y` import against the verified root-only\n/// `PackageLinkContext`. The legacy filesystem loader intentionally remains\n/// package-runtime-free.\npub fn build_routes_from_image_with_package_exports(\n    image: &RuntimeImage,\n    service_interfaces: &ServiceInterfaces,\n    package_exports: std::sync::Arc<dyn PackageExportCaller>,\n) -> anyhow::Result<axum::Router<core_lib::AppState>> {\n    discovery::build_routes_from_image_with_package_exports(\n        image,\n        service_interfaces,\n        Some(package_exports),\n    )\n}\n',
              'public Runtime Image router API',
          )

          old_boundary = (
              '### 4.2 Current integration boundary\n\n'
              '`LIBHOST-046` implements the secure live Container relay itself. Backend still needs the final owner-side integration that selects the trusted packaged proxy executable, sends the sealed bootstrap, consumes `library.proxy.ready`, attaches the resulting channel to the retained `LibrarySessionBinding`, and requires the existing `library.hello` handshake before exposing the package worker as live.\n\n'
              'Until that owner path is connected, documentation must not claim that every installed package worker is already launched end-to-end through live proxy mode.\n'
          )
          new_boundary = (
              '### 4.2 Current integration boundary\n\n'
              '`LIBHOST-046` implements the secure live Container relay itself. Route Engine now also exposes a Runtime-Image-only package-export injection point: a trusted host can supply `PackageExportCaller`, and linked `X from Y` Module REL calls are forwarded through that logical package/export/operation bridge. The legacy filesystem router deliberately has no such package runtime because it has not passed the immutable `PackageLinkContext` gate.\n\n'
              'Backend still needs the final owner-side worker integration that selects the trusted packaged proxy executable, sends the sealed bootstrap, consumes `library.proxy.ready`, attaches the resulting channel to the retained `LibrarySessionBinding`, requires the existing `library.hello` handshake, and implements `PackageExportCaller` on top of that accepted live worker channel.\n\n'
              'Until that owner path is connected, documentation must not claim that every installed package worker is already launched end-to-end through live proxy mode. A Runtime Image accepting a package caller is an execution injection boundary, not proof that Backend has started or accepted the corresponding worker.\n'
          )
          doc = once(doc, old_boundary, new_boundary, 'Library Host integration boundary docs')

          discovery_path.write_text(discovery, encoding='utf-8')
          lib_path.write_text(lib, encoding='utf-8')
          doc_path.write_text(doc, encoding='utf-8')
          PY
          rustfmt --edition 2021 engine/crates/route-engine/src/discovery.rs engine/crates/route-engine/src/lib.rs
      - name: Clippy Route Engine
        working-directory: engine
        run: cargo clippy --locked -p route-engine --all-targets -- -D warnings
      - name: Test Route Engine
        working-directory: engine
        run: cargo test --locked -p route-engine
      - name: Commit verified package bridge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add engine/crates/route-engine/src/discovery.rs engine/crates/route-engine/src/lib.rs doc/library-host-web-build.md
          git rm .github/workflows/package-export-router-bridge.yml
          python3 - <<'PY'
          import subprocess
          allowed = {
              'D  .github/workflows/package-export-router-bridge.yml',
              'M  doc/library-host-web-build.md',
              'M  engine/crates/route-engine/src/discovery.rs',
              'M  engine/crates/route-engine/src/lib.rs',
          }
          actual = set(subprocess.check_output(['git', 'status', '--porcelain'], text=True).splitlines())
          if actual != allowed:
              raise SystemExit(f'unexpected package bridge working tree: {sorted(actual)}')
          PY
          git commit -m 'FEAT | LIBHOST-047 inject verified package calls into Runtime Image routes'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
