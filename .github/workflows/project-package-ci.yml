name: Project Package CI

on:
  push:
    paths:
      - 'project-package/**'
      - '.github/workflows/project-package-ci.yml'
  pull_request:
    paths:
      - 'project-package/**'
      - '.github/workflows/project-package-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: project-package
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: project-package
      - name: fmt check
        run: cargo fmt -- --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test
