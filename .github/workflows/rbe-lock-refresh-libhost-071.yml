name: RBE lock refresh helper

on:
  push:
    branches:
      - rbe-lock-refresh-libhost-071
    paths:
      - engine/crates/backend/Cargo.toml
      - .github/workflows/rbe-lock-refresh-libhost-071.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh Cargo lock metadata
        run: cargo metadata --manifest-path engine/Cargo.toml --format-version 1 > /dev/null
      - name: Commit generated lock
        shell: bash
        run: |
          if git diff --quiet -- engine/Cargo.lock; then
            echo "Cargo.lock already matches the manifest."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/Cargo.lock
          git commit -m "BUILD | LIBHOST-071 refresh TLS dependency lock"
          git push origin HEAD:rbe-lock-refresh-libhost-071
