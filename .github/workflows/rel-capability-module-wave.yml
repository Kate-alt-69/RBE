name: REL capability and module runtime wave

on:
  push:
    paths:
      - '.github/workflows/rel-capability-module-wave.yml'

permissions:
  contents: write

concurrency:
  group: rel-capability-module-wave-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Apply REL capability and module runtime wave
        run: python .github/patches/rel-capability-module-wave.py

      - name: Format
        run: cargo fmt --manifest-path engine/Cargo.toml --all

      - name: Refresh lockfile for explicit capability dependencies
        run: cargo check --manifest-path engine/Cargo.toml --workspace

      - name: Check locked workspace
        run: cargo check --manifest-path engine/Cargo.toml --workspace --locked

      - name: Test affected runtime slices
        run: cargo test --manifest-path engine/Cargo.toml -p route-engine -p api -p backend --locked

      - name: Clippy affected runtime slices
        run: cargo clippy --manifest-path engine/Cargo.toml -p route-engine -p api -p backend --all-targets --locked -- -D warnings

      - name: Verify REL capability and module contracts
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q '"http" => matches!(function, "request" | "get" | "post")' engine/crates/route-engine/src/modules.rs
          grep -q 'ModuleKind::Builtin(BuiltinModule::Request) => call_request' engine/crates/route-engine/src/modules.rs
          grep -q 'ModuleKind::Builtin(BuiltinModule::Security) => call_security' engine/crates/route-engine/src/modules.rs
          grep -q 'return call_http(function, args).await.map(Some)' engine/crates/route-engine/src/video_host.rs
          grep -q 'redirect(reqwest::redirect::Policy::none())' engine/crates/route-engine/src/video_host.rs
          grep -q 'no_proxy()' engine/crates/route-engine/src/video_host.rs
          grep -q 'validate_module_graph(&binary_root, &modules, &mut errors)' engine/crates/route-engine/src/module_runtime.rs
          test "$(grep -c 'validate_module_graph(&binary_root, &modules, &mut errors)' engine/crates/route-engine/src/module_runtime.rs)" -eq 2
          grep -q 'code: "MOD2011"' engine/crates/route-engine/src/module_runtime.rs
          grep -q 'Status: \*\*IMPLEMENTED / EXECUTABLE\*\*' docs/module-language.md
          ! grep -q 'BuiltinModule::Request) => Err' engine/crates/route-engine/src/modules.rs
          ! grep -q 'BuiltinModule::Security) => Err' engine/crates/route-engine/src/modules.rs

      - name: Commit verified REL runtime wave
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          latest="$(git rev-parse origin/main)"
          if [[ "$latest" != "$GITHUB_SHA" ]]; then
            echo "main moved during validation; refusing stale commit" >&2
            exit 75
          fi

          rm -f .github/patches/rel-capability-module-wave.py
          rm -f .github/workflows/rel-capability-module-wave.yml

          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'FIX | BUG-REL-001 complete module graph and REL request security HTTP capabilities'
          git push origin HEAD:main
