name: RELC Core Wiring

on:
  push:
    paths:
      - '.github/patches/relc-wire-core.py'
      - '.github/workflows/relc-wire-core.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply RELC wiring
        run: python .github/patches/relc-wire-core.py
      - name: Format workspace
        working-directory: engine
        run: cargo fmt --all
      - name: Check route-engine
        working-directory: engine
        run: cargo check -p route-engine
      - name: Test route-engine
        working-directory: engine
        run: cargo test -p route-engine
      - name: Clippy route-engine
        working-directory: engine
        run: cargo clippy -p route-engine --all-targets -- -D warnings
      - name: Commit successful wiring and remove one-shot files
        shell: bash
        run: |
          rm -f .github/patches/relc-wire-core.py .github/workflows/relc-wire-core.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: link RELC Runtime Image core"
          git push origin HEAD:main
