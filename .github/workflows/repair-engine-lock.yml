name: Repair Engine Cargo Lock

on:
  push:
    paths:
      - '.github/workflows/repair-engine-lock.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Add install-executor IPC lock edge
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('engine/Cargo.lock')
          text = path.read_text()
          needle = '''[[package]]
          name = "rbe-install-executor"
          version = "0.1.0"
          dependencies = [
           "rbe-install-request",
          '''.replace('          ', '')
          replacement = '''[[package]]
          name = "rbe-install-executor"
          version = "0.1.0"
          dependencies = [
           "ipc-protocol",
           "rbe-install-request",
          '''.replace('          ', '')
          count = text.count(needle)
          if count != 1:
              raise SystemExit(f'expected exactly one install-executor lock insertion point, found {count}')
          path.write_text(text.replace(needle, replacement, 1))
          PY
          git diff --check -- engine/Cargo.lock
          test "$(git diff --numstat -- engine/Cargo.lock)" = $'1\t0\tengine/Cargo.lock' || {
            echo 'unexpected Engine lock diff:' >&2
            git diff -- engine/Cargo.lock
            exit 1
          }
      - name: Verify locked workspace metadata
        shell: bash
        run: cargo metadata --manifest-path engine/Cargo.toml --locked --no-deps --format-version 1 >/dev/null
      - name: Commit repaired lock
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add engine/Cargo.lock
          git commit -m 'FIX | BUG-WEBBUILD-008 refresh Engine worker proxy lock edge'
          git push origin HEAD:main
