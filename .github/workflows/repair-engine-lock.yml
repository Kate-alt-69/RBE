name: Repair Engine Cargo Lock

on:
  push:
    paths:
      - '.github/workflows/repair-engine-lock.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Restore known-good lock and add route-engine serde edge
        shell: bash
        run: |
          set -euo pipefail
          git show af8e9dcde0d6432069399eecc083b5349c2ed722:engine/Cargo.lock > engine/Cargo.lock
          python3 - <<'PY'
          from pathlib import Path
          path = Path('engine/Cargo.lock')
          text = path.read_text()
          needle = ' "rand 0.8.8",\n "regex",\n "serde_json",\n'
          replacement = ' "rand 0.8.8",\n "regex",\n "serde",\n "serde_json",\n'
          count = text.count(needle)
          if count != 1:
              raise SystemExit(f'expected exactly one route-engine lock insertion point, found {count}')
          path.write_text(text.replace(needle, replacement, 1))
          PY
          stats="$(git diff --numstat af8e9dcde0d6432069399eecc083b5349c2ed722 -- engine/Cargo.lock)"
          test "$stats" = $'1\t0\tengine/Cargo.lock' || { echo "unexpected lock diff: $stats" >&2; git diff -- engine/Cargo.lock; exit 1; }
          git diff --check -- engine/Cargo.lock
      - name: Verify locked workspace metadata
        shell: bash
        run: cargo metadata --manifest-path engine/Cargo.toml --locked --no-deps --format-version 1 >/dev/null
      - name: Commit repaired lock
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add engine/Cargo.lock
          git commit -m 'FIX | BUG-FLD-034 restore Cargo lock integrity'
          git push origin HEAD:main
