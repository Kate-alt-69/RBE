name: Route WASM IPC foundation

on:
  push:
    paths:
      - '.github/workflows/route-wasm-ipc-foundation.yml'

permissions:
  contents: write

concurrency:
  group: route-wasm-ipc-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            engine
            container-runtime

      - name: Apply route WASM IPC foundation
        run: python .github/patches/route-wasm-ipc-foundation.py

      - name: Format both Rust workspaces
        run: |
          cargo fmt --manifest-path container-runtime/Cargo.toml --all
          cargo fmt --manifest-path engine/Cargo.toml --all

      - name: Check Container Runtime
        run: cargo check --manifest-path container-runtime/Cargo.toml --workspace --locked

      - name: Test Container Runtime foundation
        run: cargo test --manifest-path container-runtime/Cargo.toml -p ipc-protocol -p container-runtime-core -p container-bin --locked

      - name: Clippy Container Runtime foundation
        run: cargo clippy --manifest-path container-runtime/Cargo.toml -p ipc-protocol -p container-runtime-core -p container-bin --all-targets --locked -- -D warnings

      - name: Check backend integration
        run: cargo check --manifest-path engine/Cargo.toml -p core-lib -p backend --locked

      - name: Test backend integration
        run: cargo test --manifest-path engine/Cargo.toml -p core-lib -p backend --locked

      - name: Clippy backend integration
        run: cargo clippy --manifest-path engine/Cargo.toml -p core-lib -p backend --all-targets --locked -- -D warnings

      - name: Verify artifact and input separation
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'pub const PROTOCOL_VERSION: u16 = 3;' container-runtime/crates/ipc-protocol/src/lib.rs
          grep -q 'RegisterArtifact(RegisterArtifactRequest)' container-runtime/crates/ipc-protocol/src/lib.rs
          grep -q 'pub input: Vec<u8>' container-runtime/crates/ipc-protocol/src/lib.rs
          grep -q 'Request::RegisterArtifact(request)' container-runtime/crates/container-bin/src/main.rs
          grep -q 'ARTIFACT_NOT_FOUND' container-runtime/crates/container-bin/src/main.rs
          grep -q 'request.input,' container-runtime/crates/container-bin/src/main.rs
          grep -q 'payload,' container-runtime/crates/container-runtime-core/src/runtime.rs
          grep -q 'artifact SHA-256 mismatch' container-runtime/crates/container-runtime-core/src/runtime.rs
          grep -q 'pub async fn register_artifact' engine/crates/core/src/container_client.rs
          grep -q 'pub async fn execute' engine/crates/core/src/container_client.rs
          ! grep -q 'computed = hex::encode(Sha256::digest(&payload))' container-runtime/crates/container-runtime-core/src/runtime.rs
          ! grep -q 'request.payload' container-runtime/crates/container-bin/src/main.rs

      - name: Commit verified WASM IPC foundation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          latest="$(git rev-parse origin/main)"
          if [[ "$latest" != "$GITHUB_SHA" ]]; then
            echo "main moved during validation; refusing stale commit" >&2
            exit 75
          fi

          rm -f .github/patches/route-wasm-ipc-foundation.py
          rm -f .github/workflows/route-wasm-ipc-foundation.yml

          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'FIX | BUG-WASM-001 separate artifacts from WASM invocation input'
          git push origin HEAD:main
