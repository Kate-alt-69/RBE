name: Runtime Bug Batch

on:
  push:
    paths:
      - .ci-runtime-bug-batch-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: apply and validate runtime fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Kate"
          git config user.email "dhwanksh2000@gmail.com"

          python ../.github/patches/runtime-bug-batch.py svc-alias
          rustfmt --edition 2021 crates/service-runtime/src/manager.rs
          git diff --check
          cargo test -p service-runtime --locked service_process_alias_preserves_distinct_legal_names
          cargo clippy -p service-runtime --all-targets --locked -- -D warnings
          git add -- crates/service-runtime/src/manager.rs
          git commit -m "FIX | BUG-SVC-023 prevent service process alias collisions"

          python ../.github/patches/runtime-bug-batch.py svc-activity
          rustfmt --edition 2021 crates/service-runtime/src/manager.rs
          git diff --check
          cargo test -p service-runtime --locked active_call_guard_releases_counter_when_dropped
          cargo clippy -p service-runtime --all-targets --locked -- -D warnings
          git add -- crates/service-runtime/src/manager.rs
          git commit -m "FIX | BUG-SVC-024 make service activity cancellation-safe"

          python ../.github/patches/runtime-bug-batch.py video-fairness
          rustfmt --edition 2021 --config skip_children=true crates/video-manager/src/lib.rs
          rustfmt --edition 2021 crates/video-manager/src/worker.rs
          git diff --check
          cargo test -p video-manager --locked queued_download_selection_rotates_between_registered_databases
          cargo clippy -p video-manager --all-targets --locked -- -D warnings
          git add -- crates/video-manager/src/lib.rs crates/video-manager/src/worker.rs
          git commit -m "FIX | BUG-VID-001 round-robin Video Manager database queues"

          python ../.github/patches/runtime-bug-batch.py live-retry
          rustfmt --edition 2021 crates/video-manager/src/live_runtime.rs
          git diff --check
          cargo test -p video-manager --locked failed_live_stop_recovery_is_faster_than_default_idle_window
          cargo clippy -p video-manager --all-targets --locked -- -D warnings
          git add -- crates/video-manager/src/live_runtime.rs
          git commit -m "FIX | BUG-VID-002 retry failed live teardown promptly"

          git diff --exit-code
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          git push origin "HEAD:${GITHUB_REF_NAME}"
