name: Runtime CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  engine-runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: apply one-shot service monitor hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("crates/service-runtime/src/lib.rs")
          source = path.read_text()

          start = source.index("    fn start_monitor(&self,")
          end = source.index("    pub async fn snapshot(&self)", start)
          replacement = r'''    fn start_monitor(&self, interval: Duration, max_restart_backoff: Duration) {
              let manager = self.clone();
              tokio::spawn(async move {
                  let handles = manager
                      .services
                      .read()
                      .await
                      .values()
                      .cloned()
                      .collect::<Vec<_>>();
                  for handle in handles {
                      let manager = manager.clone();
                      tokio::spawn(async move {
                          manager
                              .monitor_service(handle, interval, max_restart_backoff)
                              .await;
                      });
                  }
              });
          }

          async fn monitor_service(
              &self,
              handle: Arc<Mutex<Managed>>,
              interval: Duration,
              max_restart_backoff: Duration,
          ) {
              loop {
                  tokio::time::sleep(interval).await;
                  if self.shutting_down.load(Ordering::Acquire) {
                      return;
                  }

                  let mut service = handle.lock().await;
                  let status = match service.child.try_wait() {
                      Ok(Some(status)) => status,
                      Ok(None) => continue,
                      Err(error) => {
                          tracing::warn!(
                              service = %service.file.name,
                              error = %error,
                              "failed to inspect .service child status"
                          );
                          continue;
                      }
                  };

                  if service.exit_observed {
                      return;
                  }

                  let restart = should_restart(service.file.restart, status.success());
                  if !restart {
                      service.exit_observed = true;
                      tracing::warn!(
                          service = %service.file.name,
                          pid = service.ready.pid,
                          %status,
                          restart = ?service.file.restart,
                          "service process exited and restart policy leaves it stopped"
                      );
                      return;
                  }

                  if service.started_at.elapsed() >= SERVICE_STABLE_WINDOW {
                      service.restart_attempts = 0;
                  }
                  service.restart_attempts = service.restart_attempts.saturating_add(1);
                  let attempt = service.restart_attempts;
                  let delay = restart_delay(attempt, max_restart_backoff);
                  let file = service.file.clone();
                  let old_pid = service.ready.pid;
                  service.started_at = Instant::now();
                  tracing::warn!(
                      service = %file.name,
                      pid = old_pid,
                      %status,
                      attempt,
                      backoff_ms = delay.as_millis() as u64,
                      "service process exited; scheduling restart"
                  );
                  drop(service);

                  tokio::time::sleep(delay).await;
                  if self.shutting_down.load(Ordering::Acquire) {
                      return;
                  }

                  match spawn(file.clone()).await {
                      Ok(mut replacement) => {
                          replacement.restart_attempts = attempt;
                          let new_pid = replacement.ready.pid;
                          let mut service = handle.lock().await;
                          if self.shutting_down.load(Ordering::Acquire) {
                              drop(service);
                              stop_managed(&mut replacement).await;
                              return;
                          }
                          *service = replacement;
                          tracing::info!(
                              service = %file.name,
                              old_pid,
                              new_pid,
                              attempt,
                              "service process restarted"
                          );
                      }
                      Err(error) => {
                          let mut service = handle.lock().await;
                          if self.shutting_down.load(Ordering::Acquire) {
                              return;
                          }
                          service.restart_attempts = attempt;
                          service.started_at = Instant::now();
                          tracing::error!(
                              service = %file.name,
                              attempt,
                              error = %error,
                              "service restart attempt failed"
                          );
                      }
                  }
              }
          }

          '''
          source = source[:start] + replacement + source[end:]

          old_snapshot = '''#[derive(Debug, Clone, Serialize)]
          pub struct ServiceSnapshot {
              pub name: String,
              pub title: String,
              pub pid: Option<u32>,
          }'''
          new_snapshot = '''#[derive(Debug, Clone, Serialize)]
          #[serde(rename_all = "camelCase")]
          pub struct ServiceSnapshot {
              pub name: String,
              pub title: String,
              pub pid: Option<u32>,
              pub state: String,
              pub restart: RestartPolicy,
              pub restart_attempts: u32,
          }'''
          if old_snapshot not in source and new_snapshot not in source:
              raise SystemExit("could not locate ServiceSnapshot")
          source = source.replace(old_snapshot, new_snapshot, 1)

          old_body = '''            let mut service = handle.lock().await;
              let alive = matches!(service.child.try_wait(), Ok(None));
              out.push(ServiceSnapshot {
                  name: service.file.name.clone(),
                  title: service.file.title.clone(),
                  pid: if alive { service.child.id() } else { None },
              });'''
          new_body = '''            let mut service = handle.lock().await;
              let (pid, state) = match service.child.try_wait() {
                  Ok(None) => (service.child.id(), "running"),
                  Ok(Some(status))
                      if service.exit_observed
                          || !should_restart(service.file.restart, status.success()) =>
                  {
                      (None, "stopped")
                  }
                  Ok(Some(_)) => (None, "restarting"),
                  Err(_) => (None, "unknown"),
              };
              out.push(ServiceSnapshot {
                  name: service.file.name.clone(),
                  title: service.file.title.clone(),
                  pid,
                  state: state.into(),
                  restart: service.file.restart,
                  restart_attempts: service.restart_attempts,
              });'''
          if old_body not in source and new_body not in source:
              raise SystemExit("could not locate snapshot body")
          source = source.replace(old_body, new_body, 1)

          path.write_text(source)
          PY
          cargo fmt --all
          if ! git diff --quiet -- crates/service-runtime/src/lib.rs; then
            git config user.name "Kate"
            git config user.email "dhwanksh2000@gmail.com"
            git add -- crates/service-runtime/src/lib.rs
            git commit -m "fix: isolate service crash monitors"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: format check
        run: cargo fmt --all -- --check
      - name: clippy
        id: clippy
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee ../clippy.log
      - name: upload clippy diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-clippy-log
          path: clippy.log
          if-no-files-found: error
      - name: test
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tee ../test.log
      - name: upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-test-log
          path: test.log
          if-no-files-found: error
      - name: enforce validation results
        if: steps.clippy.outcome == 'failure' || steps.tests.outcome == 'failure'
        run: exit 1
