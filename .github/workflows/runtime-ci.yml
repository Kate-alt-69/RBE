name: Runtime CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  engine-runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: apply one-shot Rust 1.98 lint cleanups
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          terminal = Path("crates/route-engine/src/terminal.rs")
          source = terminal.read_text()
          source = source.replace(
              "let filled = if total == 0 { 0 } else { 1usize.saturating_mul(width) / total };",
              "let filled = 1usize.saturating_mul(width).checked_div(total).unwrap_or(0);",
          )
          terminal.write_text(source)

          dashboard = Path("crates/api/src/dashboard.rs")
          source = dashboard.read_text()
          source = source.replace(
              "fn local_only(peer: SocketAddr) -> Result<(), Response> {",
              "fn local_only(peer: SocketAddr) -> Result<(), (StatusCode, &'static str)> {",
          )
          source = source.replace(
              "Err((StatusCode::FORBIDDEN, \"RBE dashboard is loopback-only\").into_response())",
              "Err((StatusCode::FORBIDDEN, \"RBE dashboard is loopback-only\"))",
          )
          source = source.replace(
              "if let Err(response) = local_only(peer) { return response; }",
              "if let Err(error) = local_only(peer) { return error.into_response(); }",
          )
          dashboard.write_text(source)

          container = Path("crates/backend/src/container_process.rs")
          source = container.read_text()
          source = source.replace("    pub fn pid(&self) -> Option<u32> { self.child.id() }\n", "")
          container.write_text(source)
          PY
          cargo fmt --all
          if ! git diff --quiet -- crates/route-engine/src/terminal.rs crates/api/src/dashboard.rs crates/backend/src/container_process.rs; then
            git config user.name "Kate"
            git config user.email "dhwanksh2000@gmail.com"
            git add crates/route-engine/src/terminal.rs crates/api/src/dashboard.rs crates/backend/src/container_process.rs
            git commit -m "fix: satisfy Rust 1.98 workspace lints"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: format check
        run: cargo fmt --all -- --check
      - name: clippy
        id: clippy
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee ../clippy.log
      - name: upload clippy diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-clippy-log
          path: clippy.log
          if-no-files-found: error
      - name: test
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tee ../test.log
      - name: upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-test-log
          path: test.log
          if-no-files-found: error
      - name: enforce validation results
        if: steps.clippy.outcome == 'failure' || steps.tests.outcome == 'failure'
        run: exit 1
