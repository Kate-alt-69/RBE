name: Runtime CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  engine-runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: apply service body boot validation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime = Path("crates/service-runtime/src/lib.rs")
          source = runtime.read_text()
          start = source.index("    let exports = source\n")
          end = source.index("    Ok(ServiceFile {", start)
          replacement = '''    let exports = source
              .lines()
              .filter_map(|line| {
                  let line = line.trim_start();
                  let rest = line
                      .strip_prefix("export function ")
                      .or_else(|| line.strip_prefix("export async function "))?;
                  let name: String = rest
                      .chars()
                      .take_while(|character| character.is_ascii_alphanumeric() || *character == '_')
                      .collect();
                  (!name.is_empty()).then_some(name)
              })
              .collect();

              let instances = number("instances", 1)?;
              if instances != 1 {
                  return Err(compile_error(
                      "SVC1009",
                      path,
                      line,
                      format!("instances={instances} is not supported yet; .service currently requires instances=1"),
                  ));
              }

          '''
          source = source[:start] + replacement + source[end:]

          if "metadata_accepts_async_exports" not in source:
              insert = source.rfind("\n}")
              tests = r'''

              fn temp_service_path(label: &str) -> PathBuf {
                  let nonce = std::time::SystemTime::now()
                      .duration_since(std::time::UNIX_EPOCH)
                      .unwrap_or_default()
                      .as_nanos();
                  std::env::temp_dir().join(format!(
                      "rbe-service-{label}-{}-{nonce}.service",
                      std::process::id()
                  ))
              }

              #[test]
              fn metadata_accepts_async_exports() {
                  let path = temp_service_path("async-export");
                  std::fs::write(
                      &path,
                      ":service[name = worker, instances = 1]\nexport async function fetch(value) { return value; }",
                  )
                  .unwrap();
                  let file = parse_service(&path, ServiceDefaults::default()).unwrap();
                  assert_eq!(file.exports, vec!["fetch"]);
                  let _ = std::fs::remove_file(path);
              }

              #[test]
              fn metadata_rejects_multiple_instances_until_supported() {
                  let path = temp_service_path("instances");
                  std::fs::write(
                      &path,
                      ":service[name = worker, instances = 2]\nexport function run() { return true; }",
                  )
                  .unwrap();
                  let error = parse_service(&path, ServiceDefaults::default()).unwrap_err();
                  assert_eq!(error.code, "SVC1009");
                  let _ = std::fs::remove_file(path);
              }
          '''
              source = source[:insert] + tests + source[insert:]
          runtime.write_text(source)

          boot = Path("crates/backend/src/service_boot.rs")
          source = boot.read_text()
          if "fn validate_executable_catalog" not in source:
              at = source.index("pub fn compile(\n")
              helpers = r'''fn validate_executable_catalog(catalog: &ServiceCatalog) -> Result<(), String> {
              let mut diagnostics = Vec::new();
              for service in catalog.services() {
                  let source = match std::fs::read_to_string(&service.path) {
                      Ok(source) => source,
                      Err(error) => {
                          diagnostics.push(format!(
                              "SVC2001 {}:1:1 failed to read executable service body: {error}",
                              service.path.display()
                          ));
                          continue;
                      }
                  };
                  if let Err(error) = route_engine::parse_service_source(&source) {
                      diagnostics.push(format!(
                          "SVC2000 {}:{}:{} {}",
                          service.path.display(),
                          error.line,
                          error.column,
                          error.message
                      ));
                  }
              }
              if diagnostics.is_empty() {
                  Ok(())
              } else {
                  Err(diagnostics.join("\n"))
              }
          }

          fn report_compile_failure(rendered: &str, io: &atomic_io::AtomicIo) {
              let error_path = compiler_error_path();
              if let Err(write_error) = io.write_atomic(&error_path, rendered.as_bytes()) {
                  tracing::error!(
                      error = %write_error,
                      path = %error_path.display(),
                      "failed to persist service compiler diagnostics"
                  );
              }
              eprintln!(
                  "backend couldn't start because a .service file failed to compile:\n{rendered}"
              );
              eprintln!("compiler log: {}", error_path.display());
              service_runtime::pause_for_interactive_exit();
          }

          '''
              source = source[:at] + helpers + source[at:]

              success = source.index("        Ok(catalog) => {", source.index("pub fn compile("))
              error_path = source.index("            let error_path = compiler_error_path();", success)
              source = source[:error_path] + '''            if let Err(rendered) = validate_executable_catalog(&catalog) {
                  report_compile_failure(&rendered, io);
                  return Err(anyhow::anyhow!(".service executable compilation failed"));
              }
          ''' + source[error_path:]

              err_start = source.index("        Err(errors) => {", success)
              match_end = source.index("\n        }\n    }\n}", err_start) + len("\n        }")
              source = source[:err_start] + '''        Err(errors) => {
                  let rendered = errors.render();
                  report_compile_failure(&rendered, io);
                  Err(anyhow::anyhow!(".service compilation failed"))
              }''' + source[match_end:]

          if "executable_validation_reports_file_and_location" not in source:
              source += r'''

          #[cfg(test)]
          mod tests {
              use super::*;

              fn temp_dir() -> PathBuf {
                  let nonce = std::time::SystemTime::now()
                      .duration_since(std::time::UNIX_EPOCH)
                      .unwrap_or_default()
                      .as_nanos();
                  let path = std::env::temp_dir().join(format!(
                      "rbe-service-boot-test-{}-{nonce}",
                      std::process::id()
                  ));
                  std::fs::create_dir_all(&path).unwrap();
                  path
              }

              #[test]
              fn executable_validation_reports_file_and_location() {
                  let dir = temp_dir();
                  let path = dir.join("broken.service");
                  std::fs::write(
                      &path,
                      ":service[name = broken]\nexport function run(value) { return value }",
                  )
                  .unwrap();
                  let catalog = ServiceCatalog::compile_dir(&dir, ServiceDefaults::default()).unwrap();
                  let rendered = validate_executable_catalog(&catalog).unwrap_err();
                  assert!(rendered.contains("SVC2000"));
                  assert!(rendered.contains("broken.service"));
                  let _ = std::fs::remove_dir_all(dir);
              }
          }
          '''
          boot.write_text(source)
          PY

          rustfmt --edition 2021 \
            crates/service-runtime/src/lib.rs \
            crates/backend/src/service_boot.rs
          git diff --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked

          python - <<'PY'
          import subprocess
          allowed = {
              "engine/crates/service-runtime/src/lib.rs",
              "engine/crates/backend/src/service_boot.rs",
          }
          changed = set(subprocess.check_output(["git", "diff", "--name-only"], text=True).split())
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit("unexpected service boot validation paths: " + ", ".join(sorted(unexpected)))
          PY

          if ! git diff --quiet; then
            git config user.name "Kate"
            git config user.email "dhwanksh2000@gmail.com"
            git add -- crates/service-runtime/src/lib.rs crates/backend/src/service_boot.rs
            git commit -m "feat: validate executable service bodies at boot"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: format runtime slice
        shell: bash
        run: |
          rustfmt --edition 2021 --check \
            crates/service-runtime/src/lib.rs \
            crates/backend/src/service_boot.rs \
            crates/video-manager/src/lib.rs \
            crates/api/src/health.rs \
            crates/route-engine/src/ast.rs \
            crates/route-engine/src/parser.rs \
            crates/route-engine/src/modules.rs \
            crates/route-engine/src/analyzer.rs \
            crates/route-engine/src/transpiler.rs \
            crates/route-engine/src/module_runtime.rs \
            crates/route-engine/src/module_eval.rs \
            crates/route-engine/src/discovery.rs
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --workspace --locked
