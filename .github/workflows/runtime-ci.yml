name: Runtime CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  engine-runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: wire hybrid service lifecycle
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          manager = Path("crates/service-runtime/src/manager.rs")
          m = manager.read_text()
          m = m.replace("use std::path::PathBuf;", "use std::path::{Path, PathBuf};", 1)
          m = m.replace("async fn cleanup_failed_spawn(alias: &PathBuf, child: &mut Child)", "async fn cleanup_failed_spawn(alias: &Path, child: &mut Child)", 1)
          manager.write_text(m)

          lib = Path("crates/service-runtime/src/lib.rs")
          s = lib.read_text()
          for old in [
              "use std::process::Stdio;\n",
              "use std::sync::atomic::{AtomicBool, Ordering};\n",
              "use std::time::{Duration, Instant};\n",
              "use anyhow::Context;\n",
              "use rand::RngCore;\n",
              "use tokio::process::{Child, Command};\n",
              "use tokio::sync::{Mutex, RwLock as AsyncRwLock};\n",
          ]:
              s = s.replace(old, "", 1)
          s = s.replace("use tokio::net::{TcpListener, TcpStream};", "use tokio::net::TcpListener;", 1)

          module_anchor = "use tokio::net::TcpListener;\n"
          if "mod manager;" not in s:
              s = s.replace(
                  module_anchor,
                  module_anchor + "\nmod manager;\npub use manager::{ServiceCallError, ServiceManager, ServiceRuntimeState, ServiceSnapshot};\n",
                  1,
              )

          restart_enum = '''#[derive(Debug, Clone, Copy, PartialEq, Eq, Serialize, Deserialize, Default)]
          #[serde(rename_all = "kebab-case")]
          pub enum RestartPolicy {
              Always,
              #[default]
              OnFailure,
              Never,
          }
          '''.replace('          ', '')
          mode_enum = restart_enum + '''
          #[derive(Debug, Clone, Copy, PartialEq, Eq, Serialize, Deserialize, Default)]
          #[serde(rename_all = "kebab-case")]
          pub enum ServiceMode {
              #[default]
              Resident,
              OnDemand,
              Hybrid,
          }
          '''.replace('          ', '')
          if "pub enum ServiceMode" not in s:
              if restart_enum not in s:
                  raise SystemExit("restart enum anchor missing")
              s = s.replace(restart_enum, mode_enum, 1)

          s = s.replace(
              "    pub title: String,\n    pub restart: RestartPolicy,",
              "    pub title: String,\n    pub mode: ServiceMode,\n    pub restart: RestartPolicy,",
              1,
          )
          s = s.replace(
              "    pub startup_timeout_ms: u64,\n    pub imports: Vec<String>,",
              "    pub startup_timeout_ms: u64,\n    pub idle_timeout_ms: u64,\n    pub imports: Vec<String>,",
              1,
          )

          title_anchor = '''    let title = fields
              .get("title")
              .map(|value| unquote(value))
              .unwrap_or_else(|| name.clone());
          '''.replace('          ', '')
          mode_parse = title_anchor + '''    let mode = match fields
              .get("mode")
              .map(|value| unquote(value).to_ascii_lowercase())
          {
              None => ServiceMode::Resident,
              Some(value) if value == "resident" => ServiceMode::Resident,
              Some(value)
                  if matches!(value.as_str(), "on-demand" | "on_demand" | "ondemand") =>
              {
                  ServiceMode::OnDemand
              }
              Some(value) if value == "hybrid" => ServiceMode::Hybrid,
              Some(value) => {
                  return Err(compile_error(
                      "SVC1010",
                      path,
                      line,
                      format!("invalid service mode {value:?}"),
                  ));
              }
          };
          '''.replace('          ', '')
          if "invalid service mode" not in s:
              if title_anchor not in s:
                  raise SystemExit("service mode parser anchor missing")
              s = s.replace(title_anchor, mode_parse, 1)

          number_end = '''    };

              let mut imports = Vec::new();
          '''.replace('              ', '')
          idle_parse = '''    };

              let idle_timeout_ms = number("idleTimeoutMs", 300_000)?;
              if mode != ServiceMode::Resident && idle_timeout_ms == 0 {
                  return Err(compile_error(
                      "SVC1011",
                      path,
                      line,
                      "idleTimeoutMs must be greater than zero for on-demand and hybrid services".into(),
                  ));
              }

              let mut imports = Vec::new();
          '''.replace('              ', '')
          if "idleTimeoutMs must be greater than zero" not in s:
              if number_end not in s:
                  raise SystemExit("idle timeout parser anchor missing")
              s = s.replace(number_end, idle_parse, 1)

          s = s.replace(
              "        title,\n        restart,",
              "        title,\n        mode,\n        restart,",
              1,
          )
          s = s.replace(
              "        startup_timeout_ms: number(\"startupTimeoutMs\", defaults.startup_timeout_ms)?,\n        imports,",
              "        startup_timeout_ms: number(\"startupTimeoutMs\", defaults.startup_timeout_ms)?,\n        idle_timeout_ms,\n        imports,",
              1,
          )

          old_manager_start = s.index("const RESTART_BASE_DELAY_MS")
          host_start = s.index("pub async fn run_service_host(", old_manager_start)
          s = s[:old_manager_start] + s[host_start:]

          tests_start = s.rindex("#[cfg(test)]\nmod tests {")
          tests = r'''#[cfg(test)]
          mod tests {
              use super::*;

              fn test_service_path(name: &str) -> PathBuf {
                  let nonce = std::time::SystemTime::now()
                      .duration_since(std::time::UNIX_EPOCH)
                      .unwrap_or_default()
                      .as_nanos();
                  std::env::temp_dir().join(format!(
                      "rbe-service-runtime-{name}-{}-{nonce}.service",
                      std::process::id()
                  ))
              }

              #[test]
              fn memory_round_trip() {
                  let memory = ServiceMemory::default();
                  memory.set("x".into(), serde_json::json!(7));
                  assert_eq!(memory.get("x"), Some(serde_json::json!(7)));
              }

              #[test]
              fn parses_hybrid_and_on_demand_modes() {
                  let hybrid_path = test_service_path("hybrid");
                  std::fs::write(
                      &hybrid_path,
                      ":service[name = cache, mode = hybrid, idleTimeoutMs = 1234]\nexport function get() {}",
                  )
                  .unwrap();
                  let hybrid = parse_service(&hybrid_path, ServiceDefaults::default()).unwrap();
                  assert_eq!(hybrid.mode, ServiceMode::Hybrid);
                  assert_eq!(hybrid.idle_timeout_ms, 1234);
                  let _ = std::fs::remove_file(&hybrid_path);

                  let demand_path = test_service_path("demand");
                  std::fs::write(
                      &demand_path,
                      ":service[name = lazy, mode = on-demand]\nexport function get() {}",
                  )
                  .unwrap();
                  let demand = parse_service(&demand_path, ServiceDefaults::default()).unwrap();
                  assert_eq!(demand.mode, ServiceMode::OnDemand);
                  assert_eq!(demand.idle_timeout_ms, 300_000);
                  let _ = std::fs::remove_file(&demand_path);
              }

              #[test]
              fn resident_is_the_compatibility_default() {
                  let path = test_service_path("resident");
                  std::fs::write(&path, ":service[name = existing]\nexport function run() {}").unwrap();
                  let service = parse_service(&path, ServiceDefaults::default()).unwrap();
                  assert_eq!(service.mode, ServiceMode::Resident);
                  let _ = std::fs::remove_file(path);
              }
          }
          '''.replace('          ', '')
          s = s[:tests_start] + tests
          lib.write_text(s)
          PY

          rustfmt --edition 2021 crates/service-runtime/src/lib.rs crates/service-runtime/src/manager.rs
          git diff --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked

          python - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(["git", "diff", "--name-only"], text=True).split())
          allowed = {
              "engine/crates/service-runtime/src/lib.rs",
              "engine/crates/service-runtime/src/manager.rs",
          }
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit("unexpected hybrid service paths: " + ", ".join(sorted(unexpected)))
          PY

          if ! git diff --quiet; then
            git config user.name "Kate"
            git config user.email "dhwanksh2000@gmail.com"
            git add -- crates/service-runtime/src/lib.rs crates/service-runtime/src/manager.rs
            git commit -m "feat: add hybrid service activation"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
