name: Runtime CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  engine-runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: apply module service execution
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          cargo = Path("crates/route-engine/Cargo.toml")
          source = cargo.read_text()
          dep = 'service-runtime = { path = "../service-runtime" }\n'
          if dep not in source:
              anchor = 'core-lib = { path = "../core" }\n'
              if anchor not in source:
                  raise SystemExit("route-engine core dependency anchor missing")
              source = source.replace(anchor, anchor + dep, 1)
              cargo.write_text(source)

          evaluator = Path("crates/route-engine/src/module_eval.rs")
          source = evaluator.read_text()
          if "use serde_json::Value as JsonValue;" not in source:
              anchor = "use std::sync::Arc;\n\n"
              if anchor not in source:
                  raise SystemExit("module_eval import anchor missing")
              source = source.replace(
                  anchor,
                  anchor + "use serde_json::Value as JsonValue;\nuse service_runtime::ServiceManager;\n\n",
                  1,
              )

          if "pub trait ServiceCaller" not in source:
              anchor = "type FlowFuture<'a> = Pin<Box<dyn Future<Output = Result<Flow, ModuleEvalError>> + Send + 'a>>;\n"
              if anchor not in source:
                  raise SystemExit("module_eval future alias anchor missing")
              addition = r'''
          pub type ServiceCallFuture<'a> =
              Pin<Box<dyn Future<Output = Result<JsonValue, String>> + Send + 'a>>;

          pub trait ServiceCaller: Send + Sync {
              fn call<'a>(
                  &'a self,
                  service: &'a str,
                  function: &'a str,
                  args: Vec<JsonValue>,
              ) -> ServiceCallFuture<'a>;
          }

          impl ServiceCaller for ServiceManager {
              fn call<'a>(
                  &'a self,
                  service: &'a str,
                  function: &'a str,
                  args: Vec<JsonValue>,
              ) -> ServiceCallFuture<'a> {
                  Box::pin(async move {
                      ServiceManager::call(self, service, function, args)
                          .await
                          .map_err(|error| error.to_string())
                  })
              }
          }
          '''
              source = source.replace(anchor, anchor + addition, 1)

          old = '''pub struct ModuleExecutor<'a> {
              program: &'a ModuleProgram,
          }

          impl<'a> ModuleExecutor<'a> {
              pub fn new(program: &'a ModuleProgram) -> Self {
                  Self { program }
              }
          '''
          if "services: Option<Arc<dyn ServiceCaller>>" not in source:
              if old not in source:
                  raise SystemExit("ModuleExecutor constructor anchor missing")
              new = '''pub struct ModuleExecutor<'a> {
              program: &'a ModuleProgram,
              services: Option<Arc<dyn ServiceCaller>>,
          }

          impl<'a> ModuleExecutor<'a> {
              pub fn new(program: &'a ModuleProgram) -> Self {
                  Self {
                      program,
                      services: None,
                  }
              }

              pub fn with_services(program: &'a ModuleProgram, services: ServiceManager) -> Self {
                  Self::with_service_caller(program, Arc::new(services))
              }

              pub fn with_service_caller(
                  program: &'a ModuleProgram,
                  services: Arc<dyn ServiceCaller>,
              ) -> Self {
                  Self {
                      program,
                      services: Some(services),
                  }
              }
          '''
              source = source.replace(old, new, 1)

          if "async fn call_service(" not in source:
              anchor = "    async fn call_export(\n"
              at = source.index(anchor, source.index("impl<'a> ModuleExecutor"))
              method = r'''    async fn call_service(
              &self,
              service: &str,
              function: &str,
              args: Vec<Value>,
          ) -> Result<Value, ModuleEvalError> {
              let services = self.services.as_ref().ok_or_else(|| {
                  ModuleEvalError::new(
                      "MOD3400",
                      format!(
                          "service runtime is unavailable while calling {service}.{function}"
                      ),
                  )
              })?;
              let args = args
                  .into_iter()
                  .map(value_to_json)
                  .collect::<Result<Vec<_>, _>>()?;
              let value = services
                  .call(service, function, args)
                  .await
                  .map_err(|message| {
                      ModuleEvalError::new(
                          "MOD3401",
                          format!("service {service}.{function} failed: {message}"),
                      )
                  })?;
              value_from_json(value)
          }

          '''
              source = source[:at] + method + source[at:]

          if "service_modules: HashMap<String, String>" not in source:
              anchor = "    custom_functions: HashMap<String, (String, String)>,\n"
              if anchor not in source:
                  raise SystemExit("Frame field anchor missing")
              source = source.replace(
                  anchor,
                  anchor
                  + "    service_modules: HashMap<String, String>,\n"
                  + "    service_functions: HashMap<String, (String, String)>,\n",
                  1,
              )

              anchor = "        let mut custom_functions = HashMap::new();\n"
              if anchor not in source:
                  raise SystemExit("Frame map initialization anchor missing")
              source = source.replace(
                  anchor,
                  anchor
                  + "        let mut service_modules = HashMap::new();\n"
                  + "        let mut service_functions = HashMap::new();\n",
                  1,
              )

              anchor = '''                ImportTarget::CustomFunction { path, function } => {
                      custom_functions.insert(binding, (path.clone(), function.clone()));
                  }
          '''
              if anchor not in source:
                  raise SystemExit("Frame import match anchor missing")
              source = source.replace(
                  anchor,
                  anchor
                  + '''                ImportTarget::Service(service) => {
                      service_modules.insert(binding, service.clone());
                  }
                  ImportTarget::ServiceFunction { service, function } => {
                      service_functions.insert(binding, (service.clone(), function.clone()));
                  }
          ''',
                  1,
              )

              anchor = "            custom_functions,\n"
              if anchor not in source:
                  raise SystemExit("Frame constructor field anchor missing")
              source = source.replace(
                  anchor,
                  anchor
                  + "            service_modules,\n"
                  + "            service_functions,\n",
                  1,
              )

          if "self.service_functions.get(name)" not in source:
              anchor = '''                    if let Expr::Ident(name) = callee.as_ref() {
                          if let Some((path, function)) = self.custom_functions.get(name).cloned() {
          '''
              if anchor not in source:
                  raise SystemExit("direct call dispatch anchor missing")
              replacement = '''                    if let Expr::Ident(name) = callee.as_ref() {
                          if let Some((service, function)) = self.service_functions.get(name).cloned() {
                              return self.executor.call_service(&service, &function, args).await;
                          }
                          if let Some((path, function)) = self.custom_functions.get(name).cloned() {
          '''
              source = source.replace(anchor, replacement, 1)

          if "self.service_modules.get(module_name)" not in source:
              anchor = '''                        if let Expr::Ident(module_name) = base.as_ref() {
                              if let Some(path) = self.custom_modules.get(module_name).cloned() {
          '''
              if anchor not in source:
                  raise SystemExit("namespace call dispatch anchor missing")
              replacement = '''                        if let Expr::Ident(module_name) = base.as_ref() {
                              if let Some(service) = self.service_modules.get(module_name).cloned() {
                                  return self
                                      .executor
                                      .call_service(&service, function_name, args)
                                      .await;
                              }
                              if let Some(path) = self.custom_modules.get(module_name).cloned() {
          '''
              source = source.replace(anchor, replacement, 1)

          if "fn value_to_json(" not in source:
              anchor = "fn binary(op: &BinaryOp, left: Value, right: Value) -> Result<Value, ModuleEvalError> {\n"
              at = source.index(anchor)
              converters = r'''fn value_to_json(value: Value) -> Result<JsonValue, ModuleEvalError> {
              match value {
                  Value::String(value) => Ok(JsonValue::String(value)),
                  Value::Number(value) => serde_json::Number::from_f64(value)
                      .map(JsonValue::Number)
                      .ok_or_else(|| {
                          ModuleEvalError::new(
                              "MOD3402",
                              "non-finite numbers cannot cross the service IPC boundary",
                          )
                      }),
                  Value::Bool(value) => Ok(JsonValue::Bool(value)),
                  Value::Null => Ok(JsonValue::Null),
                  Value::Object(fields) => {
                      let mut out = serde_json::Map::with_capacity(fields.len());
                      for (key, value) in fields {
                          out.insert(key, value_to_json(value)?);
                      }
                      Ok(JsonValue::Object(out))
                  }
                  Value::Array(items) => items
                      .into_iter()
                      .map(value_to_json)
                      .collect::<Result<Vec<_>, _>>()
                      .map(JsonValue::Array),
              }
          }

          fn value_from_json(value: JsonValue) -> Result<Value, ModuleEvalError> {
              match value {
                  JsonValue::Null => Ok(Value::Null),
                  JsonValue::Bool(value) => Ok(Value::Bool(value)),
                  JsonValue::Number(value) => value.as_f64().map(Value::Number).ok_or_else(|| {
                      ModuleEvalError::new(
                          "MOD3403",
                          "service returned a JSON number that cannot be represented as f64",
                      )
                  }),
                  JsonValue::String(value) => Ok(Value::String(value)),
                  JsonValue::Array(items) => items
                      .into_iter()
                      .map(value_from_json)
                      .collect::<Result<Vec<_>, _>>()
                      .map(Value::Array),
                  JsonValue::Object(fields) => {
                      let mut out = HashMap::with_capacity(fields.len());
                      for (key, value) in fields {
                          out.insert(key, value_from_json(value)?);
                      }
                      Ok(Value::Object(out))
                  }
              }
          }

          '''
              source = source[:at] + converters + source[at:]

          if "module_dispatches_namespace_and_direct_service_calls" not in source:
              insert = source.rfind("\n}")
              tests = r'''

              #[derive(Default)]
              struct FakeServices {
                  calls: std::sync::Mutex<Vec<(String, String, Vec<JsonValue>)>>,
              }

              impl ServiceCaller for FakeServices {
                  fn call<'a>(
                      &'a self,
                      service: &'a str,
                      function: &'a str,
                      args: Vec<JsonValue>,
                  ) -> ServiceCallFuture<'a> {
                      Box::pin(async move {
                          self.calls.lock().unwrap().push((
                              service.to_string(),
                              function.to_string(),
                              args.clone(),
                          ));
                          match (service, function) {
                              ("uac-cache", "get") => {
                                  Ok(args.into_iter().next().unwrap_or(JsonValue::Null))
                              }
                              ("search", "find") => Ok(serde_json::json!({
                                  "found": args.into_iter().next().unwrap_or(JsonValue::Null)
                              })),
                              _ => Err(format!("unexpected fake service call {service}.{function}")),
                          }
                      })
                  }
              }

              #[test]
              fn module_dispatches_namespace_and_direct_service_calls() {
                  let root = root();
                  fs::write(
                      root.join("module/services.module"),
                      ":import[service:uac-cache as cache, service:search.find as lookup]\nexport function run(id) { return lookup(cache.get(id)); }",
                  )
                  .unwrap();
                  let program = ModuleProgram::load(&root.join("module")).unwrap();
                  let caller = Arc::new(FakeServices::default());
                  let executor = ModuleExecutor::with_service_caller(&program, caller.clone());
                  let value = block_on_ready(executor.call(
                      "./module/services",
                      "run",
                      vec![Value::String("abc".into())],
                  ))
                  .unwrap();
                  let Value::Object(fields) = value else {
                      panic!("expected object service response");
                  };
                  assert!(matches!(fields.get("found"), Some(Value::String(value)) if value == "abc"));
                  assert_eq!(caller.calls.lock().unwrap().len(), 2);
                  let _ = fs::remove_dir_all(root);
              }

              #[test]
              fn service_call_without_runtime_is_explicit() {
                  let root = root();
                  fs::write(
                      root.join("module/services.module"),
                      ":import[service:uac-cache as cache]\nexport function run(id) { return cache.get(id); }",
                  )
                  .unwrap();
                  let program = ModuleProgram::load(&root.join("module")).unwrap();
                  let error = block_on_ready(program.call(
                      "./module/services",
                      "run",
                      vec![Value::String("abc".into())],
                  ))
                  .unwrap_err();
                  assert_eq!(error.code, "MOD3400");
                  let _ = fs::remove_dir_all(root);
              }
          '''
              source = source[:insert] + tests + source[insert:]

          evaluator.write_text(source)
          PY

          rustfmt --edition 2021 crates/route-engine/src/module_eval.rs
          git diff --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked

          python - <<'PY'
          import subprocess
          allowed = {
              "engine/crates/route-engine/Cargo.toml",
              "engine/crates/route-engine/src/module_eval.rs",
          }
          changed = set(subprocess.check_output(["git", "diff", "--name-only"], text=True).split())
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit("unexpected module-service execution paths: " + ", ".join(sorted(unexpected)))
          PY

          if ! git diff --quiet; then
            git config user.name "Kate"
            git config user.email "dhwanksh2000@gmail.com"
            git add -- crates/route-engine/Cargo.toml crates/route-engine/src/module_eval.rs
            git commit -m "feat: execute module service calls"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: format runtime slice
        shell: bash
        run: |
          rustfmt --edition 2021 --check \
            crates/service-runtime/src/lib.rs \
            crates/backend/src/service_boot.rs \
            crates/video-manager/src/lib.rs \
            crates/api/src/health.rs \
            crates/route-engine/src/ast.rs \
            crates/route-engine/src/parser.rs \
            crates/route-engine/src/modules.rs \
            crates/route-engine/src/analyzer.rs \
            crates/route-engine/src/transpiler.rs \
            crates/route-engine/src/module_runtime.rs \
            crates/route-engine/src/module_eval.rs \
            crates/route-engine/src/discovery.rs
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --workspace --locked
