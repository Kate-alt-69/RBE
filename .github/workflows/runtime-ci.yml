name: Runtime CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  engine-runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: apply async host capability hook
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("crates/route-engine/src/module_eval.rs")
          source = path.read_text()

          marker = "#[derive(Debug, Clone)]\npub struct ModuleEvalError"
          if "pub trait HostCapabilityCaller" not in source:
              at = source.index(marker)
              hook = '''pub type HostCapabilityFuture<'a> = Pin<
              Box<dyn Future<Output = Result<Option<Value>, ModuleEvalError>> + Send + 'a>,
          >;

          pub trait HostCapabilityCaller: Send + Sync {
              fn call<'a>(
                  &'a self,
                  module: &'a str,
                  function: &'a str,
                  args: Vec<Value>,
              ) -> HostCapabilityFuture<'a>;
          }

          '''.replace('          ', '')
              source = source[:at] + hook + source[at:]

          start = source.index("pub struct ModuleExecutor<'a> {")
          end = source.index("    pub async fn call(\n", start)
          prefix = '''pub struct ModuleExecutor<'a> {
              program: &'a ModuleProgram,
              services: Option<Arc<dyn ServiceCaller>>,
              host_capabilities: Option<Arc<dyn HostCapabilityCaller>>,
          }

          impl<'a> ModuleExecutor<'a> {
              pub fn new(program: &'a ModuleProgram) -> Self {
                  Self {
                      program,
                      services: None,
                      host_capabilities: None,
                  }
              }

              pub fn with_services(program: &'a ModuleProgram, services: ServiceManager) -> Self {
                  Self::with_service_caller(program, Arc::new(services))
              }

              pub fn with_service_caller(
                  program: &'a ModuleProgram,
                  services: Arc<dyn ServiceCaller>,
              ) -> Self {
                  Self {
                      program,
                      services: Some(services),
                      host_capabilities: None,
                  }
              }

              pub fn with_host_capabilities(
                  program: &'a ModuleProgram,
                  host_capabilities: Arc<dyn HostCapabilityCaller>,
              ) -> Self {
                  Self {
                      program,
                      services: None,
                      host_capabilities: Some(host_capabilities),
                  }
              }

              async fn call_host_capability(
                  &self,
                  module: &str,
                  function: &str,
                  args: Vec<Value>,
              ) -> Result<Option<Value>, ModuleEvalError> {
                  let Some(host_capabilities) = self.host_capabilities.as_ref() else {
                      return Ok(None);
                  };
                  host_capabilities.call(module, function, args).await
              }

          '''.replace('          ', '')
          source = source[:start] + prefix + source[end:]

          fields_anchor = '''    modules: ModuleRegistry,
              custom_modules: HashMap<String, String>,
              custom_functions: HashMap<String, (String, String)>,
          '''.replace('          ', '')
          fields_new = '''    modules: ModuleRegistry,
              builtin_modules: HashMap<String, String>,
              builtin_functions: HashMap<String, (String, String)>,
              custom_modules: HashMap<String, String>,
              custom_functions: HashMap<String, (String, String)>,
          '''.replace('          ', '')
          if fields_anchor not in source:
              raise SystemExit("Frame field anchor missing")
          source = source.replace(fields_anchor, fields_new, 1)

          start = source.index("    fn new(executor: &'exec ModuleExecutor<'program>, file: Arc<ModuleFile>, depth: usize) -> Self {")
          end = source.index("\n    fn exec_block<'b>", start)
          frame_new = '''    fn new(executor: &'exec ModuleExecutor<'program>, file: Arc<ModuleFile>, depth: usize) -> Self {
              let modules = ModuleRegistry::from_imports(&file.imports);
              let mut builtin_modules = HashMap::new();
              let mut builtin_functions = HashMap::new();
              let mut custom_modules = HashMap::new();
              let mut custom_functions = HashMap::new();
              let mut service_modules = HashMap::new();
              let mut service_functions = HashMap::new();
              for import in &file.imports {
                  let binding = binding_name(import);
                  match import_base(import) {
                      ImportTarget::Builtin(module) => {
                          builtin_modules.insert(binding, module.clone());
                      }
                      ImportTarget::BuiltinFunction { module, function } => {
                          builtin_functions.insert(binding, (module.clone(), function.clone()));
                      }
                      ImportTarget::Custom(path) => {
                          custom_modules.insert(binding, path.clone());
                      }
                      ImportTarget::CustomFunction { path, function } => {
                          custom_functions.insert(binding, (path.clone(), function.clone()));
                      }
                      ImportTarget::Service(service) => {
                          service_modules.insert(binding, service.clone());
                      }
                      ImportTarget::ServiceFunction { service, function } => {
                          service_functions.insert(binding, (service.clone(), function.clone()));
                      }
                      ImportTarget::Aliased { .. } => unreachable!("import_base removes aliases"),
                  }
              }
              Self {
                  executor,
                  file,
                  modules,
                  builtin_modules,
                  builtin_functions,
                  custom_modules,
                  custom_functions,
                  service_modules,
                  service_functions,
                  scope: HashMap::new(),
                  depth,
              }
          }
          '''.replace('          ', '')
          source = source[:start] + frame_new + source[end:]

          call_start = source.index("                Expr::Call(callee, arg_exprs) => {")
          ident = "                    if let Expr::Ident(name) = callee.as_ref() {"
          ident_at = source.index(ident, call_start)
          ident_end = ident_at + len(ident)
          direct_hook = '''
              if let Some((module, function)) = self.builtin_functions.get(name).cloned() {
                  if let Some(value) = self
                      .executor
                      .call_host_capability(&module, &function, args.clone())
                      .await?
                  {
                      return Ok(value);
                  }
              }
          '''.replace('          ', '')
          source = source[:ident_end] + direct_hook + source[ident_end:]

          member = "                    if let Expr::Member(base, function_name) = callee.as_ref() {"
          member_at = source.index(member, call_start)
          nested = "                        if let Expr::Ident(module_name) = base.as_ref() {"
          nested_at = source.index(nested, member_at)
          nested_end = nested_at + len(nested)
          member_hook = '''
              if let Some(module) = self.builtin_modules.get(module_name).cloned() {
                  if let Some(value) = self
                      .executor
                      .call_host_capability(&module, function_name, args.clone())
                      .await?
                  {
                      return Ok(value);
                  }
              }
          '''.replace('          ', '')
          source = source[:nested_end] + member_hook + source[nested_end:]

          if "host_capability_can_override_imported_builtin" not in source:
              insert = source.rfind("\n}")
              test = r'''

              struct TestHostCapability;

              impl HostCapabilityCaller for TestHostCapability {
                  fn call<'a>(
                      &'a self,
                      module: &'a str,
                      function: &'a str,
                      args: Vec<Value>,
                  ) -> HostCapabilityFuture<'a> {
                      Box::pin(async move {
                          if module == "host" && function == "double" {
                              let Some(Value::Number(value)) = args.into_iter().next() else {
                                  return Err(ModuleEvalError::new("TEST", "expected numeric argument"));
                              };
                              Ok(Some(Value::Number(value * 2.0)))
                          } else {
                              Ok(None)
                          }
                      })
                  }
              }

              #[test]
              fn host_capability_can_override_imported_builtin() {
                  let root = root();
                  fs::write(
                      root.join("module/hosted.module"),
                      ":import[host.double as twice]\nexport function run(value) { return twice(value); }",
                  )
                  .unwrap();
                  let program = ModuleProgram::load(&root.join("module")).unwrap();
                  let executor = ModuleExecutor::with_host_capabilities(
                      &program,
                      Arc::new(TestHostCapability),
                  );
                  let value = block_on_ready(executor.call(
                      "./module/hosted",
                      "run",
                      vec![Value::Number(6.0)],
                  ))
                  .unwrap();
                  assert!(matches!(value, Value::Number(value) if value == 12.0));
                  let _ = fs::remove_dir_all(root);
              }
          '''
              source = source[:insert] + test + source[insert:]

          path.write_text(source)
          PY

          rustfmt --edition 2021 crates/route-engine/src/module_eval.rs
          git diff --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked

          python - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(["git", "diff", "--name-only"], text=True).split())
          allowed = {"engine/crates/route-engine/src/module_eval.rs"}
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit("unexpected host-capability paths: " + ", ".join(sorted(unexpected)))
          PY

          if ! git diff --quiet; then
            git config user.name "Kate"
            git config user.email "dhwanksh2000@gmail.com"
            git add -- crates/route-engine/src/module_eval.rs
            git commit -m "feat: add async module host capabilities"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: format runtime slice
        shell: bash
        run: |
          rustfmt --edition 2021 --check \
            crates/service-runtime/src/lib.rs \
            crates/backend/src/service_boot.rs \
            crates/video-manager/src/lib.rs \
            crates/api/src/health.rs \
            crates/route-engine/src/ast.rs \
            crates/route-engine/src/parser.rs \
            crates/route-engine/src/modules.rs \
            crates/route-engine/src/analyzer.rs \
            crates/route-engine/src/transpiler.rs \
            crates/route-engine/src/module_runtime.rs \
            crates/route-engine/src/module_eval.rs \
            crates/route-engine/src/discovery.rs
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --workspace --locked
