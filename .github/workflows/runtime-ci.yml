name: Runtime CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  engine-runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: apply service executor boundary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("crates/service-runtime/src/lib.rs")
          source = path.read_text()
          if "use std::future::Future;" not in source:
              source = source.replace(
                  "use std::collections::{HashMap, HashSet};\n",
                  "use std::collections::{HashMap, HashSet};\nuse std::future::Future;\n",
                  1,
              )
          if "use std::pin::Pin;" not in source:
              source = source.replace(
                  "use std::path::{Path, PathBuf};\n",
                  "use std::path::{Path, PathBuf};\nuse std::pin::Pin;\n",
                  1,
              )

          if "pub trait ServiceExecutor" not in source:
              anchor = '''#[derive(Debug, Serialize, Deserialize)]
          #[serde(tag = "status", rename_all = "snake_case")]
          pub enum ServiceResponse {
              Ok { value: Value },
              Error { code: String, message: String },
          }
          '''
              if anchor not in source:
                  raise SystemExit("ServiceResponse anchor missing")
              addition = r'''

          #[derive(Debug, Clone)]
          pub struct ServiceExecutionError {
              pub code: String,
              pub message: String,
          }

          impl ServiceExecutionError {
              pub fn new(code: impl Into<String>, message: impl Into<String>) -> Self {
                  Self {
                      code: code.into(),
                      message: message.into(),
                  }
              }
          }

          pub type ServiceExecutionFuture<'a> = Pin<
              Box<dyn Future<Output = Result<Value, ServiceExecutionError>> + Send + 'a>,
          >;

          pub trait ServiceExecutor: Send + Sync {
              fn call<'a>(
                  &'a self,
                  function: &'a str,
                  args: Vec<Value>,
              ) -> ServiceExecutionFuture<'a>;
          }

          struct AddressableOnlyExecutor;

          impl ServiceExecutor for AddressableOnlyExecutor {
              fn call<'a>(
                  &'a self,
                  function: &'a str,
                  _args: Vec<Value>,
              ) -> ServiceExecutionFuture<'a> {
                  Box::pin(async move {
                      Err(ServiceExecutionError::new(
                          "SVC4100",
                          format!(
                              "export {function:?} is addressable; executable service bodies require a service executor"
                          ),
                      ))
                  })
              }
          }
          '''
              source = source.replace(anchor, anchor + addition, 1)

          start = source.index("pub async fn run_service_host(\n")
          end = source.index("\n#[cfg(unix)]\nfn apply_memory_limit", start)
          replacement = r'''pub async fn run_service_host(
              path: PathBuf,
              token: String,
              defaults: ServiceDefaults,
          ) -> anyhow::Result<()> {
              run_service_host_with_executor(
                  path,
                  token,
                  defaults,
                  Arc::new(AddressableOnlyExecutor),
              )
              .await
          }

          pub async fn run_service_host_with_executor(
              path: PathBuf,
              token: String,
              defaults: ServiceDefaults,
              executor: Arc<dyn ServiceExecutor>,
          ) -> anyhow::Result<()> {
              let file = parse_service(&path, defaults)?;
              apply_memory_limit(file.memory_limit_mb)?;
              let listener = TcpListener::bind("127.0.0.1:0").await?;
              let ready = ServiceReady {
                  service: file.name.clone(),
                  pid: std::process::id(),
                  address: listener.local_addr()?,
              };
              println!("{}", serde_json::to_string(&ready)?);
              std::io::stdout().flush()?;
              let memory = ServiceMemory::default();

              loop {
                  let (stream, _) = listener.accept().await?;
                  let (read, mut write) = stream.into_split();
                  let mut reader = BufReader::new(read);
                  let mut line = String::new();
                  reader.read_line(&mut line).await?;
                  let request: ServiceRequest = serde_json::from_str(line.trim())?;
                  let (response, shutdown) =
                      dispatch(request, &file, &token, &memory, executor.as_ref()).await;
                  write
                      .write_all(format!("{}\n", serde_json::to_string(&response)?).as_bytes())
                      .await?;
                  write.shutdown().await?;
                  if shutdown {
                      return Ok(());
                  }
              }
          }

          async fn dispatch(
              request: ServiceRequest,
              file: &ServiceFile,
              token: &str,
              memory: &ServiceMemory,
              executor: &dyn ServiceExecutor,
          ) -> (ServiceResponse, bool) {
              if request.token() != token {
                  return (
                      ServiceResponse::Error {
                          code: "SVC4001".into(),
                          message: "service IPC authentication failed".into(),
                      },
                      false,
                  );
              }
              let ok = |value| (ServiceResponse::Ok { value }, false);
              match request {
                  ServiceRequest::Health { .. } => ok(serde_json::json!({
                      "ok": true,
                      "service": &file.name,
                      "pid": std::process::id(),
                      "memoryEntries": memory.len()
                  })),
                  ServiceRequest::MemoryGet { key, .. } => {
                      ok(memory.get(&key).unwrap_or(Value::Null))
                  }
                  ServiceRequest::MemorySet { key, value, .. } => {
                      memory.set(key, value);
                      ok(Value::Bool(true))
                  }
                  ServiceRequest::MemoryDelete { key, .. } => {
                      ok(Value::Bool(memory.delete(&key)))
                  }
                  ServiceRequest::MemoryClear { .. } => {
                      memory.clear();
                      ok(Value::Bool(true))
                  }
                  ServiceRequest::Call { function, .. }
                      if !file.exports.iter().any(|value| value == &function) =>
                  {
                      (
                          ServiceResponse::Error {
                              code: "SVC4101".into(),
                              message: format!("unknown export {function:?}"),
                          },
                          false,
                      )
                  }
                  ServiceRequest::Call { function, args, .. } => match executor.call(&function, args).await {
                      Ok(value) => ok(value),
                      Err(error) => (
                          ServiceResponse::Error {
                              code: error.code,
                              message: error.message,
                          },
                          false,
                      ),
                  },
                  ServiceRequest::Shutdown { .. } => (
                      ServiceResponse::Ok {
                          value: Value::Bool(true),
                      },
                      true,
                  ),
              }
          }
          '''
          source = source[:start] + replacement + source[end:]

          if "dispatch_delegates_exported_calls_to_executor" not in source:
              insert = source.rfind("\n}")
              source = source[:insert] + r'''

              struct EchoExecutor;

              impl ServiceExecutor for EchoExecutor {
                  fn call<'a>(
                      &'a self,
                      function: &'a str,
                      args: Vec<Value>,
                  ) -> ServiceExecutionFuture<'a> {
                      Box::pin(async move {
                          if function == "echo" {
                              Ok(args.into_iter().next().unwrap_or(Value::Null))
                          } else {
                              Err(ServiceExecutionError::new(
                                  "TEST",
                                  format!("unexpected function {function}"),
                              ))
                          }
                      })
                  }
              }

              #[tokio::test]
              async fn dispatch_delegates_exported_calls_to_executor() {
                  let file = ServiceFile {
                      path: PathBuf::from("echo.service"),
                      name: "echo".into(),
                      title: "echo".into(),
                      restart: RestartPolicy::Never,
                      memory_limit_mb: 0,
                      startup_timeout_ms: 1000,
                      imports: Vec::new(),
                      exports: vec!["echo".into()],
                  };
                  let memory = ServiceMemory::default();
                  let (response, shutdown) = dispatch(
                      ServiceRequest::Call {
                          token: "token".into(),
                          function: "echo".into(),
                          args: vec![serde_json::json!({"ok": true})],
                      },
                      &file,
                      "token",
                      &memory,
                      &EchoExecutor,
                  )
                  .await;
                  assert!(!shutdown);
                  assert!(matches!(
                      response,
                      ServiceResponse::Ok { value } if value == serde_json::json!({"ok": true})
                  ));
              }
          ''' + source[insert:]
          path.write_text(source)
          PY

          rustfmt --edition 2021 crates/service-runtime/src/lib.rs
          git diff --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked

          python - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(["git", "diff", "--name-only"], text=True).split())
          allowed = {"engine/crates/service-runtime/src/lib.rs"}
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit("unexpected service executor paths: " + ", ".join(sorted(unexpected)))
          PY

          if ! git diff --quiet; then
            git config user.name "Kate"
            git config user.email "dhwanksh2000@gmail.com"
            git add -- crates/service-runtime/src/lib.rs
            git commit -m "feat: add service executor boundary"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: format runtime slice
        shell: bash
        run: |
          rustfmt --edition 2021 --check \
            crates/service-runtime/src/lib.rs \
            crates/backend/src/service_boot.rs \
            crates/video-manager/src/lib.rs \
            crates/api/src/health.rs \
            crates/route-engine/src/ast.rs \
            crates/route-engine/src/parser.rs \
            crates/route-engine/src/modules.rs \
            crates/route-engine/src/analyzer.rs \
            crates/route-engine/src/transpiler.rs \
            crates/route-engine/src/module_runtime.rs \
            crates/route-engine/src/module_eval.rs \
            crates/route-engine/src/discovery.rs
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --workspace --locked
