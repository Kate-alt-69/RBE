name: Runtime CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  engine-runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: apply async route module bridge
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          evaluator = Path("crates/route-engine/src/module_eval.rs")
          source = evaluator.read_text()
          if "pub(crate) async fn call_inline" not in source:
              at = source.index("    async fn call_service(\n", source.index("impl<'a> ModuleExecutor"))
              source = source[:at] + r'''    pub(crate) async fn call_inline(
              &self,
              file: Arc<ModuleFile>,
              function: &str,
              args: Vec<Value>,
          ) -> Result<Value, ModuleEvalError> {
              self.call_function(file, function, args, 0).await
          }

          ''' + source[at:]

          if "inline_route_can_reach_module_service_chain" not in source:
              insert = source.rfind("\n}")
              source = source[:insert] + r'''

              #[test]
              fn inline_route_can_reach_module_service_chain() {
                  let root = root();
                  fs::write(
                      root.join("module/bridge.module"),
                      ":import[service:uac-cache as cache]\nexport function lookup(id) { return cache.get(id); }",
                  )
                  .unwrap();
                  let program = ModuleProgram::load(&root.join("module")).unwrap();
                  let caller = Arc::new(FakeServices::default());
                  let executor = ModuleExecutor::with_service_caller(&program, caller.clone());
                  let route = Arc::new(ModuleFile {
                      imports: vec![ImportTarget::Custom("./module/bridge".into())],
                      functions: vec![crate::ast::FunctionDef {
                          name: "\0route-test".into(),
                          params: vec!["req".into()],
                          body: vec![Statement::Return(Expr::Call(
                              Box::new(Expr::Member(
                                  Box::new(Expr::Ident("bridge".into())),
                                  "lookup".into(),
                              )),
                              vec![Expr::Member(
                                  Box::new(Expr::Ident("req".into())),
                                  "id".into(),
                              )],
                          ))],
                      }],
                      exports: Vec::new(),
                  });
                  let mut request = HashMap::new();
                  request.insert("id".into(), Value::String("route-id".into()));
                  let value = block_on_ready(executor.call_inline(
                      route,
                      "\0route-test",
                      vec![Value::Object(request)],
                  ))
                  .unwrap();
                  assert!(matches!(value, Value::String(value) if value == "route-id"));
                  assert_eq!(caller.calls.lock().unwrap().len(), 1);
                  let _ = fs::remove_dir_all(root);
              }
          ''' + source[insert:]
          evaluator.write_text(source)

          discovery = Path("crates/route-engine/src/discovery.rs")
          source = discovery.read_text()
          source = source.replace(
              "use axum::response::{IntoResponse, Json};\n",
              "use axum::extract::State;\nuse axum::response::{IntoResponse, Json};\n",
              1,
          )
          source = source.replace(
              "use crate::ast::{FunctionDef, MethodDef, RouteFile, Value};\nuse crate::interpreter::{Interpreter, RequestContext};\n",
              "use crate::ast::{FunctionDef, ModuleFile, RouteFile, Value};\nuse crate::module_eval::ModuleExecutor;\nuse crate::module_runtime::ModuleProgram;\n",
              1,
          )
          source = source.replace(
              "use crate::modules::{binding_name, ModuleRegistry};\n",
              "use crate::modules::binding_name;\n",
              1,
          )

          start = source.index("async fn execute(")
          end = source.index("\nfn compiler_error_path", start)
          source = source[:start] + r'''const INLINE_ROUTE_HANDLER: &str = "\0rbe-route-handler";

          fn request_value(method: &str, path: &str) -> Value {
              let mut fields = HashMap::new();
              fields.insert("method".into(), Value::String(method.to_string()));
              fields.insert("path".into(), Value::String(path.to_string()));
              fields.insert("params".into(), Value::Object(HashMap::new()));
              fields.insert("query".into(), Value::Object(HashMap::new()));
              Value::Object(fields)
          }

          async fn execute(
              inline_file: Arc<ModuleFile>,
              module_program: Arc<ModuleProgram>,
              takes_request: bool,
              state: AppState,
              http_method: String,
              path: String,
          ) -> axum::response::Response {
              let args = if takes_request {
                  vec![request_value(&http_method, &path)]
              } else {
                  Vec::new()
              };
              let executor = ModuleExecutor::with_services(module_program.as_ref(), state.services.clone());
              match executor.call_inline(inline_file, INLINE_ROUTE_HANDLER, args).await {
                  Ok(value) => Json(value_to_json(&value)).into_response(),
                  Err(err) => {
                      tracing::error!(error = %err, path = %path, "route evaluation failed");
                      append_runtime_error(&path, &err.to_string());
                      (
                          axum::http::StatusCode::INTERNAL_SERVER_ERROR,
                          Json(serde_json::json!({ "error": err.to_string() })),
                      )
                          .into_response()
                  }
              }
          }

          fn build_method_router(
              file: &RouteFile,
              module_program: Arc<ModuleProgram>,
              url_path: String,
          ) -> MethodRouter<AppState> {
              let mut router = MethodRouter::<AppState>::new();
              for method_def in &file.methods {
                  let mut functions = file.functions.clone();
                  functions.push(FunctionDef {
                      name: INLINE_ROUTE_HANDLER.to_string(),
                      params: method_def.param_name.clone().into_iter().collect(),
                      body: method_def.body.clone(),
                  });
                  let inline_file = Arc::new(ModuleFile {
                      imports: file.imports.clone(),
                      functions,
                      exports: Vec::new(),
                  });
                  let takes_request = method_def.param_name.is_some();
                  let module_program = module_program.clone();
                  let url_path = url_path.clone();
                  let verb = method_def.verb.clone();
                  let handler_verb = verb.clone();
                  let handler = move |State(state): State<AppState>| {
                      let inline_file = inline_file.clone();
                      let module_program = module_program.clone();
                      let path = url_path.clone();
                      let method = handler_verb.to_uppercase();
                      async move {
                          execute(
                              inline_file,
                              module_program,
                              takes_request,
                              state,
                              method,
                              path,
                          )
                          .await
                      }
                  };
                  router = match verb.as_str() {
                      "get" => router.get(handler),
                      "post" => router.post(handler),
                      "put" => router.put(handler),
                      "delete" => router.delete(handler),
                      "patch" => router.patch(handler),
                      "head" => router.head(handler),
                      "options" => router.options(handler),
                      _ => router,
                  };
              }
              router
          }
          ''' + source[end:]

          source = source.replace(
              "    let module_program = crate::module_runtime::ModuleProgram::load_default()?;\n",
              "    let module_program = Arc::new(ModuleProgram::load_default()?);\n",
              1,
          )
          build = source.index("pub fn build_routes(api_dir: &Path)")
          loop_at = source.index("    for (path, route_file) in compiled {", build)
          url_at = source.index("        let url_path = url_path_for(api_dir, &path);", loop_at)
          url_end = source.index("\n", url_at) + 1
          trace_at = source.index("        tracing::info!(", url_end)
          source = source[:url_end] + "\n" + source[trace_at:]
          route_at = source.index("        router = router.route(", trace_at)
          route_end = source.index("        );", route_at) + len("        );")
          source = source[:route_at] + '''        router = router.route(
              &url_path,
              build_method_router(&route_file, module_program.clone(), url_path.clone()),
          );''' + source[route_end:]
          discovery.write_text(source)
          PY

          rustfmt --edition 2021 \
            crates/route-engine/src/module_eval.rs \
            crates/route-engine/src/discovery.rs
          git diff --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked

          python - <<'PY'
          import subprocess
          allowed = {
              "engine/crates/route-engine/src/module_eval.rs",
              "engine/crates/route-engine/src/discovery.rs",
          }
          changed = set(subprocess.check_output(["git", "diff", "--name-only"], text=True).split())
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit("unexpected route-module bridge paths: " + ", ".join(sorted(unexpected)))
          PY

          if ! git diff --quiet; then
            git config user.name "Kate"
            git config user.email "dhwanksh2000@gmail.com"
            git add -- crates/route-engine/src/module_eval.rs crates/route-engine/src/discovery.rs
            git commit -m "feat: execute routes through module runtime"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: format runtime slice
        shell: bash
        run: |
          rustfmt --edition 2021 --check \
            crates/service-runtime/src/lib.rs \
            crates/backend/src/service_boot.rs \
            crates/video-manager/src/lib.rs \
            crates/api/src/health.rs \
            crates/route-engine/src/ast.rs \
            crates/route-engine/src/parser.rs \
            crates/route-engine/src/modules.rs \
            crates/route-engine/src/analyzer.rs \
            crates/route-engine/src/transpiler.rs \
            crates/route-engine/src/module_runtime.rs \
            crates/route-engine/src/module_eval.rs \
            crates/route-engine/src/discovery.rs
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --workspace --locked
