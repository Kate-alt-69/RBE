name: Runtime CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  engine-runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: apply authenticated service call boundary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          cargo = Path("crates/service-runtime/Cargo.toml")
          cargo_source = cargo.read_text()
          if "thiserror = { workspace = true }" not in cargo_source:
              needle = "anyhow = { workspace = true }\n"
              if needle not in cargo_source:
                  raise SystemExit("could not locate service-runtime dependency anchor")
              cargo_source = cargo_source.replace(
                  needle,
                  needle + "thiserror = { workspace = true }\n",
                  1,
              )
              cargo.write_text(cargo_source)

          path = Path("crates/service-runtime/src/lib.rs")
          source = path.read_text()

          if "pub enum ServiceCallError" not in source:
              anchor = "\n\nimpl ServiceManager {"
              at = source.index(anchor)
              error_type = r'''

          #[derive(Debug, thiserror::Error)]
          pub enum ServiceCallError {
              #[error("unknown service {service:?}")]
              Unknown { service: String },
              #[error("service {service:?} is unavailable")]
              Unavailable { service: String },
              #[error("failed to inspect service {service:?}: {message}")]
              Inspect { service: String, message: String },
              #[error("service {service:?} IPC failed: {message}")]
              Ipc { service: String, message: String },
              #[error("service {service:?} returned {code}: {message}")]
              Remote {
                  service: String,
                  code: String,
                  message: String,
              },
          }
          '''
              source = source[:at] + error_type + source[at:]

          impl_start = source.index("impl ServiceManager {")
          if "    pub async fn call(" not in source[impl_start:]:
              insert_at = source.index("    pub async fn snapshot(&self)", impl_start)
              call_method = r'''    pub async fn call(
              &self,
              service_name: &str,
              function: &str,
              args: Vec<Value>,
          ) -> Result<Value, ServiceCallError> {
              if self.shutting_down.load(Ordering::Acquire) {
                  return Err(ServiceCallError::Unavailable {
                      service: service_name.to_string(),
                  });
              }

              let handle = self
                  .services
                  .read()
                  .await
                  .get(service_name)
                  .cloned()
                  .ok_or_else(|| ServiceCallError::Unknown {
                      service: service_name.to_string(),
                  })?;

              let (address, token) = {
                  let mut service = handle.lock().await;
                  match service.child.try_wait() {
                      Ok(None) => (service.ready.address, service.token.clone()),
                      Ok(Some(_)) => {
                          return Err(ServiceCallError::Unavailable {
                              service: service_name.to_string(),
                          });
                      }
                      Err(error) => {
                          return Err(ServiceCallError::Inspect {
                              service: service_name.to_string(),
                              message: error.to_string(),
                          });
                      }
                  }
              };

              let response = rpc(
                  address,
                  ServiceRequest::Call {
                      token,
                      function: function.to_string(),
                      args,
                  },
              )
              .await
              .map_err(|error| ServiceCallError::Ipc {
                  service: service_name.to_string(),
                  message: error.to_string(),
              })?;

              map_call_response(service_name, response)
          }

          '''
              source = source[:insert_at] + call_method + source[insert_at:]

          if "fn map_call_response(" not in source:
              anchor = "\nfn should_restart("
              at = source.index(anchor)
              helper = r'''
          fn map_call_response(
              service_name: &str,
              response: ServiceResponse,
          ) -> Result<Value, ServiceCallError> {
              match response {
                  ServiceResponse::Ok { value } => Ok(value),
                  ServiceResponse::Error { code, message } => Err(ServiceCallError::Remote {
                      service: service_name.to_string(),
                      code,
                      message,
                  }),
              }
          }
          '''
              source = source[:at] + helper + source[at:]

          if "unknown_service_call_is_typed" not in source:
              module_end = source.rfind("}")
              tests_start = source.rfind("#[cfg(test)]")
              if tests_start < 0 or module_end <= tests_start:
                  raise SystemExit("could not locate service-runtime test module")
              tests = r'''

              #[tokio::test]
              async fn unknown_service_call_is_typed() {
                  let error = ServiceManager::default()
                      .call("missing", "get", Vec::new())
                      .await
                      .unwrap_err();
                  assert!(matches!(
                      error,
                      ServiceCallError::Unknown { service } if service == "missing"
                  ));
              }

              #[test]
              fn call_response_maps_success_and_remote_error() {
                  assert_eq!(
                      map_call_response(
                          "cache",
                          ServiceResponse::Ok {
                              value: serde_json::json!(7),
                          },
                      )
                      .unwrap(),
                      serde_json::json!(7)
                  );

                  let error = map_call_response(
                      "cache",
                      ServiceResponse::Error {
                          code: "SVC4100".into(),
                          message: "pending evaluator".into(),
                      },
                  )
                  .unwrap_err();
                  assert!(matches!(
                      error,
                      ServiceCallError::Remote { service, code, message }
                          if service == "cache"
                              && code == "SVC4100"
                              && message == "pending evaluator"
                  ));
              }
          '''
              source = source[:module_end] + tests + source[module_end:]

          path.write_text(source)
          PY
          rustfmt --edition 2021 crates/service-runtime/src/lib.rs
          git diff --check
          if ! git diff --quiet -- crates/service-runtime/src/lib.rs crates/service-runtime/Cargo.toml; then
            git config user.name "Kate"
            git config user.email "dhwanksh2000@gmail.com"
            git add -- crates/service-runtime/src/lib.rs crates/service-runtime/Cargo.toml
            git commit -m "feat: add authenticated service call boundary"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: format runtime slice
        shell: bash
        run: |
          rustfmt --edition 2021 --check \
            crates/service-runtime/src/lib.rs \
            crates/backend/src/service_boot.rs \
            crates/video-manager/src/lib.rs
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
