name: Runtime CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine-runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: format workspace
        run: cargo fmt --all
      - name: upload formatted service runtime
        uses: actions/upload-artifact@v4
        with:
          name: service-runtime-formatted
          path: engine/crates/service-runtime/src/lib.rs
          if-no-files-found: error
      - name: clippy
        id: clippy
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee ../clippy.log
      - name: upload clippy diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-clippy-log
          path: clippy.log
          if-no-files-found: error
      - name: test
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tee ../test.log
      - name: upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-test-log
          path: test.log
          if-no-files-found: error
      - name: enforce validation results
        if: steps.clippy.outcome == 'failure' || steps.tests.outcome == 'failure'
        run: exit 1
