name: Runtime CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  engine-runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: apply typed service runtime health
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("crates/service-runtime/src/lib.rs")
          source = path.read_text()

          if "pub enum ServiceRuntimeState" not in source:
              start = source.index("#[derive(Debug, Clone, Serialize)]\npub struct ServiceSnapshot")
              end = source.index("\n\nimpl ServiceManager {", start)
              typed = '''#[derive(Debug, Clone, Copy, PartialEq, Eq, Serialize)]
          #[serde(rename_all = "snake_case")]
          pub enum ServiceRuntimeState {
              Running,
              Restarting,
              Stopped,
              Unknown,
          }

          #[derive(Debug, Clone, Serialize)]
          #[serde(rename_all = "camelCase")]
          pub struct ServiceSnapshot {
              pub name: String,
              pub title: String,
              pub pid: Option<u32>,
              pub state: ServiceRuntimeState,
              pub restart: RestartPolicy,
              pub restart_attempts: u32,
          }'''
              source = source[:start] + typed + source[end:]

          snapshot = source.index("    pub async fn snapshot(&self) -> Vec<ServiceSnapshot> {")
          if "state: state," not in source[snapshot:]:
              body_start = source.index("            let mut service = handle.lock().await;", snapshot)
              body_end = source.index("        }\n        out.sort_by", body_start)
              body = '''            let mut service = handle.lock().await;
              let (pid, state) = match service.child.try_wait() {
                  Ok(None) => (service.child.id(), ServiceRuntimeState::Running),
                  Ok(Some(status))
                      if service.exit_observed
                          || !should_restart(service.file.restart, status.success()) =>
                  {
                      (None, ServiceRuntimeState::Stopped)
                  }
                  Ok(Some(_)) => (None, ServiceRuntimeState::Restarting),
                  Err(_) => (None, ServiceRuntimeState::Unknown),
              };
              out.push(ServiceSnapshot {
                  name: service.file.name.clone(),
                  title: service.file.title.clone(),
                  pid,
                  state,
                  restart: service.file.restart,
                  restart_attempts: service.restart_attempts,
              });
          '''
              source = source[:body_start] + body + source[body_end:]

          path.write_text(source)
          PY
          rustfmt --edition 2021 crates/service-runtime/src/lib.rs
          git diff --check
          if ! git diff --quiet -- crates/service-runtime/src/lib.rs; then
            git config user.name "Kate"
            git config user.email "dhwanksh2000@gmail.com"
            git add -- crates/service-runtime/src/lib.rs
            git commit -m "feat: expose service restart health"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: format runtime slice
        shell: bash
        run: |
          rustfmt --edition 2021 --check \
            crates/service-runtime/src/lib.rs \
            crates/backend/src/service_boot.rs \
            crates/video-manager/src/lib.rs
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
