name: Runtime CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  engine-runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: apply executable service parser
        shell: bash
        run: |
          python - <<'PY'
          import subprocess

          previous = subprocess.check_output(
              ["git", "show", "HEAD^:.github/workflows/runtime-ci.yml"],
              text=True,
          )
          marker = "          python - <<'PY'\n"
          start = previous.index(marker) + len(marker)
          end = previous.index("\n          PY", start)
          patch = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in previous[start:end].splitlines()
          )
          exec(compile(patch, "service-parser-patch", "exec"))
          PY

          rustfmt --edition 2021 \
            crates/route-engine/src/ast.rs \
            crates/route-engine/src/parser.rs
          git diff --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked

          python - <<'PY'
          import subprocess
          allowed = {
              "engine/crates/route-engine/src/ast.rs",
              "engine/crates/route-engine/src/parser.rs",
              "engine/crates/route-engine/src/lib.rs",
          }
          changed = set(subprocess.check_output(["git", "diff", "--name-only"], text=True).split())
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit("unexpected service parser paths: " + ", ".join(sorted(unexpected)))
          PY

          if ! git diff --quiet; then
            git config user.name "Kate"
            git config user.email "dhwanksh2000@gmail.com"
            git add -- \
              crates/route-engine/src/ast.rs \
              crates/route-engine/src/parser.rs \
              crates/route-engine/src/lib.rs
            git commit -m "feat: parse executable service programs"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: format runtime slice
        shell: bash
        run: |
          rustfmt --edition 2021 --check \
            crates/service-runtime/src/lib.rs \
            crates/backend/src/service_boot.rs \
            crates/video-manager/src/lib.rs \
            crates/api/src/health.rs \
            crates/route-engine/src/ast.rs \
            crates/route-engine/src/parser.rs \
            crates/route-engine/src/modules.rs \
            crates/route-engine/src/analyzer.rs \
            crates/route-engine/src/transpiler.rs \
            crates/route-engine/src/module_runtime.rs \
            crates/route-engine/src/module_eval.rs \
            crates/route-engine/src/discovery.rs
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --workspace --locked
