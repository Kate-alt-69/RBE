name: Runtime CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  engine-runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: refresh engine lockfile
        shell: bash
        run: |
          cargo generate-lockfile
          git diff --check
          python - <<'PY'
          import subprocess
          changed = [line.strip() for line in subprocess.check_output(
              ["git", "diff", "--name-only"], text=True
          ).splitlines() if line.strip()]
          if changed not in ([], ["engine/Cargo.lock"]):
              raise SystemExit("unexpected lock refresh paths: " + ", ".join(changed))
          PY
          if ! git diff --quiet -- Cargo.lock; then
            git config user.name "Kate"
            git config user.email "dhwanksh2000@gmail.com"
            git add -- Cargo.lock
            git commit -m "chore: refresh engine lockfile"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: format runtime slice
        shell: bash
        run: |
          rustfmt --edition 2021 --check \
            crates/service-runtime/src/lib.rs \
            crates/backend/src/service_boot.rs \
            crates/video-manager/src/lib.rs \
            crates/api/src/health.rs
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
