name: Runtime CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  engine-runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: apply module service imports
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          ast = Path("crates/route-engine/src/ast.rs")
          source = ast.read_text()
          if "Service(String)" not in source:
              at = source.index("    Aliased {")
              source = source[:at] + '''    Service(String),
              ServiceFunction {
                  service: String,
                  function: String,
              },
          ''' + source[at:]
              ast.write_text(source)

          parser = Path("crates/route-engine/src/parser.rs")
          source = parser.read_text()
          start = source.index("    fn parse_import_target(&mut self) -> Result<ImportTarget, ParseError> {")
          end = source.index("\n    fn is_export_keyword", start)
          source = source[:start] + r'''    fn parse_import_target(&mut self) -> Result<ImportTarget, ParseError> {
              match self.advance().kind {
                  TokenKind::Ident(name) => {
                      if name == "service" && self.check(&TokenKind::Colon) {
                          self.advance();
                          let service = self.expect_ident()?;
                          if self.check(&TokenKind::Dot) {
                              self.advance();
                              let function = self.expect_ident()?;
                              Ok(ImportTarget::ServiceFunction { service, function })
                          } else {
                              Ok(ImportTarget::Service(service))
                          }
                      } else if self.check(&TokenKind::Dot) {
                          self.advance();
                          let function = self.expect_ident()?;
                          Ok(ImportTarget::BuiltinFunction { module: name, function })
                      } else if let Some((prefix, module_name)) = name.split_once('&') {
                          if prefix != "module" {
                              return Err(self.error_here("only module&name shorthand is supported"));
                          }
                          Ok(ImportTarget::Custom(format!("./module/{module_name}")))
                      } else {
                          Ok(ImportTarget::Builtin(name))
                      }
                  }
                  TokenKind::String(path) => {
                      if let Some(service) = path.strip_prefix("service:") {
                          if service.is_empty() {
                              return Err(self.error_here("service import name cannot be empty"));
                          }
                          if self.check(&TokenKind::Dot) {
                              self.advance();
                              let function = self.expect_ident()?;
                              Ok(ImportTarget::ServiceFunction {
                                  service: service.to_string(),
                                  function,
                              })
                          } else {
                              Ok(ImportTarget::Service(service.to_string()))
                          }
                      } else if self.check(&TokenKind::RBracket)
                          || self.check(&TokenKind::Comma)
                          || self.is_as_keyword()
                      {
                          Ok(ImportTarget::Custom(path))
                      } else {
                          self.expect(TokenKind::Dot)?;
                          let function = self.expect_ident()?;
                          Ok(ImportTarget::CustomFunction { path, function })
                      }
                  }
                  other => Err(self.error_here(&format!(
                      "expected builtin, module path, or service import inside :import[...], got {other:?}"
                  ))),
              }
          }
          ''' + source[end:]
          parser.write_text(source)

          modules = Path("crates/route-engine/src/modules.rs")
          source = modules.read_text()
          if "ImportTarget::Service(name) => name.clone()" not in source:
              anchor = "        ImportTarget::CustomFunction { function, .. } => function.clone(),\n"
              if anchor not in source:
                  raise SystemExit("binding_name anchor missing")
              source = source.replace(
                  anchor,
                  anchor
                  + "        ImportTarget::Service(name) => name.clone(),\n"
                  + "        ImportTarget::ServiceFunction { function, .. } => function.clone(),\n",
                  1,
              )
          if "Service calls are async" not in source:
              marker = '                ImportTarget::Aliased { .. } => unreachable!("base_target removes aliased import wrappers"),'
              at = source.index(marker)
              source = source[:at] + '''                ImportTarget::Service(_) | ImportTarget::ServiceFunction { .. } => {
                      // Service calls are async and are intentionally handled by ModuleExecutor,
                      // never by the synchronous route capability registry.
                  }
          ''' + source[at:]
          modules.write_text(source)

          analyzer = Path("crates/route-engine/src/analyzer.rs")
          source = analyzer.read_text()
          if 'format!("service:{service}")' not in source:
              marker = '        ImportTarget::Aliased { .. } => unreachable!("import_base removes aliased import wrappers"),'
              at = source.index(marker)
              source = source[:at] + '''        ImportTarget::Service(service) => format!("service:{service}"),
              ImportTarget::ServiceFunction { service, function } => {
                  format!("service:{service}.{function}")
              }
          ''' + source[at:]
          if 'code: "E3020"' not in source:
              old = "            ImportTarget::Custom(_) | ImportTarget::CustomFunction { .. } => SymbolKind::Module,\n"
              if old not in source:
                  raise SystemExit("route service policy anchor missing")
              source = source.replace(old, '''            ImportTarget::Custom(_) => SymbolKind::Module,
              ImportTarget::CustomFunction { .. } => SymbolKind::DirectFunction,
              ImportTarget::Service(service) => {
                  diagnostics.push(Diagnostic {
                      severity: Severity::Error,
                      code: "E3020",
                      message: format!(
                          "service `{service}` cannot be imported directly by a `.route`; import it from a `.module` instead"
                      ),
                      symbol: Some(name.clone()),
                  });
                  SymbolKind::Module
              }
              ImportTarget::ServiceFunction { service, function } => {
                  diagnostics.push(Diagnostic {
                      severity: Severity::Error,
                      code: "E3020",
                      message: format!(
                          "service function `{service}.{function}` cannot be imported directly by a `.route`; import it from a `.module` instead"
                      ),
                      symbol: Some(name.clone()),
                  });
                  SymbolKind::DirectFunction
              }
          ''', 1)
          analyzer.write_text(source)

          transpiler = Path("crates/route-engine/src/transpiler.rs")
          source = transpiler.read_text()
          if "ImportTarget::Service(_)" not in source:
              loop_at = source.index("        for import in imports {", source.index("impl Scope"))
              match_at = source.index("            match base_import(import) {", loop_at)
              end_marker = "            }\n        }\n        for function in functions {"
              match_end = source.index(end_marker, match_at)
              match_end += len("            }\n")
              replacement = '''            match base_import(import) {
                  ImportTarget::Builtin(_) | ImportTarget::Custom(_) | ImportTarget::Service(_) => {
                      names.insert(crate::modules::binding_name(import), NameKind::Module);
                  }
                  ImportTarget::BuiltinFunction { .. }
                  | ImportTarget::CustomFunction { .. }
                  | ImportTarget::ServiceFunction { .. } => {
                      names.insert(crate::modules::binding_name(import), NameKind::DirectFunction);
                  }
                  ImportTarget::Aliased { .. } => {
                      unreachable!("base_import removes aliased import wrappers")
                  }
              }
          '''
              source = source[:match_at] + replacement + source[match_end:]
          transpiler.write_text(source)

          runtime = Path("crates/route-engine/src/module_runtime.rs")
          source = runtime.read_text()
          if "ImportTarget::Service(service)" not in source:
              marker = "        ImportTarget::Aliased { .. } => unreachable!(),"
              at = source.index(marker, source.index("fn import_source_key"))
              source = source[:at] + '''        ImportTarget::Service(service) => format!("service:{service}"),
              ImportTarget::ServiceFunction { service, function } => {
                  format!("service:{service}.{function}")
              }
          ''' + source[at:]
          if "accepts_service_imports_without_module_dependencies" not in source:
              insert = source.rfind("}\n")
              source = source[:insert] + r'''

              #[test]
              fn accepts_service_imports_without_module_dependencies() {
                  let root = root();
                  fs::write(
                      root.join("module/cache.module"),
                      ":import[service:uac-cache, service:search.find as lookup]\nexport function run(value) { return value; }",
                  )
                  .unwrap();
                  let program = ModuleProgram::load(&root.join("module")).unwrap();
                  assert_eq!(program.len(), 1);
                  let _ = fs::remove_dir_all(root);
              }
          ''' + source[insert:]
          runtime.write_text(source)

          lib = Path("crates/route-engine/src/lib.rs")
          source = lib.read_text()
          if "parses_service_imports_for_modules" not in source:
              anchor = "    #[test]\n    fn parses_multiple_import_entries_and_aliases()"
              if anchor not in source:
                  raise SystemExit("lib test anchor missing")
              source = source.replace(anchor, r'''    #[test]
              fn parses_service_imports_for_modules() {
                  let tokens = Lexer::new(
                      r#":import[service:uac-cache as uac, service:search.find as lookup, "service:media"]
                      export function run(value) { return value; }"#,
                  )
                  .tokenize()
                  .expect("lex failed");
                  let file = Parser::new(tokens)
                      .parse_module_file()
                      .expect("module parse failed");
                  assert_eq!(file.imports.len(), 3);
                  assert_eq!(binding_name(&file.imports[0]), "uac");
                  assert_eq!(binding_name(&file.imports[1]), "lookup");
                  assert_eq!(binding_name(&file.imports[2]), "media");
              }

              #[test]
              fn route_rejects_direct_service_imports() {
                  let file = parse(r#"
                      :import[service:uac-cache]
                      class Route {
                          get(req) { return { ok: true }; }
                      }
                  "#);
                  let diagnostics = analyze(&file);
                  assert!(diagnostics.iter().any(|diagnostic| diagnostic.code == "E3020"));
              }

          ''' + anchor, 1)
          lib.write_text(source)
          PY

          rustfmt --edition 2021 \
            crates/route-engine/src/ast.rs \
            crates/route-engine/src/parser.rs \
            crates/route-engine/src/modules.rs \
            crates/route-engine/src/analyzer.rs \
            crates/route-engine/src/transpiler.rs \
            crates/route-engine/src/module_runtime.rs
          git diff --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked

          python - <<'PY'
          import subprocess
          allowed = {
              "engine/crates/route-engine/src/ast.rs",
              "engine/crates/route-engine/src/parser.rs",
              "engine/crates/route-engine/src/modules.rs",
              "engine/crates/route-engine/src/analyzer.rs",
              "engine/crates/route-engine/src/transpiler.rs",
              "engine/crates/route-engine/src/module_runtime.rs",
              "engine/crates/route-engine/src/lib.rs",
          }
          changed = set(subprocess.check_output(["git", "diff", "--name-only"], text=True).split())
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit("unexpected service-import paths: " + ", ".join(sorted(unexpected)))
          PY

          if ! git diff --quiet; then
            git config user.name "Kate"
            git config user.email "dhwanksh2000@gmail.com"
            git add -- \
              crates/route-engine/src/ast.rs \
              crates/route-engine/src/parser.rs \
              crates/route-engine/src/modules.rs \
              crates/route-engine/src/analyzer.rs \
              crates/route-engine/src/transpiler.rs \
              crates/route-engine/src/module_runtime.rs \
              crates/route-engine/src/lib.rs
            git commit -m "feat: add module service imports"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: format runtime slice
        shell: bash
        run: |
          rustfmt --edition 2021 --check \
            crates/service-runtime/src/lib.rs \
            crates/backend/src/service_boot.rs \
            crates/video-manager/src/lib.rs \
            crates/api/src/health.rs \
            crates/route-engine/src/ast.rs \
            crates/route-engine/src/parser.rs \
            crates/route-engine/src/modules.rs \
            crates/route-engine/src/analyzer.rs \
            crates/route-engine/src/transpiler.rs \
            crates/route-engine/src/module_runtime.rs \
            crates/route-engine/src/module_eval.rs \
            crates/route-engine/src/discovery.rs
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --workspace --locked
