name: Runtime CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  engine-runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: apply module compiler foundation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          ast = Path("crates/route-engine/src/ast.rs")
          source = ast.read_text()
          if "pub struct ModuleFile" not in source:
              anchor = '''#[derive(Debug, Clone)]
          pub struct FunctionDef {'''
              insertion = '''#[derive(Debug, Clone)]
          pub struct ModuleFile {
              pub imports: Vec<ImportTarget>,
              pub functions: Vec<FunctionDef>,
              pub exports: Vec<String>,
          }

          #[derive(Debug, Clone)]
          pub struct FunctionDef {'''
              if anchor not in source:
                  raise SystemExit("ast ModuleFile anchor missing")
              source = source.replace(anchor, insertion, 1)
              ast.write_text(source)

          parser = Path("crates/route-engine/src/parser.rs")
          source = parser.read_text()
          old_use = "use crate::ast::{BinaryOp, Expr, FunctionDef, ImportTarget, MethodDef, RouteFile, Statement};"
          new_use = "use crate::ast::{BinaryOp, Expr, FunctionDef, ImportTarget, MethodDef, ModuleFile, RouteFile, Statement};"
          if old_use in source:
              source = source.replace(old_use, new_use, 1)
          if "pub fn parse_module_file" not in source:
              anchor = '''    /// Parse a route while retaining recoverable statement errors.'''
              method = '''    pub fn parse_module_file(mut self) -> Result<ModuleFile, ParseError> {
              let mut imports = Vec::new();
              while self.check(&TokenKind::Colon) {
                  imports.extend(self.parse_imports()?);
              }

              let mut functions = Vec::new();
              let mut exports = Vec::new();
              while !self.check(&TokenKind::Eof) {
                  let exported = self.is_export_keyword();
                  if exported {
                      self.advance();
                  }
                  if self.check(&TokenKind::Async) {
                      self.advance();
                  }
                  if !self.check(&TokenKind::Function) {
                      return Err(self.error_here(
                          "expected `function` or `export function` in .module file",
                      ));
                  }
                  let function = self.parse_function()?;
                  if exported {
                      exports.push(function.name.clone());
                  }
                  functions.push(function);
              }

              Ok(ModuleFile {
                  imports,
                  functions,
                  exports,
              })
          }

          '''
              if anchor not in source:
                  raise SystemExit("parser module method anchor missing")
              source = source.replace(anchor, method + anchor, 1)
          if "fn is_export_keyword" not in source:
              anchor = '''    fn is_as_keyword(&self) -> bool {'''
              helper = '''    fn is_export_keyword(&self) -> bool {
              matches!(
                  self.tokens.get(self.pos).map(|token| &token.kind),
                  Some(TokenKind::Ident(name)) if name == "export"
              )
          }

          '''
              if anchor not in source:
                  raise SystemExit("parser export helper anchor missing")
              source = source.replace(anchor, helper + anchor, 1)
          parser.write_text(source)

          module_runtime = Path("crates/route-engine/src/module_runtime.rs")
          if not module_runtime.exists():
              module_runtime.write_text(r'''//! Boot-time loader and dependency validator for `.module` files.

          use std::collections::{HashMap, HashSet};
          use std::fs;
          use std::path::{Path, PathBuf};
          use std::sync::Arc;

          use crate::ast::{ImportTarget, ModuleFile};
          use crate::discovery::collect_files;
          use crate::lexer::Lexer;
          use crate::modules::binding_name;
          use crate::parser::Parser;
          use crate::paths::{binary_dir, default_module_dir, resolve_custom_import};

          #[derive(Debug, Clone)]
          pub struct ModuleCompileError {
              pub code: &'static str,
              pub path: PathBuf,
              pub line: usize,
              pub column: usize,
              pub message: String,
          }

          impl std::fmt::Display for ModuleCompileError {
              fn fmt(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {
                  write!(
                      f,
                      "{}: {}:{}:{}: {}",
                      self.code,
                      self.path.display(),
                      self.line,
                      self.column,
                      self.message
                  )
              }
          }

          #[derive(Debug, Clone)]
          pub struct ModuleCompileErrors(pub Vec<ModuleCompileError>);

          impl ModuleCompileErrors {
              pub fn render(&self) -> String {
                  self.0
                      .iter()
                      .map(ToString::to_string)
                      .collect::<Vec<_>>()
                      .join("\n")
              }
          }

          impl std::fmt::Display for ModuleCompileErrors {
              fn fmt(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {
                  write!(f, "{} module compiler error(s)", self.0.len())
              }
          }

          impl std::error::Error for ModuleCompileErrors {}

          #[derive(Debug, Clone)]
          pub struct ModuleProgram {
              binary_root: PathBuf,
              module_dir: PathBuf,
              modules: HashMap<PathBuf, Arc<ModuleFile>>,
          }

          impl ModuleProgram {
              pub fn load_default() -> Result<Self, ModuleCompileErrors> {
                  Self::load(&default_module_dir())
              }

              pub fn load(module_dir: &Path) -> Result<Self, ModuleCompileErrors> {
                  let binary_root = module_dir
                      .parent()
                      .map(Path::to_path_buf)
                      .unwrap_or_else(binary_dir);
                  let mut files = Vec::new();
                  if let Err(error) = collect_files(module_dir, "module", &mut files) {
                      return Err(ModuleCompileErrors(vec![ModuleCompileError {
                          code: "MOD1000",
                          path: module_dir.to_path_buf(),
                          line: 0,
                          column: 0,
                          message: format!("failed to scan module directory: {error}"),
                      }]));
                  }
                  files.sort();

                  let mut errors = Vec::new();
                  let mut modules = HashMap::new();
                  for path in files {
                      match load_one(&path) {
                          Ok(file) => {
                              validate_local(&path, &file, &mut errors);
                              modules.insert(normalize(&path), Arc::new(file));
                          }
                          Err(error) => errors.push(error),
                      }
                  }

                  let mut graph: HashMap<PathBuf, Vec<PathBuf>> = HashMap::new();
                  for (path, file) in &modules {
                      let mut dependencies = Vec::new();
                      for import in &file.imports {
                          if let Some(raw_path) = custom_import_path(import) {
                              let resolved = normalize(&resolve_custom_import(&binary_root, raw_path));
                              if modules.contains_key(&resolved) {
                                  dependencies.push(resolved);
                              } else {
                                  errors.push(ModuleCompileError {
                                      code: "MOD2001",
                                      path: path.clone(),
                                      line: 1,
                                      column: 1,
                                      message: format!(
                                          "module import {raw_path:?} resolves to missing file {}",
                                          resolved.display()
                                      ),
                                  });
                              }
                          }
                      }
                      graph.insert(path.clone(), dependencies);
                  }
                  detect_cycles(&graph, &mut errors);

                  if !errors.is_empty() {
                      return Err(ModuleCompileErrors(errors));
                  }

                  Ok(Self {
                      binary_root,
                      module_dir: module_dir.to_path_buf(),
                      modules,
                  })
              }

              pub fn len(&self) -> usize {
                  self.modules.len()
              }

              pub fn is_empty(&self) -> bool {
                  self.modules.is_empty()
              }

              pub fn module_dir(&self) -> &Path {
                  &self.module_dir
              }

              pub fn resolve(&self, raw_path: &str) -> Option<Arc<ModuleFile>> {
                  let path = normalize(&resolve_custom_import(&self.binary_root, raw_path));
                  self.modules.get(&path).cloned()
              }
          }

          fn load_one(path: &Path) -> Result<ModuleFile, ModuleCompileError> {
              let bytes = fs::read(path).map_err(|error| ModuleCompileError {
                  code: "MOD1001",
                  path: path.to_path_buf(),
                  line: 0,
                  column: 0,
                  message: format!("failed to read module: {error}"),
              })?;
              let source = String::from_utf8(bytes).map_err(|error| ModuleCompileError {
                  code: "MOD1002",
                  path: path.to_path_buf(),
                  line: 0,
                  column: 0,
                  message: format!("module is not valid UTF-8: {error}"),
              })?;
              let tokens = Lexer::new(&source).tokenize().map_err(|error| ModuleCompileError {
                  code: "MOD1100",
                  path: path.to_path_buf(),
                  line: error.line,
                  column: error.column,
                  message: error.message,
              })?;
              Parser::new(tokens)
                  .parse_module_file()
                  .map_err(|error| ModuleCompileError {
                      code: "MOD1200",
                      path: path.to_path_buf(),
                      line: error.line,
                      column: error.column,
                      message: error.message,
                  })
          }

          fn validate_local(path: &Path, file: &ModuleFile, errors: &mut Vec<ModuleCompileError>) {
              let mut functions = HashSet::new();
              for function in &file.functions {
                  if !functions.insert(function.name.clone()) {
                      errors.push(ModuleCompileError {
                          code: "MOD2002",
                          path: path.to_path_buf(),
                          line: 1,
                          column: 1,
                          message: format!("duplicate function {:?}", function.name),
                      });
                  }
              }

              let mut exports = HashSet::new();
              for export in &file.exports {
                  if !exports.insert(export.clone()) {
                      errors.push(ModuleCompileError {
                          code: "MOD2003",
                          path: path.to_path_buf(),
                          line: 1,
                          column: 1,
                          message: format!("duplicate export {export:?}"),
                      });
                  }
                  if !functions.contains(export) {
                      errors.push(ModuleCompileError {
                          code: "MOD2004",
                          path: path.to_path_buf(),
                          line: 1,
                          column: 1,
                          message: format!("export {export:?} has no function body"),
                      });
                  }
              }

              let mut bindings = HashSet::new();
              let mut sources = HashSet::new();
              for import in &file.imports {
                  let binding = binding_name(import);
                  if !bindings.insert(binding.clone()) {
                      errors.push(ModuleCompileError {
                          code: "MOD2005",
                          path: path.to_path_buf(),
                          line: 1,
                          column: 1,
                          message: format!("duplicate import binding {binding:?}"),
                      });
                  }
                  let source = import_source_key(import);
                  if !sources.insert(source.clone()) {
                      errors.push(ModuleCompileError {
                          code: "MOD2006",
                          path: path.to_path_buf(),
                          line: 1,
                          column: 1,
                          message: format!("duplicate import source {source:?}"),
                      });
                  }
              }
          }

          fn import_base(import: &ImportTarget) -> &ImportTarget {
              match import {
                  ImportTarget::Aliased { target, .. } => target.as_ref(),
                  other => other,
              }
          }

          fn custom_import_path(import: &ImportTarget) -> Option<&str> {
              match import_base(import) {
                  ImportTarget::Custom(path) | ImportTarget::CustomFunction { path, .. } => {
                      Some(path.as_str())
                  }
                  _ => None,
              }
          }

          fn import_source_key(import: &ImportTarget) -> String {
              match import_base(import) {
                  ImportTarget::Builtin(name) => format!("builtin:{name}"),
                  ImportTarget::BuiltinFunction { module, function } => {
                      format!("builtin:{module}.{function}")
                  }
                  ImportTarget::Custom(path) => format!("module:{path}"),
                  ImportTarget::CustomFunction { path, function } => {
                      format!("module:{path}.{function}")
                  }
                  ImportTarget::Aliased { .. } => unreachable!(),
              }
          }

          fn normalize(path: &Path) -> PathBuf {
              fs::canonicalize(path).unwrap_or_else(|_| path.to_path_buf())
          }

          #[derive(Clone, Copy, PartialEq, Eq)]
          enum VisitState {
              Visiting,
              Done,
          }

          fn detect_cycles(
              graph: &HashMap<PathBuf, Vec<PathBuf>>,
              errors: &mut Vec<ModuleCompileError>,
          ) {
              let mut states = HashMap::new();
              let mut stack = Vec::new();
              let mut reported = HashSet::new();
              for node in graph.keys() {
                  visit(node, graph, &mut states, &mut stack, &mut reported, errors);
              }
          }

          fn visit(
              node: &PathBuf,
              graph: &HashMap<PathBuf, Vec<PathBuf>>,
              states: &mut HashMap<PathBuf, VisitState>,
              stack: &mut Vec<PathBuf>,
              reported: &mut HashSet<String>,
              errors: &mut Vec<ModuleCompileError>,
          ) {
              match states.get(node) {
                  Some(VisitState::Done) => return,
                  Some(VisitState::Visiting) => {
                      let start = stack.iter().position(|item| item == node).unwrap_or(0);
                      let mut cycle = stack[start..].to_vec();
                      cycle.push(node.clone());
                      let rendered = cycle
                          .iter()
                          .map(|path| path.display().to_string())
                          .collect::<Vec<_>>()
                          .join(" -> ");
                      if reported.insert(rendered.clone()) {
                          errors.push(ModuleCompileError {
                              code: "MOD2007",
                              path: node.clone(),
                              line: 1,
                              column: 1,
                              message: format!("circular module dependency: {rendered}"),
                          });
                      }
                      return;
                  }
                  None => {}
              }

              states.insert(node.clone(), VisitState::Visiting);
              stack.push(node.clone());
              if let Some(dependencies) = graph.get(node) {
                  for dependency in dependencies {
                      visit(dependency, graph, states, stack, reported, errors);
                  }
              }
              stack.pop();
              states.insert(node.clone(), VisitState::Done);
          }

          #[cfg(test)]
          mod tests {
              use super::*;
              use std::sync::atomic::{AtomicU64, Ordering};
              use std::time::{SystemTime, UNIX_EPOCH};

              static NEXT: AtomicU64 = AtomicU64::new(0);

              fn root() -> PathBuf {
                  let nonce = SystemTime::now()
                      .duration_since(UNIX_EPOCH)
                      .unwrap_or_default()
                      .as_nanos();
                  let path = std::env::temp_dir().join(format!(
                      "rbe-module-test-{}-{nonce}-{}",
                      std::process::id(),
                      NEXT.fetch_add(1, Ordering::Relaxed)
                  ));
                  fs::create_dir_all(path.join("module")).unwrap();
                  path
              }

              #[test]
              fn loads_exports_and_dependencies() {
                  let root = root();
                  fs::write(
                      root.join("module/b.module"),
                      "export function twice(value) { return value * 2; }",
                  )
                  .unwrap();
                  fs::write(
                      root.join("module/a.module"),
                      ":import[module&b]\nfunction hidden() { return 1; }\nexport function run(value) { return value; }",
                  )
                  .unwrap();

                  let program = ModuleProgram::load(&root.join("module")).unwrap();
                  assert_eq!(program.len(), 2);
                  let a = program.resolve("./module/a").unwrap();
                  assert_eq!(a.exports, vec!["run"]);
                  assert_eq!(a.functions.len(), 2);
                  let _ = fs::remove_dir_all(root);
              }

              #[test]
              fn rejects_cycles_at_boot() {
                  let root = root();
                  fs::write(
                      root.join("module/a.module"),
                      ":import[module&b]\nexport function a() { return 1; }",
                  )
                  .unwrap();
                  fs::write(
                      root.join("module/b.module"),
                      ":import[module&a]\nexport function b() { return 1; }",
                  )
                  .unwrap();

                  let error = ModuleProgram::load(&root.join("module")).unwrap_err();
                  assert!(error.0.iter().any(|item| item.code == "MOD2007"));
                  let _ = fs::remove_dir_all(root);
              }
          }
          ''')

          lib = Path("crates/route-engine/src/lib.rs")
          source = lib.read_text()
          if "mod module_runtime;" not in source:
              source = source.replace("mod modules;\n", "mod modules;\nmod module_runtime;\n", 1)
          old = "pub use ast::{BinaryOp, Expr, FunctionDef, ImportTarget, MethodDef, RouteFile, Statement, Value};"
          new = "pub use ast::{BinaryOp, Expr, FunctionDef, ImportTarget, MethodDef, ModuleFile, RouteFile, Statement, Value};"
          if old in source:
              source = source.replace(old, new, 1)
          if "pub use module_runtime::" not in source:
              source = source.replace(
                  "pub use modules::{binding_name, route_capability_allowed, ModuleError, ModuleRegistry};\n",
                  "pub use modules::{binding_name, route_capability_allowed, ModuleError, ModuleRegistry};\npub use module_runtime::{ModuleCompileError, ModuleCompileErrors, ModuleProgram};\n",
                  1,
              )
          if "parses_module_exports" not in source:
              anchor = "    #[test]\n    fn parses_multiple_import_entries_and_aliases()"
              test = r'''    #[test]
              fn parses_module_exports() {
                  let tokens = Lexer::new(
                      r#":import[net]
                      function hidden(value) { return value; }
                      export async function visible(value) { return hidden(value); }"#,
                  )
                  .tokenize()
                  .expect("lex failed");
                  let file = Parser::new(tokens)
                      .parse_module_file()
                      .expect("module parse failed");
                  assert_eq!(file.functions.len(), 2);
                  assert_eq!(file.exports, vec!["visible"]);
              }

          '''
              if anchor not in source:
                  raise SystemExit("lib module test anchor missing")
              source = source.replace(anchor, test + anchor, 1)
          lib.write_text(source)

          discovery = Path("crates/route-engine/src/discovery.rs")
          source = discovery.read_text()
          if "ModuleProgram::load_default" not in source:
              anchor = '''pub fn build_routes(api_dir: &Path) -> anyhow::Result<Router<AppState>> {
              let mut files = Vec::new();'''
              replacement = '''pub fn build_routes(api_dir: &Path) -> anyhow::Result<Router<AppState>> {
              let module_program = crate::module_runtime::ModuleProgram::load_default()?;
              tracing::info!(
                  modules = module_program.len(),
                  module_dir = %module_program.module_dir().display(),
                  "validated .module files"
              );

              let mut files = Vec::new();'''
              if anchor not in source:
                  raise SystemExit("discovery build_routes anchor missing")
              source = source.replace(anchor, replacement, 1)
          discovery.write_text(source)
          PY
          rustfmt --edition 2021 \
            crates/route-engine/src/ast.rs \
            crates/route-engine/src/parser.rs \
            crates/route-engine/src/module_runtime.rs \
            crates/route-engine/src/lib.rs \
            crates/route-engine/src/discovery.rs
          git diff --check
          changed="$(git diff --name-only)"
          python - <<'PY'
          import subprocess
          allowed = {
              "engine/crates/route-engine/src/ast.rs",
              "engine/crates/route-engine/src/parser.rs",
              "engine/crates/route-engine/src/module_runtime.rs",
              "engine/crates/route-engine/src/lib.rs",
              "engine/crates/route-engine/src/discovery.rs",
              "crates/route-engine/src/ast.rs",
              "crates/route-engine/src/parser.rs",
              "crates/route-engine/src/module_runtime.rs",
              "crates/route-engine/src/lib.rs",
              "crates/route-engine/src/discovery.rs",
          }
          changed = set(subprocess.check_output(["git", "diff", "--name-only"], text=True).split())
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit("unexpected changed paths: " + ", ".join(sorted(unexpected)))
          PY
          if ! git diff --quiet; then
            git config user.name "Kate"
            git config user.email "dhwanksh2000@gmail.com"
            git add -- \
              crates/route-engine/src/ast.rs \
              crates/route-engine/src/parser.rs \
              crates/route-engine/src/module_runtime.rs \
              crates/route-engine/src/lib.rs \
              crates/route-engine/src/discovery.rs
            git commit -m "feat: compile module files at boot"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: format runtime slice
        shell: bash
        run: |
          rustfmt --edition 2021 --check \
            crates/service-runtime/src/lib.rs \
            crates/backend/src/service_boot.rs \
            crates/video-manager/src/lib.rs \
            crates/api/src/health.rs \
            crates/route-engine/src/ast.rs \
            crates/route-engine/src/parser.rs \
            crates/route-engine/src/module_runtime.rs \
            crates/route-engine/src/lib.rs \
            crates/route-engine/src/discovery.rs
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
