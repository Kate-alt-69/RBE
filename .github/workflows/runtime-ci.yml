name: Runtime CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  engine-runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: apply one-shot RestartPolicy fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("crates/service-runtime/src/lib.rs")
          source = path.read_text()
          old = '''#[derive(Debug, Clone, Copy, PartialEq, Eq, Serialize, Deserialize)]
          #[serde(rename_all = "kebab-case")]
          pub enum RestartPolicy {
              Always,
              OnFailure,
              Never,
          }

          impl Default for RestartPolicy {
              fn default() -> Self {
                  Self::OnFailure
              }
          }
          '''
          new = '''#[derive(Debug, Clone, Copy, PartialEq, Eq, Serialize, Deserialize, Default)]
          #[serde(rename_all = "kebab-case")]
          pub enum RestartPolicy {
              Always,
              #[default]
              OnFailure,
              Never,
          }
          '''
          if old in source:
              path.write_text(source.replace(old, new, 1))
          PY
          cargo fmt --all
          if ! git diff --quiet -- crates/service-runtime/src/lib.rs; then
            git config user.name "Kate"
            git config user.email "dhwanksh2000@gmail.com"
            git add crates/service-runtime/src/lib.rs
            git commit -m "fix: derive service restart default"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: format check
        run: cargo fmt --all -- --check
      - name: clippy
        id: clippy
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee ../clippy.log
      - name: upload clippy diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-clippy-log
          path: clippy.log
          if-no-files-found: error
      - name: test
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tee ../test.log
      - name: upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-test-log
          path: test.log
          if-no-files-found: error
      - name: enforce validation results
        if: steps.clippy.outcome == 'failure' || steps.tests.outcome == 'failure'
        run: exit 1
