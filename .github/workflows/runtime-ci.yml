name: Runtime CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  engine-runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: guard service restart ownership
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("crates/service-runtime/src/manager.rs")
          source = path.read_text()
          start = source.index("            match spawn_process(&file).await {", source.index("tokio::time::sleep(delay).await;"))
          end = source.index("\n        }\n    }\n\n    pub async fn call(", start)
          replacement = '''            let mut service = handle.lock().await;
              if self.shutting_down.load(Ordering::Acquire) {
                  return;
              }
              if !service.restarting {
                  tracing::debug!(
                      service = %file.name,
                      attempt,
                      "scheduled service restart was superseded"
                  );
                  continue;
              }

              let running_pid = if let Some(process) = service.process.as_mut() {
                  match process.child.try_wait() {
                      Ok(None) => process.child.id(),
                      Ok(Some(_)) => None,
                      Err(error) => {
                          tracing::warn!(
                              service = %file.name,
                              attempt,
                              error = %error,
                              "failed to re-check service before restart"
                          );
                          continue;
                      }
                  }
              } else {
                  None
              };
              if let Some(pid) = running_pid {
                  service.restarting = false;
                  tracing::debug!(
                      service = %file.name,
                      pid,
                      attempt,
                      "scheduled service restart found a running replacement"
                  );
                  continue;
              }

              match spawn_process(&file).await {
                  Ok(replacement) => {
                      let new_pid = replacement.ready.pid;
                      service.process = Some(replacement);
                      service.restart_attempts = attempt;
                      service.exit_observed = false;
                      service.restarting = false;
                      service.last_activity = Instant::now();
                      tracing::info!(
                          service = %file.name,
                          old_pid,
                          new_pid,
                          attempt,
                          "service process restarted"
                      );
                  }
                  Err(error) => {
                      service.restart_attempts = attempt;
                      service.restarting = true;
                      tracing::error!(
                          service = %file.name,
                          attempt,
                          error = %error,
                          "service restart attempt failed"
                      );
                  }
              }
          '''.replace('              ', '')
          path.write_text(source[:start] + replacement + source[end:])
          PY

          rustfmt --edition 2021 crates/service-runtime/src/manager.rs
          git diff --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked

          python - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(["git", "diff", "--name-only", "--relative"], text=True).split())
          allowed = {"crates/service-runtime/src/manager.rs"}
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit("unexpected restart-ownership paths: " + ", ".join(sorted(unexpected)))
          PY

          if ! git diff --quiet; then
            git config user.name "Kate"
            git config user.email "dhwanksh2000@gmail.com"
            git add -- crates/service-runtime/src/manager.rs
            git commit -m "fix: serialize hybrid service restarts"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
