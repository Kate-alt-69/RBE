name: REL Runtime Activation

on:
  push:
    paths:
      - '.github/patches/runtime-core-wire.py'
      - '.github/workflows/runtime-core-wire.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Apply REL HTTP wiring
        run: python .github/patches/http-rel-wire.py
      - name: Apply REL HTTP Clippy fixups
        run: python .github/patches/http-rel-fix.py
      - name: Apply Runtime Image activation
        run: python .github/patches/runtime-core-wire.py
      - name: Format workspace
        working-directory: engine
        run: cargo fmt --all
      - name: Check workspace
        working-directory: engine
        run: cargo check --workspace --locked
      - name: Test affected runtime crates
        working-directory: engine
        run: cargo test -p route-engine -p api -p backend -p service-runtime --locked
      - name: Clippy affected runtime crates
        working-directory: engine
        run: cargo clippy -p route-engine -p api -p backend -p service-runtime --all-targets --locked -- -D warnings
      - name: Commit successful Runtime Image activation
        shell: bash
        run: |
          rm -f \
            .github/patches/http-rel-wire.py \
            .github/patches/http-rel-fix.py \
            .github/workflows/http-rel-wire.yml \
            .github/patches/runtime-core-wire.py \
            .github/workflows/runtime-core-wire.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: activate Runtime Image and typed Runtime ENV"
          git push origin HEAD:main
