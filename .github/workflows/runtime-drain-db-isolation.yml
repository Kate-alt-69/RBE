name: One-shot public Error Code Book links

on:
  push:
    branches:
      - main
    paths:
      - .ci-runtime-drain-db-isolation-trigger

permissions:
  contents: write

jobs:
  validate-and-land:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Apply, validate and land DIAG-006
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python3 .github/patches/diag-public-help.py

          rustfmt --edition 2021 \
            engine/crates/route-engine/src/relc.rs \
            engine/crates/backend/src/error_code_book.rs \
            engine/crates/backend/src/service_main.rs \
            engine/crates/backend/src/service_mother.rs \
            engine/crates/backend/src/container_process.rs \
            engine/crates/backend/src/main.rs

          cd engine
          cargo check -p route-engine -p backend --all-targets --locked
          cargo test -p route-engine --locked
          cargo test -p backend --all-targets --locked error_code_book
          cargo test -p backend --all-targets --locked fallback_service_diagnostics_link_to_error_code_book
          cargo clippy -p route-engine -p backend --all-targets --locked -- -D warnings
          cd ..

          python3 -m json.tool doc/error-codes/catalog.json >/dev/null
          grep -q '"publicBaseUrl": "https://kastrick.vercel.app/project/rbe/doc/error-codes"' doc/error-codes/catalog.json
          grep -q 'https://kastrick.vercel.app/project/rbe/doc/error-codes/relc#relc3001' engine/crates/route-engine/src/relc.rs
          grep -q 'Online: {online}' engine/crates/backend/src/error_code_book.rs
          if grep -E 'doc/error-codes/(rel|relc|service|runtime|container)\.md#' \
            engine/crates/route-engine/src/relc.rs \
            engine/crates/backend/src/service_main.rs \
            engine/crates/backend/src/service_mother.rs \
            engine/crates/backend/src/container_process.rs \
            engine/crates/backend/src/main.rs; then
            echo 'user-facing runtime help still contains repository-local Error Code Book links' >&2
            exit 1
          fi

          rm -f \
            .ci-runtime-drain-db-isolation-trigger \
            .github/patches/runtime-drain-db-isolation.py \
            .github/patches/diag-public-help.py \
            .github/workflows/runtime-drain-db-isolation.yml

          git add -A
          git diff --cached --check
          git commit -m "FIX | BUG-DIAG-006 link runtime errors to public Error Code Book"

          git pull --rebase origin main
          git push origin HEAD:main
