name: Runtime Image capability identity

"on":
  push:
    branches: [main]
    paths:
      - '.github/patches/runtime-image-identity.py'
      - '.github/workflows/runtime-image-identity.yml'

permissions:
  contents: write

concurrency:
  group: runtime-image-identity
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            engine
            container-runtime
      - name: Apply Runtime Image identity repair
        shell: bash
        run: |
          set -euo pipefail
          # Revalidation intentionally runs on the current main after BUG-CI-006.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          python3 .github/patches/runtime-image-identity.py
          cargo fmt --manifest-path engine/Cargo.toml --all
      - name: Check Runtime Image consumers
        run: cargo check --manifest-path engine/Cargo.toml -p route-engine -p backend --all-targets --locked
      - name: Test Runtime Image linker
        run: cargo test --manifest-path engine/Cargo.toml -p route-engine --locked
      - name: Clippy Runtime Image consumers
        run: cargo clippy --manifest-path engine/Cargo.toml -p route-engine -p backend --all-targets --locked -- -D warnings
      - name: Test Capability Broker contract
        run: cargo test --manifest-path container-runtime/Cargo.toml -p container-runtime-core control_plane --locked
      - name: Verify identity invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'RBE_SOURCE_SET_V1' engine/crates/route-engine/src/runtime_image.rs
          grep -q 'RBE_RUNTIME_IMAGE_V3' engine/crates/route-engine/src/runtime_image.rs
          grep -q 'pub source_hash: String' engine/crates/route-engine/src/runtime_image.rs
          grep -q 'image_id: image_hash' engine/crates/route-engine/src/relc.rs
          grep -q 'value.len() != 64' container-runtime/crates/container-runtime-core/src/control_plane.rs
          if grep -q 'rbe-{image_hash:016x}' engine/crates/route-engine/src/relc.rs; then
            echo 'legacy 64-bit Runtime Image identity still present' >&2
            exit 1
          fi
      - name: Land validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/runtime-image-identity.yml
          git rm .github/patches/runtime-image-identity.py
          git add engine/crates/route-engine engine/crates/backend
          git commit -m "FIX | BUG-CAP-001 cryptographically bind Runtime Image identity"
          git fetch origin main
          base="$(git rev-parse HEAD~1)"
          current="$(git rev-parse origin/main)"
          if [ "$current" != "$base" ]; then
            git rebase origin/main
          fi
          git push origin HEAD:main
