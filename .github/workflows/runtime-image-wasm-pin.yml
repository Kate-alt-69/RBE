name: Runtime Image WASM artifact pinning

on:
  push:
    paths:
      - '.github/workflows/runtime-image-wasm-pin.yml'

permissions:
  contents: write

concurrency:
  group: runtime-image-wasm-pin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Apply Runtime Image WASM artifact pinning
        run: python .github/patches/runtime-image-wasm-pin.py

      - name: Format
        run: cargo fmt --manifest-path engine/Cargo.toml --all

      - name: Check route engine
        run: cargo check --manifest-path engine/Cargo.toml -p route-engine --locked

      - name: Test route engine Runtime Image contracts
        run: cargo test --manifest-path engine/Cargo.toml -p route-engine --locked

      - name: Clippy route engine
        run: cargo clippy --manifest-path engine/Cargo.toml -p route-engine --all-targets --locked -- -D warnings

      - name: Verify immutable artifact pinning
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'ROUTE_WASM_COMPILER_VERSION: u32 = 1' engine/crates/route-engine/src/wasm_compiler.rs
          grep -q 'route_wasm_artifacts: BTreeMap<SourceId, RouteWasmArtifact>' engine/crates/route-engine/src/runtime_image.rs
          grep -q 'route_wasm_fallbacks: BTreeMap<SourceId, String>' engine/crates/route-engine/src/runtime_image.rs
          grep -q 'feed_hash(&mut hash, &ROUTE_WASM_COMPILER_VERSION.to_be_bytes())' engine/crates/route-engine/src/runtime_image.rs
          grep -q 'match compile_route(file)' engine/crates/route-engine/src/relc.rs
          grep -q 'compiler_version' engine/crates/route-engine/src/cache.rs
          grep -q 'CACHE_MANIFEST_VERSION: u64 = 3' engine/crates/route-engine/src/cache.rs

      - name: Commit verified Runtime Image WASM pinning
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          latest="$(git rev-parse origin/main)"
          if [[ "$latest" != "$GITHUB_SHA" ]]; then
            echo "main moved during validation; refusing stale commit" >&2
            exit 75
          fi

          rm -f .github/patches/runtime-image-wasm-pin.py
          rm -f .github/workflows/runtime-image-wasm-pin.yml

          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'FIX | BUG-WASM-005 pin native route artifacts in Runtime Image'
          git push origin HEAD:main
