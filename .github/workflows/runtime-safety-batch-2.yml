name: Runtime Safety Batch 2

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: apply and validate runtime safety fixes
        shell: bash
        run: |
          python ../.github/patches/runtime-safety-batch-2.py
          rustfmt --edition 2021 \
            crates/video-manager/src/worker.rs \
            crates/core/src/video_language.rs \
            crates/backend/src/service_mother.rs
          git diff --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          python - <<'PY'
          import subprocess
          allowed = {
              "crates/video-manager/src/worker.rs",
              "crates/core/src/video_language.rs",
              "crates/backend/src/service_mother.rs",
          }
          changed = set(subprocess.check_output(
              ["git", "diff", "--name-only", "--relative"], text=True
          ).split())
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit(
                  "unexpected runtime safety batch paths: " + ", ".join(sorted(unexpected))
              )
          missing = allowed - changed
          if missing:
              raise SystemExit(
                  "expected runtime safety patch paths missing: " + ", ".join(sorted(missing))
              )
          PY

          git config user.name "Kate"
          git config user.email "dhwanksh2000@gmail.com"

          git add -- crates/video-manager/src/worker.rs
          git commit -m "FIX | BUG-VM-001 supervise Video Manager worker crashes"

          git add -- crates/core/src/video_language.rs
          git commit -m "FIX | BUG-VM-002 hide Video Manager database paths"

          git add -- crates/backend/src/service_mother.rs
          git commit -m "FIX | BUG-SVC-008 clean failed Service Mother processes"

          git push origin "HEAD:${GITHUB_REF_NAME}"
