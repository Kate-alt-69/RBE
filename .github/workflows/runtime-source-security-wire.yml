name: REL Runtime Source Security

on:
  push:
    paths:
      - '.github/patches/runtime-source-security-wire.py'
      - '.github/workflows/runtime-source-security-wire.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Apply Runtime Image base when needed
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'pub struct RuntimeHostCapabilities' engine/crates/route-engine/src/video_host.rs; then
            echo 'Runtime Image activation already present; skipping base patch.'
          else
            python .github/patches/http-rel-wire.py
            python .github/patches/http-rel-fix.py
            python .github/patches/runtime-core-wire.py
          fi

      - name: Apply source-integrity and immutable-execution hardening
        run: python .github/patches/runtime-source-security-wire.py

      - name: Format workspace
        working-directory: engine
        run: cargo fmt --all

      - name: Check workspace
        working-directory: engine
        run: cargo check --workspace --locked

      - name: Test affected runtime crates
        working-directory: engine
        run: cargo test -p route-engine -p api -p backend -p service-runtime --locked

      - name: Clippy affected runtime crates
        working-directory: engine
        run: cargo clippy -p route-engine -p api -p backend -p service-runtime --all-targets --locked -- -D warnings

      - name: Rebase source generation onto latest main if main moved
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
            exit 0
          fi

          echo 'main moved while the gate was validating; regenerating from latest main.'
          git reset --hard origin/main
          if grep -q 'pub struct RuntimeHostCapabilities' engine/crates/route-engine/src/video_host.rs; then
            echo 'Runtime Image activation already present on latest main.'
          else
            python .github/patches/http-rel-wire.py
            python .github/patches/http-rel-fix.py
            python .github/patches/runtime-core-wire.py
          fi
          python .github/patches/runtime-source-security-wire.py
          (cd engine && cargo fmt --all)
          (cd engine && cargo check --workspace --locked)
          (cd engine && cargo test -p route-engine -p api -p backend -p service-runtime --locked)
          (cd engine && cargo clippy -p route-engine -p api -p backend -p service-runtime --all-targets --locked -- -D warnings)

      - name: Commit verified Runtime Image security hardening
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/patches/http-rel-wire.py \
            .github/patches/http-rel-fix.py \
            .github/workflows/http-rel-wire.yml \
            .github/patches/runtime-core-wire.py \
            .github/workflows/runtime-core-wire.yml \
            .github/patches/runtime-source-security-wire.py \
            .github/workflows/runtime-source-security-wire.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'FIX | BUG-REL-TOCTOU pin REL execution to Runtime Image'
          git push origin HEAD:main
