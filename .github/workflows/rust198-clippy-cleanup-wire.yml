name: Rust 1.98 warning cleanup

"on":
  push:
    branches: [main]
    paths:
      - '.github/patches/rust198-clippy-cleanup.py'
      - '.github/workflows/rust198-clippy-cleanup-wire.yml'

permissions:
  contents: write

concurrency:
  group: rust198-clippy-cleanup-wire
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Apply cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          python3 .github/patches/rust198-clippy-cleanup.py
          cargo fmt --manifest-path engine/Cargo.toml --all
      - name: Check API crate
        run: cargo check --manifest-path engine/Cargo.toml -p api --all-targets --locked
      - name: Test API crate
        run: cargo test --manifest-path engine/Cargo.toml -p api --locked
      - name: Clippy API crate
        run: cargo clippy --manifest-path engine/Cargo.toml -p api --all-targets --locked -- -D warnings
      - name: Clippy engine workspace
        run: cargo clippy --manifest-path engine/Cargo.toml --workspace --all-targets --locked -- -D warnings
      - name: Land cleanup
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/rust198-clippy-cleanup-wire.yml
          git rm .github/patches/rust198-clippy-cleanup.py
          git add engine/crates/api
          git commit -m "FIX | BUG-CI-006 clear Rust 1.98 API warnings"
          git fetch origin main
          base="$(git rev-parse HEAD~1)"
          current="$(git rev-parse origin/main)"
          if [ "$current" != "$base" ]; then
            git rebase origin/main
          fi
          git push origin HEAD:main
