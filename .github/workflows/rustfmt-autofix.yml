name: Rustfmt Autofix

on:
  push:
    paths:
      - '.github/workflows/rustfmt-autofix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format and fast-forward live main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3 4; do
            git fetch origin +refs/heads/main:refs/remotes/origin/live-main
            git reset --hard refs/remotes/origin/live-main
            (cd engine && cargo fmt --all)

            if git diff --quiet; then
              echo 'No rustfmt changes required.'
              exit 0
            fi

            git add -u
            git commit -m 'FIX | OID-004 normalize workspace rustfmt'
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "main advanced during rustfmt attempt ${attempt}; retrying from the live tip"
          done

          echo 'Could not fast-forward formatted main after four attempts.' >&2
          exit 1
