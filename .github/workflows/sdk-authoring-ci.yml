name: SDK Authoring CI

on:
  push:
    branches:
      - main
    paths:
      - 'engine/crates/sdk-package/**'
      - 'engine/crates/rpx/**'
      - 'engine/crates/sdk-backend/**'
      - 'sdk/**'
      - 'build.ps1'
      - 'build.sh'
      - 'build-select.ps1'
      - 'build-select.sh'
      - '.github/workflows/sdk-authoring-ci.yml'
  pull_request:
    paths:
      - 'engine/crates/sdk-package/**'
      - 'engine/crates/rpx/**'
      - 'engine/crates/sdk-backend/**'
      - 'sdk/**'
      - 'build.ps1'
      - 'build.sh'
      - 'build-select.ps1'
      - 'build-select.sh'
      - '.github/workflows/sdk-authoring-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-authoring-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk-authoring:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format standalone SDK crates
        run: |
          cargo fmt --manifest-path engine/crates/sdk-package/Cargo.toml -- --check
          cargo fmt --manifest-path engine/crates/rpx/Cargo.toml -- --check
          cargo fmt --manifest-path engine/crates/sdk-backend/Cargo.toml -- --check
          cargo fmt --manifest-path sdk/rbe-sdk/Cargo.toml -- --check
      - name: Clippy standalone SDK crates
        run: |
          cargo clippy --manifest-path engine/crates/sdk-package/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path engine/crates/rpx/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path engine/crates/sdk-backend/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path sdk/rbe-sdk/Cargo.toml --all-targets -- -D warnings
      - name: Test standalone SDK crates
        run: |
          cargo test --manifest-path engine/crates/sdk-package/Cargo.toml
          cargo test --manifest-path engine/crates/rpx/Cargo.toml
          cargo test --manifest-path engine/crates/sdk-backend/Cargo.toml
          cargo test --manifest-path sdk/rbe-sdk/Cargo.toml
      - name: Smoke JavaScript advanced SDK surface
        run: |
          node --input-type=module <<'NODE'
          import { RbeSdk } from './sdk/js/index.js';

          const calls = [];
          const bridge = {
            call(request) {
              calls.push(request);
              if (request.operation.startsWith('fail')) throw new Error('expected smoke failure');
              return { operation: request.operation, unwind: [] };
            }
          };
          const sdk = new RbeSdk(bridge);
          sdk.capability('video:encode', 'encoder:gpu0').retarget('encoder:gpu1').call('submit', {});
          const advanced = sdk.advanced();
          const results = await advanced.batch([
            advanced.request('net:quic', 'peer:a', 'connect'),
            advanced.request('future:thing', 'thing:42', 'fail')
          ]);
          if (calls.length !== 3 || !results[0].ok || results[1].ok) process.exit(2);

          const events = [];
          const interceptor = (name) => ({
            before(request) {
              events.push(`${name}:before`);
              return { ...request, operation: `${request.operation}-${name}` };
            },
            after(request, reply) {
              events.push(`${name}:after`);
              return { ...reply, unwind: [...reply.unwind, name] };
            },
            onError(request, error) {
              events.push(`${name}:error`);
              return new Error(`${error.message}:${name}`);
            }
          });
          const hooked = sdk.intercept(interceptor('outer'), interceptor('inner'));
          const hookedReply = await hooked.capability('custom:hooks').call('hook', {});
          if (calls.at(-1).operation !== 'hook-outer-inner') process.exit(3);
          if (hookedReply.unwind.join(',') !== 'inner,outer') process.exit(4);
          if (events.join(',') !== 'outer:before,inner:before,inner:after,outer:after') process.exit(5);

          events.length = 0;
          try {
            await hooked.capability('custom:hooks').call('fail', {});
            process.exit(6);
          } catch (error) {
            if (error.message !== 'expected smoke failure:inner:outer') process.exit(7);
          }
          if (events.join(',') !== 'outer:before,inner:before,inner:error,outer:error') process.exit(8);
          NODE
      - name: Smoke Python advanced SDK surface
        env:
          PYTHONPATH: sdk/python
        run: |
          python3 <<'PY'
          from rbe_sdk import HostCall, HostInterceptor, RbeSdk

          class Bridge:
              def __init__(self):
                  self.calls = []

              def call(self, request):
                  self.calls.append(request)
                  if request.operation.startswith("fail"):
                      raise RuntimeError("expected smoke failure")
                  return request.operation

          bridge = Bridge()
          sdk = RbeSdk(bridge)
          sdk.capability("video:encode", "encoder:gpu0").retarget("encoder:gpu1").call("submit", {})
          advanced = sdk.advanced()
          results = advanced.batch((
              advanced.request("net:quic", "peer:a", "connect"),
              advanced.request("future:thing", "thing:42", "fail"),
          ))
          assert len(bridge.calls) == 3 and results[0].ok and not results[1].ok

          events = []

          class Trace(HostInterceptor):
              def __init__(self, name):
                  self.name = name

              def before(self, request):
                  events.append(f"{self.name}:before")
                  return HostCall(
                      request.capability,
                      request.target,
                      f"{request.operation}-{self.name}",
                      request.payload,
                  )

              def after(self, request, reply):
                  events.append(f"{self.name}:after")
                  return f"{reply}:{self.name}"

              def on_error(self, request, error):
                  events.append(f"{self.name}:error")
                  return RuntimeError(f"{error}:{self.name}")

          hooked = sdk.intercept(Trace("outer"), Trace("inner"))
          hooked_reply = hooked.capability("custom:hooks").call("hook", {})
          assert bridge.calls[-1].operation == "hook-outer-inner"
          assert hooked_reply == "hook-outer-inner:inner:outer"
          assert events == ["outer:before", "inner:before", "inner:after", "outer:after"]

          events.clear()
          try:
              hooked.capability("custom:hooks").call("fail", {})
              raise AssertionError("expected intercepted failure")
          except RuntimeError as error:
              assert str(error) == "expected smoke failure:inner:outer"
          assert events == ["outer:before", "inner:before", "inner:error", "outer:error"]
          PY
      - name: Smoke build complete SDK bundle
        run: ./build.sh --build-sdk --build-linux --arch-x64
      - name: Validate SDK bundle contents
        run: |
          test -x dist/x86_64-unknown-linux-gnu/sdk/backend
          test -x dist/x86_64-unknown-linux-gnu/sdk/rpx
          test -f dist/x86_64-unknown-linux-gnu/sdk/bindings/rust/Cargo.toml
          test -f dist/x86_64-unknown-linux-gnu/sdk/bindings/javascript/index.js
          test -f dist/x86_64-unknown-linux-gnu/sdk/bindings/typescript/index.d.ts
          test -f dist/x86_64-unknown-linux-gnu/sdk/bindings/python/pyproject.toml
      - name: Smoke RPX language compiler checks
        run: |
          RPX="$PWD/dist/x86_64-unknown-linux-gnu/sdk/rpx"
          SDK_BINDINGS="$PWD/dist/x86_64-unknown-linux-gnu/sdk/bindings"
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT

          mkdir -p "$TMP/js/components/hello" "$TMP/js/components/broken"
          cat > "$TMP/js/package.rbe.toml" <<'EOF'
          [package]
          name = "smoke-js"
          version = "1.0.0"
          language = "javascript"
          runtime = "node"
          EOF
          cat > "$TMP/js/components/hello/hello.js" <<'EOF'
          export function hello(name) { return `hi ${name}`; }
          EOF
          cat > "$TMP/js/components/broken/broken.js" <<'EOF'
          export function broken( { return true; }
          EOF

          "$RPX" compile "$TMP/js/components/hello" --allow-host-toolchain
          if "$RPX" compile "$TMP/js/components/broken" --allow-host-toolchain; then
            echo "RPX accepted invalid JavaScript" >&2
            exit 1
          fi

          mkdir -p "$TMP/python/components/hello" "$TMP/python/components/broken"
          cat > "$TMP/python/package.rbe.toml" <<'EOF'
          [package]
          name = "smoke-python"
          version = "1.0.0"
          language = "python"
          EOF
          cat > "$TMP/python/components/hello/hello.py" <<'EOF'
          def hello(name):
              return f"hi {name}"
          EOF
          cat > "$TMP/python/components/broken/broken.py" <<'EOF'
          def broken(:
              return True
          EOF

          "$RPX" compile "$TMP/python/components/hello" --allow-host-toolchain
          if "$RPX" compile "$TMP/python/components/broken" --allow-host-toolchain; then
            echo "RPX accepted invalid Python" >&2
            exit 1
          fi

          mkdir -p "$TMP/rust/components/hello" "$TMP/rust/components/broken" "$TMP/rust/.rbe/sdk"
          cp -R "$SDK_BINDINGS/rust" "$TMP/rust/.rbe/sdk/rust"
          cat > "$TMP/rust/package.rbe.toml" <<'EOF'
          [package]
          name = "smoke-rust"
          version = "1.0.0"
          language = "rust"
          EOF
          cat > "$TMP/rust/components/hello/hello.rs" <<'EOF'
          mod helper;

          pub fn hello(name: &str) -> String {
              helper::message(name)
          }
          EOF
          cat > "$TMP/rust/components/hello/helper.rs" <<'EOF'
          pub fn message(name: &str) -> String {
              format!("hi {name}")
          }
          EOF
          cat > "$TMP/rust/components/broken/broken.rs" <<'EOF'
          pub fn broken() -> bool {
              let value = ;
              value
          }
          EOF

          "$RPX" compile "$TMP/rust/components/hello" --allow-host-toolchain
          if "$RPX" compile "$TMP/rust/components/broken" --allow-host-toolchain; then
            echo "RPX accepted invalid Rust" >&2
            exit 1
          fi
      - name: Smoke build SDK backend only
        run: |
          rm -rf dist/x86_64-unknown-linux-gnu/sdk
          ./build.sh --build-sdk --only-backend --build-linux --arch-x64
          test -x dist/x86_64-unknown-linux-gnu/sdk/backend
          test ! -e dist/x86_64-unknown-linux-gnu/sdk/rpx
          test ! -d dist/x86_64-unknown-linux-gnu/sdk/bindings
