name: SDK Toolchain

on:
  push:
    branches:
      - main
    paths:
      - 'engine/crates/sdk-package/**'
      - 'engine/crates/rpx/**'
      - 'engine/crates/sdk-backend/**'
      - 'sdk/**'
      - 'build.ps1'
      - 'build.sh'
      - 'build-select.ps1'
      - 'build-select.sh'
      - '.github/workflows/sdk-toolchain.yml'
  pull_request:
    paths:
      - 'engine/crates/sdk-package/**'
      - 'engine/crates/rpx/**'
      - 'engine/crates/sdk-backend/**'
      - 'sdk/**'
      - 'build.ps1'
      - 'build.sh'
      - 'build-select.ps1'
      - 'build-select.sh'
      - '.github/workflows/sdk-toolchain.yml'
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-toolchain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format SDK crates
        run: |
          cargo fmt --manifest-path engine/crates/sdk-package/Cargo.toml -- --check
          cargo fmt --manifest-path engine/crates/rpx/Cargo.toml -- --check
          cargo fmt --manifest-path engine/crates/sdk-backend/Cargo.toml -- --check
      - name: Check SDK crates
        run: |
          cargo check --manifest-path engine/crates/sdk-package/Cargo.toml
          cargo check --manifest-path engine/crates/rpx/Cargo.toml
          cargo check --manifest-path engine/crates/sdk-backend/Cargo.toml
      - name: Clippy SDK crates
        run: |
          cargo clippy --manifest-path engine/crates/sdk-package/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path engine/crates/rpx/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path engine/crates/sdk-backend/Cargo.toml --all-targets -- -D warnings

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: rbe-sdk-linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: rbe-sdk-windows-x64
          - os: macos-13
            target: x86_64-apple-darwin
            artifact: rbe-sdk-macos-x64
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: rbe-sdk-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build SDK bundle (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          case '${{ matrix.target }}' in
            x86_64-unknown-linux-gnu) ./build.sh --build-sdk --build-linux --arch-x64 ;;
            x86_64-apple-darwin) ./build.sh --build-sdk --build-macos --arch-x64 ;;
            aarch64-apple-darwin) ./build.sh --build-sdk --build-macos --arch-arm64 ;;
            *) echo 'unsupported SDK target' >&2; exit 2 ;;
          esac
          tar -C 'dist/${{ matrix.target }}/sdk' -czf '${{ matrix.artifact }}.tar.gz' .
          shasum -a 256 '${{ matrix.artifact }}.tar.gz' > '${{ matrix.artifact }}.tar.gz.sha256'
      - name: Build SDK bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./build.ps1 --build-sdk --build-windows --arch-x64
          Compress-Archive -Path 'dist/${{ matrix.target }}/sdk/*' -DestinationPath '${{ matrix.artifact }}.zip' -Force
          $hash = (Get-FileHash '${{ matrix.artifact }}.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ${{ matrix.artifact }}.zip" | Set-Content '${{ matrix.artifact }}.zip.sha256' -Encoding ascii
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.tar.gz.sha256
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.zip.sha256
          if-no-files-found: error
          retention-days: 30

  publish-development-release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download SDK bundles
        uses: actions/download-artifact@v4
        with:
          path: sdk-assets
          merge-multiple: true

      - name: Validate release assets
        shell: bash
        run: |
          set -euo pipefail
          required=(
            rbe-sdk-linux-x64.tar.gz
            rbe-sdk-linux-x64.tar.gz.sha256
            rbe-sdk-windows-x64.zip
            rbe-sdk-windows-x64.zip.sha256
            rbe-sdk-macos-x64.tar.gz
            rbe-sdk-macos-x64.tar.gz.sha256
            rbe-sdk-macos-arm64.tar.gz
            rbe-sdk-macos-arm64.tar.gz.sha256
          )
          for asset in "${required[@]}"; do
            test -f "sdk-assets/$asset" || {
              echo "missing SDK release asset: $asset" >&2
              exit 1
            }
          done

      - name: Publish development SDK release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="sdk-v0.0.0-dev.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" \
            sdk-assets/rbe-sdk-linux-x64.tar.gz \
            sdk-assets/rbe-sdk-linux-x64.tar.gz.sha256 \
            sdk-assets/rbe-sdk-windows-x64.zip \
            sdk-assets/rbe-sdk-windows-x64.zip.sha256 \
            sdk-assets/rbe-sdk-macos-x64.tar.gz \
            sdk-assets/rbe-sdk-macos-x64.tar.gz.sha256 \
            sdk-assets/rbe-sdk-macos-arm64.tar.gz \
            sdk-assets/rbe-sdk-macos-arm64.tar.gz.sha256 \
            --target "$GITHUB_SHA" \
            --title "RBE SDK development ${tag#sdk-v}" \
            --notes "Automated development SDK bundle from RBE main at $GITHUB_SHA." \
            --prerelease
