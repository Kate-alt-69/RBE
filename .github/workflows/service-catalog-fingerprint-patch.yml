name: Service Catalog Fingerprint Patch

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: bind Service Mother to parent catalog contract
        shell: bash
        run: |
          python ../.github/patches/service-catalog-fingerprint.py
          cargo check
          rustfmt --edition 2021 --config skip_children=true crates/service-runtime/src/lib.rs
          rustfmt --edition 2021 crates/service-runtime/src/manager.rs crates/backend/src/service_mother.rs
          rustfmt --edition 2021 --config skip_children=true crates/backend/src/main.rs
          git diff --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          python - <<'PY'
          import subprocess
          allowed = {
              "Cargo.lock",
              "crates/service-runtime/Cargo.toml",
              "crates/service-runtime/src/lib.rs",
              "crates/service-runtime/src/manager.rs",
              "crates/backend/src/service_mother.rs",
              "crates/backend/src/main.rs",
          }
          changed = set(subprocess.check_output(
              ["git", "diff", "--name-only", "--relative"], text=True
          ).split())
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit("unexpected service catalog fingerprint paths: " + ", ".join(sorted(unexpected)))
          if not {"Cargo.lock", "crates/service-runtime/Cargo.toml"}.issubset(changed):
              raise SystemExit("service catalog fingerprint dependency/lockfile did not update")
          PY
          git config user.name "Kate"
          git config user.email "dhwanksh2000@gmail.com"
          git add -- \
            Cargo.lock \
            crates/service-runtime/Cargo.toml \
            crates/service-runtime/src/lib.rs \
            crates/service-runtime/src/manager.rs \
            crates/backend/src/service_mother.rs \
            crates/backend/src/main.rs
          git commit -m "FIX | BUG-SVC-022 bind Service Mother to validated catalog"
          git push origin "HEAD:${GITHUB_REF_NAME}"
