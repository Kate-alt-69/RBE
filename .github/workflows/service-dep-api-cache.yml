name: Service dep and API cache

on:
  push:
    paths:
      - '.github/workflows/service-dep-api-cache.yml'

permissions:
  contents: write

concurrency:
  group: service-dep-api-cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Apply Service dep and endpoint cache changes
        run: python .github/patches/service-dep-api-cache.py

      - name: Format
        run: cargo fmt --manifest-path engine/Cargo.toml --all

      - name: Check workspace
        run: cargo check --manifest-path engine/Cargo.toml --workspace --locked

      - name: Test affected runtime slices
        run: cargo test --manifest-path engine/Cargo.toml -p route-engine -p backend -p service-runtime --locked

      - name: Clippy affected runtime slices
        run: cargo clippy --manifest-path engine/Cargo.toml -p route-engine -p backend -p service-runtime --all-targets --locked -- -D warnings

      - name: Verify layout contracts
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'parent.join("dep").join(service_executable_name())' engine/crates/backend/src/service_mother.rs
          grep -q 'service_dest="$dep_dir/service"' build-core.sh
          grep -q 'Join-Path $depDir $serviceName' build.ps1
          grep -q 'Join-Path $serviceDepDir $serviceName' build-ps5.ps1
          grep -q 'join(".cache");' engine/crates/backend/src/main.rs
          grep -q 'join("api")' engine/crates/route-engine/src/cache.rs
          grep -q '"module.wasm"' engine/crates/route-engine/src/cache.rs

      - name: Commit verified runtime layout
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          latest="$(git rev-parse origin/main)"
          if [[ "$latest" != "$GITHUB_SHA" ]]; then
            echo "main moved during validation; refusing stale commit" >&2
            exit 75
          fi

          rm -f .github/patches/service-dep-api-cache.py
          rm -f .github/workflows/service-dep-api-cache.yml

          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'FIX | BUG-RUNTIME-003 move Service under dep and add endpoint WASM cache'
          git push origin HEAD:main
