name: Service Fabric Wiring

on:
  push:
    paths:
      - '.github/patches/service-fabric-wire.py'
      - '.github/patches/service-fabric-fix.py'
      - '.github/workflows/service-fabric-wire.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply Service Fabric wiring
        run: python .github/patches/service-fabric-wire.py
      - name: Apply compile fixups
        run: python .github/patches/service-fabric-fix.py
      - name: Format workspace
        working-directory: engine
        run: cargo fmt --all
      - name: Check workspace
        working-directory: engine
        run: cargo check --workspace
      - name: Test affected crates
        working-directory: engine
        run: cargo test -p service-runtime -p route-engine -p backend
      - name: Clippy affected crates
        working-directory: engine
        run: cargo clippy -p service-runtime -p route-engine -p backend --all-targets -- -D warnings
      - name: Commit successful wiring and remove one-shot files
        shell: bash
        run: |
          rm -f .github/patches/service-fabric-wire.py .github/patches/service-fabric-fix.py .github/workflows/service-fabric-wire.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: propagate authenticated Service Fabric calls"
          git push origin HEAD:main
