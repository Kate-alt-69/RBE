name: Service Health Patch

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: wire lifecycle health into snapshots
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          manager = Path("crates/service-runtime/src/manager.rs")
          source = manager.read_text()

          snapshot_struct_start = source.index("#[derive(Debug, Clone, Serialize)]\n#[serde(rename_all = \"camelCase\")]\npub struct ServiceSnapshot")
          snapshot_struct_end = source.index("\n#[derive(Debug, thiserror::Error)]", snapshot_struct_start)
          snapshot_struct = '''#[derive(Debug, Clone, Serialize)]
          #[serde(rename_all = "camelCase")]
          pub struct ServiceSnapshot {
              pub name: String,
              pub title: String,
              pub pid: Option<u32>,
              pub state: ServiceRuntimeState,
              pub mode: ServiceMode,
              pub restart: RestartPolicy,
              pub restart_attempts: u32,
              pub idle_timeout_ms: u64,
              pub ready: bool,
              pub health_checked: bool,
              #[serde(skip_serializing_if = "Option::is_none")]
              pub health: Option<Value>,
              #[serde(skip_serializing_if = "Option::is_none")]
              pub health_error: Option<String>,
          }
          '''.replace('          ', '')
          source = source[:snapshot_struct_start] + snapshot_struct.rstrip() + "\n" + source[snapshot_struct_end:]

          snapshot_start = source.index("    pub async fn snapshot(&self) -> Vec<ServiceSnapshot> {")
          shutdown_start = source.index("    pub async fn shutdown_all(&self) {", snapshot_start)
          snapshot_impl = '''    pub async fn snapshot(&self) -> Vec<ServiceSnapshot> {
              let handles = self
                  .services
                  .read()
                  .await
                  .values()
                  .cloned()
                  .collect::<Vec<_>>();
              let mut out = Vec::new();
              for handle in handles {
                  let (mut snapshot, health_target) = {
                      let mut service = handle.lock().await;
                      let restarting = service.restarting;
                      let wakeable = service.wakeable();
                      let exit_observed = service.exit_observed;
                      let restart = service.file.restart;
                      let (pid, state, health_target) = match service.process.as_mut() {
                          None if restarting => (None, ServiceRuntimeState::Restarting, None),
                          None if wakeable && !exit_observed => {
                              (None, ServiceRuntimeState::Dormant, None)
                          }
                          None => (None, ServiceRuntimeState::Stopped, None),
                          Some(process) => match process.child.try_wait() {
                              Ok(None) => (
                                  process.child.id(),
                                  ServiceRuntimeState::Running,
                                  Some((process.ready.address, process.token.clone())),
                              ),
                              Ok(Some(_)) if restarting => {
                                  (None, ServiceRuntimeState::Restarting, None)
                              }
                              Ok(Some(status))
                                  if exit_observed || !should_restart(restart, status.success()) =>
                              {
                                  (None, ServiceRuntimeState::Stopped, None)
                              }
                              Ok(Some(_)) => (None, ServiceRuntimeState::Restarting, None),
                              Err(_) => (None, ServiceRuntimeState::Unknown, None),
                          },
                      };
                      if health_target.is_some() {
                          service.active_calls = service.active_calls.saturating_add(1);
                      }
                      (
                          ServiceSnapshot {
                              name: service.file.name.clone(),
                              title: service.file.title.clone(),
                              pid,
                              state,
                              mode: service.file.mode,
                              restart: service.file.restart,
                              restart_attempts: service.restart_attempts,
                              idle_timeout_ms: service.file.idle_timeout_ms,
                              ready: state == ServiceRuntimeState::Dormant,
                              health_checked: false,
                              health: None,
                              health_error: None,
                          },
                          health_target,
                      )
                  };

                  if let Some((address, token)) = health_target {
                      snapshot.health_checked = true;
                      let response = rpc(address, ServiceRequest::Health { token }).await;
                      {
                          let mut service = handle.lock().await;
                          service.active_calls = service.active_calls.saturating_sub(1);
                      }
                      match response {
                          Ok(ServiceResponse::Ok { value }) => {
                              snapshot.ready = health_value_ready(&value);
                              snapshot.health = Some(value);
                          }
                          Ok(ServiceResponse::Error { code, message }) => {
                              snapshot.health_error = Some(format!("{code}: {message}"));
                          }
                          Err(error) => {
                              snapshot.health_error = Some(error.to_string());
                          }
                      }
                  }

                  out.push(snapshot);
              }
              out.sort_by(|left, right| left.name.cmp(&right.name));
              out
          }

          '''.replace('          ', '')
          source = source[:snapshot_start] + snapshot_impl + source[shutdown_start:]

          helper_anchor = "fn map_call_response(\n"
          helper_index = source.index(helper_anchor)
          health_helper = '''fn health_value_ready(value: &Value) -> bool {
              value.get("ok").and_then(Value::as_bool).unwrap_or(false)
          }

          '''.replace('          ', '')
          source = source[:helper_index] + health_helper + source[helper_index:]

          dormant_assert = '''        assert!(snapshots[0].pid.is_none());'''
          dormant_replacement = '''        assert!(snapshots[0].pid.is_none());
                  assert!(snapshots[0].ready);
                  assert!(!snapshots[0].health_checked);
                  assert!(snapshots[0].health.is_none());
                  assert!(snapshots[0].health_error.is_none());'''.replace('                  ', '')
          if dormant_assert not in source:
              raise SystemExit("dormant snapshot assertion anchor missing")
          source = source.replace(dormant_assert, dormant_replacement, 1)

          tests_end = source.rfind("\n}")
          health_test = '''

              #[test]
              fn health_value_requires_explicit_ok_true() {
                  assert!(health_value_ready(&serde_json::json!({"ok": true})));
                  assert!(!health_value_ready(&serde_json::json!({"ok": false})));
                  assert!(!health_value_ready(&serde_json::json!({})));
              }
          '''.replace('          ', '')
          source = source[:tests_end] + health_test + source[tests_end:]
          manager.write_text(source)

          health = Path("crates/api/src/health.rs")
          health.write_text('''use axum::extract::State;
          use axum::routing::get;
          use axum::{Json, Router};
          use core_lib::AppState;
          use serde_json::{json, Value};
          use service_runtime::ServiceRuntimeState;
          use supervisor::BackendState;

          pub fn routes() -> Router<AppState> {
              Router::new().route("/health", get(health))
          }

          async fn health(State(state): State<AppState>) -> Json<Value> {
              let lifecycle = state.backend_state();
              let services = state.services.snapshot().await;
              let running_services = services
                  .iter()
                  .filter(|service| service.state == ServiceRuntimeState::Running)
                  .count();
              let dormant_services = services
                  .iter()
                  .filter(|service| service.state == ServiceRuntimeState::Dormant)
                  .count();
              let restarting_services = services
                  .iter()
                  .filter(|service| service.state == ServiceRuntimeState::Restarting)
                  .count();
              let stopped_services = services
                  .iter()
                  .filter(|service| service.state == ServiceRuntimeState::Stopped)
                  .count();
              let unknown_services = services
                  .iter()
                  .filter(|service| service.state == ServiceRuntimeState::Unknown)
                  .count();
              let ready_services = services.iter().filter(|service| service.ready).count();
              let unhealthy_services = services
                  .iter()
                  .filter(|service| service.health_checked && !service.ready)
                  .count();
              let services_ok = ready_services == services.len();

              let (video_ok, video_status) = match state.video_manager.as_ref() {
                  Some(manager) => match manager.status() {
                      Ok(status) => (status.ok, json!(status)),
                      Err(error) => (
                          false,
                          json!({
                              "ok": false,
                              "error": error.to_string()
                          }),
                      ),
                  },
                  None => (true, json!({ "enabled": false })),
              };

              let lifecycle_ok = matches!(lifecycle, BackendState::Ready | BackendState::Running);
              Json(json!({
                  "ok": lifecycle_ok && services_ok && video_ok,
                  "state": lifecycle,
                  "services": {
                      "ok": services_ok,
                      "ready": ready_services,
                      "running": running_services,
                      "dormant": dormant_services,
                      "unhealthy": unhealthy_services,
                      "restarting": restarting_services,
                      "stopped": stopped_services,
                      "unknown": unknown_services,
                      "total": services.len(),
                      "entries": services
                  },
                  "videoManager": video_status
              }))
          }
          '''.replace('          ', ''))
          PY

          rustfmt --edition 2021 \
            crates/service-runtime/src/manager.rs \
            crates/api/src/health.rs
          git diff --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked

          python - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(["git", "diff", "--name-only", "--relative"], text=True).split())
          allowed = {
              "crates/service-runtime/src/manager.rs",
              "crates/api/src/health.rs",
          }
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit("unexpected service health paths: " + ", ".join(sorted(unexpected)))
          PY

          if ! git diff --quiet; then
            git config user.name "Kate"
            git config user.email "dhwanksh2000@gmail.com"
            git add -- \
              crates/service-runtime/src/manager.rs \
              crates/api/src/health.rs
            git commit -m "feat: surface service lifecycle health"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
