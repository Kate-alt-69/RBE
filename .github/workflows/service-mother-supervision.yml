name: Service Mother Supervision

on:
  push:
    branches:
      - codex/service-runtime-video-manager
    paths:
      - .ci-service-mother-supervision-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: supervise Service Mother process
        shell: bash
        run: |
          set -euo pipefail
          python ../.github/patches/service-mother-supervision.py
          rustfmt --edition 2021 --config skip_children=true \
            crates/service-runtime/src/manager.rs \
            crates/service-runtime/src/mother.rs
          rustfmt --edition 2021 crates/backend/src/service_mother.rs
          git diff --check
          cargo test -p service-runtime --locked
          cargo test -p backend --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          python - <<'PY'
          import subprocess
          allowed = {
              "crates/service-runtime/src/manager.rs",
              "crates/service-runtime/src/mother.rs",
              "crates/backend/src/service_mother.rs",
          }
          changed = set(subprocess.check_output(["git", "diff", "--name-only", "--relative"], text=True).split())
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit("unexpected Service Mother supervision paths: " + ", ".join(sorted(unexpected)))
          PY
          git config user.name "Kate"
          git config user.email "dhwanksh2000@gmail.com"
          git add -- \
            crates/service-runtime/src/manager.rs \
            crates/service-runtime/src/mother.rs \
            crates/backend/src/service_mother.rs
          git commit -m "FIX | BUG-SVC-007 supervise Service Mother crashes"
          git push origin "HEAD:${GITHUB_REF_NAME}"
