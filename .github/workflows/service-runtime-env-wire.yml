name: Service Runtime ENV Snapshot

on:
  push:
    paths:
      - '.github/patches/service-runtime-env-wire.py'
      - '.github/patches/runtime-source-security-fix.py'
      - '.github/patches/runtime-policy-wire.py'
      - '.github/patches/runtime-launch-hardening-wire.py'
      - '.github/patches/runtime-security-docs-wire.py'
      - '.github/patches/middleware-runtime-wire.py'
      - '.github/workflows/service-runtime-env-wire.yml'

permissions:
  contents: write

concurrency:
  group: rel-runtime-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wire:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Materialize prerequisite runtime state
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q 'pub struct RuntimeHostCapabilities' engine/crates/route-engine/src/video_host.rs; then
            python .github/patches/http-rel-wire.py
            python .github/patches/http-rel-fix.py
            python .github/patches/runtime-core-wire.py
          fi
          if ! grep -q 'pub enum RuntimeExecutable' engine/crates/route-engine/src/runtime_image.rs; then
            python .github/patches/runtime-source-security-wire.py
          fi
          if ! grep -q 'pub route_path: Option<String>' engine/crates/route-engine/src/runtime_image.rs; then
            python .github/patches/runtime-source-security-fix.py
          fi

      - name: Apply Service Runtime ENV propagation
        run: python .github/patches/service-runtime-env-wire.py

      - name: Apply Runtime Image server policy admission
        run: python .github/patches/runtime-policy-wire.py

      - name: Apply launch environment hardening
        run: python .github/patches/runtime-launch-hardening-wire.py

      - name: Apply native MiddlewarePlan runtime wiring
        run: python .github/patches/middleware-runtime-wire.py

      - name: Apply source security documentation
        run: python .github/patches/runtime-security-docs-wire.py

      - name: Format workspace
        working-directory: engine
        run: cargo fmt --all

      - name: Check workspace
        working-directory: engine
        run: cargo check --workspace --locked

      - name: Test runtime slices
        working-directory: engine
        run: cargo test -p route-engine -p service-runtime -p backend -p api --locked

      - name: Clippy runtime slices
        working-directory: engine
        run: cargo clippy -p route-engine -p service-runtime -p backend -p api --all-targets --locked -- -D warnings

      - name: Regenerate and revalidate if main moved
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
            exit 0
          fi

          echo 'main moved while validating; regenerating REL runtime from latest main.'
          git reset --hard origin/main
          if ! grep -q 'pub struct RuntimeHostCapabilities' engine/crates/route-engine/src/video_host.rs; then
            python .github/patches/http-rel-wire.py
            python .github/patches/http-rel-fix.py
            python .github/patches/runtime-core-wire.py
          fi
          if ! grep -q 'pub enum RuntimeExecutable' engine/crates/route-engine/src/runtime_image.rs; then
            python .github/patches/runtime-source-security-wire.py
          fi
          if ! grep -q 'pub route_path: Option<String>' engine/crates/route-engine/src/runtime_image.rs; then
            python .github/patches/runtime-source-security-fix.py
          fi
          if ! grep -q 'ImageSnapshot' engine/crates/route-engine/src/runtime_env.rs; then
            python .github/patches/service-runtime-env-wire.py
          fi
          if ! grep -q 'async fn server_status_gate' engine/crates/api/src/lib.rs; then
            python .github/patches/runtime-policy-wire.py
          fi
          if ! grep -q 'fn resolve_settings_path()' engine/crates/backend/src/main.rs; then
            python .github/patches/runtime-launch-hardening-wire.py
          fi
          if ! grep -q 'apply_middleware_plan' engine/crates/backend/src/runtime_image_boot.rs; then
            python .github/patches/middleware-runtime-wire.py
          fi
          if [ ! -f doc/source-security.md ]; then
            python .github/patches/runtime-security-docs-wire.py
          fi
          (cd engine && cargo fmt --all)
          (cd engine && cargo check --workspace --locked)
          (cd engine && cargo test -p route-engine -p service-runtime -p backend -p api --locked)
          (cd engine && cargo clippy -p route-engine -p service-runtime -p backend -p api --all-targets --locked -- -D warnings)

      - name: Commit verified REL runtime activation
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/patches/http-rel-wire.py \
            .github/patches/http-rel-fix.py \
            .github/workflows/http-rel-wire.yml \
            .github/patches/runtime-core-wire.py \
            .github/workflows/runtime-core-wire.yml \
            .github/patches/runtime-source-security-wire.py \
            .github/patches/runtime-source-security-fix.py \
            .github/workflows/runtime-source-security-wire.yml \
            .github/patches/service-runtime-env-wire.py \
            .github/patches/runtime-policy-wire.py \
            .github/patches/runtime-launch-hardening-wire.py \
            .github/patches/middleware-runtime-wire.py \
            .github/patches/runtime-security-docs-wire.py \
            .github/workflows/service-runtime-env-wire.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'FIX | BUG-REL-ENV-001 pin Runtime Image execution and Service ENV'
          git push origin HEAD:main
