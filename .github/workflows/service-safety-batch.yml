name: Service Safety Batch

on:
  push:
    branches:
      - codex/service-runtime-video-manager
    paths:
      - .ci-service-safety-batch-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: apply guarded service safety fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Kate"
          git config user.email "dhwanksh2000@gmail.com"

          format_service_runtime() {
            rustfmt --edition 2021 --config skip_children=true \
              crates/service-runtime/src/lib.rs \
              crates/service-runtime/src/manager.rs \
              crates/service-runtime/src/mother.rs
          }

          # 1) Parent-death propagation for backend -> Service Mother -> workers.
          python ../.github/patches/service-safety-batch.py process-tree
          format_service_runtime
          rustfmt --edition 2021 crates/backend/src/service_mother.rs
          cargo test -p service-runtime --locked
          cargo check -p backend --locked
          git diff --check
          git add -- \
            crates/service-runtime/src/lib.rs \
            crates/service-runtime/src/manager.rs \
            crates/backend/src/service_mother.rs
          git commit -m "FIX | BUG-SVC-002 stop orphaned service process trees"

          # 2) Individual service IPC must not be wedged/crashed by malformed frames.
          python ../.github/patches/service-safety-batch.py service-ipc
          format_service_runtime
          cargo test -p service-runtime --locked
          git diff --check
          git add -- \
            crates/service-runtime/src/lib.rs \
            crates/service-runtime/src/manager.rs
          git commit -m "FIX | BUG-SVC-003 bound and isolate service IPC frames"

          # 3) Bound Service Mother connection pressure and RPC stalls.
          python ../.github/patches/service-safety-batch.py mother-ipc
          format_service_runtime
          cargo test -p service-runtime --locked
          git diff --check
          git add -- crates/service-runtime/src/mother.rs
          git commit -m "FIX | BUG-SVC-004 bound Service Mother RPC pressure"

          # 4) Child readiness must match the actual local process we spawned.
          python ../.github/patches/service-safety-batch.py readiness
          format_service_runtime
          rustfmt --edition 2021 crates/backend/src/service_mother.rs
          cargo test -p service-runtime --locked
          cargo check -p backend --locked
          git diff --check
          git add -- \
            crates/service-runtime/src/manager.rs \
            crates/backend/src/service_mother.rs
          git commit -m "FIX | BUG-SVC-005 verify service readiness identity"

          # 5) Health snapshots should not serialize N independent service RPCs.
          python ../.github/patches/service-safety-batch.py snapshots
          format_service_runtime
          cargo test -p service-runtime --locked
          git diff --check
          git add -- crates/service-runtime/src/manager.rs
          git commit -m "FIX | BUG-SVC-006 parallelize service health snapshots"

          # Final locked workspace gate for the entire commit stack.
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          git diff --check
          if ! git diff --quiet; then
            echo "unexpected unstaged changes after service safety batch" >&2
            git diff --name-only >&2
            exit 1
          fi
          git push origin "HEAD:${GITHUB_REF_NAME}"
