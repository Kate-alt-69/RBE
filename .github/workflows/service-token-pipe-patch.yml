name: Service Token Pipe Patch

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: move service authentication off process arguments
        shell: bash
        run: |
          python ../.github/patches/service-token-pipe.py
          rustfmt --edition 2021 --config skip_children=true crates/service-runtime/src/lib.rs
          rustfmt --edition 2021 \
            crates/service-runtime/src/manager.rs \
            crates/backend/src/service_boot.rs \
            crates/backend/src/service_mother.rs
          git diff --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          python - <<'PY'
          import subprocess
          allowed = {
              "crates/service-runtime/src/lib.rs",
              "crates/service-runtime/src/manager.rs",
              "crates/backend/src/service_boot.rs",
              "crates/backend/src/service_mother.rs",
          }
          changed = set(subprocess.check_output(
              ["git", "diff", "--name-only", "--relative"], text=True
          ).split())
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit("unexpected service token pipe paths: " + ", ".join(sorted(unexpected)))
          if not changed:
              raise SystemExit("service token pipe patch produced no source changes")
          PY
          git config user.name "Kate"
          git config user.email "dhwanksh2000@gmail.com"
          git add -- \
            crates/service-runtime/src/lib.rs \
            crates/service-runtime/src/manager.rs \
            crates/backend/src/service_boot.rs \
            crates/backend/src/service_mother.rs
          git commit -m "FIX | BUG-SVC-021 hide service auth tokens from process args"
          git push origin "HEAD:${GITHUB_REF_NAME}"
