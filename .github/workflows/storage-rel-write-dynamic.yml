name: One-shot dynamic REL Storage write

on:
  push:
    branches:
      - main
    paths:
      - .ci-storage-rel-write-dynamic-trigger

permissions:
  contents: write

jobs:
  storage-rel-write-dynamic:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Apply dynamic Storage write lowering
        run: python3 .github/patches/storage-rel-write-dynamic.py

      - name: Format route-engine
        run: cargo fmt --manifest-path engine/Cargo.toml -p route-engine

      - name: Diff check
        run: git diff --check

      - name: Test dynamic Storage write payload
        run: cargo test --manifest-path engine/Cargo.toml -p route-engine --locked linked_module_storage_write_accepts_dynamic_request_body

      - name: Test static Storage write regression
        run: cargo test --manifest-path engine/Cargo.toml -p route-engine --locked linked_module_storage_write_lowers_descriptors_for_trusted_boundary

      - name: Test route-engine
        run: cargo test --manifest-path engine/Cargo.toml -p route-engine --locked

      - name: Clippy route-engine
        run: cargo clippy --manifest-path engine/Cargo.toml -p route-engine --all-targets --locked -- -D warnings

      - name: Commit BUG-STO-004
        run: |
          rm -f \
            .ci-storage-rel-write-dynamic-trigger \
            .github/patches/storage-rel-write-dynamic.py \
            .github/workflows/storage-rel-write-dynamic.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "FIX | BUG-STO-004 build dynamic Storage write payloads in Route-WASM"
          git pull --rebase origin main
          git push origin HEAD:main
