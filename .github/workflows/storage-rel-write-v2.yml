name: One-shot capability-bound REL Storage write

on:
  push:
    branches:
      - main
    paths:
      - .ci-storage-rel-write-v2-trigger

permissions:
  contents: write

jobs:
  storage-rel-write-v2:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Apply capability-bound REL Storage write lowering
        run: |
          python3 .github/patches/storage-rel-write-v2-fix.py
          python3 .github/patches/storage-rel-write-v2.py

      - name: Format route-engine
        run: cargo fmt --manifest-path engine/Cargo.toml -p route-engine

      - name: Diff check
        run: git diff --check

      - name: Test symbolic project path lexer
        run: cargo test --manifest-path engine/Cargo.toml -p route-engine --locked project_root_path_stays_symbolic

      - name: Test descriptor parser semantics
        run: cargo test --manifest-path engine/Cargo.toml -p route-engine --locked parses_storage_write_descriptor_syntax_without_global_write_rewrite

      - name: Test native Storage write lowering
        run: cargo test --manifest-path engine/Cargo.toml -p route-engine --locked linked_module_storage_write_lowers_descriptors_for_trusted_boundary

      - name: Test route-engine
        run: cargo test --manifest-path engine/Cargo.toml -p route-engine --locked

      - name: Clippy route-engine
        run: cargo clippy --manifest-path engine/Cargo.toml -p route-engine --all-targets --locked -- -D warnings

      - name: Commit BUG-STO-003
        run: |
          rm -f \
            .ci-storage-rel-write-v1-trigger \
            .ci-storage-rel-write-v2-trigger \
            .github/patches/storage-rel-write-v1.py \
            .github/patches/storage-rel-write-v1-fix.py \
            .github/patches/storage-rel-write-v2.py \
            .github/patches/storage-rel-write-v2-fix.py \
            .github/workflows/storage-rel-write-v1.yml \
            .github/workflows/storage-rel-write-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "FIX | BUG-STO-003 lower capability-bound REL Storage write"
          git pull --rebase origin main
          git push origin HEAD:main
