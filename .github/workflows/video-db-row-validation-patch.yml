name: Video DB Row Validation Patch

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: validate persisted Video Manager job and variant rows
        shell: bash
        run: |
          python ../.github/patches/video-db-row-validation.py
          rustfmt --edition 2021 --config skip_children=true crates/video-manager/src/lib.rs
          git diff --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          python - <<'PY'
          import subprocess
          allowed = {"crates/video-manager/src/lib.rs"}
          changed = set(subprocess.check_output(["git", "diff", "--name-only", "--relative"], text=True).split())
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit("unexpected persisted-media validation paths: " + ", ".join(sorted(unexpected)))
          PY
          if ! git diff --quiet; then
            git config user.name "Kate"
            git config user.email "dhwanksh2000@gmail.com"
            git add -- crates/video-manager/src/lib.rs
            git commit -m "FIX | BUG-VM-002 fail closed on corrupted media rows"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
