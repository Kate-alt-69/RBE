name: Video Download Target Patch

on:
  push:
    branches:
      - codex/service-runtime-video-manager
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/service-runtime-video-manager
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Wire guarded download target validation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("engine/crates/video-manager/src/lib.rs")
          text = path.read_text()

          module_anchor = "use std::collections::HashMap;\n"
          module_block = """mod download;

pub use download::{
    is_public_download_ip, parse_download_target, resolve_download_target, DownloadTarget,
    ResolvedDownloadTarget,
};

use std::collections::HashMap;
"""
          if "mod download;" not in text:
              if module_anchor not in text:
                  raise SystemExit("video download module anchor missing")
              text = text.replace(module_anchor, module_block, 1)

          old_guard = """        if !request.url.starts_with(\"https://\") {
            anyhow::bail!(\"Video Manager downloads currently require an https:// URL\");
        }
        let database_selection = request.database.clone();
"""
          new_guard = """        let target = parse_download_target(&request.url)?;
        let database_selection = request.database.clone();
"""
          if old_guard in text:
              text = text.replace(old_guard, new_guard, 1)
          elif new_guard not in text:
              raise SystemExit("video queue URL guard anchor missing")

          old_source = "            source_uri: Some(request.url),\n"
          new_source = "            source_uri: Some(target.normalized_url().to_string()),\n"
          if old_source in text:
              text = text.replace(old_source, new_source, 1)
          elif new_source not in text:
              raise SystemExit("video queue source URI anchor missing")

          old_test_url = '                url: "https://example.invalid/avatar.mp4".into(),\n'
          new_test_url = '                url: "HTTPS://Example.INVALID:443/avatar.mp4".into(),\n'
          if old_test_url in text:
              text = text.replace(old_test_url, new_test_url, 1)
          elif new_test_url not in text:
              raise SystemExit("video queue normalization test anchor missing")

          state_assert = "        assert_eq!(queued.asset.state, VideoAssetState::Quarantined);\n"
          source_assert = """        assert_eq!(queued.asset.state, VideoAssetState::Quarantined);
        assert_eq!(
            queued.asset.source_uri.as_deref(),
            Some(\"https://example.invalid/avatar.mp4\")
        );
"""
          if "Some(\"https://example.invalid/avatar.mp4\")" not in text:
              if state_assert not in text:
                  raise SystemExit("video queue source assertion anchor missing")
              text = text.replace(state_assert, source_assert, 1)

          path.write_text(text)
          PY
      - name: Format changed Video Manager slice
        working-directory: engine
        run: rustfmt --edition 2021 crates/video-manager/src/lib.rs crates/video-manager/src/download.rs
      - name: Clippy workspace
        working-directory: engine
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test workspace
        working-directory: engine
        run: cargo test --workspace --locked
      - name: Commit validated source
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -vE '^engine/crates/video-manager/src/(lib|download)\.rs$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected changed paths:"
            printf '%s\n' "$unexpected"
            exit 1
          fi
          if git diff --quiet; then
            echo "No semantic source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/crates/video-manager/src/lib.rs engine/crates/video-manager/src/download.rs
          git commit -m "feat: validate video download targets"
          git push origin HEAD:codex/service-runtime-video-manager
