name: Video Hardware Probe Patch

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: verify advertised FFmpeg hardware encoders
        shell: bash
        run: |
          (cd .. && python .github/patches/video-hardware-probe.py)
          rustfmt --edition 2021 crates/video-manager/src/ffmpeg_capabilities.rs
          git diff --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          python - <<'PY'
          import subprocess
          allowed = {
              "crates/video-manager/src/ffmpeg_capabilities.rs",
              "crates/backend/src/main.rs",
              "../docs/video-manager.md",
          }
          changed = set(subprocess.check_output(["git", "diff", "--name-only", "--relative"], text=True).split())
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit("unexpected hardware-probe paths: " + ", ".join(sorted(unexpected)))
          PY
          if ! git diff --quiet; then
            git config user.name "Kate"
            git config user.email "dhwanksh2000@gmail.com"
            git add -- \
              crates/video-manager/src/ffmpeg_capabilities.rs \
              crates/backend/src/main.rs \
              ../docs/video-manager.md
            git commit -m "feat: verify FFmpeg hardware encoders"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
