name: Video Hardware Selection Patch

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: select verified FFmpeg hardware encoder
        shell: bash
        run: |
          python ../.github/patches/video-hardware-selection.py
          rustfmt --edition 2021 \
            crates/video-manager/src/ffmpeg.rs \
            crates/video-manager/src/ffmpeg_capabilities.rs \
            crates/video-manager/src/pipeline.rs \
            crates/video-manager/src/normalization.rs \
            crates/video-manager/src/lib.rs \
            crates/video-manager/src/worker.rs \
            crates/backend/src/main.rs
          git diff --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          # rustfmt on backend/main.rs recursively visits child modules under
          # Rust 1.98. Discard those formatter-only diffs before enforcing the
          # semantic allowlist; they are unrelated to this feature.
          git checkout -- \
            crates/backend/src/error_reporter_daemon.rs \
            crates/backend/src/maintenance_notice.rs
          python - <<'PY'
          import subprocess
          allowed = {
              "crates/video-manager/src/ffmpeg.rs",
              "crates/video-manager/src/ffmpeg_capabilities.rs",
              "crates/video-manager/src/pipeline.rs",
              "crates/video-manager/src/normalization.rs",
              "crates/video-manager/src/lib.rs",
              "crates/video-manager/src/worker.rs",
              "crates/backend/src/main.rs",
          }
          changed = set(subprocess.check_output(["git", "diff", "--name-only", "--relative"], text=True).split())
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit("unexpected Video Manager hardware-selection paths: " + ", ".join(sorted(unexpected)))
          PY
          if ! git diff --quiet; then
            git config user.name "Kate"
            git config user.email "dhwanksh2000@gmail.com"
            git add -- \
              crates/video-manager/src/ffmpeg.rs \
              crates/video-manager/src/ffmpeg_capabilities.rs \
              crates/video-manager/src/pipeline.rs \
              crates/video-manager/src/normalization.rs \
              crates/video-manager/src/lib.rs \
              crates/video-manager/src/worker.rs \
              crates/backend/src/main.rs
            git commit -m "feat: use verified video hardware encoders"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
