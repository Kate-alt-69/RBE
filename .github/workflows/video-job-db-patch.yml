name: Video Job DB Patch

on:
  push:
    branches:
      - codex/service-runtime-video-manager
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/service-runtime-video-manager
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Add atomic Video Manager job database state
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("engine/crates/video-manager/src/lib.rs")
          text = path.read_text()

          trait_old = "    fn insert_job(&self, job: &VideoJob) -> anyhow::Result<()>;\n    fn get_asset(&self, database: &str, asset_id: &str) -> anyhow::Result<Option<VideoAsset>>;\n"
          trait_new = "    fn insert_job(&self, job: &VideoJob) -> anyhow::Result<()>;\n    fn claim_job(\n        &self,\n        job_id: &str,\n        expected_state: &str,\n        claimed_state: &str,\n    ) -> anyhow::Result<Option<VideoJob>>;\n    fn update_job(\n        &self,\n        job_id: &str,\n        state: &str,\n        progress: f64,\n        error: Option<&str>,\n    ) -> anyhow::Result<()>;\n    fn get_job(&self, job_id: &str) -> anyhow::Result<Option<VideoJob>>;\n    fn get_asset(&self, database: &str, asset_id: &str) -> anyhow::Result<Option<VideoAsset>>;\n"
          if "fn claim_job(" not in text:
              if trait_old not in text:
                  raise SystemExit("VideoDatabase job trait anchor missing")
              text = text.replace(trait_old, trait_new, 1)

          insert_old = "    fn insert_job(&self, job: &VideoJob) -> anyhow::Result<()> {\n        let connection = self\n"
          insert_new = "    fn insert_job(&self, job: &VideoJob) -> anyhow::Result<()> {\n        validate_job_state(&job.state)?;\n        let connection = self\n"
          if insert_new not in text:
              if insert_old not in text:
                  raise SystemExit("SQLite insert_job anchor missing")
              text = text.replace(insert_old, insert_new, 1)

          get_asset = "    fn get_asset(&self, database: &str, asset_id: &str) -> anyhow::Result<Option<VideoAsset>> {\n"
          sqlite = "    fn claim_job(\n        &self,\n        job_id: &str,\n        expected_state: &str,\n        claimed_state: &str,\n    ) -> anyhow::Result<Option<VideoJob>> {\n        validate_job_state(expected_state)?;\n        validate_job_state(claimed_state)?;\n        let now = now_ms();\n        let connection = self\n            .connection\n            .lock()\n            .map_err(|_| anyhow::anyhow!(\"Video Manager database mutex is poisoned\"))?;\n        let transaction = connection.unchecked_transaction()?;\n        let changed = transaction.execute(\n            \"UPDATE video_jobs SET state = ?1, attempts = attempts + 1, error = NULL, updated_at_ms = ?2 WHERE id = ?3 AND state = ?4\",\n            params![claimed_state, now, job_id, expected_state],\n        )?;\n        if changed == 0 {\n            transaction.commit()?;\n            return Ok(None);\n        }\n        let job = transaction\n            .query_row(\n                \"SELECT id, asset_id, job_type, state, progress, attempts, error, created_at_ms, updated_at_ms FROM video_jobs WHERE id = ?1\",\n                params![job_id],\n                read_video_job,\n            )\n            .optional()?;\n        transaction.commit()?;\n        Ok(job)\n    }\n\n    fn update_job(\n        &self,\n        job_id: &str,\n        state: &str,\n        progress: f64,\n        error: Option<&str>,\n    ) -> anyhow::Result<()> {\n        validate_job_state(state)?;\n        if !progress.is_finite() || !(0.0..=1.0).contains(&progress) {\n            anyhow::bail!(\"Video Manager job progress must be finite and between 0 and 1\");\n        }\n        let now = now_ms();\n        let connection = self\n            .connection\n            .lock()\n            .map_err(|_| anyhow::anyhow!(\"Video Manager database mutex is poisoned\"))?;\n        let changed = connection.execute(\n            \"UPDATE video_jobs SET state = ?1, progress = ?2, error = ?3, updated_at_ms = ?4 WHERE id = ?5\",\n            params![state, progress, error, now, job_id],\n        )?;\n        if changed != 1 {\n            anyhow::bail!(\"Video Manager job {job_id:?} does not exist\");\n        }\n        Ok(())\n    }\n\n    fn get_job(&self, job_id: &str) -> anyhow::Result<Option<VideoJob>> {\n        let connection = self\n            .connection\n            .lock()\n            .map_err(|_| anyhow::anyhow!(\"Video Manager database mutex is poisoned\"))?;\n        Ok(connection\n            .query_row(\n                \"SELECT id, asset_id, job_type, state, progress, attempts, error, created_at_ms, updated_at_ms FROM video_jobs WHERE id = ?1\",\n                params![job_id],\n                read_video_job,\n            )\n            .optional()?)\n    }\n\n"
          if "validate_job_state(expected_state)?;" not in text:
              pos = text.find(get_asset)
              if pos < 0:
                  raise SystemExit("SQLite get_asset implementation anchor missing")
              text = text[:pos] + sqlite + text[pos:]

          helper_anchor = "pub struct VideoManager {\n"
          helpers = "fn read_video_job(row: &rusqlite::Row<'_>) -> rusqlite::Result<VideoJob> {\n    Ok(VideoJob {\n        id: row.get(0)?,\n        asset_id: row.get(1)?,\n        job_type: row.get(2)?,\n        state: row.get(3)?,\n        progress: row.get(4)?,\n        attempts: row.get(5)?,\n        error: row.get(6)?,\n        created_at_ms: row.get(7)?,\n        updated_at_ms: row.get(8)?,\n    })\n}\n\nfn validate_job_state(state: &str) -> anyhow::Result<()> {\n    if state.is_empty()\n        || state.len() > 64\n        || !state\n            .bytes()\n            .all(|byte| byte.is_ascii_lowercase() || byte.is_ascii_digit() || matches!(byte, b'_' | b'-'))\n    {\n        anyhow::bail!(\"Video Manager job state is not a valid state token: {state:?}\");\n    }\n    Ok(())\n}\n\n"
          if "fn read_video_job(" not in text:
              pos = text.find(helper_anchor)
              if pos < 0:
                  raise SystemExit("VideoManager helper anchor missing")
              text = text[:pos] + helpers + text[pos:]

          test_anchor = "    #[test]\n    fn explicit_unknown_database_does_not_fall_back() {\n"
          test = "    #[test]\n    fn sqlite_job_claim_is_atomic() {\n        let path = temp_db(\"claim\");\n        let manager = VideoManager::open_default(&path, 7200).unwrap();\n        let queued = manager\n            .queue_download(QueueDownloadRequest {\n                database: None,\n                namespace_kind: \"module\".into(),\n                namespace_owner: \"worker\".into(),\n                group: \"claims\".into(),\n                title: \"Claim\".into(),\n                url: \"https://example.invalid/video.mp4\".into(),\n                metadata: serde_json::Value::Null,\n            })\n            .unwrap();\n        let (_, database) = manager.resolve_database(None).unwrap();\n        let claimed = database\n            .claim_job(&queued.job.id, \"queued\", \"downloading\")\n            .unwrap()\n            .unwrap();\n        assert_eq!(claimed.state, \"downloading\");\n        assert_eq!(claimed.attempts, 1);\n        assert!(database\n            .claim_job(&queued.job.id, \"queued\", \"downloading\")\n            .unwrap()\n            .is_none());\n        database\n            .update_job(&queued.job.id, \"downloaded\", 1.0, None)\n            .unwrap();\n        let stored = database.get_job(&queued.job.id).unwrap().unwrap();\n        assert_eq!(stored.state, \"downloaded\");\n        assert_eq!(stored.progress, 1.0);\n        assert_eq!(stored.attempts, 1);\n        let _ = std::fs::remove_dir_all(path.parent().unwrap());\n    }\n\n"
          if "fn sqlite_job_claim_is_atomic()" not in text:
              pos = text.find(test_anchor)
              if pos < 0:
                  raise SystemExit("Video Manager test anchor missing")
              text = text[:pos] + test + text[pos:]

          path.write_text(text)
          PY
      - name: Format Video Manager DB slice
        working-directory: engine
        run: rustfmt --edition 2021 crates/video-manager/src/lib.rs
      - name: Clippy workspace locked
        working-directory: engine
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test workspace locked
        working-directory: engine
        run: cargo test --workspace --locked
      - name: Commit validated source
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -vE '^engine/crates/video-manager/src/lib\.rs$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected changed paths:"
            printf '%s\n' "$unexpected"
            exit 1
          fi
          if git diff --quiet; then
            echo "No semantic source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/crates/video-manager/src/lib.rs
          git commit -m "feat: add atomic video job state"
          git push origin HEAD:codex/service-runtime-video-manager
