name: Video Job Progress Patch

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: expose ownership-scoped Video Manager jobs
        shell: bash
        run: |
          (cd .. && python .github/patches/video-job-progress.py)
          python - <<'PY'
          from pathlib import Path
          path = Path("crates/video-manager/src/lib.rs")
          source = path.read_text()
          old = '''    #[test]
              fn job_lookup_and_progress_constants_form_a_monotonic_pipeline() {
                  assert_eq!(PROGRESS_QUEUED, 0.0);
                  assert!(PROGRESS_QUEUED < PROGRESS_DOWNLOADING);
                  assert!(PROGRESS_DOWNLOADING < PROGRESS_DOWNLOADED);
                  assert!(PROGRESS_DOWNLOADED < PROGRESS_CONTAINER_CHECKED);
                  assert!(PROGRESS_CONTAINER_CHECKED < PROGRESS_PROBED);
                  assert!(PROGRESS_PROBED < PROGRESS_NORMALIZING);
                  assert!(PROGRESS_NORMALIZING < 1.0);
          '''.replace('              ', '')
          new = '''    const _: () = {
              assert!(PROGRESS_QUEUED < PROGRESS_DOWNLOADING);
              assert!(PROGRESS_DOWNLOADING < PROGRESS_DOWNLOADED);
              assert!(PROGRESS_DOWNLOADED < PROGRESS_CONTAINER_CHECKED);
              assert!(PROGRESS_CONTAINER_CHECKED < PROGRESS_PROBED);
              assert!(PROGRESS_PROBED < PROGRESS_NORMALIZING);
              assert!(PROGRESS_NORMALIZING < 1.0);
          };

          #[test]
          fn job_lookup_and_progress_constants_form_a_monotonic_pipeline() {
              assert_eq!(PROGRESS_QUEUED, 0.0);
          '''.replace('          ', '')
          if old not in source:
              raise SystemExit("Video Manager progress test anchor missing")
          path.write_text(source.replace(old, new, 1))
          PY
          rustfmt --edition 2021 \
            crates/video-manager/src/lib.rs \
            crates/video-manager/src/normalization.rs \
            crates/core/src/video_language.rs \
            crates/route-engine/src/modules.rs
          git diff --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          python - <<'PY'
          import subprocess
          allowed = {
              "crates/video-manager/src/lib.rs",
              "crates/video-manager/src/normalization.rs",
              "crates/core/src/video_language.rs",
              "crates/route-engine/src/modules.rs",
          }
          changed = set(subprocess.check_output(["git", "diff", "--name-only", "--relative"], text=True).split())
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit("unexpected Video Manager job/progress paths: " + ", ".join(sorted(unexpected)))
          PY
          if ! git diff --quiet; then
            git config user.name "Kate"
            git config user.email "dhwanksh2000@gmail.com"
            git add -- \
              crates/video-manager/src/lib.rs \
              crates/video-manager/src/normalization.rs \
              crates/core/src/video_language.rs \
              crates/route-engine/src/modules.rs
            git commit -m "feat: expose Video Manager job progress"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
