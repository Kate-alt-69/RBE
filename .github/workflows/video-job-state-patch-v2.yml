name: Video Job State Patch V2

on:
  push:
    branches:
      - codex/service-runtime-video-manager
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/service-runtime-video-manager
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Add atomic Video Manager job state
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          lib = Path("engine/crates/video-manager/src/lib.rs")
          text = lib.read_text()

          trait_anchor = "    fn insert_job(&self, job: &VideoJob) -> anyhow::Result<()>;\n    fn get_asset(&self, database: &str, asset_id: &str) -> anyhow::Result<Option<VideoAsset>>;\n"
          trait_replacement = "    fn insert_job(&self, job: &VideoJob) -> anyhow::Result<()>;\n    fn claim_job(\n        &self,\n        job_id: &str,\n        expected_state: &str,\n        claimed_state: &str,\n    ) -> anyhow::Result<Option<VideoJob>>;\n    fn update_job(\n        &self,\n        job_id: &str,\n        state: &str,\n        progress: f64,\n        error: Option<&str>,\n    ) -> anyhow::Result<()>;\n    fn get_job(&self, job_id: &str) -> anyhow::Result<Option<VideoJob>>;\n    fn get_asset(&self, database: &str, asset_id: &str) -> anyhow::Result<Option<VideoAsset>>;\n"
          if "fn get_job(&self, job_id: &str)" not in text:
              if trait_anchor not in text:
                  raise SystemExit("VideoDatabase trait job anchor missing")
              text = text.replace(trait_anchor, trait_replacement, 1)

          get_asset_anchor = "    fn get_asset(&self, database: &str, asset_id: &str) -> anyhow::Result<Option<VideoAsset>> {\n"
          sqlite_methods = "    fn claim_job(\n        &self,\n        job_id: &str,\n        expected_state: &str,\n        claimed_state: &str,\n    ) -> anyhow::Result<Option<VideoJob>> {\n        validate_job_state(expected_state)?;\n        validate_job_state(claimed_state)?;\n        let now = now_ms();\n        let connection = self\n            .connection\n            .lock()\n            .map_err(|_| anyhow::anyhow!(\"Video Manager database mutex is poisoned\"))?;\n        let transaction = connection.unchecked_transaction()?;\n        let changed = transaction.execute(\n            \"UPDATE video_jobs SET state = ?1, attempts = attempts + 1, error = NULL, updated_at_ms = ?2 WHERE id = ?3 AND state = ?4\",\n            params![claimed_state, now, job_id, expected_state],\n        )?;\n        if changed == 0 {\n            transaction.commit()?;\n            return Ok(None);\n        }\n        let job = transaction\n            .query_row(\n                \"SELECT id, asset_id, job_type, state, progress, attempts, error, created_at_ms, updated_at_ms FROM video_jobs WHERE id = ?1\",\n                params![job_id],\n                read_video_job,\n            )\n            .optional()?;\n        transaction.commit()?;\n        Ok(job)\n    }\n\n    fn update_job(\n        &self,\n        job_id: &str,\n        state: &str,\n        progress: f64,\n        error: Option<&str>,\n    ) -> anyhow::Result<()> {\n        validate_job_state(state)?;\n        if !progress.is_finite() || !(0.0..=1.0).contains(&progress) {\n            anyhow::bail!(\"Video Manager job progress must be finite and between 0 and 1\");\n        }\n        let now = now_ms();\n        let connection = self\n            .connection\n            .lock()\n            .map_err(|_| anyhow::anyhow!(\"Video Manager database mutex is poisoned\"))?;\n        let changed = connection.execute(\n            \"UPDATE video_jobs SET state = ?1, progress = ?2, error = ?3, updated_at_ms = ?4 WHERE id = ?5\",\n            params![state, progress, error, now, job_id],\n        )?;\n        if changed != 1 {\n            anyhow::bail!(\"Video Manager job {job_id:?} does not exist\");\n        }\n        Ok(())\n    }\n\n    fn get_job(&self, job_id: &str) -> anyhow::Result<Option<VideoJob>> {\n        let connection = self\n            .connection\n            .lock()\n            .map_err(|_| anyhow::anyhow!(\"Video Manager database mutex is poisoned\"))?;\n        Ok(connection\n            .query_row(\n                \"SELECT id, asset_id, job_type, state, progress, attempts, error, created_at_ms, updated_at_ms FROM video_jobs WHERE id = ?1\",\n                params![job_id],\n                read_video_job,\n            )\n            .optional()?)\n    }\n\n"
          if "validate_job_state(expected_state)?;" not in text:
              pos = text.find(get_asset_anchor)
              if pos < 0:
                  raise SystemExit("SQLite get_asset anchor missing")
              text = text[:pos] + sqlite_methods + text[pos:]

          insert_job_anchor = "    fn insert_job(&self, job: &VideoJob) -> anyhow::Result<()> {\n        let connection = self\n"
          insert_job_replacement = "    fn insert_job(&self, job: &VideoJob) -> anyhow::Result<()> {\n        validate_job_state(&job.state)?;\n        let connection = self\n"
          if insert_job_replacement not in text:
              if insert_job_anchor not in text:
                  raise SystemExit("insert_job validation anchor missing")
              text = text.replace(insert_job_anchor, insert_job_replacement, 1)

          helper_anchor = "pub struct VideoManager {\n"
          helper = "fn read_video_job(row: &rusqlite::Row<'_>) -> rusqlite::Result<VideoJob> {\n    Ok(VideoJob {\n        id: row.get(0)?,\n        asset_id: row.get(1)?,\n        job_type: row.get(2)?,\n        state: row.get(3)?,\n        progress: row.get(4)?,\n        attempts: row.get(5)?,\n        error: row.get(6)?,\n        created_at_ms: row.get(7)?,\n        updated_at_ms: row.get(8)?,\n    })\n}\n\nfn validate_job_state(state: &str) -> anyhow::Result<()> {\n    if state.is_empty()\n        || state.len() > 64\n        || !state\n            .bytes()\n            .all(|byte| byte.is_ascii_lowercase() || byte.is_ascii_digit() || matches!(byte, b'_' | b'-'))\n    {\n        anyhow::bail!(\"Video Manager job state is not a valid state token: {state:?}\");\n    }\n    Ok(())\n}\n\n"
          if "fn read_video_job(" not in text:
              pos = text.find(helper_anchor)
              if pos < 0:
                  raise SystemExit("VideoManager struct anchor missing")
              text = text[:pos] + helper + text[pos:]

          manager_anchor = "    pub fn get_asset(\n        &self,\n        database: Option<&str>,\n        asset_id: &str,\n    ) -> anyhow::Result<Option<VideoAsset>> {\n"
          manager_method = "    /// Atomically claim and execute one queued download job. Successful network\n    /// fetches remain quarantined until content validation advances them.\n    pub async fn run_queued_download(\n        &self,\n        queued: &QueuedDownload,\n        policy: DownloadPolicy,\n    ) -> anyhow::Result<DownloadReceipt> {\n        let (_, database) = self.resolve_database(Some(&queued.asset.database))?;\n        let claimed = database\n            .claim_job(&queued.job.id, \"queued\", \"downloading\")?\n            .ok_or_else(|| {\n                anyhow::anyhow!(\n                    \"Video Manager download job {:?} is not queued and cannot be claimed\",\n                    queued.job.id\n                )\n            })?;\n        if claimed.asset_id != queued.asset.id || claimed.job_type != \"download\" {\n            let detail = \"Video Manager claimed job does not match its queued download asset/type\";\n            let _ = database.update_job(&claimed.id, \"failed\", 0.0, Some(detail));\n            if let Ok(path) = self.quarantine_path(&queued.asset.id, &queued.job.id) {\n                let _ = std::fs::remove_file(path);\n            }\n            anyhow::bail!(\"{detail}\");\n        }\n\n        let mut claimed_download = queued.clone();\n        claimed_download.job = claimed;\n        match self.execute_queued_download(&claimed_download, policy).await {\n            Ok(receipt) => {\n                database.update_job(&queued.job.id, \"downloaded\", 1.0, None)?;\n                Ok(receipt)\n            }\n            Err(error) => {\n                let detail = error.to_string();\n                if let Err(state_error) =\n                    database.update_job(&queued.job.id, \"failed\", 0.0, Some(&detail))\n                {\n                    return Err(anyhow::anyhow!(\n                        \"Video Manager download failed: {detail}; additionally failed to persist job failure: {state_error}\"\n                    ));\n                }\n                Err(error)\n            }\n        }\n    }\n\n"
          if "pub async fn run_queued_download(" not in text:
              pos = text.find(manager_anchor)
              if pos < 0:
                  raise SystemExit("VideoManager get_asset anchor missing")
              text = text[:pos] + manager_method + text[pos:]

          test_anchor = "    #[test]\n    fn explicit_unknown_database_does_not_fall_back() {\n"
          tests = "    #[test]\n    fn sqlite_job_claim_is_atomic() {\n        let path = temp_db(\"claim\");\n        let manager = VideoManager::open_default(&path, 7200).unwrap();\n        let queued = manager\n            .queue_download(QueueDownloadRequest {\n                database: None,\n                namespace_kind: \"module\".into(),\n                namespace_owner: \"worker\".into(),\n                group: \"claims\".into(),\n                title: \"Claim\".into(),\n                url: \"https://example.invalid/video.mp4\".into(),\n                metadata: serde_json::Value::Null,\n            })\n            .unwrap();\n        let (_, database) = manager.resolve_database(None).unwrap();\n        let claimed = database\n            .claim_job(&queued.job.id, \"queued\", \"downloading\")\n            .unwrap()\n            .unwrap();\n        assert_eq!(claimed.state, \"downloading\");\n        assert_eq!(claimed.attempts, 1);\n        assert!(database\n            .claim_job(&queued.job.id, \"queued\", \"downloading\")\n            .unwrap()\n            .is_none());\n        database\n            .update_job(&queued.job.id, \"downloaded\", 1.0, None)\n            .unwrap();\n        let stored = database.get_job(&queued.job.id).unwrap().unwrap();\n        assert_eq!(stored.state, \"downloaded\");\n        assert_eq!(stored.progress, 1.0);\n        assert_eq!(stored.attempts, 1);\n        let _ = std::fs::remove_dir_all(path.parent().unwrap());\n    }\n\n    #[tokio::test]\n    async fn download_runner_records_preflight_failure_and_cleans_quarantine() {\n        let path = temp_db(\"runner-failure\");\n        let manager = VideoManager::open_default(&path, 7200).unwrap();\n        let queued = manager\n            .queue_download(QueueDownloadRequest {\n                database: None,\n                namespace_kind: \"module\".into(),\n                namespace_owner: \"worker\".into(),\n                group: \"failures\".into(),\n                title: \"Failure\".into(),\n                url: \"https://example.invalid/video.mp4\".into(),\n                metadata: serde_json::Value::Null,\n            })\n            .unwrap();\n        let quarantine = manager.quarantine_path(&queued.asset.id, &queued.job.id).unwrap();\n        let policy = DownloadPolicy {\n            max_bytes: 0,\n            ..DownloadPolicy::default()\n        };\n        assert!(manager.run_queued_download(&queued, policy).await.is_err());\n        let (_, database) = manager.resolve_database(None).unwrap();\n        let stored = database.get_job(&queued.job.id).unwrap().unwrap();\n        assert_eq!(stored.state, \"failed\");\n        assert_eq!(stored.attempts, 1);\n        assert!(stored\n            .error\n            .as_deref()\n            .is_some_and(|error| error.contains(\"byte limit\")));\n        assert!(!quarantine.exists());\n        let asset = manager.get_asset(None, &queued.asset.id).unwrap().unwrap();\n        assert_eq!(asset.state, VideoAssetState::Quarantined);\n        let _ = std::fs::remove_dir_all(path.parent().unwrap());\n    }\n\n"
          if "fn sqlite_job_claim_is_atomic()" not in text:
              pos = text.find(test_anchor)
              if pos < 0:
                  raise SystemExit("Video Manager tests anchor missing")
              text = text[:pos] + tests + text[pos:]

          lib.write_text(text)

          worker = Path("engine/crates/video-manager/src/download_worker.rs")
          worker_text = worker.read_text()
          method_start = worker_text.find("    pub async fn execute_queued_download(\n")
          method_end = worker_text.find("\n}\n\nasync fn download_into_quarantine", method_start)
          if method_start < 0 or method_end < 0:
              raise SystemExit("download worker execute method anchor missing")
          current = worker_text[method_start:method_end + 2]
          replacement = "    pub async fn execute_queued_download(\n        &self,\n        queued: &QueuedDownload,\n        policy: DownloadPolicy,\n    ) -> anyhow::Result<DownloadReceipt> {\n        let quarantine_path = self.quarantine_path(&queued.asset.id, &queued.job.id)?;\n        let result = async {\n            policy.validate()?;\n            if queued.asset.id != queued.job.asset_id {\n                anyhow::bail!(\"Video Manager queued download asset/job identity mismatch\");\n            }\n            let source_url = queued\n                .asset\n                .source_uri\n                .as_deref()\n                .ok_or_else(|| anyhow::anyhow!(\"Video Manager queued download has no source URL\"))?;\n            let target = parse_download_target(source_url)?;\n            match tokio::time::timeout(\n                policy.total_timeout,\n                download_into_quarantine(target, &quarantine_path, &policy),\n            )\n            .await\n            {\n                Ok(result) => result,\n                Err(_) => anyhow::bail!(\n                    \"Video Manager download exceeded total timeout of {:?}\",\n                    policy.total_timeout\n                ),\n            }\n        }\n        .await;\n\n        if result.is_err() {\n            let _ = tokio::fs::remove_file(&quarantine_path).await;\n        }\n        result\n    }"
          if "let result = async {" not in current:
              worker_text = worker_text[:method_start] + replacement + worker_text[method_end + 2:]
          worker.write_text(worker_text)
          PY
      - name: Format Video Manager job slice
        working-directory: engine
        run: rustfmt --edition 2021 crates/video-manager/src/lib.rs crates/video-manager/src/download_worker.rs
      - name: Clippy workspace locked
        working-directory: engine
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test workspace locked
        working-directory: engine
        run: cargo test --workspace --locked
      - name: Commit validated source
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -vE '^engine/crates/video-manager/src/(lib|download_worker)\.rs$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected changed paths:"
            printf '%s\n' "$unexpected"
            exit 1
          fi
          if git diff --quiet; then
            echo "No semantic source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/crates/video-manager/src/lib.rs engine/crates/video-manager/src/download_worker.rs
          git commit -m "feat: claim video download jobs atomically"
          git push origin HEAD:codex/service-runtime-video-manager
