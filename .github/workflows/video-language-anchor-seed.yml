name: Video Language Anchor Seed

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: seed video language anchors
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("engine/crates/route-engine/src/module_eval.rs")
          source = path.read_text()

          normal_constructor = "    pub fn with_services(program: &'a ModuleProgram, services: ServiceManager) -> Self {\n        Self::with_service_caller(program, Arc::new(services))\n    }\n"
          seeded_constructor = "    pub fn with_services(program: &'a ModuleProgram, services: ServiceManager) -> Self {\n    Self::with_service_caller(program, Arc::new(services))\n}\n"
          if normal_constructor in source:
              source = source.replace(normal_constructor, seeded_constructor, 1)
          elif seeded_constructor not in source:
              raise SystemExit("with_services source anchor missing")

          helper_region = source.index("                        if let Some(function) = self")
          call_start = source.index("                                .call_function(", helper_region)
          call_end = source.index("\n                                .await;", call_start)
          seeded_helper = (
              "                                .call_function(\n"
              "                            self.file.clone(),\n"
              "                            &function.name,\n"
              "                            args,\n"
              "                            self.depth + 1,\n"
              "                        )"
          )
          if source[call_start:call_end] != seeded_helper:
              source = source[:call_start] + seeded_helper + source[call_end:]

          test_region = source.index("    impl HostCapabilityCaller for TestHostCapability")
          signature_start = source.index("        fn call<'a>(", test_region)
          signature_end = source.index("\n            Box::pin", signature_start)
          seeded_test_signature = (
              "        fn call<'a>(\n"
              "        &'a self,\n"
              "        module: &'a str,\n"
              "        function: &'a str,\n"
              "        args: Vec<Value>,\n"
              "    ) -> HostCapabilityFuture<'a> {"
          )
          if source[signature_start:signature_end] != seeded_test_signature:
              source = source[:signature_start] + seeded_test_signature + source[signature_end:]

          seeded_test_body = (
              '  if module == "host" && function == "double" {\n'
              '  let Some(Value::Number(value)) = args.into_iter().next() else {'
          )
          if seeded_test_body not in source:
              body_if = source.index('                if module == "host" && function == "double" {', test_region)
              body_let = source.index("                    let Some(Value::Number(value))", body_if)
              body_let_end = source.index(" else {", body_let) + len(" else {")
              source = source[:body_if] + seeded_test_body + source[body_let_end:]
          path.write_text(source)

          path = Path("engine/crates/route-engine/src/service_eval.rs")
          source = path.read_text()
          service_region = source.index("impl HostCapabilityCaller for ServiceHostCapabilities")
          signature_start = source.index("    fn call<'a>(", service_region)
          signature_end = source.index("\n        Box::pin", signature_start)
          seeded_service_signature = (
              "    fn call<'a>(\n"
              "        &'a self,\n"
              "        module: &'a str,\n"
              "        function: &'a str,\n"
              "        args: Vec<Value>,\n"
              "    ) -> HostCapabilityFuture<'a> {"
          )
          if source[signature_start:signature_end] != seeded_service_signature:
              source = source[:signature_start] + seeded_service_signature + source[signature_end:]
          path.write_text(source)

          path = Path("engine/crates/core/src/video_language.rs")
          source = path.read_text()
          seeded_database_health = (
              "to_json(\n"
              "          manager\n"
              "              .database_health(database.as_deref())\n"
              "              .map_err(operation_error)?,\n"
              "      )"
          )
          if seeded_database_health not in source:
              database_region = source.index('            "databaseHealth" | "database_health" => {')
              call_start = source.index("to_json(", database_region)
              call_end = source.index("\n                )", call_start) + len("\n                )")
              source = source[:call_start] + seeded_database_health + source[call_end:]
          path.write_text(source)

          path = Path("engine/crates/route-engine/src/modules.rs")
          source = path.read_text()
          seeded_response = (
              '            ModuleKind::Builtin(BuiltinModule::Response) => Err(ModuleError {\n'
              '        message: format!("{module_name}.{function_name}() is not implemented yet"),\n'
              '    }),'
          )
          if seeded_response not in source:
              response_start = source.index("            ModuleKind::Builtin(BuiltinModule::Response) => Err(ModuleError {")
              response_end = source.index("\n            }),", response_start) + len("\n            }),")
              source = source[:response_start] + seeded_response + source[response_end:]
          path.write_text(source)
          PY
          git diff --check
          if ! git diff --quiet; then
            git config user.name "Kate"
            git config user.email "dhwanksh2000@gmail.com"
            git add -- \
              engine/crates/route-engine/src/module_eval.rs \
              engine/crates/route-engine/src/service_eval.rs \
              engine/crates/route-engine/src/modules.rs \
              engine/crates/core/src/video_language.rs
            git commit -m "ci: seed video fallback anchors"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
