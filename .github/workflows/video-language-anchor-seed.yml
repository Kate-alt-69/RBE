name: Video Language Anchor Seed

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: seed constructor anchor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("engine/crates/route-engine/src/module_eval.rs")
          source = path.read_text()
          normal = '''    pub fn with_services(program: &'a ModuleProgram, services: ServiceManager) -> Self {
                  Self::with_service_caller(program, Arc::new(services))
              }
          '''.replace('          ', '')
          seeded = '''    pub fn with_services(program: &'a ModuleProgram, services: ServiceManager) -> Self {
              Self::with_service_caller(program, Arc::new(services))
          }
          '''.replace('          ', '')
          # The main guard accidentally expects its inner line/brace one indentation level left.
          normal = "    pub fn with_services(program: &'a ModuleProgram, services: ServiceManager) -> Self {\n        Self::with_service_caller(program, Arc::new(services))\n    }\n"
          seeded = "    pub fn with_services(program: &'a ModuleProgram, services: ServiceManager) -> Self {\n    Self::with_service_caller(program, Arc::new(services))\n}\n"
          if normal in source:
              path.write_text(source.replace(normal, seeded, 1))
          elif seeded not in source:
              raise SystemExit("with_services source anchor missing")
          PY
          git diff --check
          if ! git diff --quiet; then
            git config user.name "Kate"
            git config user.email "dhwanksh2000@gmail.com"
            git add -- engine/crates/route-engine/src/module_eval.rs
            git commit -m "ci: seed video constructor anchor"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
