name: Video Language Patch

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: wire scoped video capability into modules
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # core: expose the privileged Video language facade without adding a new dependency.
          path = Path("crates/core/src/lib.rs")
          source = path.read_text()
          source = source.replace("mod metrics;", "mod metrics;\nmod video_language;", 1)
          source = source.replace(
              "pub use metrics::{BackendMetrics, BackendMetricsSnapshot, MaintenanceMetrics, MaintenanceSnapshot};",
              "pub use metrics::{BackendMetrics, BackendMetricsSnapshot, MaintenanceMetrics, MaintenanceSnapshot};\npub use video_language::{VideoLanguage, VideoLanguageError};",
              1,
          )
          path.write_text(source)

          # Avoid naming serde directly in core-lib; serde_json owns the serialization bound.
          path = Path("crates/core/src/video_language.rs")
          source = path.read_text()
          source = source.replace(
              "to_json(manager.status().map_err(operation_error)?)",
              "json_result(serde_json::to_value(manager.status().map_err(operation_error)?))",
          )
          source = source.replace(
              '''to_json(
                    manager
                        .database_health(database.as_deref())
                        .map_err(operation_error)?,
                )''',
              '''json_result(serde_json::to_value(
                    manager
                        .database_health(database.as_deref())
                        .map_err(operation_error)?,
                ))''',
          )
          source = source.replace("to_json(asset)", "json_result(serde_json::to_value(asset))")
          source = source.replace("to_json(queued)", "json_result(serde_json::to_value(queued))")
          helper_start = source.index("fn to_json(")
          tests_start = source.index("\n#[cfg(test)]", helper_start)
          helper = '''fn json_result(value: serde_json::Result<Value>) -> Result<Value, VideoLanguageError> {
              value.map_err(|error| VideoLanguageError::new("VID3002", error.to_string()))
          }
          '''.replace('          ', '')
          source = source[:helper_start] + helper.rstrip() + "\n" + source[tests_start:]
          path.write_text(source)

          # route-engine: register the backend Video host bridge.
          path = Path("crates/route-engine/src/lib.rs")
          source = path.read_text()
          if "mod video_host;" not in source:
              insert_at = source.index("mod ", source.index("mod "))
              # Keep module declaration ordering simple; rustfmt does the rest.
              source = source.replace("mod transpiler;", "mod transpiler;\nmod video_host;", 1)
          path.write_text(source)

          # ModuleProgram: resolve each module with a deterministic capability owner.
          path = Path("crates/route-engine/src/module_runtime.rs")
          source = path.read_text()
          resolve_start = source.index("    pub fn resolve(&self, raw_path: &str) -> Option<Arc<ModuleFile>> {")
          resolve_end = source.index("\n    }\n}", resolve_start) + len("\n    }")
          resolve = '''    pub fn resolve(&self, raw_path: &str) -> Option<Arc<ModuleFile>> {
              self.resolve_scoped(raw_path).map(|(_, file)| file)
          }

          pub fn resolve_scoped(&self, raw_path: &str) -> Option<(String, Arc<ModuleFile>)> {
              let path = normalize(&resolve_custom_import(&self.binary_root, raw_path));
              let owner = module_owner(&self.module_dir, &path);
              self.modules.get(&path).cloned().map(|file| (owner, file))
          }'''.replace('          ', '')
          source = source[:resolve_start] + resolve + source[resolve_end:]

          normalize_anchor = "fn normalize(path: &Path) -> PathBuf {\n    fs::canonicalize(path).unwrap_or_else(|_| path.to_path_buf())\n}\n"
          owner_helper = r'''
          fn module_owner(module_dir: &Path, path: &Path) -> String {
              let root = normalize(module_dir);
              let relative = path.strip_prefix(&root).unwrap_or(path).with_extension("");
              let parts = relative
                  .components()
                  .filter_map(|component| match component {
                      std::path::Component::Normal(value) => Some(encode_owner_segment(&value.to_string_lossy())),
                      _ => None,
                  })
                  .collect::<Vec<_>>();
              if parts.is_empty() {
                  "root".into()
              } else {
                  parts.join(".")
              }
          }

          fn encode_owner_segment(value: &str) -> String {
              const HEX: &[u8; 16] = b"0123456789ABCDEF";
              let mut out = String::with_capacity(value.len());
              for byte in value.as_bytes() {
                  if byte.is_ascii_alphanumeric() || matches!(*byte, b'-' | b'_' | b'.') {
                      out.push(*byte as char);
                  } else {
                      out.push('_');
                      out.push(HEX[(byte >> 4) as usize] as char);
                      out.push(HEX[(byte & 0x0f) as usize] as char);
                  }
              }
              out
          }
          '''.replace('          ', '')
          if normalize_anchor not in source:
              raise SystemExit("module normalize anchor missing")
          source = source.replace(normalize_anchor, normalize_anchor + owner_helper, 1)
          tests_end = source.rfind("\n}")
          identity_test = r'''

              #[test]
              fn scoped_resolution_uses_canonical_nested_module_identity() {
                  let root = root();
                  fs::create_dir_all(root.join("module/learning")).unwrap();
                  fs::write(
                      root.join("module/learning/catalog.module"),
                      "export function run() { return true; }",
                  )
                  .unwrap();
                  let program = ModuleProgram::load(&root.join("module")).unwrap();
                  let (owner, _) = program
                      .resolve_scoped("./module/learning/catalog")
                      .expect("nested module should resolve");
                  assert_eq!(owner, "learning.catalog");
                  let _ = fs::remove_dir_all(root);
              }
          '''.replace('          ', '')
          source = source[:tests_end] + identity_test + source[tests_end:]
          path.write_text(source)

          # ModuleExecutor: host capability calls now carry the resolved module owner,
          # and mother-side execution can use services + host capabilities together.
          path = Path("crates/route-engine/src/module_eval.rs")
          source = path.read_text()
          trait_old = '''pub trait HostCapabilityCaller: Send + Sync {
              fn call<'a>(
                  &'a self,
                  module: &'a str,
                  function: &'a str,
                  args: Vec<Value>,
              ) -> HostCapabilityFuture<'a>;
          }'''.replace('          ', '')
          trait_new = '''pub trait HostCapabilityCaller: Send + Sync {
              fn call<'a>(
                  &'a self,
                  scope: Option<String>,
                  module: &'a str,
                  function: &'a str,
                  args: Vec<Value>,
              ) -> HostCapabilityFuture<'a>;
          }'''.replace('          ', '')
          if trait_old not in source:
              raise SystemExit("host capability trait anchor missing")
          source = source.replace(trait_old, trait_new, 1)

          services_anchor = '''    pub fn with_services(program: &'a ModuleProgram, services: ServiceManager) -> Self {
              Self::with_service_caller(program, Arc::new(services))
          }
          '''.replace('          ', '')
          combined = '''
              pub fn with_services_and_host_capabilities(
                  program: &'a ModuleProgram,
                  services: ServiceManager,
                  host_capabilities: Arc<dyn HostCapabilityCaller>,
              ) -> Self {
                  Self {
                      program,
                      services: Some(Arc::new(services)),
                      host_capabilities: Some(host_capabilities),
                  }
              }
          '''.replace('          ', '')
          if services_anchor not in source:
              raise SystemExit("with_services anchor missing")
          source = source.replace(services_anchor, services_anchor + combined, 1)

          host_start = source.index("    async fn call_host_capability(")
          host_end = source.index("\n    pub async fn call(", host_start)
          host_method = '''    async fn call_host_capability(
              &self,
              scope: Option<String>,
              module: &str,
              function: &str,
              args: Vec<Value>,
          ) -> Result<Option<Value>, ModuleEvalError> {
              let Some(host_capabilities) = self.host_capabilities.as_ref() else {
                  return Ok(None);
              };
              host_capabilities.call(scope, module, function, args).await
          }
          '''.replace('          ', '')
          source = source[:host_start] + host_method.rstrip() + "\n" + source[host_end:]

          source = source.replace(
              "        self.call_function(file, function, args, 0).await",
              "        self.call_function(file, function, args, 0, None).await",
              1,
          )
          source = source.replace(
              "        self.execute_function(file, function, args, 0).await",
              "        self.execute_function(file, function, args, 0, None).await",
              1,
          )

          function_start = source.index("    async fn call_export(")
          impl_end = source.index("\n}\n\nimpl ModuleProgram", function_start)
          functions = '''    async fn call_export(
              &self,
              raw_path: &str,
              function: &str,
              args: Vec<Value>,
              depth: usize,
          ) -> Result<Value, ModuleEvalError> {
              let (owner, file) = self.program.resolve_scoped(raw_path).ok_or_else(|| {
                  ModuleEvalError::new("MOD3000", format!("module {raw_path:?} is not loaded"))
              })?;
              if !file.exports.iter().any(|name| name == function) {
                  return Err(ModuleEvalError::new(
                      "MOD3001",
                      format!("module {raw_path:?} does not export {function:?}"),
                  ));
              }
              self.call_function(file, function, args, depth, Some(owner)).await
          }

              async fn call_function(
                  &self,
                  file: Arc<ModuleFile>,
                  function_name: &str,
                  args: Vec<Value>,
                  depth: usize,
                  capability_scope: Option<String>,
              ) -> Result<Value, ModuleEvalError> {
                  if depth >= MAX_MODULE_CALL_DEPTH {
                      return Err(ModuleEvalError::new(
                          "MOD3004",
                          format!("module call depth exceeded {MAX_MODULE_CALL_DEPTH}"),
                      ));
                  }
                  let function = file
                      .functions
                      .iter()
                      .find(|candidate| candidate.name == function_name)
                      .cloned()
                      .ok_or_else(|| {
                          ModuleEvalError::new(
                              "MOD3002",
                              format!("function {function_name:?} has no body"),
                          )
                      })?;
                  self.execute_function(file, function, args, depth, capability_scope)
                      .await
              }

              async fn execute_function(
                  &self,
                  file: Arc<ModuleFile>,
                  function: FunctionDef,
                  args: Vec<Value>,
                  depth: usize,
                  capability_scope: Option<String>,
              ) -> Result<Value, ModuleEvalError> {
                  if function.params.len() != args.len() {
                      return Err(ModuleEvalError::new(
                          "MOD3003",
                          format!(
                              "function {:?} expected {} argument(s), got {}",
                              function.name,
                              function.params.len(),
                              args.len()
                          ),
                      ));
                  }

                  let mut frame = Frame::new(self, file, depth, capability_scope);
                  for (param, value) in function.params.iter().zip(args) {
                      frame.scope.insert(param.clone(), value);
                  }
                  match frame.exec_block(&function.body).await? {
                      Flow::Continue => Ok(Value::Null),
                      Flow::Return(value) => Ok(value),
                  }
              }
          '''.replace('          ', '')
          source = source[:function_start] + functions.rstrip() + source[impl_end:]

          source = source.replace(
              "    scope: HashMap<String, Value>,\n    depth: usize,",
              "    scope: HashMap<String, Value>,\n    depth: usize,\n    capability_scope: Option<String>,",
              1,
          )
          source = source.replace(
              "    fn new(executor: &'exec ModuleExecutor<'program>, file: Arc<ModuleFile>, depth: usize) -> Self {",
              "    fn new(\n        executor: &'exec ModuleExecutor<'program>,\n        file: Arc<ModuleFile>,\n        depth: usize,\n        capability_scope: Option<String>,\n    ) -> Self {",
              1,
          )
          source = source.replace(
              "            scope: HashMap::new(),\n            depth,",
              "            scope: HashMap::new(),\n            depth,\n            capability_scope,",
              1,
          )
          source = source.replace(
              ".call_host_capability(&module, &function, args.clone())",
              ".call_host_capability(\n                                    self.capability_scope.clone(),\n                                    &module,\n                                    &function,\n                                    args.clone(),\n                                )",
          )
          source = source.replace(
              ".call_host_capability(&module, function_name, args.clone())",
              ".call_host_capability(\n                                    self.capability_scope.clone(),\n                                    &module,\n                                    function_name,\n                                    args.clone(),\n                                )",
          )
          old_helper_call = '''                                .call_function(
                                      self.file.clone(),
                                      &function.name,
                                      args,
                                      self.depth + 1,
                                  )'''.replace('                                  ', '')
          new_helper_call = '''                                .call_function(
                                      self.file.clone(),
                                      &function.name,
                                      args,
                                      self.depth + 1,
                                      self.capability_scope.clone(),
                                  )'''.replace('                                  ', '')
          if old_helper_call not in source:
              raise SystemExit("module helper scope anchor missing")
          source = source.replace(old_helper_call, new_helper_call, 1)

          test_impl_old = '''        fn call<'a>(
                  &'a self,
                  module: &'a str,
                  function: &'a str,
                  args: Vec<Value>,
              ) -> HostCapabilityFuture<'a> {'''.replace('              ', '')
          test_impl_new = '''        fn call<'a>(
                  &'a self,
                  scope: Option<String>,
                  module: &'a str,
                  function: &'a str,
                  args: Vec<Value>,
              ) -> HostCapabilityFuture<'a> {'''.replace('              ', '')
          if test_impl_old not in source:
              raise SystemExit("test host capability signature anchor missing")
          source = source.replace(test_impl_old, test_impl_new, 1)
          source = source.replace(
              '''                if module == "host" && function == "double" {
                          let Some(Value::Number(value)) = args.into_iter().next() else {'''.replace('              ', ''),
              '''                if module == "host" && function == "double" {
                          if scope.as_deref() != Some("hosted") {
                              return Err(ModuleEvalError::new("TEST", "unexpected module capability scope"));
                          }
                          let Some(Value::Number(value)) = args.into_iter().next() else {'''.replace('              ', ''),
              1,
          )
          path.write_text(source)

          # Service-local host capabilities ignore module scope. This keeps services isolated
          # from mother-side Video Manager until a dedicated service->mother capability channel lands.
          path = Path("crates/route-engine/src/service_eval.rs")
          source = path.read_text()
          signature = '''    fn call<'a>(
                  &'a self,
                  module: &'a str,
                  function: &'a str,
                  args: Vec<Value>,
              ) -> HostCapabilityFuture<'a> {'''.replace('              ', '')
          replacement = '''    fn call<'a>(
                  &'a self,
                  _scope: Option<String>,
                  module: &'a str,
                  function: &'a str,
                  args: Vec<Value>,
              ) -> HostCapabilityFuture<'a> {'''.replace('              ', '')
          if signature not in source:
              raise SystemExit("service host capability signature anchor missing")
          source = source.replace(signature, replacement, 1)
          path.write_text(source)

          # Make `video` a known privileged builtin but do not add it to the route whitelist.
          path = Path("crates/route-engine/src/modules.rs")
          source = path.read_text()
          source = source.replace("    Response,\n}", "    Response,\n    Video,\n}", 1)
          source = source.replace(
              '        "env" => matches!(function, "get"),\n        _ => false,',
              '        "env" => matches!(function, "get"),\n        "video" => matches!(\n            function,\n            "status"\n                | "databaseHealth"\n                | "database_health"\n                | "get"\n                | "create"\n                | "queueDownload"\n                | "queue_download"\n        ),\n        _ => false,',
              1,
          )
          source = source.replace(
              '                        "response" => ModuleKind::Builtin(BuiltinModule::Response),',
              '                        "response" => ModuleKind::Builtin(BuiltinModule::Response),\n                        "video" => ModuleKind::Builtin(BuiltinModule::Video),',
          )
          source = source.replace(
              '''            ModuleKind::Builtin(BuiltinModule::Response) => Err(ModuleError {
                  message: format!("{module_name}.{function_name}() is not implemented yet"),
              }),'''.replace('              ', ''),
              '''            ModuleKind::Builtin(BuiltinModule::Response) => Err(ModuleError {
                  message: format!("{module_name}.{function_name}() is not implemented yet"),
              }),
              ModuleKind::Builtin(BuiltinModule::Video) => Err(ModuleError {
                  message: format!(
                      "{module_name}.{function_name}() requires the privileged module Video host capability"
                  ),
              }),'''.replace('              ', ''),
              1,
          )
          path.write_text(source)

          # Live route path: combine ServiceManager with the Video host capability.
          path = Path("crates/route-engine/src/discovery.rs")
          source = path.read_text()
          source = source.replace(
              "use crate::transpiler::transpile_file;",
              "use crate::transpiler::transpile_file;\nuse crate::video_host::VideoHostCapabilities;",
              1,
          )
          old_executor = "    let executor = ModuleExecutor::with_services(module_program.as_ref(), state.services.clone());"
          new_executor = '''    let executor = ModuleExecutor::with_services_and_host_capabilities(
              module_program.as_ref(),
              state.services.clone(),
              Arc::new(VideoHostCapabilities::from_state(&state)),
          );'''.replace('          ', '')
          if old_executor not in source:
              raise SystemExit("route executor host capability anchor missing")
          source = source.replace(old_executor, new_executor, 1)
          path.write_text(source)
          PY

          rustfmt --edition 2021 \
            crates/core/src/lib.rs \
            crates/core/src/video_language.rs \
            crates/route-engine/src/lib.rs \
            crates/route-engine/src/module_runtime.rs \
            crates/route-engine/src/module_eval.rs \
            crates/route-engine/src/service_eval.rs \
            crates/route-engine/src/modules.rs \
            crates/route-engine/src/discovery.rs \
            crates/route-engine/src/video_host.rs
          git diff --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked

          python - <<'PY'
          import subprocess
          allowed = {
              "crates/core/src/lib.rs",
              "crates/core/src/video_language.rs",
              "crates/route-engine/src/lib.rs",
              "crates/route-engine/src/module_runtime.rs",
              "crates/route-engine/src/module_eval.rs",
              "crates/route-engine/src/service_eval.rs",
              "crates/route-engine/src/modules.rs",
              "crates/route-engine/src/discovery.rs",
              "crates/route-engine/src/video_host.rs",
          }
          changed = set(subprocess.check_output(["git", "diff", "--name-only", "--relative"], text=True).split())
          for path in sorted(changed - allowed):
              subprocess.run(["git", "checkout", "--", path], check=True)
          changed = set(subprocess.check_output(["git", "diff", "--name-only", "--relative"], text=True).split())
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit("unexpected video language paths: " + ", ".join(sorted(unexpected)))
          PY

          if ! git diff --quiet; then
            git config user.name "Kate"
            git config user.email "dhwanksh2000@gmail.com"
            git add -- \
              crates/core/src/lib.rs \
              crates/core/src/video_language.rs \
              crates/route-engine/src/lib.rs \
              crates/route-engine/src/module_runtime.rs \
              crates/route-engine/src/module_eval.rs \
              crates/route-engine/src/service_eval.rs \
              crates/route-engine/src/modules.rs \
              crates/route-engine/src/discovery.rs \
              crates/route-engine/src/video_host.rs
            git commit -m "feat: expose scoped video capability to modules"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
