name: Video Live Control Patch

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: wire Video Manager live control plane
        shell: bash
        run: |
          python ../.github/patches/video-live-control.py
          rustfmt --edition 2021 crates/video-manager/src/live.rs
          rustfmt --edition 2021 --config skip_children=true crates/video-manager/src/lib.rs
          rustfmt --edition 2021 crates/core/src/video_language.rs
          rustfmt --edition 2021 crates/route-engine/src/modules.rs
          git diff --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          python - <<'PY'
          import subprocess
          allowed = {
              "crates/video-manager/src/live.rs",
              "crates/video-manager/src/lib.rs",
              "crates/core/src/video_language.rs",
              "crates/route-engine/src/modules.rs",
          }
          changed = set(subprocess.check_output(["git", "diff", "--name-only", "--relative"], text=True).split())
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit("unexpected Video Manager live-control paths: " + ", ".join(sorted(unexpected)))
          PY
          if ! git diff --quiet; then
            git config user.name "Kate"
            git config user.email "dhwanksh2000@gmail.com"
            git add -- \
              crates/video-manager/src/live.rs \
              crates/video-manager/src/lib.rs \
              crates/core/src/video_language.rs \
              crates/route-engine/src/modules.rs
            git commit -m "feat: add Video Manager live session control"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
