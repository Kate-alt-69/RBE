name: Video Pipeline Patch

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: expose trusted Video Manager pipeline
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("crates/video-manager/src/lib.rs")
          source = path.read_text()
          old = '''//! Global RBE Video Manager control/data plane.
          //!
          //! This crate intentionally does **not** run FFmpeg, RTMP, or HLS yet. It owns
          //! stable video identity, quarantine-safe HTTP download transport, the default
          //! database, custom database adapter registration, and job records so heavy
          //! media workers can remain isolated and lazy.
          '''.replace('          ', '')
          new = '''//! Global RBE Video Manager control/data plane.
          //!
          //! Trusted Rust owns stable video identity, quarantine-safe HTTP download,
          //! container inspection, FFprobe validation, fixed-profile FFmpeg normalization,
          //! database promotion, and job state. Arbitrary process execution is never
          //! exposed to route/module/service language code; live RTMP/HLS workers remain
          //! separate and lazy.
          '''.replace('          ', '')
          if old not in source:
              raise SystemExit("Video Manager crate docs anchor missing")
          source = source.replace(old, new, 1)
          if "mod pipeline;" not in source:
              source = source.replace("mod normalization;", "mod normalization;\nmod pipeline;", 1)
          path.write_text(source)
          PY
          rustfmt --edition 2021 crates/video-manager/src/pipeline.rs
          rustfmt --edition 2021 --check crates/video-manager/src/lib.rs
          git diff --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          python - <<'PY'
          import subprocess
          allowed = {"crates/video-manager/src/lib.rs", "crates/video-manager/src/pipeline.rs"}
          changed = set(subprocess.check_output(["git", "diff", "--name-only", "--relative"], text=True).split())
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit("unexpected Video Manager pipeline paths: " + ", ".join(sorted(unexpected)))
          PY
          if ! git diff --quiet; then
            git config user.name "Kate"
            git config user.email "dhwanksh2000@gmail.com"
            git add -- crates/video-manager/src/lib.rs crates/video-manager/src/pipeline.rs
            git commit -m "feat: expose trusted video pipeline"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
