name: Video Worker Runtime Patch

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: wire lazy Video Manager worker runtime
        shell: bash
        run: |
          (cd .. && python .github/patches/video-worker-runtime.py)
          python - <<'PY'
          from pathlib import Path
          path = Path("crates/backend/src/main.rs")
          source = path.read_text()
          old = '''            let mut download = video_manager::DownloadPolicy::default();
                      download.max_bytes = config.video_manager.download_max_bytes;
          '''.replace('          ', '')
          new = '''            let download = video_manager::DownloadPolicy {
                      max_bytes: config.video_manager.download_max_bytes,
                      ..Default::default()
                  };
          '''.replace('          ', '')
          if old not in source:
              raise SystemExit("Video Manager DownloadPolicy lint anchor missing")
          path.write_text(source.replace(old, new, 1))
          PY
          rustfmt --edition 2021 \
            crates/video-manager/src/lib.rs \
            crates/video-manager/src/worker.rs \
            crates/video-manager/src/download_worker.rs \
            crates/video-manager/src/ffprobe.rs \
            crates/video-manager/src/ffmpeg.rs \
            crates/config/src/lib.rs \
            crates/backend/src/main.rs
          python -m json.tool settings.json >/dev/null
          git diff --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          python - <<'PY'
          import subprocess
          allowed = {
              "crates/video-manager/src/lib.rs",
              "crates/video-manager/src/worker.rs",
              "crates/video-manager/src/download_worker.rs",
              "crates/video-manager/src/ffprobe.rs",
              "crates/video-manager/src/ffmpeg.rs",
              "crates/config/src/lib.rs",
              "crates/backend/src/main.rs",
              "settings.json",
              "../.github/workflows/runtime-ci.yml",
          }
          changed = set(subprocess.check_output(["git", "diff", "--name-only", "--relative"], text=True).split())
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit("unexpected Video Manager worker paths: " + ", ".join(sorted(unexpected)))
          PY
          if ! git diff --quiet; then
            git config user.name "Kate"
            git config user.email "dhwanksh2000@gmail.com"
            git add -- \
              crates/video-manager/src/lib.rs \
              crates/video-manager/src/worker.rs \
              crates/video-manager/src/download_worker.rs \
              crates/video-manager/src/ffprobe.rs \
              crates/video-manager/src/ffmpeg.rs \
              crates/config/src/lib.rs \
              crates/backend/src/main.rs \
              settings.json \
              ../.github/workflows/runtime-ci.yml
            git commit -m "feat: run lazy Video Manager download worker"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
