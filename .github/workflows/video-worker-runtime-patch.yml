name: Video Worker Runtime Patch

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: wire lazy Video Manager worker runtime
        shell: bash
        run: |
          (cd .. && python .github/patches/video-worker-runtime.py)
          # Permanent workflow coverage is updated separately through the GitHub
          # connector because Actions tokens cannot write workflow files.
          git checkout -- ../.github/workflows/runtime-ci.yml
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path("crates/backend/src/main.rs")
          source = path.read_text()
          pattern = re.compile(
              r'(?m)^(?P<indent>\s*)let mut download = video_manager::DownloadPolicy::default\(\);\n(?P=indent)download\.max_bytes = config\.video_manager\.download_max_bytes;'
          )
          def replacement(match):
              indent = match.group('indent')
              return (
                  f"{indent}let download = video_manager::DownloadPolicy {{\n"
                  f"{indent}    max_bytes: config.video_manager.download_max_bytes,\n"
                  f"{indent}    ..Default::default()\n"
                  f"{indent}}};"
              )
          source, count = pattern.subn(replacement, source, count=1)
          if count != 1:
              raise SystemExit(f"Video Manager DownloadPolicy lint anchor count={count}")
          path.write_text(source)
          PY
          rustfmt --edition 2021 \
            crates/video-manager/src/lib.rs \
            crates/video-manager/src/worker.rs \
            crates/video-manager/src/download_worker.rs \
            crates/video-manager/src/ffprobe.rs \
            crates/video-manager/src/ffmpeg.rs \
            crates/config/src/lib.rs \
            crates/backend/src/main.rs
          git checkout -- \
            crates/backend/src/error_reporter_daemon.rs \
            crates/backend/src/maintenance_notice.rs
          python -m json.tool settings.json >/dev/null
          git diff --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          python - <<'PY'
          import subprocess
          allowed = {
              "crates/video-manager/src/lib.rs",
              "crates/video-manager/src/worker.rs",
              "crates/video-manager/src/download_worker.rs",
              "crates/video-manager/src/ffprobe.rs",
              "crates/video-manager/src/ffmpeg.rs",
              "crates/config/src/lib.rs",
              "crates/backend/src/main.rs",
              "settings.json",
          }
          changed = set(subprocess.check_output(["git", "diff", "--name-only", "--relative"], text=True).split())
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit("unexpected Video Manager worker paths: " + ", ".join(sorted(unexpected)))
          PY
          if ! git diff --quiet; then
            git config user.name "Kate"
            git config user.email "dhwanksh2000@gmail.com"
            git add -- \
              crates/video-manager/src/lib.rs \
              crates/video-manager/src/worker.rs \
              crates/video-manager/src/download_worker.rs \
              crates/video-manager/src/ffprobe.rs \
              crates/video-manager/src/ffmpeg.rs \
              crates/config/src/lib.rs \
              crates/backend/src/main.rs \
              settings.json
            git commit -m "feat: run lazy Video Manager download worker"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
