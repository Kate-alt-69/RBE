name: Bounded WASM result channel

on:
  push:
    paths:
      - '.github/workflows/wasm-result-channel.yml'

permissions:
  contents: write

concurrency:
  group: wasm-result-channel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            engine
            container-runtime

      - name: Apply bounded WASM result channel
        run: python .github/patches/wasm-result-channel.py

      - name: Format Rust workspaces
        run: |
          cargo fmt --manifest-path container-runtime/Cargo.toml --all
          cargo fmt --manifest-path engine/Cargo.toml --all

      - name: Check Container Runtime
        run: cargo check --manifest-path container-runtime/Cargo.toml --workspace --locked

      - name: Test Container Runtime
        run: cargo test --manifest-path container-runtime/Cargo.toml --workspace --locked

      - name: Clippy Container Runtime
        run: cargo clippy --manifest-path container-runtime/Cargo.toml --workspace --all-targets --locked -- -D warnings

      - name: Check backend integration
        run: cargo check --manifest-path engine/Cargo.toml -p core-lib -p backend --locked

      - name: Test backend integration
        run: cargo test --manifest-path engine/Cargo.toml -p core-lib -p backend --locked

      - name: Clippy backend integration
        run: cargo clippy --manifest-path engine/Cargo.toml -p core-lib -p backend --all-targets --locked -- -D warnings

      - name: Verify bounded result contract
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'pub const PROTOCOL_VERSION: u16 = 4;' container-runtime/crates/ipc-protocol/src/lib.rs
          grep -q 'AwaitResult(AwaitResultRequest)' container-runtime/crates/ipc-protocol/src/lib.rs
          grep -q 'ExecutionFinished {' container-runtime/crates/ipc-protocol/src/lib.rs
          grep -q 'ExecutionPending {' container-runtime/crates/ipc-protocol/src/lib.rs
          grep -q 'RESULT_STORE_MAX_RECORDS: usize = 1024' container-runtime/crates/container-runtime-core/src/runtime.rs
          grep -q 'RESULT_STORE_MAX_BYTES: usize = 16 \* 1024 \* 1024' container-runtime/crates/container-runtime-core/src/runtime.rs
          grep -q 'pub fn wait_for_result' container-runtime/crates/container-runtime-core/src/runtime.rs
          grep -q 'Request::AwaitResult(request)' container-runtime/crates/container-bin/src/main.rs
          grep -q 'pub async fn await_result' engine/crates/core/src/container_client.rs
          grep -q 'pub async fn execute_and_wait' engine/crates/core/src/container_client.rs

      - name: Commit verified bounded WASM result channel
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          latest="$(git rev-parse origin/main)"
          if [[ "$latest" != "$GITHUB_SHA" ]]; then
            echo "main moved during validation; refusing stale commit" >&2
            exit 75
          fi

          rm -f .github/patches/wasm-result-channel.py
          rm -f .github/workflows/wasm-result-channel.yml

          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'FIX | BUG-WASM-002 add bounded execution result channel'
          git push origin HEAD:main
