name: WASM worker invocation IO

on:
  push:
    paths:
      - '.github/workflows/wasm-worker-io.yml'

permissions:
  contents: write

concurrency:
  group: wasm-worker-io-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            container-runtime
            engine

      - name: Apply WASM worker invocation IO
        run: python .github/patches/wasm-worker-io.py

      - name: Format Rust workspaces
        run: |
          cargo fmt --manifest-path container-runtime/Cargo.toml --all
          cargo fmt --manifest-path engine/Cargo.toml --all

      - name: Refresh Container Runtime lockfile
        run: cargo check --manifest-path container-runtime/Cargo.toml --workspace

      - name: Check Container Runtime locked
        run: cargo check --manifest-path container-runtime/Cargo.toml --workspace --locked

      - name: Test Container Runtime
        run: cargo test --manifest-path container-runtime/Cargo.toml --workspace --locked

      - name: Clippy Container Runtime
        run: cargo clippy --manifest-path container-runtime/Cargo.toml --workspace --all-targets --locked -- -D warnings

      - name: Check backend IPC integration
        run: cargo check --manifest-path engine/Cargo.toml -p core-lib -p backend --locked

      - name: Test backend IPC integration
        run: cargo test --manifest-path engine/Cargo.toml -p core-lib -p backend --locked

      - name: Verify worker IO contracts
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'pub enum WorkerResultFrame' container-runtime/crates/ipc-protocol/src/lib.rs
          grep -q 'pub fn write_worker_input' container-runtime/crates/ipc-protocol/src/lib.rs
          grep -q 'pub fn read_worker_result' container-runtime/crates/ipc-protocol/src/lib.rs
          grep -q 'pub fn execute_with_input' container-runtime/crates/execution-engine/src/lib.rs
          grep -q '"rbe",' container-runtime/crates/execution-engine/src/lib.rs
          grep -q '"input_read"' container-runtime/crates/execution-engine/src/lib.rs
          grep -q '"output_write"' container-runtime/crates/execution-engine/src/lib.rs
          grep -q 'Result<Vec<u8>, String>' container-runtime/crates/container-runtime-core/src/worker.rs
          grep -q 'write_worker_input(&mut stdin, &task.payload)' container-runtime/crates/container-runtime-core/src/runtime.rs
          grep -q 'read_worker_result(&mut reader)' container-runtime/crates/container-runtime-core/src/runtime.rs
          grep -q 'read_worker_input(&mut stdin)' container-runtime/crates/container-bin/src/main.rs
          grep -q 'write_worker_result(&mut stdout, &frame)' container-runtime/crates/container-bin/src/main.rs
          grep -q 'host_abi_round_trips_binary_invocation_data' container-runtime/crates/execution-engine/src/lib.rs

      - name: Commit verified WASM worker IO
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          latest="$(git rev-parse origin/main)"
          if [[ "$latest" != "$GITHUB_SHA" ]]; then
            echo "main moved during validation; refusing stale commit" >&2
            exit 75
          fi

          rm -f .github/patches/wasm-worker-io.py
          rm -f .github/workflows/wasm-worker-io.yml

          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'FIX | BUG-WASM-003 pipe invocation data and results through isolated workers'
          git push origin HEAD:main
