[package]
name = "execution-engine"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
# Security-reviewed 45.x baseline.
# default-features=false removes unused Wasmtime cache/optional layers that
# pull zstd-sys into cross-builds; this executor only needs the runtime and
# Cranelift JIT to compile and execute incoming WASM modules.
wasmtime = { version = "45.0.3", default-features = false, features = ["runtime", "cranelift"] }
