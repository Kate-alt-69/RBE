[package]
name = "rpx"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "rpx"
path = "src/main.rs"

[dependencies]
sdk-package = { path = "../sdk-package" }
atomic-io = { path = "../../../atomic-io" }
rbe-install-executor = { path = "../../../install-executor" }
rbe-install-runtime = { path = "../../../install-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
semver = "1"
anyhow = "1"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
url = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
