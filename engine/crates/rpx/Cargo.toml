[package]
name = "rpx"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "rpx"
path = "src/main.rs"

[dependencies]
sdk-package = { path = "../sdk-package" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
anyhow = "1"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
