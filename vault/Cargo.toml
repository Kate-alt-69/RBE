[package]
name = "vault"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone crate — NOT a member of engine/'s workspace (or
# container-runtime/'s). Both `engine/crates/core` and the container
# runtime's payment environment depend on this via relative path, so
# there's one implementation of OS-credential-store access +
# encrypted-file fallback to get right, not two copies to keep in
# sync between two separate processes that both handle secrets.

[dependencies]
logging = { path = "../engine/crates/logging" }
error-client = { path = "../error-client" }
atomic-io = { path = "../atomic-io" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
keyring = "2"
secrecy = "0.8"
zeroize = "1"
aes-gcm = "0.10"
hex = "0.4"
rand = "0.8"
